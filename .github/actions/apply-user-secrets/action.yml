name: Apply DIGIT_SECRETS
description: >
  Merge the team's own credentials (optional GitHub secret DIGIT_SECRETS) into
  digit-secrets.yaml, re-encrypted with the team's Key Vault key, and commit
  digit-secrets.yaml to the fork if it changed (newly generated or merged).
  Needs: azure-login, load-config, setup-sops; job permission contents: write.
inputs:
  user-secrets:
    description: secrets.DIGIT_SECRETS (may be empty)
    required: false
    default: ''
  branch:
    description: branch to commit to
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DIGIT_USER_SECRETS: ${{ inputs.user-secrets }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        res=$(bash deploy-as-code/helm/scripts/merge-user-secrets.sh digit-secrets.yaml deploy-as-code/helm/secrets.template.yaml)
        [ "$res" = "changed=true" ] && echo "DIGIT_SECRETS merged into digit-secrets.yaml" | tee -a "$GITHUB_STEP_SUMMARY"
        [ -n "$(git status --porcelain -- digit-secrets.yaml)" ] || { echo "digit-secrets.yaml unchanged"; exit 0; }
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add digit-secrets.yaml
        git commit -q -m "chore(one-click): update locked secrets for $ENVIRONMENT [skip ci]"
        if ! git push -q origin "HEAD:$BRANCH" 2>/dev/null; then
          # someone committed meanwhile: replay this one commit on top and retry once
          git fetch -q --depth=20 origin "$BRANCH"
          git rebase -q FETCH_HEAD || { echo "::error::Your branch changed during this run and digit-secrets.yaml could not be updated. Run the workflow again."; exit 1; }
          git push -q origin "HEAD:$BRANCH"
        fi
        echo "Committed digit-secrets.yaml (locked with Key Vault $KEY_VAULT_NAME)" | tee -a "$GITHUB_STEP_SUMMARY"
