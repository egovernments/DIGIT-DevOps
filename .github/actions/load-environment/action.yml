name: Load DIGIT environment
description: >
  Validate deploy-as-code/environments/<env>/env.yaml, generate the Terraform input.yaml
  from it (single source of truth) and export the values as env vars.
  Run after setup-sops (needs SECRETS_DB_USER) and with ARM_SUBSCRIPTION_ID set.
inputs:
  environment:
    description: Environment name = folder under deploy-as-code/environments
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ENV_NAME: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        [[ $ENV_NAME =~ ^[a-z][a-z0-9-]{1,38}[a-z0-9]$ && $ENV_NAME != *--* ]] \
          || { echo "::error::Invalid environment name '$ENV_NAME'"; exit 1; }
        dir="deploy-as-code/environments/$ENV_NAME"
        f="$dir/env.yaml"
        [ -f "$f" ] || { echo "::error::$f not found - create it with deploy-as-code/environments/new-environment.sh"; exit 1; }

        # Reject unfilled <placeholders> (reports the key path only)
        bad=$(yq -r '.. | select(tag == "!!str" and test("<[A-Za-z_ ]+>")) | path | join(".")' "$f")
        [ -z "$bad" ] || { echo "::error file=$f::Unfilled placeholders: $(echo "$bad" | tr '\n' ' ')"; exit 1; }

        for k in domain charts.repository infra.resource_group infra.location infra.storage_account_name infra.filestore_storage_account_name; do
          v=$(yq -r ".$k // \"\"" "$f"); [ -n "$v" ] || { echo "::error file=$f::$k is required"; exit 1; }
        done
        [ -n "${ARM_SUBSCRIPTION_ID:-}" ] || { echo "::error::ARM_SUBSCRIPTION_ID secret missing in GitHub Environment $ENV_NAME"; exit 1; }
        [ -n "${SECRETS_DB_USER:-}" ] || { echo "::error::DB user not loaded - run setup-sops first"; exit 1; }

        # Terraform input.yaml consumed by infra-as-code/terraform/scripts/init.go.
        # environment <- folder name, subscription <- GitHub secret, db_user <- secrets.yaml.
        # init.go only accepts flat `key: "value"` lines, so force double-quoted strings, no comments.
        ENVIRONMENT="$ENV_NAME" DB_USER="$SECRETS_DB_USER" \
          yq '.infra + {"environment": strenv(ENVIRONMENT), "subscription_id": strenv(ARM_SUBSCRIPTION_ID), "db_user": strenv(DB_USER)}
              | .[] |= tostring | .[] style="double" | ... comments=""' "$f" \
          > infra-as-code/terraform/azure/input.yaml

        {
          echo "ENVIRONMENT=$ENV_NAME"
          echo "DIGIT_ENV_DIR=$GITHUB_WORKSPACE/$dir"
          echo "DOMAIN_NAME=$(yq -r .domain "$f")"
          echo "DIGIT_CHART_REPO_URL=$(yq -r .charts.repository "$f")"
          yq -r '.infra | to_entries | .[] | (.key | upcase) + "=" + (.value | tostring)' "$f"
          # optional scalar Terraform overrides -> TF_VAR_<name>
          yq -r '(.terraform // {}) | to_entries | .[] | select(.value | tag != "!!map" and tag != "!!seq") | "TF_VAR_" + .key + "=" + (.value | tostring)' "$f"
        } >> "$GITHUB_ENV"
        echo "Loaded environment $ENV_NAME"; yq '.infra' "$f"
