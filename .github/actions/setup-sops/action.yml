name: Setup SOPS (Azure Key Vault)
description: >
  Install a pinned sops binary. If <env>-secrets.yaml exists, check that it is encrypted,
  fully filled in and locked with THIS team's Key Vault, then export the DB admin
  credentials from it for Terraform (TF_VAR_db_password, SECRETS_DB_USER).
  Needs AZURE_CLIENT_ID/SECRET/TENANT_ID (azure-login) to decrypt.
inputs:
  version:
    description: sops version (without the leading v)
    required: true
  required:
    description: "true = fail when <env>-secrets.yaml does not exist yet"
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOPS_VERSION: ${{ inputs.version }}
        REQUIRED: ${{ inputs.required }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        base="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}"
        curl -fsSLo "sops-v${SOPS_VERSION}.linux.amd64" "$base/sops-v${SOPS_VERSION}.linux.amd64"
        curl -fsSLo sops.checksums.txt "$base/sops-v${SOPS_VERSION}.checksums.txt"
        grep " sops-v${SOPS_VERSION}.linux.amd64\$" sops.checksums.txt | sha256sum -c -
        sudo install -m 0755 "sops-v${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops
        cd "$GITHUB_WORKSPACE"

        f=${SECRETS_FILE:?run load-config first}
        n=$(basename "$f")
        if [ ! -f "$f" ]; then
          [ "$REQUIRED" != "true" ] || { echo "::error::$n does not exist yet. Run the workflow with action = install first."; exit 1; }
          echo "$n not created yet"; exit 0
        fi
        [ "$(sops filestatus "$f" | jq -r .encrypted)" = "true" ] \
          || { echo "::error file=$f::$n is NOT locked (encrypted). Never commit plain passwords. Delete the file and run install again."; exit 1; }

        # Locked with this team's own Key Vault? (a file copied from another fork is not)
        url=$(yq -r '.sops.azure_kv[0].vault_url // ""' "$f")
        [ "${url%/}" = "https://${KEY_VAULT_NAME}.vault.azure.net" ] || {
          echo "::error file=$f::$n was locked by someone else's Key Vault ($url), not yours ($KEY_VAULT_NAME). Delete $n from your fork and run install again."; exit 1; }

        bad=$(sops -d "$f" | yq -r '.. | select(tag == "!!str" and test("^<[a-z_]+>$")) | path | join(".")')
        [ -z "$bad" ] || { echo "::error file=$f::Unfilled placeholders: $(echo "$bad" | tr '\n' ' ')"; exit 1; }

        db_pwd=$(sops -d --extract '["cluster-configs"]["secrets"]["db"]["password"]' "$f")
        db_user=$(sops -d --extract '["cluster-configs"]["secrets"]["db"]["username"]' "$f")
        echo "::add-mask::$db_pwd"
        { echo "TF_VAR_db_password=$db_pwd"; echo "SECRETS_DB_USER=$db_user"; } >> "$GITHUB_ENV"
        echo "$n unlocked OK"
