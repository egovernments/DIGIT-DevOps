name: Setup SOPS (age)
description: >
  Install a pinned sops binary, load the age private key for decryption, verify the
  environment secrets file is SOPS-encrypted and fully filled in, and export the DB
  credentials it holds (TF_VAR_db_password / SECRETS_DB_USER) for Terraform.
inputs:
  version:
    description: sops version (without the leading v)
    required: true
  age-key:
    description: age private key (AGE-SECRET-KEY-1...), normally secrets.SOPS_AGE_KEY
    required: true
  secrets-file:
    description: SOPS-encrypted environment secrets file
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOPS_VERSION: ${{ inputs.version }}
        AGE_KEY: ${{ inputs.age-key }}
        SECRETS_FILE: ${{ inputs.secrets-file }}
      run: |
        set -euo pipefail
        [ -n "$AGE_KEY" ] || { echo "::error::Missing GitHub secret SOPS_AGE_KEY (age private key)"; exit 1; }

        # Install sops and verify its checksum
        cd "$RUNNER_TEMP"
        base="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}"
        curl -fsSLo "sops-v${SOPS_VERSION}.linux.amd64" "$base/sops-v${SOPS_VERSION}.linux.amd64"
        curl -fsSLo sops.checksums.txt "$base/sops-v${SOPS_VERSION}.checksums.txt"
        grep " sops-v${SOPS_VERSION}.linux.amd64\$" sops.checksums.txt | sha256sum -c -
        sudo install -m 0755 "sops-v${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops
        cd "$GITHUB_WORKSPACE"
        sops --version --check-for-updates=false 2>/dev/null || sops --version

        # age private key -> file readable only by the runner user; sops and helm-secrets read SOPS_AGE_KEY_FILE
        key_file="$RUNNER_TEMP/sops-age.key"
        ( umask 077; printf '%s\n' "$AGE_KEY" > "$key_file" )
        echo "SOPS_AGE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
        export SOPS_AGE_KEY_FILE="$key_file"

        # The secrets file must be committed encrypted - never deploy from plaintext
        if [ "$(sops filestatus "$SECRETS_FILE" | jq -r .encrypted)" != "true" ]; then
          echo "::error file=$SECRETS_FILE::File is not SOPS-encrypted. Fill in real values, then run: sops -e -i $SECRETS_FILE"
          exit 1
        fi

        # Every <placeholder> must have been replaced (reports key paths only, never values)
        bad=$(sops -d "$SECRETS_FILE" | yq -r '.. | select(tag == "!!str" and test("<[A-Za-z_ ]+>")) | path | join(".")')
        [ -z "$bad" ] || { echo "::error file=$SECRETS_FILE::Unfilled placeholders: $(echo "$bad" | tr '\n' ' ')"; exit 1; }

        # DB credentials live only in the encrypted file; Terraform gets them from here
        db_pwd=$(sops -d --extract '["cluster-configs"]["secrets"]["db"]["password"]' "$SECRETS_FILE")
        db_user=$(sops -d --extract '["cluster-configs"]["secrets"]["db"]["username"]' "$SECRETS_FILE")
        echo "::add-mask::$db_pwd"
        {
          echo "TF_VAR_db_password=$db_pwd"
          echo "SECRETS_DB_USER=$db_user"
        } >> "$GITHUB_ENV"
        echo "Decrypted $SECRETS_FILE OK (DB user: $db_user)"
