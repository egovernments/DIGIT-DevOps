name: Setup Terraform
description: Install a pinned Terraform CLI from releases.hashicorp.com
inputs:
  version:
    description: Terraform version
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${{ inputs.version }}/terraform_${{ inputs.version }}_linux_amd64.zip"
        unzip -oq terraform.zip terraform
        sudo mv terraform /usr/local/bin/terraform
        terraform -version
