name: DIGIT-Install workflow (Azure)
# One-click DIGIT on Azure, reusable by many teams/products from one repo:
#   1. Terraform: remote state -> AKS + PostgreSQL Flexible Server + filestore blob storage
#   2. Helmfile : deploy DIGIT from packaged Helm charts, secrets decrypted by helm-secrets/SOPS
#
# Each environment is self-contained and owned by one team - two files only:
#   deploy-as-code/environments/<env>/
#     env.yaml      THE file a team edits: domain, chart repo, Azure names, sizing, Helm overrides
#     secrets.yaml  generated + SOPS-encrypted with the team's own age key
#   Create one with: deploy-as-code/environments/new-environment.sh <env> <age-public-key>
#
# GitHub Environment <env> (same name) holds that team's secrets, so one team's run can
# never read another team's credentials:
#   SOPS_AGE_KEY, ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment = folder under deploy-as-code/environments and GitHub Environment name'
        required: true
        type: string
      action:
        description: 'install = create infra + deploy DIGIT, deploy = helmfile only, destroy = tear down infra'
        required: true
        type: choice
        default: install
        options:
          - install
          - deploy
          - destroy
      confirmDestroy:
        description: 'When action = destroy, type the environment name again to confirm'
        required: false
        default: ''

permissions:
  contents: read

# One run at a time per environment; different teams' environments run in parallel.
concurrency:
  group: digit-install-azure-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.11.4"
  HELM_VERSION: "3.22.1"
  HELMFILE_VERSION: "1.8.4"
  HELM_DIFF_VERSION: "3.15.15"
  HELM_SECRETS_VERSION: "4.7.11"
  SOPS_VERSION: "3.13.3"
  TF_DIR: infra-as-code/terraform/azure
  SECRETS_FILE: deploy-as-code/environments/${{ inputs.environment }}/secrets.yaml

jobs:
  Input_validation:
    if: ${{ inputs.action != 'destroy' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Azure secrets
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            [ -n "${!v}" ] || { echo "::error::Missing secret $v in GitHub Environment $ENV_NAME"; exit 1; }
          done
      - name: Setup sops + decrypt DB credentials
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secrets-file: ${{ env.SECRETS_FILE }}
      - name: Load environment
        uses: ./.github/actions/load-environment
        with:
          environment: ${{ inputs.environment }}
      - name: Install Terraform
        uses: ./.github/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      - name: Substitute inputs into Terraform files
        run: go run ../scripts/init.go
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform validate (no backend)
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
        working-directory: ${{ env.TF_DIR }}

  Terraform_Infra_Creation:
    if: ${{ inputs.action == 'install' }}
    needs: Input_validation
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup sops + decrypt DB credentials
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secrets-file: ${{ env.SECRETS_FILE }}
      - name: Load environment
        uses: ./.github/actions/load-environment
        with:
          environment: ${{ inputs.environment }}
      - name: Install Terraform
        uses: ./.github/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      - name: Substitute inputs into Terraform files
        run: go run ../scripts/init.go
        working-directory: ${{ env.TF_DIR }}
      - name: Azure login
        run: |
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az account show --query '{subscription:name, id:id}' -o table

      # The remote-state module keeps its own state locally on the runner, so it can only
      # be applied once. On re-runs the state account already exists and is reused.
      - name: Terraform remote state (resource group + state storage account)
        run: |
          if az storage account show -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "State storage account $STORAGE_ACCOUNT_NAME already exists - skipping remote-state apply"
          else
            terraform init -input=false -no-color
            terraform apply -input=false -no-color -auto-approve
          fi
        working-directory: ${{ env.TF_DIR }}/remote-state

      - name: Terraform init - Infra creation
        run: terraform init -input=false -no-color
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform plan - Infra creation
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform apply - Infra creation
        run: terraform apply -input=false -no-color -auto-approve tfplan
        working-directory: ${{ env.TF_DIR }}
      - name: Verify AKS access
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          kubectl get nodes -o wide

  DIGIT_deployment:
    if: ${{ !failure() && !cancelled() && (inputs.action == 'install' || inputs.action == 'deploy') }}
    needs: [Input_validation, Terraform_Infra_Creation]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup sops + decrypt DB credentials
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secrets-file: ${{ env.SECRETS_FILE }}
      - name: Load environment
        uses: ./.github/actions/load-environment
        with:
          environment: ${{ inputs.environment }}
      - name: Install Terraform
        uses: ./.github/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      - name: Substitute inputs into Terraform files
        run: go run ../scripts/init.go
        working-directory: ${{ env.TF_DIR }}
      - name: Azure login + AKS credentials
        run: |
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          kubectl get nodes

      # Infra-derived values come straight from Terraform state into a values file for
      # helmfile - nothing is copied into committed files.
      - name: Export Terraform outputs for helmfile
        run: |
          set -euo pipefail
          terraform init -input=false -no-color >/dev/null
          out="$RUNNER_TEMP/tf-outputs.yaml"
          terraform output -json | yq -P '{"infra": {
              "dbHost": .azurerm_postgresql_flexible_server.value,
              "dbName": .postgresql_flexible_server_database_name.value,
              "filestoreContainer": .filestore_container_name.value,
              "publicAssetsBaseUrl": .public_assets_base_url.value}}' > "$out"
          bad=$(yq -r '.infra | to_entries | .[] | select(.value == null or .value == "") | .key' "$out")
          [ -z "$bad" ] || { echo "::error::Missing Terraform outputs: $bad"; exit 1; }
          cat "$out"
          echo "TF_OUTPUTS_FILE=$out" >> "$GITHUB_ENV"
        working-directory: ${{ env.TF_DIR }}

      # Helm pinned to v3: the runner image may ship Helm 4, whose plugin install/verification differs.
      - name: Install Helm + Helmfile + helm-diff + helm-secrets
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" helmfile
          sudo install -m 0755 "$RUNNER_TEMP/helmfile" /usr/local/bin/helmfile
          helm plugin install https://github.com/databus23/helm-diff --version "v${HELM_DIFF_VERSION}"
          helm plugin install https://github.com/jkroepke/helm-secrets --version "v${HELM_SECRETS_VERSION}"
          helm version --short; helmfile --version; helm plugin list

      # The helmfile reads DIGIT_ENV_DIR (env.yaml incl. its `values:` overrides, secrets.yaml via helm-secrets),
      # TF_OUTPUTS_FILE and DIGIT_CHART_REPO_URL.
      - name: Deploy DIGIT (helmfile)
        run: helmfile -f digit-helmfile.yaml.gotmpl apply --include-needs --suppress-secrets
        working-directory: deploy-as-code/helm

      - name: Display LoadBalancer IP
        run: |
          LB_IP=$(kubectl get svc ingress-nginx-controller -n backbone -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "LoadBalancer IP: ${LB_IP}"
          {
            echo "### DIGIT installed in \`${ENVIRONMENT}\` :rocket:"
            echo "Point \`${DOMAIN_NAME}\` (A record) at \`${LB_IP}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  terraform_infra_destruction:
    if: ${{ inputs.action == 'destroy' && inputs.confirmDestroy == inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup sops + decrypt DB credentials
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
          age-key: ${{ secrets.SOPS_AGE_KEY }}
          secrets-file: ${{ env.SECRETS_FILE }}
      - name: Load environment
        uses: ./.github/actions/load-environment
        with:
          environment: ${{ inputs.environment }}
      - name: Install Terraform
        uses: ./.github/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      - name: Substitute inputs into Terraform files
        run: go run ../scripts/init.go
        working-directory: ${{ env.TF_DIR }}
      - name: Azure login
        run: |
          az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
      # Remove the ingress LoadBalancer first so its public IP is released before the VNet goes.
      - name: Delete ingress LoadBalancer
        continue-on-error: true
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          kubectl delete svc ingress-nginx-controller -n backbone --wait=true --timeout=5m
      - name: Terraform init - Infra destruction
        run: terraform init -input=false -no-color
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform destroy - Infra
        run: terraform destroy -input=false -no-color -auto-approve
        working-directory: ${{ env.TF_DIR }}
      # The resource group and Terraform state account are left in place on purpose
      # (they hold the state history). Delete them manually when no longer needed:
      #   az group delete -n <resource_group>
