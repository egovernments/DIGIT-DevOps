name: DIGIT one-click (Azure)
# Fork this repository, then follow ONE-CLICK-AZURE.md. A team only ever changes ONE file,
# digit-config.yaml, and adds ONE GitHub secret, AZURE_CREDENTIALS. Everything else is
# created and named by this workflow:
#
#   install  First time: a NEW environment. Refuses to touch Azure resources this fork did
#            not create (ownership tags managed-by / digit-repo / digit-name).
#            1. Azure resource group, Terraform state storage and the team's own Key Vault
#            2. digit-secrets.yaml: fresh random passwords, generated and locked (SOPS-encrypted
#               with that Key Vault) BY THIS WORKFLOW and committed to the fork - first install only.
#               The team's own credentials come from the optional GitHub secret DIGIT_SECRETS and
#               are merged in + re-locked on every install/deploy (nobody encrypts by hand).
#            3. Terraform: AKS + PostgreSQL Flexible Server + filestore storage
#            4. Helmfile: DIGIT backbone, core 3.0 and monitoring from packaged Helm charts,
#               secrets decrypted by helm-secrets
#   infra    step 3 only - update Azure infrastructure (terraform: in digit-config.yaml).
#            Stops if the plan would delete/replace the cluster, database, storage or network
#            unless confirm = replace.
#   deploy   step 4 only - update the DIGIT apps (everything else in digit-config.yaml)
#   destroy  Terraform destroy. The resource group (state + Key Vault) is kept.
#
# After the first install, every commit to the fork's default branch runs by itself and
# applies only what changed since the commit that is running in Azure (recorded in the
# resource-group tags digit-infra-sha / digit-deploy-sha, see .github/scripts/one-click-changes.sh):
#   Terraform code or terraform:/location in digit-config.yaml  -> Infra job
#   helmfiles/values/defaults, digit-secrets.yaml, rest of config -> Deploy job
#   both                                                         -> Infra, then Deploy
on:
  push:
    paths:
      - digit-config.yaml
      - digit-secrets.yaml
      - deploy-as-code/helm/**
      - infra-as-code/terraform/**
  workflow_dispatch:
    inputs:
      action:
        description: 'What do you want to do?'
        required: true
        type: choice
        default: install
        options:
          - install
          - infra
          - deploy
          - destroy
      confirm:
        description: 'For destroy type: delete   (for infra, only if it asks: replace)'
        required: false
        default: ''

permissions:
  contents: read

# One run at a time per fork + branch.
concurrency:
  group: digit-one-click-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.11.4"
  HELM_VERSION: "3.22.1"
  HELMFILE_VERSION: "1.8.4"
  HELM_DIFF_VERSION: "3.15.15"
  HELM_SECRETS_VERSION: "4.7.11"
  SOPS_VERSION: "3.13.3"
  TF_DIR: infra-as-code/terraform/azure

jobs:
  Check:
    # Commits run only in forks, on the default branch; manual runs anywhere (refused upstream).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.repository != 'egovernments/DIGIT-DevOps' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      prepare: ${{ steps.decide.outputs.prepare }}
      infra: ${{ steps.decide.outputs.infra }}
      deploy: ${{ steps.decide.outputs.deploy }}
      destroy: ${{ steps.decide.outputs.destroy }}
    steps:
      - name: Use your own fork
        if: ${{ github.repository == 'egovernments/DIGIT-DevOps' }}
        run: |
          echo "::error::Do not run this in egovernments/DIGIT-DevOps. Fork the repository and run it in your fork (ONE-CLICK-AZURE.md, step 1)."
          exit 1
      - name: Confirm destroy
        if: ${{ inputs.action == 'destroy' && inputs.confirm != 'delete' }}
        run: |
          echo "::error::To delete your DIGIT, run again and type the word delete in the confirm box."
          exit 1
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check digit-config.yaml
        uses: ./.github/actions/load-config
      # install = a NEW environment, or a re-run of this fork's own install.
      # infra / deploy / destroy = only an environment this fork installed.
      # install = a NEW environment, or a re-run of this fork's own install.
      # Everything else = only an environment this fork installed and has not destroyed.
      # On a commit, only the jobs whose inputs changed since the running commit are run.
      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          out() { printf 'prepare=%s\ninfra=%s\ndeploy=%s\ndestroy=%s\n' "$1" "$2" "$3" "$4" >> "$GITHUB_OUTPUT"; }
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          repo="${GITHUB_REPOSITORY,,}"
          tags=$(az group show -n "$RESOURCE_GROUP" --query tags -o json 2>/dev/null || true)
          t() { printf '%s' "$tags" | jq -r --arg k "$1" '(. // {})[$k] // ""'; }

          if [ -n "$tags" ] && { [ "$(t managed-by)" != digit-one-click ] || [ "$(t digit-repo)" != "$repo" ] || [ "$(t digit-name)" != "$ENVIRONMENT" ]; }; then
            echo "::error file=digit-config.yaml::The resource group $RESOURCE_GROUP already exists but was not created by this fork's one-click install (owner: '$(t digit-repo)'). Nothing was changed. Choose a different name in digit-config.yaml."
            exit 1
          fi
          state=$(t digit-state)   # installed | destroyed | "" (never finished an install)

          if [ "$EVENT" = push ]; then
            if [ "$state" != installed ]; then
              note "Not installed (or destroyed) - this commit changes nothing in Azure. Run the workflow with action = install."
              out false false false false; exit 0
            fi
            res=$(bash .github/scripts/one-click-changes.sh "$(t digit-infra-sha)" "$(t digit-deploy-sha)")
            infra=$(sed -n 's/^infra=//p' <<< "$res"); deploy=$(sed -n 's/^deploy=//p' <<< "$res")
            note "This commit: infra=$infra, deploy=$deploy"
            out false "$infra" "$deploy" false; exit 0
          fi

          case "$ACTION" in
            install)
              if [ -n "$tags" ]; then note "Existing environment of $repo: $RESOURCE_GROUP (re-run)"
              else note "New environment: $RESOURCE_GROUP will be created"; fi
              out true true true false ;;
            infra|deploy|destroy)
              if [ "$state" != installed ]; then
                echo "::error::Nothing is installed for '$ENVIRONMENT' (or it was destroyed). Run the workflow with action = install first."; exit 1
              fi
              out false "$([ "$ACTION" = infra ] && echo true || echo false)" "$([ "$ACTION" = deploy ] && echo true || echo false)" "$([ "$ACTION" = destroy ] && echo true || echo false)" ;;
          esac
      - name: Summary
        run: cat "$RUNNER_TEMP/config-summary.md" >> "$GITHUB_STEP_SUMMARY"

  # Creates the Azure pieces that must exist before Terraform, then the team's secrets.
  Prepare:
    if: ${{ needs.Check.outputs.prepare == 'true' }}
    needs: Check
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the generated, encrypted digit-secrets.yaml to the fork
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Load digit-config.yaml
        uses: ./.github/actions/load-config

      # The PostgreSQL server name (<name>-server) must be unique in all of Azure.
      - name: Check the name is free in Azure
        run: |
          set -euo pipefail
          srv="${ENVIRONMENT}-server"
          if az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$srv" -o none 2>/dev/null; then
            echo "$srv already belongs to this install"; exit 0
          fi
          free=$(az rest --method post \
            --url "https://management.azure.com/subscriptions/${ARM_SUBSCRIPTION_ID}/providers/Microsoft.DBforPostgreSQL/checkNameAvailability?api-version=2022-12-01" \
            --body "{\"name\": \"$srv\", \"type\": \"Microsoft.DBforPostgreSQL/flexibleServers\"}" --query nameAvailable -o tsv)
          [ "$free" = "true" ] || { echo "::error file=digit-config.yaml::The name '$ENVIRONMENT' is already used by someone else in Azure. Choose another name in digit-config.yaml."; exit 1; }

      # Idempotent: every re-run finds the same, already-created resources.
      - name: Resource group, Terraform state storage and Key Vault
        run: |
          set -euo pipefail
          read -ra tags <<< "$OWNER_TAGS"
          # Check (previous job) already refused groups this fork does not own.
          az group show -n "$RESOURCE_GROUP" -o none 2>/dev/null ||
            az group create -n "$RESOURCE_GROUP" -l "$LOCATION" --tags "${tags[@]}" environment="$ENVIRONMENT" -o none

          if ! az storage account show -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            echo "Creating Terraform state storage $STORAGE_ACCOUNT_NAME"
            az storage account create -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" -l "$LOCATION" \
              --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 \
              --allow-blob-public-access false --tags "${tags[@]}" environment="$ENVIRONMENT" -o none
          fi
          key=$(az storage account keys list -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" --query '[0].value' -o tsv)
          echo "::add-mask::$key"
          az storage container create -n "${ENVIRONMENT}-container" --account-name "$STORAGE_ACCOUNT_NAME" \
            --account-key "$key" --public-access off -o none

          # The team's own Key Vault + key that locks digit-secrets.yaml.
          # A soft-deleted vault of the same name is only ever this fork's own earlier install
          # (the name hashes subscription + fork + name). Bring it back only when the fork still
          # has the digit-secrets.yaml it locked; otherwise purge it and start fresh.
          if ! az keyvault show -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            old=$(az keyvault show-deleted -n "$KEY_VAULT_NAME" --query properties.tags -o json 2>/dev/null || true)
            if [ -n "$old" ] && [ "$(printf '%s' "$old" | jq -r '(. // {})["digit-repo"] // ""')" != "${GITHUB_REPOSITORY,,}" ]; then
              echo "::error::Key Vault name $KEY_VAULT_NAME is held by a deleted vault this fork did not create. Choose a different name in digit-config.yaml."; exit 1
            fi
            if [ -n "$old" ] && [ -f digit-secrets.yaml ]; then
              echo "Recovering this fork's deleted Key Vault $KEY_VAULT_NAME (keeps the key, so digit-secrets.yaml still unlocks)"
              az keyvault recover -n "$KEY_VAULT_NAME" -o none
            else
              if [ -n "$old" ]; then
                echo "Purging this fork's old deleted Key Vault $KEY_VAULT_NAME (no digit-secrets.yaml uses it)"
                az keyvault purge -n "$KEY_VAULT_NAME" -o none
                for _ in $(seq 1 60); do az keyvault show-deleted -n "$KEY_VAULT_NAME" -o none 2>/dev/null || break; sleep 10; done
              fi
              echo "Creating Key Vault $KEY_VAULT_NAME"
              az keyvault create -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" -l "$LOCATION" \
                --enable-rbac-authorization false --tags "${tags[@]}" environment="$ENVIRONMENT" -o none
            fi
          fi
          # Access policy for this service principal (object id from its own token: no Graph rights needed).
          oid=$(az account get-access-token --query accessToken -o tsv | cut -d. -f2 |
                python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); print(json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4)))['oid'])")
          az keyvault set-policy -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" --object-id "$oid" \
            --key-permissions get list create encrypt decrypt -o none
          az keyvault key show --vault-name "$KEY_VAULT_NAME" -n sops -o none 2>/dev/null ||
            az keyvault key create --vault-name "$KEY_VAULT_NAME" -n sops --kty RSA --size 4096 -o none
          echo "SOPS_KEY_ID=$(az keyvault key show --vault-name "$KEY_VAULT_NAME" -n sops --query key.kid -o tsv)" >> "$GITHUB_ENV"

      - name: Setup sops
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
          required: "false"

      # First install only: generate and lock digit-secrets.yaml. Never overwritten.
      - name: Create digit-secrets.yaml (first install only)
        run: |
          set -euo pipefail
          if [ -f digit-secrets.yaml ]; then echo "digit-secrets.yaml already exists - kept"; exit 0; fi
          bash deploy-as-code/helm/scripts/generate-secrets.sh deploy-as-code/helm/secrets.template.yaml digit-secrets.yaml "$SOPS_KEY_ID"
      # The team's own credentials (optional GitHub secret DIGIT_SECRETS) are locked in too,
      # so they are part of the very first deploy. Commits digit-secrets.yaml if it changed.
      - name: Add your own credentials (DIGIT_SECRETS) and commit
        uses: ./.github/actions/apply-user-secrets
        with:
          user-secrets: ${{ secrets.DIGIT_SECRETS }}
          branch: ${{ github.ref_name }}

  Infra:
    if: ${{ !failure() && !cancelled() && needs.Check.outputs.infra == 'true' }}
    needs: [Check, Prepare]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}   # includes digit-secrets.yaml committed by Prepare
      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Load digit-config.yaml
        uses: ./.github/actions/load-config
      - name: Unlock digit-secrets.yaml
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      - name: Terraform init
        run: terraform init -input=false -no-color
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: ${{ env.TF_DIR }}
      # Never lose data by accident: deleting or replacing the cluster, database, storage or
      # network needs confirm = replace. Node pools may be replaced (e.g. a new VM size).
      - name: Check the plan is safe
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          risky=$(terraform show -json tfplan | jq -r '.resource_changes[]?
            | select(.change.actions | index("delete"))
            | select(.type | test("^azurerm_(kubernetes_cluster|postgresql_flexible_server(_database)?|storage_account|storage_container|virtual_network|subnet|key_vault)$"))
            | .address')
          {
            echo "### Infrastructure plan"
            terraform show -json tfplan | jq -r '[.resource_changes[]? | .change.actions | join("+")] | group_by(.) | map("- \(.[0]): \(length)") | .[]'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$risky" ] && exit 0
          while read -r r; do echo "  will be DELETED or REPLACED: $r"; done <<< "$risky"
          if [ "$CONFIRM" != replace ]; then
            echo "::error::This change would delete or replace: $(echo "$risky" | tr '\n' ' ')- data on them can be lost. Nothing was changed. If you really want this, run again with confirm = replace."
            exit 1
          fi
          echo "::warning::confirm = replace given - applying a plan that deletes/replaces: $(echo "$risky" | tr '\n' ' ')"
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform apply (AKS, PostgreSQL, storage - first time takes 15-25 minutes)
        run: terraform apply -input=false -no-color -auto-approve tfplan
        working-directory: ${{ env.TF_DIR }}
      - name: Check the cluster
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          kubectl get nodes -o wide
      - name: Remember the commit now running in Azure (infra)
        run: |
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-state=installed digit-infra-sha="$(git rev-parse HEAD)" -o none

  Deploy:
    if: ${{ !failure() && !cancelled() && needs.Check.outputs.deploy == 'true' }}
    needs: [Check, Prepare, Infra]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit digit-secrets.yaml when DIGIT_SECRETS changed
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Load digit-config.yaml
        uses: ./.github/actions/load-config
      - name: Unlock digit-secrets.yaml
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      # Picks up DIGIT_SECRETS changes (editing a GitHub secret does not create a commit,
      # so after changing it run the workflow with action = deploy).
      - name: Add your own credentials (DIGIT_SECRETS)
        uses: ./.github/actions/apply-user-secrets
        with:
          user-secrets: ${{ secrets.DIGIT_SECRETS }}
          branch: ${{ github.ref_name }}
      - name: Connect to the cluster
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing \
            || { echo "::error::Cluster $ENVIRONMENT not found. Run the workflow with action = install first."; exit 1; }
          kubectl get nodes

      # Infra values go straight from Terraform state to helmfile - never into committed files.
      - name: Read Terraform outputs
        run: |
          set -euo pipefail
          terraform init -input=false -no-color >/dev/null
          out="$RUNNER_TEMP/tf-outputs.yaml"
          terraform output -json | CLUSTER="$ENVIRONMENT" yq -P '{"infra": {
              "dbHost": .azurerm_postgresql_flexible_server.value,
              "dbName": .postgresql_flexible_server_database_name.value,
              "clusterName": strenv(CLUSTER)}}' > "$out"
          bad=$(yq -r '.infra | to_entries | .[] | select(.value == null or .value == "") | .key' "$out")
          [ -z "$bad" ] || { echo "::error::Missing Terraform outputs: $bad. Run the workflow with action = install."; exit 1; }
          cat "$out"
          echo "TF_OUTPUTS_FILE=$out" >> "$GITHUB_ENV"
        working-directory: ${{ env.TF_DIR }}

      # Helm pinned to v3: the runner image may ship Helm 4, whose plugin install differs.
      - name: Install Helm, Helmfile, helm-diff, helm-secrets
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" helmfile
          sudo install -m 0755 "$RUNNER_TEMP/helmfile" /usr/local/bin/helmfile
          helm plugin install https://github.com/databus23/helm-diff --version "v${HELM_DIFF_VERSION}"
          helm plugin install https://github.com/jkroepke/helm-secrets --version "v${HELM_SECRETS_VERSION}"
          helm version --short; helmfile --version; helm plugin list

      # helmfiles/backbone -> core -> monitoring, all from packaged charts.
      # Values: defaults.yaml < digit-config.yaml < Terraform outputs < digit-secrets.yaml (helm-secrets).
      - name: Deploy DIGIT (backbone, core, monitoring - takes 20-40 minutes)
        run: helmfile -f digit-helmfile.yaml.gotmpl apply --suppress-secrets --skip-diff-on-install
        working-directory: deploy-as-code/helm

      # The postsync hook only runs when the vault release changes; re-check every deploy (idempotent).
      - name: Vault check
        run: |
          # namespaces as the helmfile sees them: defaults.yaml overridden by digit-config.yaml
          # shellcheck disable=SC2016  # $i is a yq variable
          ns() { yq eval-all -r '. as $i ireduce ({}; . * $i) | .namespaces.'"$1" defaults.yaml "$DIGIT_CONFIG"; }
          bash scripts/vault-bootstrap.sh "$(ns vault)" "$(ns core)"
        working-directory: deploy-as-code/helm

      - name: Remember the commit now running in Azure (apps)
        run: |
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-deploy-sha="$(git rev-parse HEAD)" -o none

      - name: Last step - point your domain at DIGIT
        working-directory: deploy-as-code/helm
        run: |
          # shellcheck disable=SC2016  # $i is a yq variable
          bb=$(yq eval-all -r '. as $i ireduce ({}; . * $i) | .namespaces.backbone' defaults.yaml "$DIGIT_CONFIG")
          ip=""
          for _ in $(seq 1 30); do
            ip=$(kubectl get svc ingress-nginx-controller -n "$bb" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$ip" ] && break; sleep 10
          done
          echo "Public IP: ${ip:-not ready yet}"
          {
            cat "$RUNNER_TEMP/config-summary.md"
            echo
            echo "## DIGIT is installed :rocket:"
            echo
            echo "**One last step:** go to the website where you bought your domain and add this DNS record:"
            echo
            echo "| Type | Name | Value |"
            echo "|---|---|---|"
            echo "| A | \`${DOMAIN_NAME}\` | \`${ip:-run deploy again to see it}\` |"
            echo
            echo "Wait 5 to 30 minutes, then open **https://${DOMAIN_NAME}**."
          } >> "$GITHUB_STEP_SUMMARY"

  Destroy:
    if: ${{ needs.Check.outputs.destroy == 'true' }}
    needs: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Load digit-config.yaml
        uses: ./.github/actions/load-config
      - name: Unlock digit-secrets.yaml
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      # Remove the ingress LoadBalancer first so its public IP is released before the network goes.
      - name: Delete the public IP
        continue-on-error: true
        working-directory: deploy-as-code/helm
        run: |
          # shellcheck disable=SC2016  # $i is a yq variable
          bb=$(yq eval-all -r '. as $i ireduce ({}; . * $i) | .namespaces.backbone' defaults.yaml "$DIGIT_CONFIG")
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          kubectl delete svc ingress-nginx-controller -n "$bb" --wait=true --timeout=5m
      - name: Terraform init
        run: terraform init -input=false -no-color
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform destroy (takes 10-20 minutes)
        run: terraform destroy -input=false -no-color -auto-approve
        working-directory: ${{ env.TF_DIR }}
      # Commits no longer change anything until the next install.
      - name: Mark the environment destroyed
        run: |
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-state=destroyed digit-infra-sha= digit-deploy-sha= -o none
      - name: Summary
        run: |
          {
            echo "## DIGIT \`$ENVIRONMENT\` is deleted"
            echo "The resource group \`$RESOURCE_GROUP\` is kept. It holds the Terraform state and your Key Vault,"
            echo "so **install** can bring the same DIGIT back with the same passwords."
            echo "To remove everything, delete the resource group \`$RESOURCE_GROUP\` in the Azure portal."
          } >> "$GITHUB_STEP_SUMMARY"
