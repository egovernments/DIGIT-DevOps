name: DIGIT one-click (Azure)
# Fork this repository, then follow ONE-CLICK-AZURE.md. A team changes ONE file,
# deploy-as-code/helm/environments/<env>.yaml (egov-demo.yaml layout, renamed from
# digit-template.yaml), and adds ONE GitHub secret, AZURE_CREDENTIALS. Everything else is
# created by this workflow. The helmfiles read only <env>.yaml and <env>-secrets.yaml.
#
#   install  First time: a NEW environment. Refuses to touch Azure resources this fork did
#            not create (ownership tags managed-by / digit-repo / digit-name).
#            1. Azure resource group, Terraform state storage and the team's own Key Vault
#            2. <env>.yaml: fills <domain> <email> <env>; <env>-secrets.yaml: fresh random
#               passwords + DIGIT_SECRETS, locked (SOPS) with that Key Vault BY THIS WORKFLOW;
#               both committed to the fork
#            3. Terraform: AKS + PostgreSQL Flexible Server + storage; fills <db_host> <db_name>
#            4. Deploy DIGIT backbone, core 3.0 and monitoring from packaged Helm charts
#   infra    step 3 only. Stops if the plan would delete/replace the cluster, database,
#            storage, network or Key Vault, unless confirm = replace.
#   deploy   step 4 only (also applies a changed DIGIT_SECRETS)
#   destroy  Terraform destroy. The resource group (state + Key Vault) is kept.
#
# Two ways to deploy (infra.argocd.enabled in <env>.yaml, fixed at the first install):
#   helmfile  the workflow runs `helmfile apply`
#   argocd    the workflow installs Argo CD and one root Application "digit"; Argo CD deploys
#             EVERY release from this fork via the digit-helmfile plugin
#             (scripts/argocd-plugin.sh) - same helmfiles, same two files.
#
# After the first install, every commit to the fork's default branch runs by itself, for
# every environment file in it, and applies only what changed since the commit running in
# Azure (resource-group tags digit-infra-sha / digit-deploy-sha,
# .github/scripts/one-click-changes.sh):
#   Terraform code or infra.location/infra.terraform  -> infra
#   the rest of <env>.yaml, <env>-secrets.yaml, helmfiles -> deploy
on:
  push:
    paths:
      - deploy-as-code/helm/**
      - infra-as-code/terraform/**
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment = name of your file deploy-as-code/helm/environments/<name>.yaml'
        required: true
        type: string
      action:
        description: 'What do you want to do?'
        required: true
        type: choice
        default: install
        options:
          - install
          - infra
          - deploy
          - destroy
      confirm:
        description: 'For destroy type: delete   (for infra, only if it asks: replace)'
        required: false
        default: ''

permissions:
  contents: read

# One run at a time per fork + branch.
concurrency:
  group: digit-one-click-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.11.4"
  HELM_VERSION: "3.22.1"
  HELMFILE_VERSION: "1.8.4"
  HELM_DIFF_VERSION: "3.15.15"
  HELM_SECRETS_VERSION: "4.7.11"
  SOPS_VERSION: "3.13.3"
  TF_DIR: infra-as-code/terraform/azure

jobs:
  # Which environments to run: the one asked for, or (on a commit) every environment file.
  Environments:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.repository != 'egovernments/DIGIT-DevOps' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Use your own fork
        if: ${{ github.repository == 'egovernments/DIGIT-DevOps' }}
        run: |
          echo "::error::Do not run this in egovernments/DIGIT-DevOps. Fork the repository and run it in your fork (ONE-CLICK-AZURE.md, step 1)."
          exit 1
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: List environments
        id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            list=$(jq -cn --arg e "$INPUT_ENV" '[$e]')
          else
            list=$(for f in deploy-as-code/helm/environments/*.yaml; do
                     n=$(basename "$f" .yaml)
                     case "$n" in *-secrets|digit-template) continue ;; esac
                     yq -e '.infra | type == "!!map"' "$f" >/dev/null 2>&1 && echo "$n"
                   done | jq -Rcs 'split("\n") | map(select(length > 0))')
          fi
          echo "Environments: $list" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  DIGIT:
    needs: Environments
    if: ${{ needs.Environments.outputs.list != '[]' }}
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # commit the generated secrets file and the values filled into <env>.yaml
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.Environments.outputs.list) }}
    steps:
      - name: Confirm destroy
        if: ${{ inputs.action == 'destroy' && inputs.confirm != 'delete' }}
        run: |
          echo "::error::To delete your DIGIT, run again and type the word delete in the confirm box."
          exit 1
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Azure login
        uses: ./.github/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check the environment file
        uses: ./.github/actions/load-config
        with:
          environment: ${{ matrix.environment }}

      # install = a NEW environment, or a re-run of this fork's own install.
      # Everything else = only an environment this fork installed and has not destroyed.
      # On a commit, only the parts whose inputs changed since the running commit are run.
      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          out() { printf 'prepare=%s\ninfra=%s\ndeploy=%s\ndestroy=%s\n' "$1" "$2" "$3" "$4" >> "$GITHUB_OUTPUT"; }
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          cat "$RUNNER_TEMP/config-summary.md" >> "$GITHUB_STEP_SUMMARY"
          repo="${GITHUB_REPOSITORY,,}"
          tags=$(az group show -n "$RESOURCE_GROUP" --query tags -o json 2>/dev/null || true)
          t() { printf '%s' "$tags" | jq -r --arg k "$1" '(. // {})[$k] // ""'; }

          if [ -n "$tags" ] && { [ "$(t managed-by)" != digit-one-click ] || [ "$(t digit-repo)" != "$repo" ] || [ "$(t digit-name)" != "$ENVIRONMENT" ]; }; then
            echo "::error file=$ENV_FILE::The resource group $RESOURCE_GROUP already exists but was not created by this fork's one-click install (owner: '$(t digit-repo)'). Nothing was changed. Use a different environment name (rename the file)."
            exit 1
          fi
          state=$(t digit-state)   # installed | destroyed | "" (never finished an install)
          mode=$(t digit-deploy-mode)
          if [ "$state" = installed ] && [ -n "$mode" ] && [ "$mode" != "$DEPLOY_MODE" ] && [ "$ACTION" != destroy ]; then
            echo "::error file=$ENV_FILE::This DIGIT was deployed with $mode, but infra.argocd.enabled now says $DEPLOY_MODE. It cannot be switched on a running DIGIT. Change it back, or run destroy and then install again."
            exit 1
          fi

          if [ "$EVENT" = push ]; then
            if [ "$state" != installed ]; then
              note "Not installed (or destroyed) - this commit changes nothing in Azure. Run the workflow with action = install."
              out false false false false; exit 0
            fi
            res=$(bash .github/scripts/one-click-changes.sh "$ENVIRONMENT" "$(t digit-infra-sha)" "$(t digit-deploy-sha)")
            infra=$(sed -n 's/^infra=//p' <<< "$res"); deploy=$(sed -n 's/^deploy=//p' <<< "$res")
            note "This commit: infra=$infra, deploy=$deploy"
            out false "$infra" "$deploy" false; exit 0
          fi

          case "$ACTION" in
            install)
              if [ -n "$tags" ]; then note "Existing environment of $repo: $RESOURCE_GROUP (re-run)"
              else note "New environment: $RESOURCE_GROUP will be created"; fi
              out true true true false ;;
            infra|deploy|destroy)
              if [ "$state" != installed ]; then
                echo "::error::Nothing is installed for '$ENVIRONMENT' (or it was destroyed). Run the workflow with action = install first."; exit 1
              fi
              out false "$([ "$ACTION" = infra ] && echo true || echo false)" "$([ "$ACTION" = deploy ] && echo true || echo false)" "$([ "$ACTION" = destroy ] && echo true || echo false)" ;;
          esac

      - name: Setup sops
        if: contains(format('{0}{1}{2}{3}', steps.decide.outputs.prepare, steps.decide.outputs.infra, steps.decide.outputs.deploy, steps.decide.outputs.destroy), 'true')
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
          required: ${{ steps.decide.outputs.prepare == 'true' && 'false' || 'true' }}

      # ---------------- Prepare (install) ----------------
      # The database server name (<env>-server) must be unique in all of Azure.
      - name: Check the name is free in Azure
        if: steps.decide.outputs.prepare == 'true'
        run: |
          set -euo pipefail
          srv="${ENVIRONMENT}-server"
          if az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$srv" -o none 2>/dev/null; then
            echo "$srv already belongs to this install"; exit 0
          fi
          free=$(az rest --method post \
            --url "https://management.azure.com/subscriptions/${ARM_SUBSCRIPTION_ID}/providers/Microsoft.DBforPostgreSQL/checkNameAvailability?api-version=2022-12-01" \
            --body "{\"name\": \"$srv\", \"type\": \"Microsoft.DBforPostgreSQL/flexibleServers\"}" --query nameAvailable -o tsv)
          [ "$free" = "true" ] || { echo "::error file=$ENV_FILE::The name '$ENVIRONMENT' is already used by someone else in Azure. Use another environment name (rename the file)."; exit 1; }

      # Idempotent: every re-run finds the same, already-created resources.
      - name: Resource group, Terraform state storage and Key Vault
        if: steps.decide.outputs.prepare == 'true'
        run: |
          set -euo pipefail
          read -ra tags <<< "$OWNER_TAGS"
          # The decide step already refused groups this fork does not own.
          az group show -n "$RESOURCE_GROUP" -o none 2>/dev/null ||
            az group create -n "$RESOURCE_GROUP" -l "$LOCATION" --tags "${tags[@]}" environment="$ENVIRONMENT" -o none

          if ! az storage account show -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            echo "Creating Terraform state storage $STORAGE_ACCOUNT_NAME"
            az storage account create -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" -l "$LOCATION" \
              --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 \
              --allow-blob-public-access false --tags "${tags[@]}" environment="$ENVIRONMENT" -o none
          fi
          key=$(az storage account keys list -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" --query '[0].value' -o tsv)
          echo "::add-mask::$key"
          az storage container create -n "${ENVIRONMENT}-container" --account-name "$STORAGE_ACCOUNT_NAME" \
            --account-key "$key" --public-access off -o none

          # The team's own Key Vault + key that locks <env>-secrets.yaml. A soft-deleted vault of
          # the same name is only ever this fork's own earlier install (the name hashes
          # subscription + fork + env): bring it back only when the fork still has the secrets
          # file it locked; otherwise purge it and start fresh.
          if ! az keyvault show -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            old=$(az keyvault show-deleted -n "$KEY_VAULT_NAME" --query properties.tags -o json 2>/dev/null || true)
            if [ -n "$old" ] && [ "$(printf '%s' "$old" | jq -r '(. // {})["digit-repo"] // ""')" != "${GITHUB_REPOSITORY,,}" ]; then
              echo "::error::Key Vault name $KEY_VAULT_NAME is held by a deleted vault this fork did not create. Use a different environment name."; exit 1
            fi
            if [ -n "$old" ] && [ -f "$SECRETS_FILE" ]; then
              echo "Recovering this fork's deleted Key Vault $KEY_VAULT_NAME (keeps the key, so the secrets file still unlocks)"
              az keyvault recover -n "$KEY_VAULT_NAME" -o none
            else
              if [ -n "$old" ]; then
                echo "Purging this fork's old deleted Key Vault $KEY_VAULT_NAME (no secrets file uses it)"
                az keyvault purge -n "$KEY_VAULT_NAME" -o none
                for _ in $(seq 1 60); do az keyvault show-deleted -n "$KEY_VAULT_NAME" -o none 2>/dev/null || break; sleep 10; done
              fi
              echo "Creating Key Vault $KEY_VAULT_NAME"
              az keyvault create -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" -l "$LOCATION" \
                --enable-rbac-authorization false --tags "${tags[@]}" environment="$ENVIRONMENT" -o none
            fi
          fi
          # Access policy for this service principal (object id from its own token: no Graph rights needed).
          oid=$(az account get-access-token --query accessToken -o tsv | cut -d. -f2 |
                python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); print(json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4)))['oid'])")
          az keyvault set-policy -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" --object-id "$oid" \
            --key-permissions get list create encrypt decrypt -o none
          az keyvault key show --vault-name "$KEY_VAULT_NAME" -n sops -o none 2>/dev/null ||
            az keyvault key create --vault-name "$KEY_VAULT_NAME" -n sops --kty RSA --size 4096 -o none
          echo "SOPS_KEY_ID=$(az keyvault key show --vault-name "$KEY_VAULT_NAME" -n sops --query key.kid -o tsv)" >> "$GITHUB_ENV"

      # <domain>, <email> and <env> in <env>.yaml -> the team's values. Plain text replace, so
      # the file keeps exactly the layout and comments the team wrote.
      - name: Fill in your domain and e-mail
        if: steps.decide.outputs.prepare == 'true'
        run: |
          esc() { printf '%s' "$1" | sed 's/[&|\\]/\\&/g'; }
          sed -i -e "s|<domain>|$(esc "$DOMAIN_NAME")|g" -e "s|<email>|$(esc "$ACME_EMAIL")|g" \
            -e "s|<env>|$(esc "$ENVIRONMENT")|g" "$ENV_FILE"
          git diff --stat -- "$ENV_FILE"

      # First install only: generate and lock <env>-secrets.yaml. Never overwritten.
      - name: Create the secrets file (first install only)
        if: steps.decide.outputs.prepare == 'true'
        run: |
          set -euo pipefail
          if [ -f "$SECRETS_FILE" ]; then echo "$SECRETS_FILE already exists - kept"; exit 0; fi
          bash deploy-as-code/helm/scripts/generate-secrets.sh "$SECRETS_TEMPLATE" "$SECRETS_FILE" "$SOPS_KEY_ID"

      # The team's own credentials (optional GitHub secret DIGIT_SECRETS) are locked in too
      # (also on every deploy), so they are part of the very first deploy.
      - name: Add your own credentials (DIGIT_SECRETS)
        if: steps.decide.outputs.prepare == 'true' || steps.decide.outputs.deploy == 'true'
        uses: ./.github/actions/apply-user-secrets
        with:
          user-secrets: ${{ secrets.DIGIT_SECRETS }}
      - name: Commit the environment files
        if: steps.decide.outputs.prepare == 'true' || steps.decide.outputs.deploy == 'true'
        uses: ./.github/actions/commit-to-fork
        with:
          paths: ${{ env.ENV_FILE }} ${{ env.SECRETS_FILE }}
          message: "chore(one-click): environment files for ${{ matrix.environment }}"
          branch: ${{ github.ref_name }}
      - name: Unlock the secrets file
        if: steps.decide.outputs.prepare == 'true'
        uses: ./.github/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}

      # ---------------- Infra (install, infra) ----------------
      - name: Setup Terraform
        if: steps.decide.outputs.infra == 'true' || steps.decide.outputs.destroy == 'true'
        uses: ./.github/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      - name: Terraform init
        if: steps.decide.outputs.infra == 'true'
        run: terraform init -input=false -no-color
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform plan
        if: steps.decide.outputs.infra == 'true'
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: ${{ env.TF_DIR }}
      # Never lose data by accident: deleting or replacing the cluster, database, storage or
      # network needs confirm = replace. Node pools may be replaced (e.g. a new VM size).
      - name: Check the plan is safe
        if: steps.decide.outputs.infra == 'true'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          risky=$(terraform show -json tfplan | jq -r '.resource_changes[]?
            | select(.change.actions | index("delete"))
            | select(.type | test("^azurerm_(kubernetes_cluster|postgresql_flexible_server(_database)?|storage_account|storage_container|virtual_network|subnet|key_vault)$"))
            | .address')
          {
            echo "### Infrastructure plan"
            terraform show -json tfplan | jq -r '[.resource_changes[]? | .change.actions | join("+")] | group_by(.) | map("- \(.[0]): \(length)") | .[]'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$risky" ] && exit 0
          while read -r r; do echo "  will be DELETED or REPLACED: $r"; done <<< "$risky"
          if [ "$CONFIRM" != replace ]; then
            echo "::error::This change would delete or replace: $(echo "$risky" | tr '\n' ' ')- data on them can be lost. Nothing was changed. If you really want this, run infra again with confirm = replace."
            exit 1
          fi
          echo "::warning::confirm = replace given - applying a plan that deletes/replaces: $(echo "$risky" | tr '\n' ' ')"
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform apply (AKS, PostgreSQL, storage - first time takes 15-25 minutes)
        if: steps.decide.outputs.infra == 'true'
        run: terraform apply -input=false -no-color -auto-approve tfplan
        working-directory: ${{ env.TF_DIR }}
      # <db_host> / <db_name> in <env>.yaml -> the database Terraform created
      - name: Fill in the database address
        if: steps.decide.outputs.infra == 'true'
        run: |
          set -euo pipefail
          out=$(terraform -chdir="$TF_DIR" output -json)
          H=$(jq -r '.azurerm_postgresql_flexible_server.value // ""' <<< "$out")
          B=$(jq -r '.postgresql_flexible_server_database_name.value // ""' <<< "$out")
          [ -n "$H" ] && [ -n "$B" ] || { echo "::error::Terraform did not output the database host/name"; exit 1; }
          sed -i -e "s|<db_host>|$H|g" -e "s|<db_name>|$B|g" "$ENV_FILE"
          cur=$(yq -r '.["cluster-configs"].configmaps["egov-config"].data["db-host"] // ""' "$ENV_FILE")
          [ "$cur" = "$H" ] || echo "::warning file=$ENV_FILE::cluster-configs db-host is '$cur' but the database is '$H'. Update it in $ENV_FILE."
      - name: Commit the database address
        if: steps.decide.outputs.infra == 'true'
        uses: ./.github/actions/commit-to-fork
        with:
          paths: ${{ env.ENV_FILE }}
          message: "chore(one-click): database address for ${{ matrix.environment }}"
          branch: ${{ github.ref_name }}
      - name: Remember the commit now running in Azure (infra)
        if: steps.decide.outputs.infra == 'true'
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          kubectl get nodes -o wide
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-state=installed digit-infra-sha="$(git rev-parse HEAD)" -o none

      # ---------------- Deploy (install, deploy) ----------------
      - name: Connect to the cluster
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          if grep -qE '<db_host>|<db_name>' "$ENV_FILE"; then
            echo "::error file=$ENV_FILE::The database address is not filled in yet. Run the workflow with action = install."; exit 1
          fi
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing \
            || { echo "::error::Cluster $ENVIRONMENT not found. Run the workflow with action = install first."; exit 1; }
          kubectl get nodes

      # Helm pinned to v3: the runner image may ship Helm 4, whose plugin install differs.
      - name: Install Helm, Helmfile, helm-diff, helm-secrets
        if: steps.decide.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" helmfile
          sudo install -m 0755 "$RUNNER_TEMP/helmfile" /usr/local/bin/helmfile
          helm plugin install https://github.com/databus23/helm-diff --version "v${HELM_DIFF_VERSION}"
          helm plugin install https://github.com/jkroepke/helm-secrets --version "v${HELM_SECRETS_VERSION}"
          helm version --short; helmfile --version; helm plugin list

      # backbone -> core -> monitoring from packaged charts. The helmfiles read only
      # DIGIT_ENV_FILE (<env>.yaml) and DIGIT_SECRETS_FILE (<env>-secrets.yaml, helm-secrets).
      - name: Deploy DIGIT with helmfile (backbone, core, monitoring - takes 20-40 minutes)
        if: steps.decide.outputs.deploy == 'true' && env.DEPLOY_MODE == 'helmfile'
        run: helmfile -f digit-helmfile.yaml.gotmpl apply --suppress-secrets --skip-diff-on-install
        working-directory: deploy-as-code/helm

      # ---- Argo CD mode: install Argo CD, then Argo CD deploys everything from this fork ----
      # sops in the Argo CD plugin unlocks <env>-secrets.yaml with the cluster's own (kubelet)
      # managed identity: allowed to get/decrypt with the Key Vault key, nothing else.
      - name: Argo CD - allow the cluster to unlock the secrets file
        if: steps.decide.outputs.deploy == 'true' && env.DEPLOY_MODE == 'argocd'
        run: |
          set -euo pipefail
          cid=$(az aks show -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --query identityProfile.kubeletidentity.clientId -o tsv)
          oid=$(az aks show -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --query identityProfile.kubeletidentity.objectId -o tsv)
          [ -n "$cid" ] && [ -n "$oid" ] || { echo "::error::Could not read the cluster's kubelet identity"; exit 1; }
          az keyvault set-policy -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" --object-id "$oid" --key-permissions get decrypt -o none
          echo "KUBELET_CLIENT_ID=$cid" >> "$GITHUB_ENV"

      # Admin login of the Argo CD UI = secrets.argocd.adminPassword. The bcrypt hash is kept
      # when the password did not change, so Argo CD is not restarted on every deploy.
      - name: Argo CD - admin password
        if: steps.decide.outputs.deploy == 'true' && env.DEPLOY_MODE == 'argocd'
        run: |
          set -euo pipefail
          pw=$(sops -d --extract '["cluster-configs"]["secrets"]["argocd-admin"]["password"]' "$SECRETS_FILE"); echo "::add-mask::$pw"
          old=$(kubectl -n "$NS_ARGOCD" get secret argocd-secret -o jsonpath='{.data.admin\.password}' 2>/dev/null | base64 -d || true)
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check bcrypt
          hash=$(PW="$pw" OLD="$old" "$RUNNER_TEMP/venv/bin/python" -c '
          import os, bcrypt
          pw, old = os.environ["PW"].encode(), os.environ["OLD"].encode()
          try: keep = bool(old) and bcrypt.checkpw(pw, old)
          except ValueError: keep = False
          print((old if keep else bcrypt.hashpw(pw, bcrypt.gensalt())).decode())')
          echo "::add-mask::$hash"
          echo "ARGOCD_ADMIN_HASH=$hash" >> "$GITHUB_ENV"

      - name: Argo CD - install or upgrade Argo CD
        if: steps.decide.outputs.deploy == 'true' && env.DEPLOY_MODE == 'argocd'
        run: helmfile -f helmfiles/argocd.yaml.gotmpl apply --suppress-secrets --skip-diff-on-install
        working-directory: deploy-as-code/helm

      # The only object the workflow gives Argo CD. Argo CD renders it with the plugin into one
      # Application per helmfile release (ordered by sync waves) and keeps all of them synced.
      - name: Argo CD - hand DIGIT over to Argo CD
        if: steps.decide.outputs.deploy == 'true' && env.DEPLOY_MODE == 'argocd'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          kubectl apply -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: digit
            namespace: ${NS_ARGOCD}
          spec:
            project: default
            source:
              repoURL: https://github.com/${GITHUB_REPOSITORY}.git
              targetRevision: ${BRANCH}
              path: deploy-as-code/helm
              plugin:
                name: digit-helmfile
                env:
                  - {name: MODE, value: apps}
                  - {name: ENV, value: "${ENVIRONMENT}"}
            destination:
              server: https://kubernetes.default.svc
              namespace: ${NS_ARGOCD}
            syncPolicy:
              automated: {prune: true, selfHeal: true}
              retry: {limit: 20, backoff: {duration: 30s, factor: 2, maxDuration: 10m}}
          EOF
          # Do not wait for the 3-minute poll
          kubectl -n "$NS_ARGOCD" annotate applications.argoproj.io --all argocd.argoproj.io/refresh=normal --overwrite >/dev/null

      # Vault starts sealed: unseal it and write the AppRole (idempotent). In Argo CD mode this
      # waits until Argo CD has created Vault.
      - name: Vault check
        if: steps.decide.outputs.deploy == 'true'
        env:
          VAULT_WAIT_SECONDS: ${{ env.DEPLOY_MODE == 'argocd' && '2400' || '450' }}
        run: bash scripts/vault-bootstrap.sh "$NS_VAULT" "$NS_CORE"
        working-directory: deploy-as-code/helm

      - name: Argo CD - wait until every application is synced and healthy
        if: steps.decide.outputs.deploy == 'true' && env.DEPLOY_MODE == 'argocd'
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          deadline=$((SECONDS + 3600)); next_print=0
          while :; do
            apps=$(kubectl -n "$NS_ARGOCD" get applications.argoproj.io -o json)
            rev=$(printf '%s' "$apps" | jq -r '.items[] | select(.metadata.name == "digit") | .status.sync.revision // ""')
            # ok when Argo CD runs this commit, or a newer one that contains it
            if [ "$rev" != "$head" ] && [ -n "$rev" ]; then
              git fetch -q --depth=50 origin "$rev" 2>/dev/null && git merge-base --is-ancestor "$head" "$rev" 2>/dev/null && head=$rev
            fi
            total=$(printf '%s' "$apps" | jq '.items | length')
            pending=$(printf '%s' "$apps" | jq -r --arg h "$head" '.items[]
              | select(.status.sync.status != "Synced" or .status.health.status != "Healthy" or (.status.sync.revision // "") != $h)
              | "\(.metadata.name)  sync=\(.status.sync.status // "-")  health=\(.status.health.status // "-")"')
            if [ "$total" -gt 1 ] && [ -z "$pending" ]; then
              echo "All $total Argo CD applications are synced and healthy at ${head:0:9}"; break
            fi
            if [ $SECONDS -ge "$next_print" ]; then
              echo "--- $(date -u +%H:%M:%S) waiting for $(printf '%s\n' "$pending" | grep -c .) of $total applications:"; printf '%s\n' "$pending"
              next_print=$((SECONDS + 120))
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::Argo CD did not finish within 60 minutes. Still waiting for:"
              printf '%s\n' "$pending"
              printf '%s' "$apps" | jq -r '.items[] | select(.status.conditions != null) | "\(.metadata.name): \(.status.conditions | map(.message) | join(" | "))"' | cut -c1-400
              exit 1
            fi
            sleep 20
          done
          {
            echo "### Argo CD"
            echo "All $total applications synced and healthy. UI: **https://${DOMAIN_NAME}/argocd** (user \`admin\`, password = \`argocd.adminPassword\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remember the commit now running in Azure (apps)
        if: steps.decide.outputs.deploy == 'true'
        run: |
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-deploy-sha="$(git rev-parse HEAD)" digit-deploy-mode="$DEPLOY_MODE" -o none

      - name: Last step - point your domain at DIGIT
        if: steps.decide.outputs.deploy == 'true'
        run: |
          ip=""
          for _ in $(seq 1 30); do
            ip=$(kubectl get svc ingress-nginx-controller -n "$NS_BACKBONE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$ip" ] && break; sleep 10
          done
          echo "Public IP: ${ip:-not ready yet}"
          {
            echo
            echo "## DIGIT is installed :rocket:"
            echo
            echo "**One last step:** go to the website where you bought your domain and add this DNS record:"
            echo
            echo "| Type | Name | Value |"
            echo "|---|---|---|"
            echo "| A | \`${DOMAIN_NAME}\` | \`${ip:-run deploy again to see it}\` |"
            echo
            echo "Wait 5 to 30 minutes, then open **https://${DOMAIN_NAME}**."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------- Destroy ----------------
      # Remove the ingress LoadBalancer first so its public IP is released before the network goes.
      - name: Delete the public IP
        if: steps.decide.outputs.destroy == 'true'
        continue-on-error: true
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          # Argo CD mode: stop Argo CD first, or it would put the service straight back
          kubectl -n "$NS_ARGOCD" scale statefulset argocd-application-controller --replicas=0 2>/dev/null || true
          kubectl delete svc ingress-nginx-controller -n "$NS_BACKBONE" --wait=true --timeout=5m
      - name: Terraform destroy (takes 10-20 minutes)
        if: steps.decide.outputs.destroy == 'true'
        run: |
          terraform init -input=false -no-color
          terraform destroy -input=false -no-color -auto-approve
        working-directory: ${{ env.TF_DIR }}
      # Commits no longer change anything until the next install.
      - name: Mark the environment destroyed
        if: steps.decide.outputs.destroy == 'true'
        run: |
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-state=destroyed digit-infra-sha= digit-deploy-sha= -o none
          {
            echo "## DIGIT \`$ENVIRONMENT\` is deleted"
            echo "The resource group \`$RESOURCE_GROUP\` is kept. It holds the Terraform state and your Key Vault,"
            echo "so **install** can bring the same DIGIT back with the same passwords."
            echo "To remove everything, delete the resource group \`$RESOURCE_GROUP\` in the Azure portal."
          } >> "$GITHUB_STEP_SUMMARY"
