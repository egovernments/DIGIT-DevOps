name: DIGIT one-click (Azure)
# Fork this repository, then follow one-click/README.md. A team changes ONE file,
# one-click/input.yaml (environment, domain, email + optional settings), and adds ONE GitHub
# secret, AZURE_CREDENTIALS. Everything else is created by this workflow. The helmfiles live
# in egovernments/helm-charts (helmfile/digit3-one-click), pinned by helmfiles_ref, and read
# only one-click/<environment>.yaml (filled from input.yaml + Terraform on every deploy) and
# one-click/<environment>-secrets.yaml.
#
#   install  First time: a NEW environment. Refuses to touch Azure resources this fork did
#            not create (ownership tags managed-by / digit-repo / digit-name).
#            1. Azure resource group, Terraform state storage and the team's own Key Vault
#            2. <environment>.yaml copied from digit-template.yaml; <environment>-secrets.yaml:
#               fresh random passwords + DIGIT_SECRETS, locked (SOPS) with that Key Vault BY
#               THIS WORKFLOW; both committed to the fork
#            3. Terraform: AKS + PostgreSQL Flexible Server + storage
#            4. Deploy DIGIT backbone, core 3.0 and monitoring from packaged Helm charts
#   infra    step 3 only. Stops if the plan would delete/replace the cluster, database,
#            storage, network or Key Vault, unless confirm = replace.
#   deploy   step 4 only (also applies a changed DIGIT_SECRETS)
#   destroy  confirm = delete: Terraform destroy. The resource group (state + Key Vault) is
#            kept, so install brings the same DIGIT back with the same passwords.
#            confirm = delete-all: also deletes the resource group, purges the Key Vault and
#            removes <environment>.yaml + <environment>-secrets.yaml from the fork.
#
# Two ways to deploy (argocd_enabled in input.yaml, fixed at the first install):
#   helmfile  the workflow runs `helmfile apply`
#   argocd    the workflow installs Argo CD and one root Application "digit"; Argo CD deploys
#             EVERY release via the digit-helmfile plugin (input.yaml + env files from this
#             fork, helmfiles from helm-charts at the same pinned ref).
#
# Jobs:  Plan -> Infra -> Deploy        (Destroy instead, for destroy)
#   Plan    decides what runs and writes why in its summary.
#   Infra   Terraform (and, on install, the resource group, Key Vault and files first).
#   Deploy  the DIGIT apps. On a commit it runs even if Infra failed, so an apps change is
#           never stuck behind an infra problem; on install it waits for Infra.
#
# After the first install, every commit to the fork's default branch runs by itself and
# applies only what changed since the last successful Infra / Deploy (resource-group tags
# digit-infra-sha / digit-deploy-sha, one-click/scripts/one-click-changes.sh):
#   Terraform code, or location / terraform_* in input.yaml        -> Infra
#   the rest of input.yaml, <environment>.yaml, the secrets file   -> Deploy
#   both                                                           -> Infra and Deploy
# A failed Infra or Deploy runs again on the next commit (its tag was not moved).
on:
  push:
    paths:
      - one-click/*.yaml
      - infra-as-code/terraform/**
  workflow_dispatch:
    inputs:
      action:
        description: 'What do you want to do?'
        required: true
        type: choice
        default: install
        options:
          - install
          - infra
          - deploy
          - destroy
      confirm:
        description: 'destroy: type delete (keeps state + Key Vault) or delete-all (removes everything). infra: replace, only if it asks'
        required: false
        default: ''

permissions:
  contents: read

# One run at a time per fork + branch.
concurrency:
  group: digit-one-click-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.11.4"
  HELM_VERSION: "3.22.1"
  HELMFILE_VERSION: "1.8.4"
  HELM_DIFF_VERSION: "3.15.15"
  HELM_SECRETS_VERSION: "4.7.11"
  SOPS_VERSION: "3.13.3"
  TF_DIR: infra-as-code/terraform/azure

jobs:
  # Which environments to run: the one asked for, or (on a commit) every environment file.
  Environments:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.repository != 'egovernments/DIGIT-DevOps' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Use your own fork
        if: ${{ github.repository == 'egovernments/DIGIT-DevOps' }}
        run: |
          echo "::error::Do not run this in egovernments/DIGIT-DevOps. Fork the repository and run it in your fork (one-click/README.md, step 1)."
          exit 1
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The environment is the one named in one-click/input.yaml. On a commit, nothing runs
      # until input.yaml is filled in.
      - name: Read the environment from input.yaml
        id: list
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          env=$(yq -r '.environment // ""' one-click/input.yaml 2>/dev/null || true)
          if [ "$EVENT" = push ] && [[ ! $env =~ ^[a-z][a-z0-9-]{1,18}[a-z0-9]$ ]]; then
            echo "one-click/input.yaml is not filled in yet - nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            echo 'list=[]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          list=$(jq -cn --arg e "${env:-input.yaml}" '[$e]')
          echo "Environment: $list" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # What this run does. A commit runs only the parts whose files changed (see the top of this
  # file); a manual run does the chosen action. The summary of this job says which and why.
  Plan:
    needs: Environments
    if: ${{ needs.Environments.outputs.list != '[]' }}
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prepare: ${{ steps.decide.outputs.prepare }}
      infra: ${{ steps.decide.outputs.infra }}
      deploy: ${{ steps.decide.outputs.deploy }}
      destroy: ${{ steps.decide.outputs.destroy }}
      destroy_all: ${{ steps.decide.outputs.destroy_all }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.Environments.outputs.list) }}
    steps:
      - name: Confirm destroy
        if: ${{ inputs.action == 'destroy' && inputs.confirm != 'delete' && inputs.confirm != 'delete-all' }}
        run: |
          echo "::error::To delete your DIGIT, run again and type in the confirm box: delete (keeps the resource group, so install can bring it back) or delete-all (removes everything)."
          exit 1
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Azure login
        uses: ./one-click/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check input.yaml
        uses: ./one-click/actions/load-config

      # install = a NEW environment, or a re-run of this fork's own install.
      # Everything else = only an environment this fork installed and has not destroyed.
      # On a commit, only the parts whose inputs changed since the running commit are run.
      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          out() { printf 'prepare=%s\ninfra=%s\ndeploy=%s\ndestroy=%s\n' "$1" "$2" "$3" "$4" >> "$GITHUB_OUTPUT"; }
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          cat "$RUNNER_TEMP/config-summary.md" >> "$GITHUB_STEP_SUMMARY"
          repo="${GITHUB_REPOSITORY,,}"
          tags=$(az group show -n "$RESOURCE_GROUP" --query tags -o json 2>/dev/null || true)
          t() { printf '%s' "$tags" | jq -r --arg k "$1" '(. // {})[$k] // ""'; }

          if [ -n "$tags" ] && { [ "$(t managed-by)" != digit-one-click ] || [ "$(t digit-repo)" != "$repo" ] || [ "$(t digit-name)" != "$ENVIRONMENT" ]; }; then
            echo "::error file=$INPUT_FILE::The resource group $RESOURCE_GROUP already exists but was not created by this fork's one-click install (owner: '$(t digit-repo)'). Nothing was changed. Use a different environment name in input.yaml."
            exit 1
          fi
          state=$(t digit-state)   # installed | destroyed | "" (never finished an install)
          mode=$(t digit-deploy-mode)
          if [ "$state" = installed ] && [ -n "$mode" ] && [ "$mode" != "$DEPLOY_MODE" ] && [ "$ACTION" != destroy ]; then
            echo "::error file=$INPUT_FILE::This DIGIT was deployed with $mode, but argocd_enabled in input.yaml now says $DEPLOY_MODE. It cannot be switched on a running DIGIT. Change it back, or run destroy and then install again."
            exit 1
          fi

          if [ "$EVENT" = push ]; then
            if [ "$state" != installed ]; then
              note "Not installed (or destroyed) - this commit changes nothing in Azure. Run the workflow with action = install."
              out false false false false; exit 0
            fi
            res=$(bash one-click/scripts/one-click-changes.sh "$ENVIRONMENT" "$(t digit-infra-sha)" "$(t digit-deploy-sha)" 2> "$RUNNER_TEMP/why.txt")
            infra=$(sed -n 's/^infra=//p' <<< "$res"); deploy=$(sed -n 's/^deploy=//p' <<< "$res")
            yn() { [ "$1" = true ] && echo "**runs**" || echo "skipped (nothing changed)"; }
            {
              echo "### This commit"
              echo "| Job | |"
              echo "|---|---|"
              echo "| Infra (Terraform) | $(yn "$infra") |"
              echo "| Deploy (DIGIT apps) | $(yn "$deploy") |"
              echo
              echo "Why:"
              echo '```'
              cat "$RUNNER_TEMP/why.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/why.txt"
            out false "$infra" "$deploy" false; exit 0
          fi

          # delete-all: Terraform destroy when something is installed, then remove the resource
          # group, Key Vault and environment files. Also cleans up after an earlier plain delete.
          if [ "$ACTION" = destroy ] && [ "$CONFIRM" = delete-all ]; then
            [ -n "$tags" ] || [ -f "$ENV_FILE" ] || [ -f "$SECRETS_FILE" ] || {
              echo "::error::Nothing to delete: there is no resource group $RESOURCE_GROUP and no environment files."; exit 1; }
            note "delete-all: everything of '$ENVIRONMENT' will be removed"
            out false false false "$([ "$state" = installed ] && echo true || echo false)"
            echo "destroy_all=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          case "$ACTION" in
            install)
              if [ -n "$tags" ]; then note "Existing environment of $repo: $RESOURCE_GROUP (re-run)"
              else note "New environment: $RESOURCE_GROUP will be created"; fi
              out true true true false ;;
            infra|deploy|destroy)
              if [ "$state" != installed ]; then
                echo "::error::Nothing is installed for '$ENVIRONMENT' (or it was destroyed). Run the workflow with action = install first."; exit 1
              fi
              out false "$([ "$ACTION" = infra ] && echo true || echo false)" "$([ "$ACTION" = deploy ] && echo true || echo false)" "$([ "$ACTION" = destroy ] && echo true || echo false)" ;;
          esac

  Infra:
    needs: [Environments, Plan]
    if: ${{ needs.Plan.outputs.prepare == 'true' || needs.Plan.outputs.infra == 'true' }}
    name: Infra (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # install: commit the new environment file and secrets file
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.Environments.outputs.list) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Azure login
        uses: ./one-click/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check input.yaml
        uses: ./one-click/actions/load-config
      - name: Setup sops
        uses: ./one-click/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
          required: ${{ needs.Plan.outputs.prepare == 'true' && 'false' || 'true' }}

      # ---------------- Prepare (install) ----------------
      # The database server name (<env>-server) must be unique in all of Azure.
      - name: Check the name is free in Azure
        if: needs.Plan.outputs.prepare == 'true'
        run: |
          set -euo pipefail
          srv="${ENVIRONMENT}-server"
          if az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$srv" -o none 2>/dev/null; then
            echo "$srv already belongs to this install"; exit 0
          fi
          free=$(az rest --method post \
            --url "https://management.azure.com/subscriptions/${ARM_SUBSCRIPTION_ID}/providers/Microsoft.DBforPostgreSQL/checkNameAvailability?api-version=2022-12-01" \
            --body "{\"name\": \"$srv\", \"type\": \"Microsoft.DBforPostgreSQL/flexibleServers\"}" --query nameAvailable -o tsv)
          [ "$free" = "true" ] || { echo "::error file=$INPUT_FILE::The name '$ENVIRONMENT' is already used by someone else in Azure. Use another environment name in input.yaml."; exit 1; }

      # Idempotent: every re-run finds the same, already-created resources.
      - name: Resource group, Terraform state storage and Key Vault
        if: needs.Plan.outputs.prepare == 'true'
        run: |
          set -euo pipefail
          read -ra tags <<< "$OWNER_TAGS"
          # The decide step already refused groups this fork does not own.
          az group show -n "$RESOURCE_GROUP" -o none 2>/dev/null ||
            az group create -n "$RESOURCE_GROUP" -l "$LOCATION" --tags "${tags[@]}" environment="$ENVIRONMENT" -o none

          if ! az storage account show -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            echo "Creating Terraform state storage $STORAGE_ACCOUNT_NAME"
            az storage account create -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" -l "$LOCATION" \
              --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 \
              --allow-blob-public-access false --tags "${tags[@]}" environment="$ENVIRONMENT" -o none
          fi
          key=$(az storage account keys list -n "$STORAGE_ACCOUNT_NAME" -g "$RESOURCE_GROUP" --query '[0].value' -o tsv)
          echo "::add-mask::$key"
          az storage container create -n "${ENVIRONMENT}-container" --account-name "$STORAGE_ACCOUNT_NAME" \
            --account-key "$key" --public-access off -o none

          # The team's own Key Vault + key that locks <env>-secrets.yaml. A soft-deleted vault of
          # the same name is only ever this fork's own earlier install (the name hashes
          # subscription + fork + env): bring it back only when the fork still has the secrets
          # file it locked; otherwise purge it and start fresh.
          if ! az keyvault show -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            old=$(az keyvault show-deleted -n "$KEY_VAULT_NAME" --query properties.tags -o json 2>/dev/null || true)
            if [ -n "$old" ] && [ "$(printf '%s' "$old" | jq -r '(. // {})["digit-repo"] // ""')" != "${GITHUB_REPOSITORY,,}" ]; then
              echo "::error::Key Vault name $KEY_VAULT_NAME is held by a deleted vault this fork did not create. Use a different environment name."; exit 1
            fi
            if [ -n "$old" ] && [ -f "$SECRETS_FILE" ]; then
              echo "Recovering this fork's deleted Key Vault $KEY_VAULT_NAME (keeps the key, so the secrets file still unlocks)"
              az keyvault recover -n "$KEY_VAULT_NAME" -o none
            else
              if [ -n "$old" ]; then
                echo "Purging this fork's old deleted Key Vault $KEY_VAULT_NAME (no secrets file uses it)"
                az keyvault purge -n "$KEY_VAULT_NAME" -o none
                for _ in $(seq 1 60); do az keyvault show-deleted -n "$KEY_VAULT_NAME" -o none 2>/dev/null || break; sleep 10; done
              fi
              echo "Creating Key Vault $KEY_VAULT_NAME"
              az keyvault create -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" -l "$LOCATION" \
                --enable-rbac-authorization false --tags "${tags[@]}" environment="$ENVIRONMENT" -o none
            fi
          fi
          # Access policy for this service principal (object id from its own token: no Graph rights needed).
          oid=$(az account get-access-token --query accessToken -o tsv | cut -d. -f2 |
                python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); print(json.loads(base64.urlsafe_b64decode(p+'='*(-len(p)%4)))['oid'])")
          az keyvault set-policy -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" --object-id "$oid" \
            --key-permissions get list create encrypt decrypt -o none
          az keyvault key show --vault-name "$KEY_VAULT_NAME" -n sops -o none 2>/dev/null ||
            az keyvault key create --vault-name "$KEY_VAULT_NAME" -n sops --kty RSA --size 4096 -o none
          echo "SOPS_KEY_ID=$(az keyvault key show --vault-name "$KEY_VAULT_NAME" -n sops --query key.kid -o tsv)" >> "$GITHUB_ENV"

      # First install only: one-click/<environment>.yaml from digit-template.yaml. Its
      # placeholders stay; they are filled from input.yaml + Terraform on every deploy.
      - name: Create the environment file (first install only)
        if: needs.Plan.outputs.prepare == 'true'
        run: |
          if [ -f "$ENV_FILE" ]; then echo "$ENV_FILE already exists - kept"; exit 0; fi
          cp "$ENV_TEMPLATE" "$ENV_FILE" && echo "Created $ENV_FILE from $ENV_TEMPLATE"

      # First install only: generate and lock <env>-secrets.yaml. Never overwritten.
      - name: Create the secrets file (first install only)
        if: needs.Plan.outputs.prepare == 'true'
        run: |
          set -euo pipefail
          if [ -f "$SECRETS_FILE" ]; then echo "$SECRETS_FILE already exists - kept"; exit 0; fi
          bash one-click/scripts/generate-secrets.sh "$SECRETS_TEMPLATE" "$SECRETS_FILE" "$SOPS_KEY_ID"

      # The team's own credentials (optional GitHub secret DIGIT_SECRETS) are locked in too
      # (also on every deploy), so they are part of the very first deploy.
      - name: Add your own credentials (DIGIT_SECRETS)
        if: needs.Plan.outputs.prepare == 'true'
        uses: ./one-click/actions/apply-user-secrets
        with:
          user-secrets: ${{ secrets.DIGIT_SECRETS }}
      - name: Commit the environment files
        if: needs.Plan.outputs.prepare == 'true'
        uses: ./one-click/actions/commit-to-fork
        with:
          paths: ${{ env.ENV_FILE }} ${{ env.SECRETS_FILE }}
          message: "chore(one-click): environment files for ${{ matrix.environment }}"
          branch: ${{ github.ref_name }}
      - name: Unlock the secrets file
        if: needs.Plan.outputs.prepare == 'true'
        uses: ./one-click/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
      # ---------------- Infra (install, infra) ----------------
      - name: Setup Terraform
        uses: ./one-click/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      - name: Terraform init
        run: terraform init -input=false -no-color
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan
        working-directory: ${{ env.TF_DIR }}
      # Never lose data by accident: deleting or replacing the cluster, database, storage or
      # network needs confirm = replace. Node pools may be replaced (e.g. a new VM size).
      - name: Check the plan is safe
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          risky=$(terraform show -json tfplan | jq -r '.resource_changes[]?
            | select(.change.actions | index("delete"))
            | select(.type | test("^azurerm_(kubernetes_cluster|postgresql_flexible_server(_database)?|storage_account|storage_container|virtual_network|subnet|key_vault)$"))
            | .address')
          {
            echo "### Infrastructure plan"
            terraform show -json tfplan | jq -r '[.resource_changes[]? | .change.actions | join("+")] | group_by(.) | map("- \(.[0]): \(length)") | .[]'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$risky" ] && exit 0
          while read -r r; do echo "  will be DELETED or REPLACED: $r"; done <<< "$risky"
          if [ "$CONFIRM" != replace ]; then
            echo "::error::This change would delete or replace: $(echo "$risky" | tr '\n' ' ')- data on them can be lost. Nothing was changed. If you really want this, run infra again with confirm = replace."
            exit 1
          fi
          echo "::warning::confirm = replace given - applying a plan that deletes/replaces: $(echo "$risky" | tr '\n' ' ')"
        working-directory: ${{ env.TF_DIR }}
      # A new VM size (or disk size, ...) rotates the node pool: AKS drains every node, and
      # PodDisruptionBudgets that allow no disruption (vault, elasticsearch) block that drain.
      # The next deploy recreates them (and unseals Vault on its new node).
      - name: Let the nodes drain (node pool change only)
        run: |
          set -euo pipefail
          moved=$(terraform show -json tfplan | jq -r '.resource_changes[]?
            | select(.type == "azurerm_kubernetes_cluster_node_pool" or .type == "azurerm_kubernetes_cluster")
            | select(.change.actions != ["no-op"] and .change.actions != ["create"])
            | select(.change.before.vm_size != .change.after.vm_size
                     or (.change.before.default_node_pool // [] | tostring) != (.change.after.default_node_pool // [] | tostring)
                     or (.change.actions | index("delete")))
            | .address')
          [ -n "$moved" ] || exit 0
          az aks show -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" -o none 2>/dev/null || exit 0
          echo "Node pool rebuild ($(echo $moved)): removing PodDisruptionBudgets so the nodes can drain"
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          kubectl -n "$NS_ARGOCD" scale statefulset argocd-application-controller --replicas=0 2>/dev/null || true
          for ns in "$NS_CORE" "$NS_BACKBONE" "$NS_VAULT" monitoring; do
            kubectl delete pdb --all -n "$ns" --ignore-not-found
          done
          echo "::warning::The node pool is rebuilt: run the workflow with action = deploy afterwards (it unseals Vault and recreates the PodDisruptionBudgets)."
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform apply (AKS, PostgreSQL, storage - first time takes 15-25 minutes)
        run: terraform apply -input=false -no-color -auto-approve tfplan
        working-directory: ${{ env.TF_DIR }}
      # Terraform ignores the main pool's node_count (the night/morning schedule changes it), so
      # it never corrects it, and a VM-size rotation rebuilds the pool with 1 node. Bring it back
      # to terraform_node_count - unless the schedule has it at 0 for the night.
      - name: Main node pool size
        run: |
          set -euo pipefail
          want=${TF_VAR_node_count:-3}
          have=$(az aks nodepool show -g "$RESOURCE_GROUP" --cluster-name "$ENVIRONMENT" -n mainpool --query count -o tsv 2>/dev/null \
            || az aks nodepool show -g "$RESOURCE_GROUP" --cluster-name "$ENVIRONMENT" -n mainpool --query properties.count -o tsv)
          echo "mainpool: $have node(s), terraform_node_count: $want"
          if [ "$have" != "$want" ] && { [ "${TF_VAR_scheduling:-true}" != true ] || [ "$have" != 0 ]; }; then
            az aks nodepool scale -g "$RESOURCE_GROUP" --cluster-name "$ENVIRONMENT" -n mainpool --node-count "$want" -o none
            echo "::notice::mainpool scaled from $have to $want nodes"
          fi
      - name: Remember the commit now running in Azure (infra)
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          kubectl get nodes -o wide
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-state=installed digit-infra-sha="$(git rev-parse HEAD)" -o none

  # On a commit, Deploy runs even when Infra failed: an apps change should not wait for an infra
  # problem. On install it waits for Infra (there is no cluster before it).
  Deploy:
    needs: [Environments, Plan, Infra]
    if: ${{ !cancelled() && needs.Plan.outputs.deploy == 'true' && (needs.Infra.result == 'success' || needs.Infra.result == 'skipped' || (github.event_name == 'push' && needs.Infra.result == 'failure')) }}
    name: Deploy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write   # commit the secrets file when DIGIT_SECRETS changed
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.Environments.outputs.list) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Azure login
        uses: ./one-click/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check input.yaml
        uses: ./one-click/actions/load-config
      - name: Setup sops
        uses: ./one-click/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
          required: true
      # The team's own credentials (optional GitHub secret DIGIT_SECRETS) are locked in too
      # (also on every deploy), so they are part of the very first deploy.
      - name: Add your own credentials (DIGIT_SECRETS)
        uses: ./one-click/actions/apply-user-secrets
        with:
          user-secrets: ${{ secrets.DIGIT_SECRETS }}
      - name: Commit the environment files
        uses: ./one-click/actions/commit-to-fork
        with:
          paths: ${{ env.ENV_FILE }} ${{ env.SECRETS_FILE }}
          message: "chore(one-click): environment files for ${{ matrix.environment }}"
          branch: ${{ github.ref_name }}
      - name: Setup Terraform
        uses: ./one-click/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}

      # ---------------- Deploy (install, deploy) ----------------
      # The helmfiles (and the Vault / Argo CD scripts) from helm-charts at the pinned ref
      - name: Get the helmfiles (${{ env.HELMFILES_REPO }}@${{ env.HELMFILES_REF }})
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.HELMFILES_REPO }}
          ref: ${{ env.HELMFILES_REF }}
          path: .helmfiles
          sparse-checkout: helmfile/digit3-one-click
          persist-credentials: false
      - name: Check the helmfiles
        run: |
          [ -f "$HELMFILE_DIR/digit-helmfile.yaml.gotmpl" ] || {
            echo "::error file=$INPUT_FILE::No helmfile/digit3-one-click in $HELMFILES_REPO@$HELMFILES_REF. Check helmfiles_repo / helmfiles_ref in input.yaml."; exit 1; }
          git -C .helmfiles log -1 --format="Helmfiles: $HELMFILES_REPO@%h (%s)" | tee -a "$GITHUB_STEP_SUMMARY"
      # <environment>.yaml keeps its placeholders in git; fill them for this deploy:
      # <domain> <email> <env> from input.yaml, <db_host> <db_name> from Terraform.
      - name: Fill in the environment file
        run: |
          set -euo pipefail
          [ -f "$ENV_FILE" ] || { echo "::error::$ENV_FILE not found. Run the workflow with action = install first."; exit 1; }
          terraform -chdir="$TF_DIR" init -input=false -no-color >/dev/null
          out=$(terraform -chdir="$TF_DIR" output -json)
          DB_HOST=$(jq -r '.azurerm_postgresql_flexible_server.value // ""' <<< "$out")
          DB_NAME=$(jq -r '.postgresql_flexible_server_database_name.value // ""' <<< "$out")
          [ -n "$DB_HOST" ] && [ -n "$DB_NAME" ] || { echo "::error::No database in Terraform state. Run the workflow with action = install."; exit 1; }
          mkdir -p "$RUNNER_TEMP/env"
          DB_HOST="$DB_HOST" DB_NAME="$DB_NAME" bash "$HELMFILE_DIR/scripts/render-env.sh" \
            "$ENV_FILE" "$INPUT_FILE" "$RUNNER_TEMP/env/$ENVIRONMENT.yaml"
          { echo "DB_HOST=$DB_HOST"; echo "DB_NAME=$DB_NAME"; echo "DIGIT_ENV_FILE=$RUNNER_TEMP/env/$ENVIRONMENT.yaml"; } >> "$GITHUB_ENV"
      - name: Connect to the cluster
        run: |
          set -euo pipefail
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing \
            || { echo "::error::Cluster $ENVIRONMENT not found. Run the workflow with action = install first."; exit 1; }
          kubectl get nodes

      # Helm pinned to v3: the runner image may ship Helm 4, whose plugin install differs.
      - name: Install Helm, Helmfile, helm-diff, helm-secrets
        run: |
          set -euo pipefail
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP" helmfile
          sudo install -m 0755 "$RUNNER_TEMP/helmfile" /usr/local/bin/helmfile
          helm plugin install https://github.com/databus23/helm-diff --version "v${HELM_DIFF_VERSION}"
          helm plugin install https://github.com/jkroepke/helm-secrets --version "v${HELM_SECRETS_VERSION}"
          helm version --short; helmfile --version; helm plugin list

      # backbone -> core -> monitoring from packaged charts. The helmfiles read only
      # DIGIT_ENV_FILE (<environment>.yaml, filled) and DIGIT_SECRETS_FILE (helm-secrets).
      - name: Deploy DIGIT with helmfile (backbone, core, monitoring - takes 20-40 minutes)
        if: env.DEPLOY_MODE == 'helmfile'
        run: helmfile -f digit-helmfile.yaml.gotmpl apply --suppress-secrets --skip-diff-on-install
        working-directory: ${{ env.HELMFILE_DIR }}

      # ---- Argo CD mode: install Argo CD, then Argo CD deploys everything from this fork ----
      # sops in the Argo CD plugin unlocks <env>-secrets.yaml with the cluster's own (kubelet)
      # managed identity: allowed to get/decrypt with the Key Vault key, nothing else.
      - name: Argo CD - allow the cluster to unlock the secrets file
        if: env.DEPLOY_MODE == 'argocd'
        run: |
          set -euo pipefail
          cid=$(az aks show -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --query identityProfile.kubeletidentity.clientId -o tsv)
          oid=$(az aks show -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --query identityProfile.kubeletidentity.objectId -o tsv)
          [ -n "$cid" ] && [ -n "$oid" ] || { echo "::error::Could not read the cluster's kubelet identity"; exit 1; }
          az keyvault set-policy -n "$KEY_VAULT_NAME" -g "$RESOURCE_GROUP" --object-id "$oid" --key-permissions get decrypt -o none
          echo "KUBELET_CLIENT_ID=$cid" >> "$GITHUB_ENV"

      # Admin login of the Argo CD UI = cluster-configs.secrets.argocd-admin.password. The bcrypt hash is kept
      # when the password did not change, so Argo CD is not restarted on every deploy.
      - name: Argo CD - admin password
        if: env.DEPLOY_MODE == 'argocd'
        run: |
          set -euo pipefail
          pw=$(sops -d --extract '["cluster-configs"]["secrets"]["argocd-admin"]["password"]' "$SECRETS_FILE"); echo "::add-mask::$pw"
          old=$(kubectl -n "$NS_ARGOCD" get secret argocd-secret -o jsonpath='{.data.admin\.password}' 2>/dev/null | base64 -d || true)
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check bcrypt
          hash=$(PW="$pw" OLD="$old" "$RUNNER_TEMP/venv/bin/python" -c '
          import os, bcrypt
          pw, old = os.environ["PW"].encode(), os.environ["OLD"].encode()
          try: keep = bool(old) and bcrypt.checkpw(pw, old)
          except ValueError: keep = False
          print((old if keep else bcrypt.hashpw(pw, bcrypt.gensalt())).decode())')
          echo "::add-mask::$hash"
          echo "ARGOCD_ADMIN_HASH=$hash" >> "$GITHUB_ENV"

      - name: Argo CD - install or upgrade Argo CD
        if: env.DEPLOY_MODE == 'argocd'
        run: helmfile -f helmfiles/argocd.yaml.gotmpl apply --suppress-secrets --skip-diff-on-install
        working-directory: ${{ env.HELMFILE_DIR }}

      # The only object the workflow gives Argo CD. Argo CD renders it with the plugin into one
      # Application per helmfile release (ordered by sync waves) and keeps all of them synced.
      - name: Argo CD - hand DIGIT over to Argo CD
        if: env.DEPLOY_MODE == 'argocd'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          kubectl apply -f - <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: digit
            namespace: ${NS_ARGOCD}
          spec:
            project: default
            source:
              repoURL: https://github.com/${GITHUB_REPOSITORY}.git
              targetRevision: ${BRANCH}
              path: one-click
              plugin:
                name: digit-helmfile
                env:
                  - {name: MODE, value: apps}
                  - {name: DB_HOST, value: "${DB_HOST}"}
                  - {name: DB_NAME, value: "${DB_NAME}"}
            destination:
              server: https://kubernetes.default.svc
              namespace: ${NS_ARGOCD}
            syncPolicy:
              automated: {prune: true, selfHeal: true}
              retry: {limit: 20, backoff: {duration: 30s, factor: 2, maxDuration: 10m}}
          EOF
          # A deploy re-renders everything now: the helmfiles (helmfiles_ref, often master) can change
          # without a new commit in this fork, and Argo CD caches manifests per fork commit. A root
          # sync still waiting on an older plan (e.g. a wave that can never turn healthy) is stopped;
          # auto-sync starts again with the new manifests.
          phase=$(kubectl -n "$NS_ARGOCD" get applications.argoproj.io digit -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)
          if [ "$phase" = Running ]; then
            echo "Stopping the running sync of the root application (it restarts with the new manifests)"
            kubectl -n "$NS_ARGOCD" patch applications.argoproj.io digit --type merge \
              -p '{"status":{"operationState":{"phase":"Terminating"}}}' >/dev/null
          fi
          kubectl -n "$NS_ARGOCD" annotate applications.argoproj.io --all argocd.argoproj.io/refresh=hard --overwrite >/dev/null
          # Auto-sync never retries a commit whose last sync failed (a stopped sync counts), so start
          # the root sync here, once the refresh has re-rendered it (Argo CD then drops the annotation).
          for _ in $(seq 1 60); do
            busy=$(kubectl -n "$NS_ARGOCD" get applications.argoproj.io digit -o json |
              jq -r '[(.metadata.annotations["argocd.argoproj.io/refresh"] // empty),
                      (.status.operationState.phase // "" | select(. == "Running" or . == "Terminating"))] | join(" ")')
            [ -z "$busy" ] && break
            sleep 10
          done
          if [ -z "$busy" ]; then
            kubectl -n "$NS_ARGOCD" patch applications.argoproj.io digit --type merge \
              -p "{\"operation\":{\"initiatedBy\":{\"username\":\"one-click-workflow\"},\"sync\":{\"revision\":\"${BRANCH}\"}}}" >/dev/null
            echo "Started a sync of the root application"
          else
            echo "::warning::The root application is still busy ($busy); not starting another sync."
          fi

      # Vault starts sealed: unseal it and write the AppRole (idempotent). In Argo CD mode this
      # waits until Argo CD has created Vault.
      - name: Vault check
        env:
          VAULT_WAIT_SECONDS: ${{ env.DEPLOY_MODE == 'argocd' && '2400' || '450' }}
        run: bash scripts/vault-bootstrap.sh "$NS_VAULT" "$NS_CORE"
        working-directory: ${{ env.HELMFILE_DIR }}

      - name: Argo CD - wait until every application is synced and healthy
        if: env.DEPLOY_MODE == 'argocd'
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          deadline=$((SECONDS + 3600)); next_print=0
          while :; do
            apps=$(kubectl -n "$NS_ARGOCD" get applications.argoproj.io -o json)
            rev=$(printf '%s' "$apps" | jq -r '.items[] | select(.metadata.name == "digit") | .status.sync.revision // ""')
            # ok when Argo CD runs this commit, or a newer one that contains it
            if [ "$rev" != "$head" ] && [ -n "$rev" ]; then
              git fetch -q --depth=50 origin "$rev" 2>/dev/null && git merge-base --is-ancestor "$head" "$rev" 2>/dev/null && head=$rev
            fi
            total=$(printf '%s' "$apps" | jq '.items | length')
            pending=$(printf '%s' "$apps" | jq -r --arg h "$head" '.items[]
              | select(.status.sync.status != "Synced" or .status.health.status != "Healthy" or (.status.sync.revision // "") != $h)
              | "\(.metadata.name)  sync=\(.status.sync.status // "-")  health=\(.status.health.status // "-")"')
            if [ "$total" -gt 1 ] && [ -z "$pending" ]; then
              echo "All $total Argo CD applications are synced and healthy at ${head:0:9}"; break
            fi
            if [ $SECONDS -ge "$next_print" ]; then
              echo "--- $(date -u +%H:%M:%S) waiting for $(printf '%s\n' "$pending" | grep -c .) of $total applications:"; printf '%s\n' "$pending"
              next_print=$((SECONDS + 120))
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::Argo CD did not finish within 60 minutes. Still waiting for:"
              printf '%s\n' "$pending"
              printf '%s' "$apps" | jq -r '.items[] | select(.status.conditions != null) | "\(.metadata.name): \(.status.conditions | map(.message) | join(" | "))"' | cut -c1-400
              exit 1
            fi
            sleep 20
          done
          {
            echo "### Argo CD"
            echo "All $total applications synced and healthy. UI: **https://${DOMAIN_NAME}/argocd** (user \`admin\`, password = \`cluster-configs.secrets.argocd-admin.password\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remember the commit now running in Azure (apps)
        run: |
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-deploy-sha="$(git rev-parse HEAD)" digit-deploy-mode="$DEPLOY_MODE" -o none

      - name: Last step - point your domain at DIGIT
        run: |
          ip=""
          for _ in $(seq 1 30); do
            ip=$(kubectl get svc ingress-nginx-controller -n "$NS_BACKBONE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$ip" ] && break; sleep 10
          done
          echo "Public IP: ${ip:-not ready yet}"
          {
            echo
            echo "## DIGIT is installed :rocket:"
            echo
            echo "**One last step:** go to the website where you bought your domain and add this DNS record:"
            echo
            echo "| Type | Name | Value |"
            echo "|---|---|---|"
            echo "| A | \`${DOMAIN_NAME}\` | \`${ip:-run deploy again to see it}\` |"
            echo
            echo "Wait 5 to 30 minutes, then open **https://${DOMAIN_NAME}**."
          } >> "$GITHUB_STEP_SUMMARY"

  Destroy:
    needs: [Environments, Plan]
    if: ${{ needs.Plan.outputs.destroy == 'true' || needs.Plan.outputs.destroy_all == 'true' }}
    name: Destroy (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # delete-all: remove the environment files from the fork
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.Environments.outputs.list) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
      - name: Azure login
        uses: ./one-click/actions/azure-login
        with:
          credentials: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check input.yaml
        uses: ./one-click/actions/load-config
      - name: Setup sops
        if: needs.Plan.outputs.destroy == 'true'
        uses: ./one-click/actions/setup-sops
        with:
          version: ${{ env.SOPS_VERSION }}
      - name: Setup Terraform
        if: needs.Plan.outputs.destroy == 'true'
        uses: ./one-click/actions/setup-terraform-azure
        with:
          version: ${{ env.TF_VERSION }}
      # ---------------- Destroy ----------------
      # Remove the ingress LoadBalancer first so its public IP is released before the network goes.
      - name: Delete the public IP
        if: needs.Plan.outputs.destroy == 'true'
        continue-on-error: true
        run: |
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --overwrite-existing
          # Argo CD mode: stop Argo CD first, or it would put the service straight back
          kubectl -n "$NS_ARGOCD" scale statefulset argocd-application-controller --replicas=0 2>/dev/null || true
          kubectl delete svc ingress-nginx-controller -n "$NS_BACKBONE" --wait=true --timeout=5m
      - name: Terraform destroy (takes 10-20 minutes)
        if: needs.Plan.outputs.destroy == 'true'
        run: |
          terraform init -input=false -no-color
          # Delete the AKS cluster first, as a whole: Azure then removes the nodes without draining
          # them. Deleting the node pool on its own drains every node, which hangs on
          # PodDisruptionBudgets (vault, elasticsearch) and fails once Terraform deletes the egov
          # namespace at the same time ("unable to create new content in namespace egov because it
          # is being terminated"). The in-cluster objects Terraform tracks go with the cluster.
          terraform state list | grep '^kubernetes_' | while read -r r; do terraform state rm -no-color "$r"; done
          if az aks show -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" -o none 2>/dev/null; then
            az aks delete -g "$RESOURCE_GROUP" -n "$ENVIRONMENT" --yes
          fi
          terraform destroy -input=false -no-color -auto-approve
        working-directory: ${{ env.TF_DIR }}
      # Commits no longer change anything until the next install.
      - name: Mark the environment destroyed
        if: needs.Plan.outputs.destroy == 'true' && needs.Plan.outputs.destroy_all != 'true'
        run: |
          az tag update --resource-id "$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)" --operation merge \
            --tags digit-state=destroyed digit-infra-sha= digit-deploy-sha= -o none
          {
            echo "## DIGIT \`$ENVIRONMENT\` is deleted"
            echo "The resource group \`$RESOURCE_GROUP\` is kept. It holds the Terraform state and your Key Vault,"
            echo "so **install** can bring the same DIGIT back with the same passwords."
            echo "To remove everything as well, run destroy again with confirm = delete-all."
          } >> "$GITHUB_STEP_SUMMARY"

      # delete-all: the resource group (Terraform state storage, Key Vault, anything left), the
      # soft-deleted Key Vault (frees its name), and the environment files: the secrets file was
      # locked with that Key Vault and can never be opened again.
      - name: Delete the resource group and Key Vault (delete-all)
        if: needs.Plan.outputs.destroy_all == 'true'
        run: |
          set -euo pipefail
          if az group show -n "$RESOURCE_GROUP" -o none 2>/dev/null; then
            echo "Deleting resource group $RESOURCE_GROUP (5-15 minutes)"
            az group delete -n "$RESOURCE_GROUP" --yes
          fi
          if az keyvault show-deleted -n "$KEY_VAULT_NAME" -o none 2>/dev/null; then
            echo "Purging Key Vault $KEY_VAULT_NAME"
            az keyvault purge -n "$KEY_VAULT_NAME" -o none
          fi
          rm -f "$ENV_FILE" "$SECRETS_FILE"
      - name: Remove the environment files from the fork (delete-all)
        if: needs.Plan.outputs.destroy_all == 'true'
        uses: ./one-click/actions/commit-to-fork
        with:
          paths: ${{ env.ENV_FILE }} ${{ env.SECRETS_FILE }}
          message: "chore(one-click): remove environment files of ${{ matrix.environment }} (delete-all)"
          branch: ${{ github.ref_name }}
      - name: Summary (delete-all)
        if: needs.Plan.outputs.destroy_all == 'true'
        run: |
          {
            echo "## DIGIT \`$ENVIRONMENT\` is deleted, with everything else"
            echo "Removed: the cluster, database and network, the resource group \`$RESOURCE_GROUP\` (Terraform state, Key Vault),"
            echo "and \`$ENV_FILE\` + \`$SECRETS_FILE\` from this fork. **install** now starts a new DIGIT with new passwords."
          } >> "$GITHUB_STEP_SUMMARY"
