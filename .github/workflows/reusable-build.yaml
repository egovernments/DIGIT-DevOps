# Central, reusable Docker build engine for eGov service repos.
# Pipeline (default branch): resolve-config -> code-scan -> build image (app + db,
#   local) -> image-scan the built image(s) -> push (multi-arch) + cosign sign.
#   A CRITICAL at the code stage OR the image stage blocks the push, so the image
#   that is scanned is exactly the one that gets pushed. Reports publish to the
#   caller's gh-pages /security/trivy via .trivy/dashboard, with the app and db
#   image findings combined under one service.
# On non-default branches the scans are skipped and the image is built + pushed.
# Docs: docs/workflows/build.md
name: Reusable Build

on:
  workflow_call:
    inputs:
      service:
        description: "Image name to build (must match an image-name in the build config)"
        required: true
        type: string
      build_branch:
        description: "Branch/ref whose code is checked out and built; empty = the ref that triggered the run"
        required: false
        type: string
        default: ""
      service_folder:
        description: "Work-dir prefix, used as WORK_DIR fallback when the config has no entry"
        required: false
        type: string
        default: ""
      config_path:
        description: "Path to the build config file"
        required: false
        type: string
        default: "build/build-config.yml"
      registry_namespace:
        description: "Image registry namespace (e.g. egovio)"
        required: false
        type: string
        default: "egovio"
      platforms:
        description: "Target platforms for buildx"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      default_dockerfile:
        description: "Dockerfile used when the config entry does not set one"
        required: false
        type: string
        default: "build/maven/Dockerfile"
      runs_on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
      push:
        description: "Push images to the registry (false = build-only validation)"
        required: false
        type: boolean
        default: true
      enable_trivy:
        description: "Run Trivy code + image scans on the scanned branches (CRITICAL blocks the push); other branches build unscanned"
        required: false
        type: boolean
        default: true
      scan_branches:
        description: "Branches to Trivy-scan + gate (comma/space/newline list, e.g. the TRIVY_SCAN_BRANCHES repo var); empty = default branch only"
        required: false
        type: string
        default: ""
      enable_cosign:
        description: "Sign the pushed images with cosign keyless (GitHub OIDC -> Fulcio -> Rekor); needs id-token:write from the caller"
        required: false
        type: boolean
        default: true
      publish_home:
        description: "Also regenerate the Trivy dashboard landing index in this run. Set false for parallel all-services legs (a final `home` run rebuilds it once, avoiding shared-index races)"
        required: false
        type: boolean
        default: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_ACCESS_TOKEN:
        required: true
    outputs:
      docker_image:
        description: "Pushed application image reference"
        value: ${{ jobs.build.outputs.docker_image }}
      db_image:
        description: "Pushed database image reference (empty when absent)"
        value: ${{ jobs.build.outputs.db_image }}

jobs:
  resolve-config:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      image_name: ${{ inputs.service }}
      work_dir: ${{ steps.cfg.outputs.app_work_dir }}
      dockerfile: ${{ steps.cfg.outputs.app_dockerfile }}
      db_work_dir: ${{ steps.cfg.outputs.db_work_dir }}
      db_dockerfile: ${{ steps.cfg.outputs.db_dockerfile }}
      tag: ${{ steps.tag.outputs.tag }}
      do_scan: ${{ steps.policy.outputs.do_scan }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.build_branch }}

      - name: Install yq
        run: |
          VERSION="v4.54.1"
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve build config
        id: cfg
        env:
          SERVICE: ${{ inputs.service }}
          CONFIG: ${{ inputs.config_path }}
          FALLBACK_WORK_DIR: ${{ inputs.service_folder }}/${{ inputs.service }}
          DEFAULT_DOCKERFILE: ${{ inputs.default_dockerfile }}
        run: |
          set -euo pipefail
          APP_WORK_DIR=$(yq eval ".config[].build[] | select(.\"image-name\" == \"$SERVICE\") | .\"work-dir\" // \"\"" "$CONFIG" | head -n1)
          APP_DOCKERFILE=$(yq eval ".config[].build[] | select(.\"image-name\" == \"$SERVICE\") | .dockerfile // \"\"" "$CONFIG" | head -n1)
          [ -n "$APP_WORK_DIR" ] || APP_WORK_DIR="${FALLBACK_WORK_DIR#/}"
          [ -n "$APP_DOCKERFILE" ] || APP_DOCKERFILE="$DEFAULT_DOCKERFILE"

          DB_WORK_DIR=$(yq eval ".config[].build[] | select(.\"image-name\" == \"${SERVICE}-db\") | .\"work-dir\" // \"\"" "$CONFIG" | head -n1)
          DB_DOCKERFILE=$(yq eval ".config[].build[] | select(.\"image-name\" == \"${SERVICE}-db\") | .dockerfile // \"\"" "$CONFIG" | head -n1)
          [ -n "$DB_DOCKERFILE" ] || DB_DOCKERFILE="${DB_WORK_DIR}/Dockerfile"

          {
            echo "app_work_dir=$APP_WORK_DIR"
            echo "app_dockerfile=$APP_DOCKERFILE"
            echo "db_work_dir=$DB_WORK_DIR"
            echo "db_dockerfile=$DB_DOCKERFILE"
          } >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: tag
        env:
          BUILD_BRANCH: ${{ inputs.build_branch }}
        run: |
          REF="${BUILD_BRANCH:-${GITHUB_REF##*/}}"
          echo "tag=${REF##*/}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Scan policy: Trivy scans + gates only the branches in scan_branches
      # (the TRIVY_SCAN_BRANCHES repo var). When that list is empty, fall back to
      # the default branch only. Any other branch builds + pushes unscanned.
      - name: Determine scan policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_BRANCH: ${{ inputs.build_branch }}
          SCAN_BRANCHES: ${{ inputs.scan_branches }}
        run: |
          set -euo pipefail
          DEFAULT=$(gh api "repos/${GITHUB_REPOSITORY}" -q .default_branch)
          REF="${BUILD_BRANCH:-${GITHUB_REF_NAME}}"
          REF="${REF##*/}"
          DO=false
          LIST=$(printf '%s' "$SCAN_BRANCHES" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$' || true)
          if [ -n "$LIST" ]; then
            printf '%s\n' "$LIST" | grep -qxF "$REF" && DO=true
          else
            [ "$REF" = "$DEFAULT" ] && DO=true
          fi
          echo "do_scan=$DO" >> "$GITHUB_OUTPUT"
          echo "Build ref '$REF' | scan_branches='${SCAN_BRANCHES}' | default='$DEFAULT' — scan: $DO"

  # Security gate 1 — scan the service SOURCE. CRITICAL aborts before any build.
  code-scan:
    name: Code scan · ${{ needs.resolve-config.outputs.image_name }}
    needs: resolve-config
    # Gate only the default branch; other branches skip the scan and build normally.
    if: ${{ inputs.enable_trivy && needs.resolve-config.outputs.do_scan == 'true' }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.build_branch }}

      - name: Trivy filesystem scan (code)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
          TRIVY_TIMEOUT: 15m
        with:
          scan-type: fs
          scan-ref: ${{ needs.resolve-config.outputs.work_dir }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: code-scan.json
          exit-code: '0'
          hide-progress: true

      - name: Evaluate gate & publish dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.build_branch || github.ref_name }}
          PUBLISH_HOME: ${{ inputs.publish_home && '1' || '0' }}
        run: |
          SERVICE="${{ needs.resolve-config.outputs.image_name }}"
          CRIT=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Secrets[]?) | select(.Severity=="CRITICAL")] | length' code-scan.json)
          GATE=pass; [ "$CRIT" -gt 0 ] && GATE=fail
          URL=$(bash .trivy/dashboard/publish.sh code "$SERVICE" "${{ github.run_id }}" code-scan.json "$GATE")
          {
            echo "### Trivy code scan · $SERVICE"
            echo ""
            echo "- Critical findings: **$CRIT**"
            echo "- Report: [$URL]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error title=Code scan blocked::$CRIT critical finding(s) in the source of $SERVICE. Build aborted. Report: $URL"
            exit 1
          fi
          echo "Code scan passed for $SERVICE ($CRIT critical). Report: $URL"

  # Build the image, scan the BUILT image, then push only if the scan passes.
  # Order within this job: build (local, app + db) -> image-scan (app + db,
  # default branch only) -> push (multi-arch) + cosign. Kept in one job because a
  # locally-built image can't cross GitHub job boundaries without a heavy tarball;
  # the buildx cache makes the pushed amd64 the same layers that were scanned. A
  # CRITICAL in the gate fails the job before the push steps run.
  build:
    name: Build · ${{ needs.resolve-config.outputs.image_name }}
    needs: [resolve-config, code-scan]
    # Run when the code gate passed, or was skipped (non-default branch / trivy off).
    # A failed code-scan leaves this skipped, so nothing is built or pushed.
    if: >-
      ${{ always()
      && needs.resolve-config.result == 'success'
      && (needs.code-scan.result == 'success' || needs.code-scan.result == 'skipped') }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write          # publish the Trivy image dashboard to gh-pages
      id-token: write          # cosign keyless signing (OIDC -> Fulcio)
    outputs:
      docker_image: ${{ steps.refs.outputs.app }}
      db_image: ${{ steps.refs.outputs.db }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.build_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # --- Build the image(s) locally (amd64) so the exact built artifact can be
      #     scanned before anything is pushed — only when the gate is active. ---
      - name: Build application image (local, for scan)
        if: ${{ inputs.enable_trivy && needs.resolve-config.outputs.do_scan == 'true' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ needs.resolve-config.outputs.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: local-scan/${{ inputs.service }}:${{ needs.resolve-config.outputs.tag }}
          build-args: WORK_DIR=${{ needs.resolve-config.outputs.work_dir }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Build database image (local, for scan)
        if: ${{ inputs.enable_trivy && needs.resolve-config.outputs.do_scan == 'true' && needs.resolve-config.outputs.db_work_dir != '' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ needs.resolve-config.outputs.db_work_dir }}
          file: ${{ needs.resolve-config.outputs.db_dockerfile }}
          platforms: linux/amd64
          load: true
          tags: local-scan/${{ inputs.service }}-db:${{ needs.resolve-config.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service }}-db
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-db

      # --- Image scan (app + db) + gate — default branch only ---
      - name: Trivy image scan (application)
        if: ${{ inputs.enable_trivy && needs.resolve-config.outputs.do_scan == 'true' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
          TRIVY_TIMEOUT: 15m
        with:
          scan-type: image
          image-ref: local-scan/${{ inputs.service }}:${{ needs.resolve-config.outputs.tag }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: image-app.json
          exit-code: '0'
          hide-progress: true

      - name: Trivy image scan (database)
        if: ${{ inputs.enable_trivy && needs.resolve-config.outputs.do_scan == 'true' && needs.resolve-config.outputs.db_work_dir != '' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
          TRIVY_TIMEOUT: 15m
        with:
          scan-type: image
          image-ref: local-scan/${{ inputs.service }}-db:${{ needs.resolve-config.outputs.tag }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: image-db.json
          exit-code: '0'
          hide-progress: true

      - name: Evaluate image gate & publish dashboard
        if: ${{ inputs.enable_trivy && needs.resolve-config.outputs.do_scan == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.build_branch || github.ref_name }}
          PUBLISH_HOME: ${{ inputs.publish_home && '1' || '0' }}
          HAS_DB: ${{ needs.resolve-config.outputs.db_work_dir != '' }}
        run: |
          set -euo pipefail
          SERVICE="${{ needs.resolve-config.outputs.image_name }}"
          # Combine app + db image findings into one report so both appear under the
          # same service in the dashboard; the gate counts criticals across both.
          if [ "$HAS_DB" = "true" ] && [ -f image-db.json ]; then
            jq -s '{SchemaVersion: .[0].SchemaVersion, ArtifactName: .[0].ArtifactName,
                    Metadata: .[0].Metadata,
                    Results: ((.[0].Results // []) + (.[1].Results // []))}' \
               image-app.json image-db.json > image-scan.json
          else
            cp image-app.json image-scan.json
          fi
          CRIT=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Secrets[]?) | select(.Severity=="CRITICAL")] | length' image-scan.json)
          GATE=pass; [ "$CRIT" -gt 0 ] && GATE=fail
          URL=$(bash .trivy/dashboard/publish.sh image "$SERVICE" "${{ github.run_id }}" image-scan.json "$GATE")
          {
            echo "### Trivy image scan · $SERVICE"
            echo ""
            echo "- Critical findings (app + db): **$CRIT**"
            echo "- Report: [$URL]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error title=Image scan blocked::$CRIT critical finding(s) in the image(s) for $SERVICE. Nothing pushed. Report: $URL"
            exit 1
          fi
          echo "Image scan passed for $SERVICE ($CRIT critical). Report: $URL"

      # --- Push (multi-arch) — reached only if the gate above did not fail.
      #     success() is explicit so a failed gate skips the push. ---
      - name: Build and push application image
        id: build_app
        if: ${{ success() && inputs.push }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ needs.resolve-config.outputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.registry_namespace }}/${{ inputs.service }}:${{ needs.resolve-config.outputs.tag }}
          build-args: WORK_DIR=${{ needs.resolve-config.outputs.work_dir }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Build and push database image
        id: build_db
        if: ${{ success() && inputs.push && needs.resolve-config.outputs.db_work_dir != '' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ needs.resolve-config.outputs.db_work_dir }}
          file: ${{ needs.resolve-config.outputs.db_dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.registry_namespace }}/${{ inputs.service }}-db:${{ needs.resolve-config.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service }}-db
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-db

      - name: Export image refs
        id: refs
        if: ${{ success() && inputs.push }}
        env:
          APP_IMAGE: ${{ inputs.registry_namespace }}/${{ inputs.service }}:${{ needs.resolve-config.outputs.tag }}
          DB_WORK_DIR: ${{ needs.resolve-config.outputs.db_work_dir }}
          DB_IMAGE: ${{ inputs.registry_namespace }}/${{ inputs.service }}-db:${{ needs.resolve-config.outputs.tag }}
        run: |
          echo "app=$APP_IMAGE" >> "$GITHUB_OUTPUT"
          if [ -n "$DB_WORK_DIR" ]; then
            echo "db=$DB_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "db=" >> "$GITHUB_OUTPUT"
          fi

      # Supply-chain control: sign the pushed image(s) so consumers can verify
      # provenance. Keyless — identity from the GitHub OIDC token, certificate from
      # Fulcio, signature in the public Rekor log; no key to manage. cosign-installer
      # ships no floating v4 tag, so pin it by exact tag.
      - name: Install cosign
        if: ${{ success() && inputs.push && inputs.enable_cosign }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign images (cosign keyless)
        if: ${{ success() && inputs.push && inputs.enable_cosign }}
        env:
          APP_REPO: ${{ inputs.registry_namespace }}/${{ inputs.service }}
          DB_REPO: ${{ inputs.registry_namespace }}/${{ inputs.service }}-db
          APP_DIGEST: ${{ steps.build_app.outputs.digest }}
          DB_DIGEST: ${{ steps.build_db.outputs.digest }}
        run: |
          set -euo pipefail
          # Sign by digest (immutable content id), never by the mutable tag.
          test -n "$APP_DIGEST" || { echo "::error::no application digest to sign"; exit 1; }
          cosign sign --yes "${APP_REPO}@${APP_DIGEST}"
          SIGNED="app"
          if [ -n "${DB_DIGEST:-}" ]; then
            cosign sign --yes "${DB_REPO}@${DB_DIGEST}"
            SIGNED="app, db"
          fi
          echo "Signed (${SIGNED}) with cosign keyless — GitHub OIDC → Fulcio → Rekor." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: ${{ always() }}
        env:
          APP_IMAGE: ${{ inputs.registry_namespace }}/${{ inputs.service }}:${{ needs.resolve-config.outputs.tag }}
          DB_WORK_DIR: ${{ needs.resolve-config.outputs.db_work_dir }}
          DB_IMAGE: ${{ inputs.registry_namespace }}/${{ inputs.service }}-db:${{ needs.resolve-config.outputs.tag }}
          PUSHED: ${{ inputs.push }}
        run: |
          {
            echo "### Build result"
            if [ "$PUSHED" = "true" ]; then
              echo "- Application: \`$APP_IMAGE\`"
              if [ -n "$DB_WORK_DIR" ]; then echo "- Database: \`$DB_IMAGE\`"; fi
            else
              echo "- Build-only (push disabled)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
