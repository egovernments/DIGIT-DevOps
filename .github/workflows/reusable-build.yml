# Central, reusable Docker build engine for eGov service repos.
# Pipeline: resolve-config -> code-scan -> image-scan -> build (push).
# Trivy mirrors health-campaign-services: CRITICAL blocks the push; reports
# publish to the caller's gh-pages /security/trivy via .trivy/dashboard.
# Docs: docs/workflows/build.md
name: Reusable Build

on:
  workflow_call:
    inputs:
      service:
        description: "Image name to build (must match an image-name in the build config)"
        required: true
        type: string
      service_folder:
        description: "Work-dir prefix, used as WORK_DIR fallback when the config has no entry"
        required: false
        type: string
        default: ""
      config_path:
        description: "Path to the build config file"
        required: false
        type: string
        default: "build/build-config.yml"
      registry_namespace:
        description: "Image registry namespace (e.g. egovio)"
        required: false
        type: string
        default: "egovio"
      platforms:
        description: "Target platforms for buildx"
        required: false
        type: string
        default: "linux/amd64,linux/arm64"
      default_dockerfile:
        description: "Dockerfile used when the config entry does not set one"
        required: false
        type: string
        default: "build/maven/Dockerfile"
      runs_on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
      push:
        description: "Push images to the registry (false = build-only validation)"
        required: false
        type: boolean
        default: true
      enable_trivy:
        description: "Run Trivy code + image scans and publish the dashboard (needs .trivy/dashboard in the caller)"
        required: false
        type: boolean
        default: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_ACCESS_TOKEN:
        required: true
    outputs:
      docker_image:
        description: "Pushed application image reference"
        value: ${{ jobs.build.outputs.docker_image }}
      db_image:
        description: "Pushed database image reference (empty when absent)"
        value: ${{ jobs.build.outputs.db_image }}

jobs:
  resolve-config:
    runs-on: ${{ inputs.runs_on }}
    outputs:
      image_name: ${{ inputs.service }}
      work_dir: ${{ steps.cfg.outputs.app_work_dir }}
      dockerfile: ${{ steps.cfg.outputs.app_dockerfile }}
      db_work_dir: ${{ steps.cfg.outputs.db_work_dir }}
      db_dockerfile: ${{ steps.cfg.outputs.db_dockerfile }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install yq
        run: |
          VERSION="v4.54.1"
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve build config
        id: cfg
        env:
          SERVICE: ${{ inputs.service }}
          CONFIG: ${{ inputs.config_path }}
          FALLBACK_WORK_DIR: ${{ inputs.service_folder }}/${{ inputs.service }}
          DEFAULT_DOCKERFILE: ${{ inputs.default_dockerfile }}
        run: |
          set -euo pipefail
          APP_WORK_DIR=$(yq eval ".config[].build[] | select(.\"image-name\" == \"$SERVICE\") | .\"work-dir\" // \"\"" "$CONFIG" | head -n1)
          APP_DOCKERFILE=$(yq eval ".config[].build[] | select(.\"image-name\" == \"$SERVICE\") | .dockerfile // \"\"" "$CONFIG" | head -n1)
          [ -n "$APP_WORK_DIR" ] || APP_WORK_DIR="${FALLBACK_WORK_DIR#/}"
          [ -n "$APP_DOCKERFILE" ] || APP_DOCKERFILE="$DEFAULT_DOCKERFILE"

          DB_WORK_DIR=$(yq eval ".config[].build[] | select(.\"image-name\" == \"${SERVICE}-db\") | .\"work-dir\" // \"\"" "$CONFIG" | head -n1)
          DB_DOCKERFILE=$(yq eval ".config[].build[] | select(.\"image-name\" == \"${SERVICE}-db\") | .dockerfile // \"\"" "$CONFIG" | head -n1)
          [ -n "$DB_DOCKERFILE" ] || DB_DOCKERFILE="${DB_WORK_DIR}/Dockerfile"

          {
            echo "app_work_dir=$APP_WORK_DIR"
            echo "app_dockerfile=$APP_DOCKERFILE"
            echo "db_work_dir=$DB_WORK_DIR"
            echo "db_dockerfile=$DB_DOCKERFILE"
          } >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_REF##*/}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # Security gate 1 — scan the service SOURCE. CRITICAL aborts before any build.
  code-scan:
    name: Code scan · ${{ needs.resolve-config.outputs.image_name }}
    needs: resolve-config
    if: ${{ inputs.enable_trivy }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trivy filesystem scan (code)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
          TRIVY_TIMEOUT: 15m
        with:
          scan-type: fs
          scan-ref: ${{ needs.resolve-config.outputs.work_dir }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: code-scan.json
          exit-code: '0'
          hide-progress: true

      - name: Evaluate gate & publish dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SERVICE="${{ needs.resolve-config.outputs.image_name }}"
          CRIT=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Secrets[]?) | select(.Severity=="CRITICAL")] | length' code-scan.json)
          GATE=pass; [ "$CRIT" -gt 0 ] && GATE=fail
          URL=$(bash .trivy/dashboard/publish.sh code "$SERVICE" "${{ github.run_id }}" code-scan.json "$GATE")
          {
            echo "### Trivy code scan · $SERVICE"
            echo ""
            echo "- Critical findings: **$CRIT**"
            echo "- Report: [$URL]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error title=Code scan blocked::$CRIT critical finding(s) in the source of $SERVICE. Build aborted. Report: $URL"
            exit 1
          fi
          echo "Code scan passed for $SERVICE ($CRIT critical). Report: $URL"

  # Security gate 2 — build the image and scan it before it is pushed.
  image-scan:
    name: Image scan · ${{ needs.resolve-config.outputs.image_name }}
    needs: [resolve-config, code-scan]
    if: ${{ inputs.enable_trivy }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build image locally (amd64) for scanning
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg WORK_DIR=${{ needs.resolve-config.outputs.work_dir }} \
            --file ${{ needs.resolve-config.outputs.dockerfile }} \
            --tag local-scan/${{ needs.resolve-config.outputs.image_name }}:${{ needs.resolve-config.outputs.tag }} \
            --load \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: 'true'
          TRIVY_TIMEOUT: 15m
        with:
          scan-type: image
          image-ref: local-scan/${{ needs.resolve-config.outputs.image_name }}:${{ needs.resolve-config.outputs.tag }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: image-scan.json
          exit-code: '0'
          hide-progress: true

      - name: Evaluate gate & publish dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SERVICE="${{ needs.resolve-config.outputs.image_name }}"
          CRIT=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Secrets[]?) | select(.Severity=="CRITICAL")] | length' image-scan.json)
          GATE=pass; [ "$CRIT" -gt 0 ] && GATE=fail
          URL=$(bash .trivy/dashboard/publish.sh image "$SERVICE" "${{ github.run_id }}" image-scan.json "$GATE")
          {
            echo "### Trivy image scan · $SERVICE"
            echo ""
            echo "- Critical findings: **$CRIT**"
            echo "- Report: [$URL]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error title=Image scan blocked::$CRIT critical finding(s) in the image for $SERVICE. Image not pushed. Report: $URL"
            exit 1
          fi
          echo "Image scan passed for $SERVICE ($CRIT critical). Report: $URL"

  build:
    name: Build & push · ${{ needs.resolve-config.outputs.image_name }}
    needs: [resolve-config, code-scan, image-scan]
    # Run when gates passed, or when they were skipped (enable_trivy=false).
    # A failed gate leaves this skipped, so a CRITICAL image is never pushed.
    if: >-
      ${{ always()
      && needs.resolve-config.result == 'success'
      && (needs.code-scan.result == 'success' || needs.code-scan.result == 'skipped')
      && (needs.image-scan.result == 'success' || needs.image-scan.result == 'skipped') }}
    runs-on: ${{ inputs.runs_on }}
    outputs:
      docker_image: ${{ steps.refs.outputs.app }}
      db_image: ${{ steps.refs.outputs.db }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ needs.resolve-config.outputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.registry_namespace }}/${{ inputs.service }}:${{ needs.resolve-config.outputs.tag }}
          build-args: WORK_DIR=${{ needs.resolve-config.outputs.work_dir }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Build and push database image
        if: ${{ needs.resolve-config.outputs.db_work_dir != '' }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ needs.resolve-config.outputs.db_work_dir }}
          file: ${{ needs.resolve-config.outputs.db_dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.registry_namespace }}/${{ inputs.service }}-db:${{ needs.resolve-config.outputs.tag }}
          cache-from: type=gha,scope=${{ inputs.service }}-db
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-db

      - name: Export image refs
        id: refs
        env:
          APP_IMAGE: ${{ inputs.registry_namespace }}/${{ inputs.service }}:${{ needs.resolve-config.outputs.tag }}
          DB_WORK_DIR: ${{ needs.resolve-config.outputs.db_work_dir }}
          DB_IMAGE: ${{ inputs.registry_namespace }}/${{ inputs.service }}-db:${{ needs.resolve-config.outputs.tag }}
        run: |
          echo "app=$APP_IMAGE" >> "$GITHUB_OUTPUT"
          if [ -n "$DB_WORK_DIR" ]; then
            echo "db=$DB_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "db=" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        env:
          APP_IMAGE: ${{ inputs.registry_namespace }}/${{ inputs.service }}:${{ needs.resolve-config.outputs.tag }}
          DB_WORK_DIR: ${{ needs.resolve-config.outputs.db_work_dir }}
          DB_IMAGE: ${{ inputs.registry_namespace }}/${{ inputs.service }}-db:${{ needs.resolve-config.outputs.tag }}
        run: |
          {
            echo "### Build result"
            echo "- Application: \`$APP_IMAGE\`"
            if [ -n "$DB_WORK_DIR" ]; then echo "- Database: \`$DB_IMAGE\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
