# Keep the Code Build dropdowns current, in one place:
#   • service       — from build/build-config.yml (additive union; never drops)
#   • build_branch  — from the repo's live branches (replaced each run; default first)
# Commits any change straight to the default branch via a GitHub App token
# (App on the default-branch ruleset bypass list). Always operates on the default
# branch, whatever ref triggered the caller.
# Auth: APP_CLIENT_ID + APP_PRIVATE_KEY (Contents + Workflows write).
# Docs: docs/workflows/sync-code-build.md
name: Reusable Code Build Sync

on:
  workflow_call:
    inputs:
      config_path:
        description: "Path to the build config file"
        required: false
        type: string
        default: "build/build-config.yml"
      sync_branch:
        description: "Read build-config.yml from this branch (to pull its new services into the default list); empty = the default branch"
        required: false
        type: string
        default: ""
      workflow_file:
        description: "Code Build workflow whose service + build_branch lists are synced"
        required: false
        type: string
        default: ".github/workflows/code-build.yaml"
      sync_workflow_file:
        description: "Sync workflow whose sync_branch picker is synced (empty/absent = skip)"
        required: false
        type: string
        default: ".github/workflows/sync-code-build.yaml"
      branch_exclude:
        description: "ERE of branch names to leave OUT of the build_branch dropdown (empty = include all)"
        required: false
        type: string
        default: "^dependabot/"
      max_branches:
        description: "Cap on branches listed (GitHub limits choice options)"
        required: false
        type: number
        default: 200
    secrets:
      APP_CLIENT_ID:
        description: "GitHub App Client ID (Iv..; App has Contents+Workflows write, on the default-branch ruleset bypass list)"
        required: true
      APP_PRIVATE_KEY:
        description: "GitHub App private key (PEM)"
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve default branch
        id: def
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "branch=$(gh api "repos/${GITHUB_REPOSITORY}" -q .default_branch)" >> "$GITHUB_OUTPUT"

      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.def.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          VERSION="v4.54.1"
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Sync service dropdown (from build-config)
        env:
          CONFIG: ${{ inputs.config_path }}
          WF: ${{ inputs.workflow_file }}
          SYNC_BRANCH: ${{ inputs.sync_branch }}
          DEFAULT: ${{ steps.def.outputs.branch }}
        run: |
          set -euo pipefail
          test -f "$WF" || { echo "::error::workflow not found: $WF"; exit 1; }

          # Source config: another branch's build-config (to pull in its new
          # services) when sync_branch is given, else the default branch's file.
          if [ -n "$SYNC_BRANCH" ] && [ "$SYNC_BRANCH" != "$DEFAULT" ]; then
            git fetch -q --depth 1 origin "$SYNC_BRANCH" || { echo "::error::cannot fetch branch '$SYNC_BRANCH'"; exit 1; }
            SRC="$(mktemp)"
            git show "FETCH_HEAD:$CONFIG" > "$SRC" 2>/dev/null || { echo "::error::$CONFIG not found on '$SYNC_BRANCH'"; exit 1; }
            echo "Reading services from branch '$SYNC_BRANCH'."
          else
            test -f "$CONFIG" || { echo "::error::config not found: $CONFIG"; exit 1; }
            SRC="$CONFIG"
          fi

          # services = app image-names (drop -db). Additive union, never drops.
          NEW_SVC=$(yq eval '.config[].build[]."image-name"' "$SRC" | grep -vE -- '-db$' | sort -u)
          OLD_SVC=$(yq eval '.["on"].workflow_dispatch.inputs.service.options[]' "$WF" 2>/dev/null || true)
          SVC=$(printf '%s\n%s\n' "$OLD_SVC" "$NEW_SVC" | grep -v '^$' | grep -vxF placeholder | sort -u)
          SVC="$SVC" yq -i '.["on"].workflow_dispatch.inputs.service.options = (strenv(SVC) | split("\n"))' "$WF"
          echo "Services: $(echo "$SVC" | wc -l | tr -d ' ')"

      - name: Sync branch dropdowns (from live branches)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WF: ${{ inputs.workflow_file }}
          SYNC_WF: ${{ inputs.sync_workflow_file }}
          DEFAULT: ${{ steps.def.outputs.branch }}
          EXCLUDE: ${{ inputs.branch_exclude }}
          MAX: ${{ inputs.max_branches }}
        run: |
          set -euo pipefail
          # Live branch names, minus the excluded pattern; default branch pinned
          # first; the list is REPLACED each run so deleted branches disappear.
          ALL=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches" -q '.[].name')
          if [ -n "$EXCLUDE" ]; then
            ALL=$(printf '%s\n' "$ALL" | grep -vE "$EXCLUDE" || true)
          fi
          OTHERS=$(printf '%s\n' "$ALL" | grep -vxF "$DEFAULT" | grep -v '^$' | sort | head -n "$((MAX-1))")
          OPTS=$(printf '%s\n%s\n' "$DEFAULT" "$OTHERS" | grep -v '^$')
          # Code Build: the "Build from Branch" picker.
          OPTS="$OPTS" yq -i '.["on"].workflow_dispatch.inputs.build_branch.options = (strenv(OPTS) | split("\n"))' "$WF"
          DEFAULT="$DEFAULT" yq -i '.["on"].workflow_dispatch.inputs.build_branch.default = strenv(DEFAULT)' "$WF"
          # Sync: the "Sync from Branch" picker (same list).
          if [ -n "$SYNC_WF" ] && [ -f "$SYNC_WF" ]; then
            OPTS="$OPTS" yq -i '.["on"].workflow_dispatch.inputs.sync_branch.options = (strenv(OPTS) | split("\n"))' "$SYNC_WF"
            DEFAULT="$DEFAULT" yq -i '.["on"].workflow_dispatch.inputs.sync_branch.default = strenv(DEFAULT)' "$SYNC_WF"
          fi
          echo "Branches: $(echo "$OPTS" | wc -l | tr -d ' ') (default: $DEFAULT)"

      - name: Commit if changed
        env:
          WF: ${{ inputs.workflow_file }}
          SYNC_WF: ${{ inputs.sync_workflow_file }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT: ${{ steps.def.outputs.branch }}
        run: |
          set -euo pipefail
          # The files we may have touched (sync workflow only if present).
          FILES="$WF"
          [ -n "$SYNC_WF" ] && [ -f "$SYNC_WF" ] && FILES="$FILES $SYNC_WF"
          if git diff --quiet -- $FILES; then
            echo "Code Build dropdowns already up to date."; exit 0
          fi
          git config user.name  "digit-devops-workflows[bot]"
          git config user.email "digit-devops-workflows[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore(code-build): sync service + branch dropdowns"
          # Direct push to the default branch; the App is on the ruleset bypass list.
          git push origin "HEAD:${DEFAULT}"
          echo "### Code Build dropdowns synced → ${DEFAULT}" >> "$GITHUB_STEP_SUMMARY"
