# Reusable delivery: promote a freshly built service to an environment's Kargo stage.
# Config comes from repo env (generic, multi-env): vars KARGO_URL + KARGO_STAGES (JSON),
# secrets <ENV>_API_KEY (else KARGO_API_KEY) and <ENV>_KUBECONFIG. See docs/4. Kargo Promotions.
name: Reusable — Deliver

on:
  workflow_call:
    inputs:
      service:
        description: "Service to promote (must match its Kargo Warehouse + <service>-<stage> Stage)"
        required: true
        type: string
      image_tag:
        description: "The freshly built image tag; the Freight carrying THIS tag is promoted (not the latest)"
        required: true
        type: string
      environment:
        description: "Target env key in KARGO_STAGES (e.g. DEV, QA, UAT)"
        required: true
        type: string
      stage:
        description: "Kargo stage suffix; the stage promoted is <service>-<stage>. Empty = lowercased environment"
        required: false
        type: string
        default: ""
      kargo_url:
        description: "Default Kargo API URL (repo var KARGO_URL); a per-env kargo-url in KARGO_STAGES overrides it"
        required: false
        type: string
        default: ""
      kargo_stages:
        description: 'JSON map env -> {kargo-project, kargo-url} (repo var KARGO_STAGES), e.g. {"DEV":{"kargo-project":"hcm-3-0","kargo-url":""}}'
        required: true
        type: string
      kargo_version:
        description: "Kargo CLI version to install (match the server)"
        required: false
        type: string
        default: "v1.11.4"
      runs_on:
        description: "Runner label"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      KARGO_API_KEY:
        description: "Default Kargo API bearer token (fallback when <ENV>_API_KEY is unset)"
        required: false
      DEV_API_KEY:
        required: false
      QA_API_KEY:
        required: false
      UAT_API_KEY:
        required: false
      DEV_KUBECONFIG:
        required: false
      QA_KUBECONFIG:
        required: false
      UAT_KUBECONFIG:
        required: false

jobs:
  deliver:
    runs-on: ${{ inputs.runs_on }}
    env:
      # Mapped statically because Actions cannot index secrets by a computed name;
      # the step below selects the right one by ${ENVIRONMENT} via bash indirection.
      ENVIRONMENT: ${{ inputs.environment }}
      KARGO_API_KEY: ${{ secrets.KARGO_API_KEY }}
      DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
      QA_API_KEY: ${{ secrets.QA_API_KEY }}
      UAT_API_KEY: ${{ secrets.UAT_API_KEY }}
      DEV_KUBECONFIG: ${{ secrets.DEV_KUBECONFIG }}
      QA_KUBECONFIG: ${{ secrets.QA_KUBECONFIG }}
      UAT_KUBECONFIG: ${{ secrets.UAT_KUBECONFIG }}
    steps:
      - name: Resolve environment config
        env:
          KARGO_STAGES: ${{ inputs.kargo_stages }}
          DEFAULT_URL: ${{ inputs.kargo_url }}
        run: |
          set -euo pipefail
          ENV="${ENVIRONMENT}"
          PROJECT=$(jq -r --arg e "$ENV" '.[$e]["kargo-project"] // empty' <<<"$KARGO_STAGES")
          URL_OVERRIDE=$(jq -r --arg e "$ENV" '.[$e]["kargo-url"] // empty' <<<"$KARGO_STAGES")
          [ -n "$PROJECT" ] || { echo "::error::environment '$ENV' is not defined in KARGO_STAGES"; exit 1; }
          KURL="${URL_OVERRIDE:-$DEFAULT_URL}"
          [ -n "$KURL" ] || { echo "::error::no Kargo URL: set KARGO_URL or a kargo-url for '$ENV' in KARGO_STAGES"; exit 1; }
          # API key: <ENV>_API_KEY else KARGO_API_KEY
          KEYVAR="${ENV}_API_KEY"; APIKEY="${!KEYVAR:-}"
          [ -n "$APIKEY" ] || APIKEY="${KARGO_API_KEY:-}"
          [ -n "$APIKEY" ] || { echo "::error::no API key: set ${ENV}_API_KEY or KARGO_API_KEY"; exit 1; }
          echo "::add-mask::$APIKEY"
          # Kubeconfig: <ENV>_KUBECONFIG (no default)
          KCVAR="${ENV}_KUBECONFIG"; KCFG="${!KCVAR:-}"
          STAGE="${{ inputs.stage }}"; [ -n "$STAGE" ] || STAGE=$(printf '%s' "$ENV" | tr '[:upper:]' '[:lower:]')
          # kargo CLI authenticates from KARGO_API_ADDRESS + KARGO_API_TOKEN (no login step).
          {
            echo "KARGO_PROJECT=$PROJECT"
            echo "KARGO_API_ADDRESS=$KURL"
            echo "KARGO_API_TOKEN=$APIKEY"
            echo "KARGO_STAGE=${{ inputs.service }}-$STAGE"
          } >> "$GITHUB_ENV"
          if [ -n "$KCFG" ]; then
            printf '%s' "$KCFG" > "$RUNNER_TEMP/kubeconfig"; chmod 600 "$RUNNER_TEMP/kubeconfig"
            echo "DELIVER_KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          fi
          echo "Delivering ${{ inputs.service }} (tag ${{ inputs.image_tag }}) -> $PROJECT / ${{ inputs.service }}-$STAGE @ $KURL"

      - name: Install Kargo CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/kargo" \
            "https://github.com/akuity/kargo/releases/download/${{ inputs.kargo_version }}/kargo-linux-amd64"
          chmod +x "$RUNNER_TEMP/bin/kargo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/kargo" version --client || true

      - name: Create this build's Freight and promote it
        env:
          TAG: ${{ inputs.image_tag }}
          SVC: ${{ inputs.service }}
        run: |
          set -euo pipefail
          # Deterministic delivery: discover the freshly pushed tag, then CREATE the Freight that
          # carries exactly this build's image+chart and promote it. Auto-selection (NewestBuild)
          # is unreliable when every image shares a build timestamp, so we never wait for it.
          DIGEST=""; WH='{}'
          for attempt in 1 2 3 4 5 6; do
            kargo refresh warehouse "$SVC" --project "$KARGO_PROJECT" --wait || true
            WH=$(kargo get warehouse "$SVC" --project "$KARGO_PROJECT" -o json 2>/dev/null || echo '{}')
            DIGEST=$(jq -r --arg t "$TAG" '[.status.discoveredArtifacts.images[]?.references[]? | select(.tag==$t) | .digest] | first // ""' <<<"$WH")
            [ -n "$DIGEST" ] && break
            echo "tag '$TAG' not discovered in warehouse '$SVC' yet (attempt ${attempt})..."
            sleep 15
          done
          [ -n "$DIGEST" ] || { echo "::error::tag '$TAG' never discovered in warehouse '$SVC' for $KARGO_PROJECT"; exit 1; }
          IMG_REPO=$(jq -r --arg t "$TAG" '[.status.discoveredArtifacts.images[]? | select(any(.references[]?; .tag==$t)) | .repoURL] | first // ""' <<<"$WH")
          CHART_REPO=$(jq -r '.status.discoveredArtifacts.charts[0].repoURL // ""' <<<"$WH")
          CHART_NAME=$(jq -r '.status.discoveredArtifacts.charts[0].name // ""' <<<"$WH")
          CHART_VER=$(jq -r '.status.discoveredArtifacts.charts[0].versions[0] // ""' <<<"$WH")
          # Freight name = Kargo's content hash: sha1("Warehouse/<svc>:<sorted '|'-joined parts>"),
          # image part "<repo>:<tag>@<digest>", chart part "<path.Join(repo,name)>:<version>".
          IMG_PART="${IMG_REPO}:${TAG}@${DIGEST}"
          if [ -n "$CHART_REPO" ]; then
            CHART_PATH=$(printf '%s/%s' "$CHART_REPO" "$CHART_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#//*#/#g')
            PARTS=$(printf '%s\n%s:%s\n' "$IMG_PART" "$CHART_PATH" "$CHART_VER" | sort | paste -sd'|' -)
          else
            PARTS="$IMG_PART"
          fi
          NAME=$(printf 'Warehouse/%s:%s' "$SVC" "$PARTS" | sha1sum | cut -d' ' -f1)
          echo "Freight $NAME  image=${IMG_REPO}:${TAG}  chart=${CHART_NAME:-<none>}:${CHART_VER:-<none>}"
          {
            echo "apiVersion: kargo.akuity.io/v1alpha1"
            echo "kind: Freight"
            echo "metadata: { name: ${NAME}, namespace: ${KARGO_PROJECT} }"
            echo "origin: { kind: Warehouse, name: ${SVC} }"
            echo "images:"
            echo "- { repoURL: ${IMG_REPO}, tag: ${TAG}, digest: ${DIGEST} }"
            [ -n "$CHART_REPO" ] && { echo "charts:"; echo "- { repoURL: ${CHART_REPO}, name: ${CHART_NAME}, version: ${CHART_VER} }"; }
          } > "$RUNNER_TEMP/freight.yaml"
          # Idempotent: same content -> same name, so an existing Freight is fine.
          kargo create -f "$RUNNER_TEMP/freight.yaml" 2>&1 | tail -2 || echo "freight already exists; continuing"
          echo "Promoting freight $NAME (image $TAG) -> $KARGO_STAGE"
          kargo promote --project "$KARGO_PROJECT" --freight "$NAME" --stage "$KARGO_STAGE"

      - name: Verify rollout on the target cluster
        if: ${{ env.DELIVER_KUBECONFIG != '' }}
        env:
          KUBECONFIG: ${{ env.DELIVER_KUBECONFIG }}
        run: |
          set -euo pipefail
          kubectl -n "$KARGO_PROJECT" rollout status "deploy/${{ inputs.service }}" --timeout=300s || \
            echo "::warning::rollout not confirmed within timeout; check Argo CD / Kargo for ${{ inputs.service }}"
