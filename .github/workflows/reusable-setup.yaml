# One-shot setup for a consumer repo. Scaffolds the Code Build caller,
# the sync-dropdown workflow and the Trivy dashboard toolkit from DIGIT-DevOps,
# populates the dropdowns, and opens a PR with them. The /pipelines UI is Pages
# content, so it is published straight to the gh-pages branch (which Pages
# serves), not committed to the source tree. gh-pages is pushed directly (not protected).
# Needs repo secret WORKFLOWS_TOKEN:
#   Contents:write + Workflows:write + Pull requests:write (+ Pages:write optional).
# Docs: docs/workflows/setup.md
name: Reusable Setup

on:
  workflow_call:
    inputs:
      enable_pages:
        description: "Attempt to enable GitHub Pages on gh-pages (best effort)"
        required: false
        type: boolean
        default: true
    secrets:
      WORKFLOWS_TOKEN:
        description: "Token with Contents+Workflows+Pull requests write (+ Pages:write to auto-enable Pages)"
        required: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Guard — default branch only
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_TOKEN }}
        run: |
          set -euo pipefail
          DEFAULT=$(gh api "repos/${GITHUB_REPOSITORY}" -q .default_branch)
          if [ "${GITHUB_REF_NAME}" != "$DEFAULT" ]; then
            echo "::error::Setup runs only from the default branch ($DEFAULT); it was started from '${GITHUB_REF_NAME}'. Set 'Use workflow from' to $DEFAULT."
            exit 1
          fi
          echo "On default branch ($DEFAULT) — proceeding."

      - name: Checkout consumer repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.WORKFLOWS_TOKEN }}

      - name: Checkout DIGIT-DevOps templates
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: egovernments/DIGIT-DevOps
          ref: reusable-build-v1
          path: _devops

      - name: Install yq
        run: |
          VERSION="v4.54.1"
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Scaffold files and populate dropdowns
        env:
          CONFIG: build/build-config.yml
          WF: .github/workflows/code-build.yaml
        run: |
          set -euo pipefail
          cp -R _devops/templates/consumer/. ./
          rm -rf _devops
          # The /pipelines UI is GitHub Pages content: it is published to the
          # gh-pages branch (served by Pages), not committed to the source tree.
          # Stash it for the gh-pages step and keep it out of the setup PR.
          rm -rf "$RUNNER_TEMP/pipelines"
          mv pipelines "$RUNNER_TEMP/pipelines"
          # Populate the Code Build dropdowns from this repo's build-config.
          if [ -f "$CONFIG" ]; then
            SVC=$(yq eval '.config[].build[]."image-name"' "$CONFIG" | grep -vE -- '-db$' | grep -vxF placeholder | sort -u)
            MOD=$(yq eval '.config[].name' "$CONFIG" | awk -F/ 'NF>=3{print $3}' | grep -vxF placeholder | sort -u)
            SVC="$SVC" yq -i '.["on"].workflow_dispatch.inputs.service.options = (strenv(SVC) | split("\n"))' "$WF"
            MOD="$MOD" yq -i '.["on"].workflow_dispatch.inputs.module.options  = (strenv(MOD) | split("\n"))' "$WF"
          fi

      - name: Open setup PR
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_TOKEN }}
          BRANCH: ci/setup-code-build
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to scaffold (already present)."; exit 0
          fi
          BASE="$(gh api "repos/${GITHUB_REPOSITORY}" -q .default_branch)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore: scaffold Code Build from DIGIT-DevOps"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "ci: set up Code Build" \
              --body "Provisioned by DIGIT-DevOps reusable-setup: code-build.yaml (synced dropdowns), sync-dropdown.yaml, .trivy/dashboard. The /pipelines UI is published separately to the gh-pages branch."
          fi
          echo "PR_URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')" >> "$GITHUB_ENV"

      - name: Publish /pipelines UI to gh-pages
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          tmp="$(mktemp -d)"
          # Reuse the existing gh-pages tree (keeps /security/trivy and any other
          # published content); create it as an orphan branch on first run.
          if git clone --quiet --depth 1 --branch gh-pages "$REMOTE" "$tmp" 2>/dev/null; then
            echo "gh-pages exists; refreshing the /pipelines UI."
          else
            rm -rf "$tmp"; mkdir -p "$tmp"; cd "$tmp"
            git init -q
            git checkout -q --orphan gh-pages
            : > .nojekyll
            printf '<!doctype html><meta charset=utf8><title>%s</title><meta http-equiv=refresh content="0; url=security/trivy/">\n' "$GITHUB_REPOSITORY" > index.html
            echo "Initialized gh-pages."
          fi
          cd "$tmp"
          touch .nojekyll
          rm -rf pipelines
          cp -R "$RUNNER_TEMP/pipelines" pipelines
          git add -A
          if ! git -c user.email="github-actions[bot]@users.noreply.github.com" \
                  -c user.name="github-actions[bot]" commit -qm "chore: publish /pipelines UI to gh-pages"; then
            echo "gh-pages already up to date."; exit 0
          fi
          git push -q "$REMOTE" HEAD:gh-pages
          echo "Published /pipelines to gh-pages."

      - name: Enable Pages (best effort)
        if: ${{ inputs.enable_pages }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || echo "::warning::Enable Pages manually (Settings > Pages > branch gh-pages) — token may lack Pages:write."

      - name: Summary
        run: |
          {
            echo "### Code Build setup"
            echo "- Review & merge the setup PR: ${PR_URL:-'(no changes — already scaffolded)'}"
            echo "- /pipelines UI → published to gh-pages (\`/pipelines/\`)"
            echo "- Trivy dashboard → gh-pages \`/security/trivy\`"
            echo "- Ensure repo has \`DOCKER_USERNAME\` (var) + \`DOCKER_ACCESS_TOKEN\` (secret)."
          } >> "$GITHUB_STEP_SUMMARY"
