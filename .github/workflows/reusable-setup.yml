# One-shot setup for a consumer repo. Scaffolds the Code Build caller,
# the sync-dropdown workflow, the Trivy dashboard toolkit and the /pipelines
# UI from DIGIT-DevOps, populates the dropdowns, and opens a PR with it all.
# gh-pages is created directly (new branch, not protected).
# Needs repo secret WORKFLOWS_TOKEN:
#   Contents:write + Workflows:write + Pull requests:write (+ Pages:write optional).
# Docs: docs/workflows/setup.md
name: Reusable Setup

on:
  workflow_call:
    inputs:
      enable_pages:
        description: "Attempt to enable GitHub Pages on gh-pages (best effort)"
        required: false
        type: boolean
        default: true
    secrets:
      WORKFLOWS_TOKEN:
        description: "Token with Contents+Workflows+Pull requests write (+ Pages:write to auto-enable Pages)"
        required: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.WORKFLOWS_TOKEN }}

      - name: Checkout DIGIT-DevOps templates
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: egovernments/DIGIT-DevOps
          ref: reusable-build-v1
          path: _devops

      - name: Install yq
        run: |
          VERSION="v4.54.1"
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Scaffold files and populate dropdowns
        env:
          CONFIG: build/build-config.yml
          WF: .github/workflows/code-build.yml
        run: |
          set -euo pipefail
          cp -R _devops/templates/consumer/. ./
          rm -rf _devops
          # Populate the Code Build dropdowns from this repo's build-config.
          if [ -f "$CONFIG" ]; then
            SVC=$(yq eval '.config[].build[]."image-name"' "$CONFIG" | grep -vE -- '-db$' | grep -vxF placeholder | sort -u)
            MOD=$(yq eval '.config[].name' "$CONFIG" | awk -F/ 'NF>=3{print $3}' | grep -vxF placeholder | sort -u)
            SVC="$SVC" yq -i '.["on"].workflow_dispatch.inputs.service.options = (strenv(SVC) | split("\n"))' "$WF"
            MOD="$MOD" yq -i '.["on"].workflow_dispatch.inputs.module.options  = (strenv(MOD) | split("\n"))' "$WF"
          fi

      - name: Open setup PR
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_TOKEN }}
          BRANCH: ci/setup-code-build
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to scaffold (already present)."; exit 0
          fi
          BASE="$(gh api "repos/${GITHUB_REPOSITORY}" -q .default_branch)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore: scaffold Code Build from DIGIT-DevOps"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "ci: set up Code Build" \
              --body "Provisioned by DIGIT-DevOps reusable-setup: code-build.yml (synced dropdowns), sync-dropdown.yml, .trivy/dashboard, pipelines/ UI."
          fi
          echo "PR_URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')" >> "$GITHUB_ENV"

      - name: Ensure gh-pages exists
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages already exists."; exit 0
          fi
          tmp="$(mktemp -d)"; cd "$tmp"
          git init -q
          git checkout -q --orphan gh-pages
          : > .nojekyll
          printf '<!doctype html><meta charset=utf8><title>%s</title><meta http-equiv=refresh content="0; url=security/trivy/">\n' "$GITHUB_REPOSITORY" > index.html
          git add -A
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" commit -qm "chore: initialize gh-pages"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Created gh-pages."

      - name: Enable Pages (best effort)
        if: ${{ inputs.enable_pages }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WORKFLOWS_TOKEN }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || echo "::warning::Enable Pages manually (Settings > Pages > branch gh-pages) — token may lack Pages:write."

      - name: Summary
        run: |
          {
            echo "### Code Build setup"
            echo "- Review & merge the setup PR: ${PR_URL:-'(no changes — already scaffolded)'}"
            echo "- Trivy dashboard → gh-pages \`/security/trivy\`"
            echo "- Ensure repo has \`DOCKER_USERNAME\` (var) + \`DOCKER_ACCESS_TOKEN\` (secret)."
          } >> "$GITHUB_STEP_SUMMARY"
