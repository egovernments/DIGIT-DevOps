# Sync the Code Build dropdowns from build-config.yml.
# Service entries are added/updated in the caller's code-build workflow
# choice lists; existing entries are never removed (additive union).
# Commits the change straight to the default branch via a GitHub App token
# (App on the default-branch ruleset bypass list).
# Auth: APP_ID + APP_PRIVATE_KEY (Contents + Workflows write).
# Docs: docs/workflows/sync-dropdown.md
name: Reusable Sync Dropdown

on:
  workflow_call:
    inputs:
      config_path:
        description: "Path to the build config file"
        required: false
        type: string
        default: "build/build-config.yml"
      sync_branch:
        description: "Branch to read build-config.yml from (to pull another branch's new services into the default branch's list); empty = this branch"
        required: false
        type: string
        default: ""
      workflow_file:
        description: "Workflow file whose service choice list is synced"
        required: false
        type: string
        default: ".github/workflows/code-build.yaml"
    secrets:
      APP_ID:
        description: "GitHub App ID (Contents+Workflows write; installed here; on the default-branch ruleset bypass list)"
        required: true
      APP_PRIVATE_KEY:
        description: "GitHub App private key (PEM)"
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Guard — default branch only
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          DEFAULT=$(gh api "repos/${GITHUB_REPOSITORY}" -q .default_branch)
          if [ "${GITHUB_REF_NAME}" != "$DEFAULT" ]; then
            echo "::error::Sync runs only from the default branch ($DEFAULT); it was started from '${GITHUB_REF_NAME}'. Set 'Use workflow from' to $DEFAULT."
            exit 1
          fi
          echo "On default branch ($DEFAULT) — proceeding."

      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install yq
        run: |
          VERSION="v4.54.1"
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Sync dropdowns from build-config
        env:
          CONFIG: ${{ inputs.config_path }}
          WF: ${{ inputs.workflow_file }}
          SYNC_BRANCH: ${{ inputs.sync_branch }}
        run: |
          set -euo pipefail
          test -f "$WF" || { echo "::error::workflow not found: $WF"; exit 1; }

          # Source config: another branch's build-config (to pull in its new
          # services) when sync_branch is given, else this branch's file.
          if [ -n "$SYNC_BRANCH" ] && [ "$SYNC_BRANCH" != "$GITHUB_REF_NAME" ]; then
            git fetch -q --depth 1 origin "$SYNC_BRANCH" || { echo "::error::cannot fetch branch '$SYNC_BRANCH'"; exit 1; }
            SRC="$(mktemp)"
            git show "FETCH_HEAD:$CONFIG" > "$SRC" 2>/dev/null || { echo "::error::$CONFIG not found on '$SYNC_BRANCH'"; exit 1; }
            echo "Reading services from branch '$SYNC_BRANCH'."
          else
            test -f "$CONFIG" || { echo "::error::config not found: $CONFIG"; exit 1; }
            SRC="$CONFIG"
          fi

          # New list from the config: services = app image-names (drop -db).
          NEW_SVC=$(yq eval '.config[].build[]."image-name"' "$SRC" | grep -vE -- '-db$' | sort -u)

          # Existing options (empty on first run).
          OLD_SVC=$(yq eval '.["on"].workflow_dispatch.inputs.service.options[]' "$WF" 2>/dev/null || true)

          # Additive union — never drop a real entry (the scaffold seed is dropped).
          SVC=$(printf '%s\n%s\n' "$OLD_SVC" "$NEW_SVC" | grep -v '^$' | grep -vxF placeholder | sort -u)

          SVC="$SVC" yq -i '.["on"].workflow_dispatch.inputs.service.options = (strenv(SVC) | split("\n"))' "$WF"

          echo "Services: $(echo "$SVC" | wc -l | tr -d ' ')"

      - name: Commit if changed
        env:
          WF: ${{ inputs.workflow_file }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$WF"; then
            echo "Dropdowns already up to date."; exit 0
          fi
          git config user.name  "digit-devops-workflows[bot]"
          git config user.email "digit-devops-workflows[bot]@users.noreply.github.com"
          git add "$WF"
          git commit -m "chore(code-build): sync service dropdown from build-config"
          # Direct push to the default branch; the App is on the ruleset bypass list.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "### Dropdown synced → pushed to ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
