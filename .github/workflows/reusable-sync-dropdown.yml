# Sync the Code Build dropdowns from build-config.yml.
# Modules and services are added/updated in the caller's code-build workflow
# choice lists; existing entries are never removed (additive union).
# Needs a token with Workflows:write to commit the workflow file.
# Docs: docs/workflows/sync-dropdown.md
name: Reusable Sync Dropdown

on:
  workflow_call:
    inputs:
      config_path:
        description: "Path to the build config file"
        required: false
        type: string
        default: "build/build-config.yml"
      workflow_file:
        description: "Workflow file whose module/service choice lists are synced"
        required: false
        type: string
        default: ".github/workflows/code-build.yml"
    secrets:
      WORKFLOWS_TOKEN:
        description: "Token with Contents:write + Workflows:write to commit the workflow file"
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.WORKFLOWS_TOKEN }}

      - name: Install yq
        run: |
          VERSION="v4.54.1"
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Sync dropdowns from build-config
        env:
          CONFIG: ${{ inputs.config_path }}
          WF: ${{ inputs.workflow_file }}
        run: |
          set -euo pipefail
          test -f "$CONFIG" || { echo "::error::config not found: $CONFIG"; exit 1; }
          test -f "$WF"     || { echo "::error::workflow not found: $WF"; exit 1; }

          # New lists from the config: services = app image-names (drop -db),
          # modules = 3rd path segment of each job name.
          NEW_SVC=$(yq eval '.config[].build[]."image-name"' "$CONFIG" | grep -vE -- '-db$' | sort -u)
          NEW_MOD=$(yq eval '.config[].name' "$CONFIG" | awk -F/ 'NF>=3{print $3}' | sort -u)

          # Existing options (empty on first run).
          OLD_SVC=$(yq eval '.["on"].workflow_dispatch.inputs.service.options[]' "$WF" 2>/dev/null || true)
          OLD_MOD=$(yq eval '.["on"].workflow_dispatch.inputs.module.options[]' "$WF" 2>/dev/null || true)

          # Additive union — never drop a real entry (the scaffold seed is dropped).
          SVC=$(printf '%s\n%s\n' "$OLD_SVC" "$NEW_SVC" | grep -v '^$' | grep -vxF placeholder | sort -u)
          MOD=$(printf '%s\n%s\n' "$OLD_MOD" "$NEW_MOD" | grep -v '^$' | grep -vxF placeholder | sort -u)

          SVC="$SVC" yq -i '.["on"].workflow_dispatch.inputs.service.options = (strenv(SVC) | split("\n"))' "$WF"
          MOD="$MOD" yq -i '.["on"].workflow_dispatch.inputs.module.options  = (strenv(MOD) | split("\n"))' "$WF"

          echo "Services: $(echo "$SVC" | wc -l | tr -d ' ') · Modules: $(echo "$MOD" | wc -l | tr -d ' ')"

      - name: Commit if changed
        env:
          WF: ${{ inputs.workflow_file }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$WF"; then
            echo "Dropdowns already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WF"
          git commit -m "chore(code-build): sync module/service dropdowns from build-config"
          git push
          echo "### Dropdowns synced from build-config" >> "$GITHUB_STEP_SUMMARY"
