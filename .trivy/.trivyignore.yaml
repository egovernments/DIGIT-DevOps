#     purls: ["pkg:deb/debian/libssl1.1"]
#     expired_at: 2026-12-01
#     statement: Not reachable from any entrypoint; base-image bump tracked separately.

misconfigurations:
  - id: KSV-0013
    expired_at: 2027-04-30
    statement: >-
      Image tags are pinned per service at deploy time via the environment values
      files (deploy-as-code/helm/environments/unified-*.yaml). The scan renders charts
      without those overrides, so init/sidecar images fall back to ":latest" in the scan
      only - not in any real deployment. Revisit if the deploy/values model changes.
  - id: KSV-01010
    paths:
      - "**/argo-cd/**"
      - "**/ingress-nginx/**"
      - "**/jenkins/**"
      - "**/kafka-kraft/**"
      - "**/es-curator/**"
      - "**/pgadmin/**"
    expired_at: 2027-04-30
    statement: >-
      Keyword false positives: the check matches config field NAMES (e.g.
      application.instanceLabelKey, hsts-max-age, controller.quorum.voters, Jenkins JCasC
      fields, shell variables) in these third-party/infra charts - not real secret values.
      Verified no hard-coded secrets. Scoped to these charts so an inline secret elsewhere
      still trips the check.
  - id: KSV-0109
    paths:
      - "**/ingress-nginx/**"
      - "**/kafka-kraft/**"
      - "**/pgadmin/**"
    expired_at: 2027-04-30
    statement: >-
      Keyword false positives: matches config field names (server-tokens; pgAdmin's
      ALLOW_SAVE_PASSWORD, set from enable-save-password=false, a feature flag not a
      secret; a bash "password" variable) - not real secrets. Scoped to these charts.

secrets: []

licenses: []
