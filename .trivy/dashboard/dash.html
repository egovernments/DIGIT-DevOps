<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivy · DIGIT</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<style>
  :root{
    color-scheme:light;
    --bg:#eef1f7; --surface:#ffffff; --surface-2:#f6f8fc; --surface-3:#eef2f9;
    --ink:#0f1b2e; --ink-2:#42506a; --muted:#697689; --faint:#98a2b5;
    --line:#e5eaf3; --line-2:#d6ddea;
    --brand:#4c1d95; --brand-2:#7c3aed; --accent:#7c3aed; --link:#6d28d9;
    --crit:#b31d33; --high:#e06a2c; --med:#c58a12; --low:#2f6fed; --unknown:#8a94a6;
    --crit-bg:#fdeef0; --high-bg:#fdf0e7; --med-bg:#fbf4e2; --low-bg:#ecf2fe;
    --good:#0f8a3c;
    --sh-sm:0 1px 2px rgba(16,27,46,.05);
    --sh:0 1px 2px rgba(16,27,46,.05),0 10px 26px -14px rgba(16,27,46,.20);
    --sh-lg:0 24px 60px -30px rgba(16,27,46,.42);
    --r:16px; --r-sm:11px;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
    --grad:linear-gradient(150deg,#4c1d95,#7c3aed);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0c1119; --surface:#141b26; --surface-2:#1a2230; --surface-3:#212b3b;
    --ink:#e8edf6; --ink-2:#c1cad9; --muted:#8a94a5; --faint:#6a7484;
    --line:#27313f; --line-2:#333e4e;
    --brand:#c4b5fd; --brand-2:#a78bfa; --accent:#a78bfa; --link:#c4b5fd;
    --crit:#e0566d; --high:#ef8a5c; --med:#e2ab43; --low:#5b93f2; --unknown:#7b8698;
    --crit-bg:#2a1820; --high-bg:#291a14; --med-bg:#26200f; --low-bg:#141f31;
    --good:#3ec46b;
    --sh-sm:0 1px 2px rgba(0,0,0,.4);
    --sh:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.65);
    --sh-lg:0 26px 64px -30px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:7px;border:3px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}
  .app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}

  /* sidebar */
  .sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sb-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
  .sb-brand .logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 10px rgba(124,58,237,.35))}
  .sb-brand b{font-size:15px;font-weight:760;letter-spacing:-.01em;display:block}
  .sb-brand span{font-size:11.5px;color:var(--muted)}
  .sb-sec{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--faint);text-transform:uppercase;padding:12px 20px 6px}
  .nav{padding:2px 12px;display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink-2);font-size:13.5px;font-weight:550;cursor:pointer}
  .nav a .ni{width:17px;height:17px;flex:none;color:var(--muted)}
  .nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--ink)}
  .nav a.on{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
  .nav a.on .ni{color:var(--accent)}
  .nav a .badge{margin-left:auto;font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface-3);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .nav a.on .badge{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
  .switch{margin:10px 12px 0;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
  .switch .sw-l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .switch a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;color:var(--ink-2);font-size:13px;font-weight:560}
  .switch a:hover{background:var(--surface);text-decoration:none;color:var(--ink)}
  .switch a.cur{color:var(--accent)}
  .switch a .di{width:16px;height:16px;color:var(--muted)}.switch a.cur .di{color:var(--accent)}
  .sb-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}

  /* topbar */
  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);
    backdrop-filter:saturate(1.5) blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:13px 30px}
  .topbar h1{font-size:17px;font-weight:740;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .topbar h1 .tg{font-size:10.5px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--grad);padding:3px 9px;border-radius:7px}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:9px}
  .icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh-sm)}
  .icon-btn:hover{color:var(--ink)}
  .search{position:relative}
  .search input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px 8px 32px;font:inherit;font-size:12.5px;width:180px;box-shadow:var(--sh-sm)}
  .search svg{position:absolute;left:10px;top:9px;color:var(--faint)}

  /* run / branch selector */
  .rpick{position:relative}
  .rbtn{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:7px 12px;cursor:pointer;box-shadow:var(--sh-sm);min-width:0}
  .rbtn:hover{border-color:var(--accent)}
  .rbtn.open{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
  .rbtn .rl{font-size:9.5px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .rbtn .rv{font-size:13px;font-weight:660;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .rbtn .rv small{color:var(--muted);font-weight:500}
  .rbtn .cv{color:var(--muted);transition:transform .15s} .rbtn.open .cv{transform:rotate(180deg)}
  .rmenu{position:absolute;right:0;top:calc(100% + 8px);width:340px;max-width:88vw;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--sh-lg);padding:8px;z-index:40;display:none}
  .rmenu.open{display:block}
  .rmenu .bsearch{position:relative;margin:4px 4px 8px}
  .rmenu .bsearch input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px 8px 30px;font:inherit;font-size:12.5px;color:var(--ink)}
  .rmenu .bsearch svg{position:absolute;left:9px;top:9px;color:var(--faint)}
  .rmenu .msec{font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 10px 5px}
  .branchlist{max-height:150px;overflow:auto;padding:0 2px 4px}
  .brow{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
  .brow:hover{background:var(--surface-2)} .brow.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
  .brow .gi{width:14px;height:14px;color:var(--muted)} .brow.on .gi{color:var(--accent)}
  .brow .bc{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .runlist{max-height:320px;overflow:auto;padding:0 2px 2px}
  .rrow{display:block;padding:9px 11px;border-radius:10px;cursor:pointer;border-left:3px solid transparent}
  .rrow:hover{background:var(--surface-2)}
  .rrow.on{background:color-mix(in srgb,var(--accent) 10%,transparent);border-left-color:var(--accent)}
  .rrow .t{display:flex;align-items:center;gap:8px}
  .rrow .t b{font-size:13px;font-weight:660;color:var(--ink)}
  .rrow .lt{font-size:9.5px;font-weight:750;letter-spacing:.03em;color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);border-radius:6px;padding:2px 7px}
  .rrow .m{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:7px}
  .rrow .m .dot{width:4px;height:4px;border-radius:50%;background:var(--faint)}
  .rrow .m .oc{color:var(--crit);font-weight:600}

  .content{padding:24px 30px 72px;max-width:1320px;width:100%}
  .filterbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .chips{display:inline-flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none;box-shadow:var(--sh-sm)}
  .chip .dot{width:9px;height:9px;border-radius:3px;flex:none}
  .chip[aria-pressed="false"]{opacity:.42}
  .vhint{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .vhint svg{width:14px;height:14px;color:var(--faint)}

  /* posture / score */
  .posture{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 26px;box-shadow:var(--sh);margin-bottom:16px;position:relative;overflow:hidden}
  .posture::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--band,var(--accent))}
  .gauge{position:relative;width:128px;height:128px;flex:none}
  .gauge .lab{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .gauge .lab b{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--band,var(--ink))}
  .gauge .lab b sub{font-size:17px;font-weight:650;color:var(--faint);bottom:-.15em;margin-left:1px}
  .posture .verdict{font-size:21px;font-weight:750;letter-spacing:-.01em;margin:0 0 5px;color:var(--band,var(--ink))}
  .posture .pdesc{font-size:13px;color:var(--ink-2);max-width:72ch}
  .posture .pmeta{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .pmeta .mp{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:flex;align-items:center;gap:6px}
  .pmeta .mp b{color:var(--ink);font-weight:640}

  .statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px 15px;box-shadow:var(--sh);min-width:0}
  .tile .lab{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-weight:520}
  .tile .val{font-size:30px;font-weight:740;letter-spacing:-.02em;margin-top:8px;line-height:1}
  .tile .foot{font-size:11.5px;color:var(--muted);margin-top:8px}
  .tile .val.c{color:var(--crit)}.tile .val.h{color:var(--high)}
  .sev-ic{width:14px;height:14px;flex:none}

  .grid-3-2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:18px;align-items:start}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 13px}
  .card-h h2{font-size:12px;font-weight:720;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin:0;display:flex;align-items:center;gap:9px}
  .card-h h2::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--accent)}
  .card-h .aux{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .card-b{padding:6px 18px 18px}

  .donut-wrap{display:flex;align-items:center;gap:24px;padding:8px 4px}
  .donut{position:relative;width:176px;height:176px;flex:none}
  .donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .donut .ctr b{display:block;font-size:31px;font-weight:750;letter-spacing:-.02em;line-height:1}
  .donut .ctr span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .dlegend{display:flex;flex-direction:column;gap:11px;flex:1;min-width:0}
  .dlegend .li{display:flex;align-items:center;gap:9px;font-size:13px}
  .dlegend .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .dlegend .ln{color:var(--ink-2)}.dlegend .lv{margin-left:auto;font-weight:680;font-variant-numeric:tabular-nums}
  .dlegend .lp{color:var(--muted);font-size:11.5px;width:42px;text-align:right;font-variant-numeric:tabular-nums}

  .hbars{display:flex;flex-direction:column;gap:12px;padding:8px 2px 2px}
  .hbar{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:12px}
  .hbar .hl{font-size:12.5px;color:var(--ink);font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar .tk{height:20px;background:var(--surface-2);border-radius:6px;display:flex;overflow:hidden;gap:2px}
  .hbar .tk i{height:100%;transition:filter .12s}.hbar .tk i:hover{filter:brightness(1.07)}
  .hbar .hv{text-align:right;font-weight:680;font-size:13px;font-variant-numeric:tabular-nums}

  .prio .pr{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
  .prio .pr:first-child{border-top:0}
  .prio .ptag{font-size:10.5px;font-weight:780;color:#fff;border-radius:6px;padding:3px 8px;letter-spacing:.03em}
  .prio .pt{font-size:13.5px;font-weight:640;color:var(--ink)}
  .prio .ps{font-size:12px;color:var(--muted);margin-top:1px}
  .prio .pn{font-size:13px;font-weight:680;white-space:nowrap}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;text-align:left;font-weight:720;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
  thead th.num{text-align:right}
  thead th .ar{opacity:.35;font-size:9px;margin-left:3px}thead th[aria-sort] .ar{opacity:1;color:var(--accent)}
  tbody td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr.drow{cursor:pointer}
  tbody tr.drow:hover td{background:var(--surface-2)}
  tbody tr.open td{background:var(--surface-2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .chev{display:inline-flex;width:15px;color:var(--faint);transition:transform .15s;margin-right:2px}
  tr.open .chev{transform:rotate(90deg);color:var(--accent)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .name{font-weight:640}.name small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:1px}
  .sev-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:680;white-space:nowrap}
  .sev-pill .sev-ic{width:13px;height:13px}
  .n0{color:var(--faint)}
  .minibar{height:8px;border-radius:4px;display:flex;gap:1.5px;overflow:hidden;min-width:74px}.minibar i{height:100%}
  .card-scroll{max-height:660px;overflow:auto}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  .hide{display:none!important}.view{display:none}.view.on{display:block}
  .fix-ok{color:var(--good);font-weight:640}

  tr.det>td{padding:0;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .det .box{padding:14px 18px 16px 40px}
  .det .why{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
  .det .why b{color:var(--ink);font-weight:640}
  .det .why code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--surface-3);padding:1px 5px;border-radius:5px;color:var(--ink)}
  .det .dh{font-size:10.5px;font-weight:720;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .flist{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
  .fli{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:8px 13px;font-size:12.5px;border-top:1px solid var(--line)}
  .fli:first-child{border-top:0}
  .fli .fp{font-family:ui-monospace,Menlo,monospace;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fli .fx{color:var(--muted);font-family:ui-monospace,Menlo,monospace;text-align:right;white-space:nowrap}
  .fli-v{padding:9px 13px;border-top:1px solid var(--line)} .fli-v:first-child{border-top:0}
  .fli-top{display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:center}
  .fli-top .fp{font-family:ui-monospace,Menlo,monospace;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fli-top .fx{color:var(--muted);font-family:ui-monospace,Menlo,monospace;text-align:right;white-space:nowrap}
  .ftitle{font-size:12px;color:var(--ink-2);margin:5px 0 0 130px;line-height:1.45}
  .taglist{display:flex;flex-direction:column;gap:8px}
  .tagblock{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
  .tagblock.open{border-color:var(--line-2);box-shadow:var(--sh-sm)}
  .tagitem{display:grid;grid-template-columns:15px minmax(120px,1.5fr) minmax(80px,1fr) 150px 92px 50px;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
  .tagitem:hover,.tagitem.open{background:var(--surface-2)}
  .tagitem .chev{color:var(--faint);transition:transform .15s;display:inline-flex}
  .tagitem.open .chev{transform:rotate(90deg);color:var(--accent)}
  .tgname{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tgos{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tgsev{font-size:12px;white-space:nowrap;text-align:right}
  .tgtot{font-variant-numeric:tabular-nums;font-weight:660;text-align:right;font-size:12.5px}
  .tagvulns{border-top:1px solid var(--line);padding:13px 14px;background:var(--surface-2)}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:12px;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:4px 9px;color:var(--ink-2);font-family:ui-monospace,Menlo,monospace}

  #tt{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);padding:8px 11px;border-radius:9px;font-size:12px;box-shadow:var(--sh-lg);opacity:0;transform:translateY(4px);transition:opacity .1s;max-width:260px}
  #tt.on{opacity:1;transform:none}#tt .v{font-weight:720;font-size:13px}#tt .k{color:var(--faint)}

  @media(max-width:1080px){.app{grid-template-columns:1fr}.sidebar{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.statstrip{grid-template-columns:repeat(2,1fr)}.grid-3-2{grid-template-columns:1fr}.search input{width:120px}}
  @media print{.sidebar,.topbar .tb-right,.filterbar,.chev{display:none!important}.app{grid-template-columns:1fr}body{background:#fff}.card,.tile,.posture{box-shadow:none;border:1px solid #ccc}.view{display:block!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="logo" id="brand-logo"></span>
      <div><b>Trivy · DIGIT</b><span id="brand-sub">Security scan console</span></div>
    </div>

<script>
const DATA=/*__DATA__*/{};
const DOMAIN=DATA.domain;
const IS_DOCKER=DOMAIN==="docker";
const SEVS=["CRITICAL","HIGH","MEDIUM","LOW","UNKNOWN"];
const SEVVAR={CRITICAL:"--crit",HIGH:"--high",MEDIUM:"--med",LOW:"--low",UNKNOWN:"--unknown"};
const LOGO='<svg viewBox="0 0 48 48" width="38" height="38" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><path d="M24 3.2C24 3.2 32.5 8 39.6 8.6 40.2 8.65 40.6 9.1 40.6 9.7V22c0 10.6-6.8 17.9-15.9 21.6-.45.2-.95.2-1.4 0C14.2 39.9 7.4 32.6 7.4 22V9.7c0-.6.4-1.05 1-1.1C15.5 8 24 3.2 24 3.2Z" fill="url(#gv)"/><path d="M24 6.4C24 6.4 31.6 10.6 37.9 11.2V22c0 9-5.9 15.5-13.9 18.9C16 37.5 10.1 31 10.1 22V11.2C16.4 10.6 24 6.4 24 6.4Z" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.1"/><circle cx="18.7" cy="16.2" r="2.35" fill="#F2A23C"/><rect x="23.5" y="13.85" width="8.7" height="4.8" rx="2.4" fill="#F2A23C"/><circle cx="18.5" cy="23.7" r="2.95" fill="#3B7DD8"/><circle cx="26" cy="23.7" r="2.95" fill="#3B7DD8"/><circle cx="22.25" cy="30.9" r="2.95" fill="#54AE5A"/></svg>';
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sevColor=s=>cssv(SEVVAR[s]||"--unknown");
const cap=s=>s?s[0]+s.slice(1).toLowerCase():s;
const fmt=n=>(n||0).toLocaleString();
// image repos come as docker.io/egovio/<service>; drop the registry/namespace so
// the service name is legible (the full ref stays searchable + in the tooltip)
const shortRepo=r=>String(r==null?"":r).replace(/^[^/]+\/[^/]+\//,"");
const _p2=n=>String(n).padStart(2,"0");
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtRun(v){if(!v)return "—";const d=new Date(v);if(isNaN(d))return v;let h=d.getHours(),ap=h<12?"AM":"PM";h=h%12||12;return `${MON[d.getMonth()]} ${_p2(d.getDate())}, ${d.getFullYear()}, ${h}:${_p2(d.getMinutes())} ${ap}`;}
function fmtLocal(v){if(!v)return "not run";const d=new Date(v);if(isNaN(d))return v;return `${d.getFullYear()}-${_p2(d.getMonth()+1)}-${_p2(d.getDate())} ${_p2(d.getHours())}:${_p2(d.getMinutes())}`;}
function fmtLocalDate(v){if(!v)return "";const d=new Date(v);if(isNaN(d))return String(v).slice(0,10);return `${d.getFullYear()}-${_p2(d.getMonth()+1)}-${_p2(d.getDate())}`;}
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;};
const escAttr=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const SEVICON={
  CRITICAL:'<svg class="sev-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2 2 20h20L12 2z"/><path d="M12 9v5"/><path d="M12 17.5v.01"/></svg>',
  HIGH:'<svg class="sev-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5"/><path d="M12 16v.01"/></svg>',
  MEDIUM:'<svg class="sev-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/></svg>',
  LOW:'<svg class="sev-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>',
  UNKNOWN:'<svg class="sev-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1.9-1.1 1.8"/><path d="M12 17v.01"/></svg>'};
const sevLab=s=>`<span style="color:${sevColor(s)}">${SEVICON[s]}</span> ${cap(s)}`;
const sevPill=s=>`<span class="sev-pill" style="color:${sevColor(s)}">${SEVICON[s]} ${cap(s)}</span>`;
const CHEVSVG='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const CHEV=`<span class="chev">${CHEVSVG}</span>`;
const SR=s=>SEVS.indexOf(s);

// DATA is a light bootstrap (meta + run list). MODEL is the currently displayed
// run's full model, fetched from data/runs/<id>.json on load / run switch.
let MODEL=null;
const RUNS=DATA.runs||[];
const runCache={};
let state={view:"overview",sev:new Set(SEVS),q:"",open:{},repo:null,tag:null,
           run:DATA.current, branch:(DATA.meta&&DATA.meta.branch)||"", menu:false, bq:""};

const assets=()=>IS_DOCKER?(MODEL.images||[]):(MODEL.charts||[]);
const findings=()=>IS_DOCKER?(MODEL.vulns||[]):(MODEL.rules||[]);
const REPO=()=>MODEL.meta&&MODEL.meta.repo||null;
function fileHref(path,line){const r=REPO();if(!r)return null;const p=r.helm_prefix?r.helm_prefix+"/"+path:path;return `${r.url}/blob/${r.ref}/${p}${line?"#L"+line:""}`;}
function fileCell(path,line){const disp=esc(path.split("/").slice(-2).join("/"))+(line?":"+line:"");const h=fileHref(path,line);return h?`<a href="${escAttr(h)}" target="_blank" rel="noopener">${disp}</a>`:disp;}
const activeSevs=()=>SEVS.filter(s=>state.sev.has(s));
const rowMatch=s=>!state.q||s.toLowerCase().includes(state.q);
const sevRowMatch=c=>activeSevs().some(s=>(c[s]||0)>0)||SEVS.every(s=>(c[s]||0)===0);
const scopedTotal=t=>activeSevs().reduce((a,s)=>a+(t[s]||0),0);

/* ---------------- head / chrome ---------------- */
function initChrome(){
  document.getElementById("brand-logo").innerHTML=LOGO;
  document.getElementById("brand-sub").textContent=IS_DOCKER?"Container images · Trivy":"Helm charts · Trivy";
  document.getElementById("title").firstChild.textContent=(IS_DOCKER?"Container images ":"Helm charts ");
  document.getElementById("tag").textContent=IS_DOCKER?"Docker":"Helm";
  document.title=(IS_DOCKER?"Docker · ":"Helm · ")+"Trivy · DIGIT";
  document.getElementById("lk-"+DOMAIN).classList.add("cur");
  const nav=[["overview","Overview",'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',""],
    ["assets",IS_DOCKER?"Container images":"Helm charts",IS_DOCKER?'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>':'<path d="M12 3 3 8l9 5 9-5-9-5zM3 16l9 5 9-5M3 12l9 5 9-5"/>',"a"],
    ["findings",IS_DOCKER?"Vulnerabilities":"Misconfigurations",IS_DOCKER?'<path d="M10.3 3.5 2.5 17a1.5 1.5 0 0 0 1.3 2.3h16.4a1.5 1.5 0 0 0 1.3-2.3L13.7 3.5a1.5 1.5 0 0 0-2.6 0z"/><path d="M12 9v4M12 17h.01"/>':'<path d="M4 4h16v4H4zM4 12h16v8H4z"/><path d="M8 6h.01M8 16h.01"/>',"f"]];
  document.getElementById("nav").innerHTML=nav.map(([v,l,ic])=>`<a data-v="${v}" class="${v==="overview"?"on":""}"><svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${l}<span class="badge" data-b="${v}"></span></a>`).join("");
  document.querySelectorAll("#nav a").forEach(a=>a.onclick=()=>{state.view=a.dataset.v;render();});
}
function initBadges(){
  document.querySelector('[data-b="assets"]').textContent=fmt(assets().length);
  document.querySelector('[data-b="findings"]').textContent=fmt(findings().length);
  const m=MODEL.meta;
  document.getElementById("sub").textContent=IS_DOCKER
    ? `${fmt(m.asset_count)} images · ${fmt(m.tag_count)} tags scanned · Trivy ${m.trivy_version||""}`
    : `${fmt(m.asset_count)} charts · branch ${esc(m.branch||"—")} · Trivy ${m.trivy_version||""}`;
  document.getElementById("sb-foot").innerHTML=IS_DOCKER
    ? `${fmt(m.asset_count)} images · ${fmt(m.tag_count)} tags<br>Trivy ${m.trivy_version||""}`
    : `${fmt(m.asset_count)} charts<br>branch ${esc(m.branch||"—")} · Trivy ${m.trivy_version||""}`;
}

/* ---------------- run / branch selector ---------------- */
function currentRun(){return RUNS.find(r=>r.id===state.run)||RUNS[0]||{scanned_at:MODEL.meta&&MODEL.meta.scanned_at,actor:"",branch:MODEL.meta&&MODEL.meta.branch};}
function branches(){const s=[];RUNS.forEach(r=>{if(r.branch&&!s.includes(r.branch))s.push(r.branch);});return s;}
function initSelector(){
  const r=currentRun();
  document.getElementById("rbtn-v").innerHTML=`${r.actor?esc(r.actor)+" · ":""}${fmtRun(r.scanned_at)}`;
  const menu=document.getElementById("rmenu");
  const brs=branches();
  let bhtml="";
  if(!IS_DOCKER && brs.length){
    const shown=brs.filter(b=>!state.bq||b.toLowerCase().includes(state.bq));
    bhtml=`<div class="msec">Branch</div>
      <div class="bsearch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="bq" placeholder="Search branch…" value="${escAttr(state.bq)}" autocomplete="off"></div>
      <div class="branchlist">${shown.map(b=>{const n=RUNS.filter(x=>x.branch===b).length;return `<div class="brow ${b===state.branch?"on":""}" data-branch="${escAttr(b)}"><svg class="gi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="8" r="3"/><path d="M18 11a6 6 0 0 1-6 6H6"/></svg>${esc(b)}<span class="bc">${n} run${n>1?"s":""}</span></div>`;}).join("")||`<div class="brow n0">No branch matches.</div>`}</div>`;
  }
  const rl=RUNS.filter(x=>IS_DOCKER||!state.branch||x.branch===state.branch);
  const runs=`<div class="msec">Recent runs (${rl.length})</div>
    <div class="runlist">${rl.map(x=>`<div class="rrow ${x.id===state.run?"on":""}" data-run="${escAttr(x.id)}">
      <div class="t"><b>${x.actor?esc(x.actor)+" · ":""}${fmtRun(x.scanned_at)}</b>${x.latest?'<span class="lt">LATEST</span>':""}</div>
      <div class="m">${x.branch?esc(x.branch):"scan"}<span class="dot"></span><span class="oc">${fmt(x.occ)} occ</span><span class="dot"></span>${fmt(x.assets)} ${IS_DOCKER?"repos":"charts"}<span class="dot"></span>score ${x.score}/10</div>
    </div>`).join("")||`<div class="rrow n0">No runs.</div>`}</div>`;
  menu.innerHTML=bhtml+runs;
  document.getElementById("rbtn").classList.toggle("open",state.menu);
  menu.classList.toggle("open",state.menu);
  if(state.menu){
    const bq=document.getElementById("bq");
    if(bq)bq.oninput=e=>{state.bq=e.target.value.toLowerCase();initSelector();document.getElementById("bq").focus();};
    menu.querySelectorAll(".brow[data-branch]").forEach(el=>el.onclick=()=>{state.branch=el.dataset.branch;const first=RUNS.find(x=>x.branch===state.branch);if(first)selectRun(first.id);else initSelector();});
    menu.querySelectorAll(".rrow[data-run]").forEach(el=>el.onclick=()=>selectRun(el.dataset.run));
  }
}
async function selectRun(id){
  state.menu=false;
  if(!runCache[id]){
    try{
      const res=await fetch(`data/runs/${id}.json`,{cache:"no-cache"});
      if(!res.ok)throw new Error(res.status);
      runCache[id]=await res.json();
    }catch(e){console.error(e);alert("Could not load that run.");return;}
  }
  MODEL=runCache[id]; state.run=id;
  if(MODEL.meta&&MODEL.meta.branch)state.branch=MODEL.meta.branch;
  state.repo=null;state.tag=null;state.open={};
  initBadges();render();
}

/* ---------------- filters ---------------- */
function initFilters(){
  document.getElementById("sevchips").innerHTML=SEVS.map(s=>`<button class="chip" data-s="${s}" aria-pressed="true"><span class="dot" style="background:${sevColor(s)}"></span>${cap(s)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const s=c.dataset.s;state.sev.has(s)?state.sev.delete(s):state.sev.add(s);render();});
}

/* ---------------- overview ---------------- */
function posture(){
  const o=MODEL.totals,ch=o.CRITICAL,hi=o.HIGH,score=MODEL.meta.score;
  const band=score<=3?"--crit":score<=6?"--med":"--good";const col=cssv(band);
  let verdict,desc;
  const noun=IS_DOCKER?"images":"charts";
  if(ch>0){verdict="Action required";desc=`${fmt(ch)} critical and ${fmt(hi)} high findings across ${noun} need triage. Report-only — nothing is blocked yet.`;}
  else if(hi>0){verdict="Needs attention";desc=`${fmt(hi)} high findings to review. No criticals outstanding.`;}
  else{verdict="Healthy";desc="No critical or high findings outstanding.";}
  const el=document.getElementById("posture");el.style.setProperty("--band",col);
  const R=54,C=2*Math.PI*R,off=C*(1-score/10);
  const r=currentRun();
  el.innerHTML=`
    <div class="gauge"><svg width="128" height="128" viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="11"/>
      <circle cx="64" cy="64" r="${R}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 64 64)"/></svg>
      <div class="lab"><div><b>${score}<sub>/10</sub></b></div></div></div>
    <div><p class="verdict">${verdict}</p><div class="pdesc">${desc}</div>
      <div class="pmeta">
        <span class="mp">scanned <b>${fmtLocal(MODEL.meta.scanned_at)}</b></span>
        ${r.actor?`<span class="mp">by <b>${esc(r.actor)}</b></span>`:""}
        ${MODEL.meta.branch?`<span class="mp">branch <b>${esc(MODEL.meta.branch)}</b></span>`:""}
        <span class="mp"><b>${fmt(MODEL.meta.asset_count)}</b> ${noun} scanned</span>
      </div></div>`;
}
function statStrip(){
  const o=MODEL.totals;
  const tiles=[
    {lab:sevLab("CRITICAL"),val:o.CRITICAL,vcls:"c",foot:IS_DOCKER?"vulnerabilities":"misconfigurations"},
    {lab:sevLab("HIGH"),val:o.HIGH,vcls:"h",foot:IS_DOCKER?"vulnerabilities":"misconfigurations"},
    {lab:"Secrets",val:o.secrets,foot:"hard-coded"},
    {lab:IS_DOCKER?"Images scanned":"Charts scanned",val:MODEL.meta.asset_count,foot:IS_DOCKER?`${fmt(MODEL.meta.tag_count)} tags`:"this run"}];
  document.getElementById("statstrip").innerHTML=tiles.map(t=>`<div class="tile"><div class="lab">${t.lab}</div><div class="val ${t.vcls||''}">${fmt(t.val)}</div><div class="foot">${t.foot}</div></div>`).join("");
}
function donut(){
  const o=MODEL.totals;
  const segs=activeSevs().filter(s=>o[s]>0).map(s=>({s,v:o[s]}));
  const tot=segs.reduce((a,x)=>a+x.v,0)||1;const R=70,SW=22,C=2*Math.PI*R;let acc=0;
  const rings=segs.map(x=>{const frac=x.v/tot,len=C*frac,off=-acc*C;acc+=frac;
    return `<circle cx="88" cy="88" r="${R}" fill="none" stroke="${sevColor(x.s)}" stroke-width="${SW}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${off}" transform="rotate(-90 88 88)" data-tip="${x.s}|${x.v}|${(frac*100).toFixed(1)}% of findings"></circle>`;}).join("");
  document.getElementById("donut").innerHTML=`<svg width="176" height="176" viewBox="0 0 176 176"><circle cx="88" cy="88" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="${SW}"/>${rings}</svg><div class="ctr"><div><b>${fmt(tot)}</b><span>findings</span></div></div>`;
  document.getElementById("donut-legend").innerHTML=segs.map(x=>`<div class="li"><span class="sw" style="background:${sevColor(x.s)}"></span><span class="ln">${cap(x.s)}</span><span class="lv">${fmt(x.v)}</span><span class="lp">${(x.v/tot*100).toFixed(0)}%</span></div>`).join("")||`<div class="li ln">No findings for this filter.</div>`;
  document.getElementById("donut-aux").textContent=IS_DOCKER?"container vulnerabilities":"chart misconfigurations";
  document.querySelectorAll("#donut circle[data-tip]").forEach(bindTip);
}
function byArea(){
  document.getElementById("top-h").textContent=IS_DOCKER?"Most affected images":"Most affected charts";
  const rows=assets().map(a=>({k:IS_DOCKER?a.repo:a.name,disp:IS_DOCKER?shortRepo(a.repo):a.name,v:a.counts,
      t:(state.sev.has("CRITICAL")?a.counts.CRITICAL:0)+(state.sev.has("HIGH")?a.counts.HIGH:0)}))
    .filter(r=>r.t>0).sort((a,b)=>b.t-a.t).slice(0,8);
  const max=Math.max(1,...rows.map(r=>r.t));
  document.getElementById("byarea").innerHTML=rows.map(r=>{
    const segs=["CRITICAL","HIGH"].filter(s=>state.sev.has(s)&&(r.v[s]||0)>0).map(s=>`<i style="width:${r.v[s]/max*100}%;background:${sevColor(s)}" data-tip="${s}|${r.v[s]}|${escAttr(r.disp)}"></i>`).join("");
    return `<div class="hbar"><div class="hl" title="${escAttr(r.k)}">${esc(r.disp)}</div><div class="tk">${segs}</div><div class="hv">${fmt(r.t)}</div></div>`;}).join("")||`<div class="empty">No critical or high findings.</div>`;
  document.querySelectorAll("#byarea i[data-tip]").forEach(bindTip);
}
function priorities(){
  const items=[];
  if(IS_DOCKER){
    const byPkg={};
    (MODEL.vulns||[]).filter(v=>v.fixed&&state.sev.has(v.severity)).forEach(v=>{
      const p=byPkg[v.pkg]||(byPkg[v.pkg]={pkg:v.pkg,cves:0,crit:0,imgs:new Set(),sev:"LOW",fix:""});
      p.cves++;if(v.severity==="CRITICAL")p.crit++;(v.images||[]).forEach(i=>p.imgs.add(i));
      if(SR(v.severity)<SR(p.sev))p.sev=v.severity;const f=(v.fixed||"").split(",")[0].trim();if(f&&f>p.fix)p.fix=f;});
    Object.values(byPkg).forEach(p=>items.push({sev:p.sev,title:`Upgrade ${p.pkg}`,sub:`${p.crit?p.crit+" critical, ":""}${p.cves} CVE${p.cves>1?"s":""} · ${p.imgs.size} image${p.imgs.size>1?"s":""}${p.fix?" · → "+p.fix:""}`,weight:(p.sev==="CRITICAL"?1e7:1e4)+p.crit*100+p.imgs.size}));
  }else{
    (MODEL.rules||[]).filter(r=>state.sev.has(r.severity)).forEach(r=>items.push({sev:r.severity,title:r.title||r.id,sub:`${r.id} · ${r.count} chart${r.count>1?"s":""}`,weight:(r.severity==="CRITICAL"?9e6:9e3)+r.count}));
  }
  const top=items.sort((a,b)=>b.weight-a.weight).slice(0,6);
  document.getElementById("prio").innerHTML=top.map((i,ix)=>`<div class="pr"><span class="ptag" style="background:${sevColor(i.sev)}">P${Math.min(ix,3)}</span><div><div class="pt">${esc(i.title)}</div><div class="ps">${esc(i.sub)}</div></div><div class="pn" style="color:${sevColor(i.sev)}">${sevLab(i.sev)}</div></div>`).join("")||`<div class="empty">Nothing outstanding for this filter.</div>`;
}

/* ---------------- KPIs ---------------- */
function kpis(){
  const t=MODEL.totals;
  const tiles=[
    {lab:'<svg class="sev-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Open Crit + High',val:t.CRITICAL+t.HIGH,foot:IS_DOCKER?"container images":"helm charts"},
    {lab:sevLab("CRITICAL"),val:t.CRITICAL,vcls:"c",foot:"findings"},
    {lab:sevLab("HIGH"),val:t.HIGH,vcls:"h",foot:"findings"},
    {lab:"Secrets",val:t.secrets,foot:"hard-coded"},
    {lab:"Total findings",val:t.total,foot:"all severities"}];
  document.getElementById("kpi-assets").innerHTML=tiles.map(x=>`<div class="tile"><div class="lab">${x.lab}</div><div class="val ${x.vcls||''}">${fmt(x.val)}</div><div class="foot">${x.foot}</div></div>`).join("");
}

/* ---------------- tables ---------------- */
function minibar(c){const t=SEVS.reduce((a,s)=>a+(c[s]||0),0)||1;return `<span class="minibar">${SEVS.filter(s=>c[s]>0).map(s=>`<i style="width:${c[s]/t*100}%;background:${sevColor(s)}"></i>`).join("")}</span>`;}
function numCell(n,s){return n>0?`<td class="num" style="color:${sevColor(s)};font-weight:640">${fmt(n)}</td>`:`<td class="num n0">0</td>`;}
const SORT={};
function sortRows(rows,key){const st=SORT[key];if(!st||!st.col)return rows;const c=st.col,d=st.dir;
  const g=r=>c==="bar"?(r.total||0):(c in r?r[c]:(r.counts&&c in r.counts?r.counts[c]:0));
  return rows.sort((a,b)=>{let x=g(a),y=g(b);if(typeof x==="string"||typeof y==="string"){x=(x||"").toString().toLowerCase();y=(y||"").toString().toLowerCase();return x<y?-d:x>y?d:0;}return (x-y)*d;});}
function headHtml(cols,key){const st=SORT[key]||{};return `<thead><tr>${cols.map(c=>{const on=st.col===c[0];return `<th class="${c[2]?'num':''}" data-col="${c[0]}" ${on?`aria-sort="${st.dir>0?'ascending':'descending'}"`:''}>${c[1]}<span class="ar">${on?(st.dir>0?'▲':'▼'):'↕'}</span></th>`;}).join("")}</tr></thead>`;}
function wireSort(t,key,strcols){t.querySelectorAll("th[data-col]").forEach(th=>th.onclick=()=>{const col=th.dataset.col,cur=SORT[key]||{};SORT[key]=cur.col===col?{col,dir:-cur.dir}:{col,dir:(strcols.includes(col)?1:-1)};render();});}

function tImages(){
  const cols=[["repo","Image · repo",0],["tag_count","Tags",1],["CRITICAL","Crit",1],["HIGH","High",1],["total","Total",1],["secrets","Secrets",1],["bar","Latest severity",0]];
  let rows=(MODEL.images||[]).filter(r=>rowMatch(r.repo+" "+r.os+" "+r.tags.map(t=>t.tag).join(" "))&&sevRowMatch(r.counts));
  rows=sortRows(rows,"images");
  const body=rows.map(r=>{
    const isOpen=state.repo===r.repo;
    let h=`<tr class="drow ${isOpen?'open':''}" data-repo="${escAttr(r.repo)}"><td class="name" title="${escAttr(r.repo)}">${CHEV}${esc(shortRepo(r.repo))}<small>latest ${esc(r.latest_tag)}${r.os?" · "+esc(r.os):""}</small></td>
      <td class="num">${r.tag_count}</td>${numCell(r.counts.CRITICAL,"CRITICAL")}${numCell(r.counts.HIGH,"HIGH")}<td class="num"><b>${fmt(r.total)}</b></td>${r.secrets?`<td class="num" style="color:${sevColor('CRITICAL')};font-weight:640">${r.secrets}</td>`:`<td class="num n0">0</td>`}<td>${minibar(r.counts)}</td></tr>`;
    if(isOpen)h+=`<tr class="det"><td colspan="${cols.length}"><div class="box">${detailRepo(r)}</div></td></tr>`;
    return h;}).join("")||`<tr><td class="empty" colspan="${cols.length}">Nothing matches this filter.</td></tr>`;
  const t=document.getElementById("t-assets");t.innerHTML=headHtml(cols,"images")+`<tbody>${body}</tbody>`;
  wireSort(t,"images",["repo"]);
  t.querySelectorAll("tr.drow[data-repo]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("a")||e.target.closest(".tagitem"))return;const rp=tr.dataset.repo;state.repo=state.repo===rp?null:rp;state.tag=null;render();});
  t.querySelectorAll(".tagitem[data-tag]").forEach(el=>el.onclick=e=>{if(e.target.closest("a"))return;e.stopPropagation();const tg=el.dataset.tag;state.tag=state.tag===tg?null:tg;render();});
  document.getElementById("c-assets").textContent=rows.length+" of "+(MODEL.images||[]).length+" repos · "+fmt(MODEL.meta.tag_count)+" tags scanned";
}
function detailRepo(r){
  return `<p class="dh">${r.tag_count} scanned tag${r.tag_count>1?"s":""} — latest to oldest · click a tag for its vulnerabilities</p>
    <div class="taglist">${r.tags.map(t=>{const open=state.tag===t.tag;const dt=fmtLocalDate(t.scanned_at);
      return `<div class="tagblock ${open?'open':''}">
        <div class="tagitem ${open?'open':''}" data-tag="${escAttr(t.tag)}">
          <span class="chev">${CHEVSVG}</span>
          <span class="tgname">${esc(t.tag)}</span>
          <span class="tgos">${esc(t.os||'')}${dt?" · "+dt:""}</span>
          <span class="tgsev">${t.counts.CRITICAL?`<b style="color:${sevColor('CRITICAL')}">${fmt(t.counts.CRITICAL)} crit</b>`:''}${t.counts.HIGH?` <b style="color:${sevColor('HIGH')}">${fmt(t.counts.HIGH)} high</b>`:''}${!t.counts.CRITICAL&&!t.counts.HIGH?'<span class="n0">clean</span>':''}</span>
          <span class="tgmix">${minibar(t.counts)}</span>
          <span class="tgtot">${fmt(t.total)}</span>
        </div>
        ${open?`<div class="tagvulns">${detailTag(t)}</div>`:""}
      </div>`;}).join("")}</div>`;
}
function detailTag(t){
  const f=(t.findings||[]).filter(x=>state.sev.has(x.severity));
  if(!f.length)return `<p class="dh">No findings for this filter.</p>`;
  const hasOS=f.some(x=>x.cls==="os-pkgs"),hasLib=f.some(x=>x.cls==="lang-pkgs");
  const fixbits=[];
  if(hasOS)fixbits.push("<b>OS packages</b>: rebuild the image on an updated base — <code>apt-get upgrade</code> / <code>apk upgrade</code> pulls the fixed version");
  if(hasLib)fixbits.push("<b>App libraries</b>: bump the dependency to the fixed version in the service build (pom.xml / package.json), then rebuild &amp; re-push");
  const fixnote=fixbits.length?`<div class="why"><b>How to fix:</b> ${fixbits.join(". ")}.</div>`:"";
  return `${fixnote}<p class="dh">What's wrong ${t.total>f.length?`(showing ${f.length} of ${fmt(t.total)})`:""}</p>
    <div class="flist">${f.map(x=>`<div class="fli-v"><div class="fli-top">${sevPill(x.severity)}
      <span class="fp">${x.url?`<a href="${escAttr(x.url)}" target="_blank" rel="noopener">${esc(x.id)}</a>`:esc(x.id)} &middot; ${esc(x.pkg)}</span>
      <span class="fx">${esc(x.installed)}${x.fixed?` → <span class="fix-ok">${esc(x.fixed.split(",")[0].trim())}</span>`:' · no fix'}</span></div>
      ${x.title?`<div class="ftitle">${esc(x.title)}</div>`:""}</div>`).join("")}</div>`;
}
function tCharts(){
  const cols=[["name","Chart",0],["CRITICAL","Crit",1],["HIGH","High",1],["total","Total",1],["top_rule","Top rule",0],["bar","Severity mix",0]];
  let rows=(MODEL.charts||[]).filter(r=>rowMatch(r.name)&&sevRowMatch(r.counts));
  rows=sortRows(rows,"charts");
  const body=rows.map(r=>{
    const isOpen=state.repo===r.name;
    let h=`<tr class="drow ${isOpen?'open':''}" data-chart="${escAttr(r.name)}"><td class="name">${CHEV}${esc(r.name)}</td>${numCell(r.counts.CRITICAL,"CRITICAL")}${numCell(r.counts.HIGH,"HIGH")}<td class="num"><b>${fmt(r.total)}</b></td><td class="mono">${esc(r.top_rule)}</td><td>${minibar(r.counts)}</td></tr>`;
    if(isOpen)h+=`<tr class="det"><td colspan="${cols.length}"><div class="box">${detailChart(r)}</div></td></tr>`;
    return h;}).join("")||`<tr><td class="empty" colspan="${cols.length}">Nothing matches this filter.</td></tr>`;
  const t=document.getElementById("t-assets");t.innerHTML=headHtml(cols,"charts")+`<tbody>${body}</tbody>`;
  wireSort(t,"charts",["name","top_rule"]);
  t.querySelectorAll("tr.drow[data-chart]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("a"))return;const c=tr.dataset.chart;state.repo=state.repo===c?null:c;render();});
  document.getElementById("c-assets").textContent=rows.length+" of "+(MODEL.charts||[]).length+" charts with findings";
}
function detailChart(r){
  const f=(r.findings||[]).filter(x=>state.sev.has(x.severity));
  if(!f.length)return `<p class="dh">No listed findings for this filter.</p>`;
  return `<p class="dh">Findings in ${esc(r.name)} ${r.total>f.length?`(showing ${f.length} of ${fmt(r.total)})`:""}</p>
    <div class="flist">${f.map(x=>`<div class="fli"><span>${sevPill(x.severity)}</span>
      <span class="fp">${esc(x.rule)} &middot; ${esc(x.title)}</span>
      <span class="fx">${fileCell(x.file,x.line)}</span></div>`).join("")}</div>`;
}
function tVulns(){
  const cols=[["id","CVE / ID",0],["severity","Severity",0],["pkg","Package",0],["installed","Installed",0],["fixed","Fixed in",0],["count","Images",1]];
  let rows=(MODEL.vulns||[]).filter(r=>rowMatch(r.id+" "+r.pkg+" "+r.title)&&state.sev.has(r.severity));
  rows=sortRows(rows,"vulns");
  const body=rows.map((r,ix)=>{const k="v:"+(r.id||ix);const isOpen=!!state.open[k];
    let h=`<tr class="drow ${isOpen?'open':''}" data-k="${escAttr(k)}"><td class="mono">${CHEV}${r.url?`<a href="${escAttr(r.url)}" target="_blank" rel="noopener">${esc(r.id)}</a>`:esc(r.id)}</td><td>${sevPill(r.severity)}</td><td class="mono">${esc(r.pkg)}</td><td class="mono">${esc(r.installed)}</td><td class="mono">${r.fixed?`<span class="fix-ok">${esc(r.fixed.split(",")[0].trim())}</span>`:'<span class="n0">—</span>'}</td><td class="num"><b>${fmt(r.count)}</b></td></tr>`;
    if(isOpen)h+=`<tr class="det"><td colspan="${cols.length}"><div class="box">${detailVuln(r)}</div></td></tr>`;
    return h;}).join("")||`<tr><td class="empty" colspan="${cols.length}">Nothing matches this filter.</td></tr>`;
  const t=document.getElementById("t-findings");t.innerHTML=headHtml(cols,"vulns")+`<tbody>${body}</tbody>`;
  wireSort(t,"vulns",["id","pkg","installed","fixed","severity"]);
  t.querySelectorAll("tr.drow[data-k]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("a"))return;const k=tr.dataset.k;state.open[k]=!state.open[k];render();});
  document.getElementById("c-findings").textContent="· "+rows.length+" shown";
}
function detailVuln(r){
  return `${r.title?`<div class="why"><b>What:</b> ${esc(r.title)}</div>`:""}
    <p class="dh">Affected images (${r.images.length})</p>
    <div class="tagrow">${r.images.map(i=>`<span class="tag">${esc(i)}</span>`).join("")}</div>
    ${r.fixed?`<p class="dh" style="margin-top:12px">Fix</p><div class="tagrow"><span class="tag">upgrade ${esc(r.pkg)} → ${esc(r.fixed.split(",")[0].trim())}</span></div>`:""}`;
}
function tRules(){
  const cols=[["id","ID",0],["severity","Severity",0],["title","Misconfiguration",0],["count","Charts",1]];
  let rows=(MODEL.rules||[]).filter(r=>rowMatch(r.id+" "+r.title)&&state.sev.has(r.severity));
  rows=sortRows(rows,"rules");
  const body=rows.map((r,ix)=>{const k="r:"+(r.id||ix);const isOpen=!!state.open[k];
    let h=`<tr class="drow ${isOpen?'open':''}" data-k="${escAttr(k)}"><td class="mono">${CHEV}${esc(r.id)}</td><td>${sevPill(r.severity)}</td><td>${esc(r.title)}</td><td class="num"><b>${fmt(r.count)}</b></td></tr>`;
    if(isOpen)h+=`<tr class="det"><td colspan="${cols.length}"><div class="box">${detailRule(r)}</div></td></tr>`;
    return h;}).join("")||`<tr><td class="empty" colspan="${cols.length}">Nothing matches this filter.</td></tr>`;
  const t=document.getElementById("t-findings");t.innerHTML=headHtml(cols,"rules")+`<tbody>${body}</tbody>`;
  wireSort(t,"rules",["id","title","severity"]);
  t.querySelectorAll("tr.drow[data-k]").forEach(tr=>tr.onclick=e=>{if(e.target.closest("a"))return;const k=tr.dataset.k;state.open[k]=!state.open[k];render();});
  document.getElementById("c-findings").textContent="· "+rows.length+" shown";
}
function detailRule(r){
  const locs=(r.locations||[]);
  return `${r.resolution?`<div class="why"><b>Why / how to fix:</b> ${esc(r.resolution)}</div>`:""}
    <p class="dh">Where — affected charts (${r.charts.length})</p>
    <div class="tagrow">${r.charts.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</div>
    ${locs.length?`<p class="dh" style="margin-top:12px">Example locations</p><div class="flist">${locs.slice(0,20).map(l=>`<div class="fli"><span class="fp">${esc(l.chart)}</span><span></span><span class="fx">${fileCell(l.file,l.line)}</span></div>`).join("")}</div>`:""}`;
}

/* ---------------- tooltip ---------------- */
const tt=document.getElementById("tt");
function bindTip(el){el.addEventListener("pointermove",e=>{const[s,n,ctx]=el.dataset.tip.split("|");
  tt.innerHTML=`<div class="v" style="color:${sevColor(s)}">${cap(s)}</div><div><span class="v">${fmt(+n)}</span> <span class="k">findings</span></div><div class="k">${esc(ctx)}</div>`;
  tt.classList.add("on");const pad=14;let x=e.clientX+pad,y=e.clientY+pad;if(x+tt.offsetWidth>innerWidth)x=e.clientX-tt.offsetWidth-pad;tt.style.left=x+"px";tt.style.top=y+"px";});
  el.addEventListener("pointerleave",()=>tt.classList.remove("on"));}

/* ---------------- render ---------------- */
function render(){
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",state.sev.has(c.dataset.s)));
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===state.view));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.getElementById("view-"+state.view).classList.add("on");
  document.getElementById("q").placeholder=state.view==="findings"?(IS_DOCKER?"Search CVE, package…":"Search rule, title…"):(IS_DOCKER?"Search image…":"Search chart…");
  const vh=document.getElementById("vhint");
  vh.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg> Report-only · nothing is blocked`;
  initSelector();
  if(state.view==="overview"){posture();statStrip();donut();byArea();priorities();}
  else if(state.view==="assets"){document.getElementById("assets-h").textContent=IS_DOCKER?"Container images":"Helm charts";kpis();IS_DOCKER?tImages():tCharts();}
  else if(state.view==="findings"){
    document.getElementById("findings-h").textContent=IS_DOCKER?"Vulnerabilities":"Misconfigurations";
    document.getElementById("findings-sub").textContent=IS_DOCKER?"click a row for affected images + fix":"click a row for the why + affected charts";
    IS_DOCKER?tVulns():tRules();}
}

/* ---------------- boot ---------------- */
(function(){
  const p=new URLSearchParams(location.search);
  if(p.get("theme")==="dark")document.documentElement.dataset.theme="dark";
  if(["overview","assets","findings"].includes(p.get("view")))state.view=p.get("view");
  initChrome();initFilters();initSelector();
  document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();if(MODEL)render();});
  document.getElementById("theme").onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==="dark"?"light":"dark";if(MODEL)render();};
  document.getElementById("print").onclick=()=>window.print();
  const rbtn=document.getElementById("rbtn");
  rbtn.onclick=e=>{e.stopPropagation();state.menu=!state.menu;initSelector();};
  document.getElementById("rmenu").onclick=e=>e.stopPropagation();
  document.addEventListener("click",()=>{if(state.menu){state.menu=false;initSelector();}});
  document.getElementById("posture").innerHTML='<div class="pdesc" style="padding:8px">Loading latest run…</div>';
  selectRun(DATA.current);   // fetch + first render
})();
</script>
