# Per-environment settings (non-secret). One folder per team/product environment:
#   deploy-as-code/environments/<env>/
# The folder name <env> is the single source for the environment name: it is used as the
# AKS cluster name, the Terraform state container prefix and the GitHub Environment name.
# Every value is defined once here; the workflow derives everything else from it,
# from secrets.yaml (DB credentials) or from Terraform outputs (DB host, filestore).

# Public host DIGIT is served on. After install, point its DNS A record at the
# ingress LoadBalancer IP printed in the workflow summary.
domain: "<domain>"

# Where the packaged DIGIT Helm charts are published (classic Helm repo URL or oci://...).
charts:
  repository: "<chart_repository>"

# Azure infrastructure. Subscription comes from the GitHub Environment secret
# ARM_SUBSCRIPTION_ID; DB admin user/password come from secrets.yaml.
infra:
  # 3-40 chars, lowercase letters/numbers/hyphens, starts with a letter.
  resource_group: "<resource_group>"
  # Azure region, e.g. "centralindia"
  location: "<location>"
  # Storage Account for Terraform state - 3-24 lowercase letters/numbers, globally unique.
  storage_account_name: "<state_storage_account>"
  # Storage Account for egov-filestore blobs - same rules, globally unique.
  filestore_storage_account_name: "<filestore_storage_account>"

# Optional Terraform variable overrides (scalars only), passed as TF_VAR_<name>.
# See infra-as-code/terraform/azure/variables.tf for the full list and defaults.
terraform: {}
#  node_count: 3
#  main_vm_size: "Standard_D4s_v3"
#  scheduling: false

# Helm value overrides for this environment (replicas, enabled services, image tags...).
# Layered on top of the shared DIGIT defaults by the helmfile - only put what differs here.
# Never put secrets here; they belong in secrets.yaml.
values: {}
#  egov-user:
#    replicas: 2
