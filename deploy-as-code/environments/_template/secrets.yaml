# Per-environment DIGIT secrets - TEMPLATE (plaintext placeholders only).
# Do not edit or encrypt this file. Create an environment with:
#   deploy-as-code/environments/new-environment.sh <env> <age-public-key>
# which copies it, generates fresh random values for every <placeholder>
# (no two environments share a key/password), and SOPS-encrypts the result.
# External integrations left as "demo"/"not-configured" are disabled until you
# set real provider credentials with:  sops deploy-as-code/environments/<env>/secrets.yaml
cluster-configs:
    secrets:
        # update the postgres db credentials
        db:
            username: <db_user>
            password: <db_password>
        # To work sms notification service add the sms provider details
        egov-notification-sms:
            username: demo
            password: demo
        # To work Location service add your gmap key
        egov-location:
            gmapskey: AIzaSyAQOd09-sdfegv
        # To work pg service add your respective bank details
        egov-pg-service:
            axis-merchant-id: demo
            axis-merchant-secret-key: demo
            axis-merchant-user: demo
            axis-merchant-pwd: demo
            axis-merchant-access-code: demo
            payu-merchant-key: demo
            payu-merchant-salt: demo
        # To work pgadmin service add details
        pgadmin:
            admin-email: demo@demo.com
            admin-password: <pgadmin_password>
            read-email: demo@demo.com
            read-password: <pgadmin_read_password>
        # To work egov-enc service add the details
        egov-enc-service:
            master-password: <enc_master_password>
            master-salt: <enc_master_salt>
            master-initialvector: <enc_master_iv>
        # To work mail notification service add respective mail details
        egov-notification-mail:
            mailsenderusername: demo@demo
            mailsenderpassword: demo
        # To clone the config and mdms repos, Create github user and add your ssh private key below. This private should have access to config and mdms repo.  
        git-sync:
            # private half of a fresh ed25519 deploy key; add the printed public key to your MDMS repo
            ssh: <git_sync_ssh_private_key>
            known-hosts: github.com ssh-rsa 
        # Add Kibana details
        kibana:
            namespace: es-cluster
            credentials: demo
        # Add finance service details
        egov-si-microservice:
            si-microservice-user: demo
            si-microservice-password: demo
            mail-sender-password: demo
        # Add edcr service details
        egov-edcr-notification:
            edcr-mail-username: demo@demo.com
            edcr-mail-password: demo
            edcr-sms-username: demo
            edcr-sms-password: demo
        # Add chatbot details
        chatbot:
            valuefirst-username: demo
            valuefirst-password: demo
        # Add user chatbot details
        egov-user-chatbot:
            citizen-login-password-otp-fixed-value: "<citizen_fixed_otp>"
        # To work oauth2-proxy service, create and add your github OAuth Apps details
        oauth2-proxy:
            clientID: not-configured
            clientSecret: not-configured
            cookieSecret: <oauth2_cookie_secret>
        elasticsearch-master-creds:
            password: <elasticsearch_password>
        kafka-kraft:
            kraft-cluster-id: <kafka_kraft_cluster_id>
        minio:
            username: admin
            password: <minio_password>
        alertmanager:
            config:
                global:
                    slack_api_url: <slack_api_url>
                    resolve_timeout: 5m
                route:
                    group_by:
                        - alertname
                    receiver: default
                    group_wait: 30s
                    group_interval: 5m
                    repeat_interval: 10m
                    routes:
                        - receiver: slack-notification
                          match:
                            severity: warning|critical
                          continue: true
                receivers:
                    - name: slack-notification
                      slack_configs:
                        - channel: '<slack_channel>'
                          send_resolved: true
                          username: Alertmanager
                          title: |
                            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
                          text: |
                            {{ range .Alerts -}}
                            {{- "\n" -}}
                            *Alert:* {{ .Annotations.summary }}
                            {{ if .Labels.severity }}*Severity:* `{{ .Labels.severity }}`{{ end }}
                            *Cluster:* {{ .Labels.cluster }}
                            *Details:*
                            {{ .Annotations.description }}
                            {{ end }}
