# creation rules are evaluated sequentially, the first match wins
creation_rules:
        # digit-lts secrets: Azure Key Vault digit-lts-sops-kv (argocd-sops-digit-lts WI), not AWS KMS.
        - path_regex: environments/digit\-lts\-secrets\.yaml$
          azure_keyvault: 'https://digit-lts-sops-kv.vault.azure.net/keys/sops/e1ec5546d7db4e0584bf6862ec6a498e'
        - path_regex: environments/test\-lts\-secrets\.yaml$
          azure_keyvault: 'https://digit-lts-sops-kv.vault.azure.net/keys/sops/e1ec5546d7db4e0584bf6862ec6a498e'
        - path_regex: environments/digit\-studio\-lts\-secrets\.yaml$
          azure_keyvault: 'https://digit-lts-sops-kv.vault.azure.net/keys/sops/e1ec5546d7db4e0584bf6862ec6a498e'
        - path_regex: environments/crest\-lts\-secrets\.yaml$
          azure_keyvault: 'https://digit-lts-sops-kv.vault.azure.net/keys/sops/e1ec5546d7db4e0584bf6862ec6a498e'
