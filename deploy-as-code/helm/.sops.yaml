# creation rules are evaluated sequentially, the first match wins
creation_rules:
        # upon creation of a file that matches the pattern *dev.yaml,
        # KMS set A is used
        # eGOV Internal ------------------------------------------------------------------------------------------------------------- #
        - path_regex: environments/digit\-lts\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'
        - path_regex: environments/test\-lts\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'
        # uat-saas is Azure-hosted, so it uses Azure Key Vault instead of AWS KMS --
        # decrypted by argocd-repo-server via Azure AD Workload Identity (managed
        # identity "argocd-repo-server-sops", federated to
        # system:serviceaccount:argocd:argocd-repo-server), not the AWS OIDC hack
        # digit-lts/test-lts need.
        - path_regex: environments/uat\-saas\-secrets\.yaml$
          azure_keyvault: 'https://uat-saas-sops-kv.vault.azure.net/keys/sops-key/0f444c0aaa304d9fa316507904b53001'
