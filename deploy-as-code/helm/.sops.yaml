# creation rules are evaluated sequentially, the first match wins
creation_rules:
        # upon creation of a file that matches the pattern *dev.yaml,
        # KMS set A is used
        # eGOV Internal ------------------------------------------------------------------------------------------------------------- #
        # DIGIT 3.0 module secrets (environments/unified-digit3-<module>-<env>-secrets.yaml) --
        # the unified-dev Azure Key Vault, decrypted by argocd-repo-server via workload
        # identity argocd-sops-unified-dev (Key Vault Crypto User). Must stay ABOVE the
        # environments/unified.* rule below, which would otherwise match first (AWS KMS).
        - path_regex: environments/unified\-digit3\-[^/]+\-dev\-secrets\.yaml$
          azure_keyvault: 'https://unified-dev-sops-kv.vault.azure.net/keys/sops/a4fa05d717aa4583a8a1f2f568dc73e0'

        - path_regex: environments/unified.*\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'

        - path_regex: environments/unified\-dev\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'

        - path_regex: environments/unified\-works\-dev\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'
          pgp: 'B9FF61E01273EDF7DE298B52F4D6BD77E5C66196'

        - path_regex: environments/unified\-ifix\-dev\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'
          pgp: 'B9FF61E01273EDF7DE298B52F4D6BD77E5C66196'          

        - path_regex: environments/unified\-health\-dev\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'         

        - path_regex: environments/unified\-urban\-dev\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'
          pgp: 'B9FF61E01273EDF7DE298B52F4D6BD77E5C66196'   

        - path_regex: environments/unified\-studio\-dev\-secrets\.yaml$
          kms: 'arn:aws:kms:ap-south-1:218381940040:key/9a3b0835-7713-4925-8b3d-da7e421d28d2'          
