apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  # Exported from the live cluster. This AppProject was never committed on the
  # digit-lts branch -- the same gap that made the ApplicationSet deletion
  # unrecoverable. If this project is deleted, every backbone-* Application
  # immediately fails with "application destination is not permitted in
  # project", even though the workloads themselves are untouched.
  #
  # NOTE this deliberately matches the LIVE digit-lts project, which is narrower
  # than the unified-env-lts variant of this file: that one also permits the
  # playground, clickhouse, airflow and security namespaces and carries a
  # clusterResourceWhitelist. Those namespaces do not exist in this cluster, so
  # they are not listed here. Add a destination BEFORE adding an element to
  # backbone-app-set-backbone.yaml that targets a new namespace, or the
  # generated Application is rejected.
  name: backbone-project
  namespace: argocd
spec:
  description: Backbone services for the Azure AKS digit-lts environment

  sourceRepos:
    # Both forms are permitted because appsets in this repo have historically
    # shipped either. Whatever an ApplicationSet template puts in source.repoURL
    # must appear here verbatim -- Argo matches the string, so the https and
    # git@ forms of the same repo are two different entries.
    - https://github.com/egovernments/DIGIT-DevOps.git
    - git@github.com:egovernments/DIGIT-DevOps.git
    # PostgreSQL 18: the operator from upstream, the Cluster chart from the registry.
    - https://cloudnative-pg.github.io/charts
    - https://helm.digit.org/digit3/backbone

  destinations:
    - namespace: backbone
      server: https://kubernetes.default.svc
    # The CloudNativePG operator installs here.
    - namespace: cnpg-system
      server: https://kubernetes.default.svc
    # The postgresql chart renders a Role + RoleBinding into the APP namespace so
    # its reconciler can read that namespace's egov-config and db Secret. Add a
    # destination here for every app namespace the reconciler is pointed at.
    - namespace: crest
      server: https://kubernetes.default.svc

  ## Added for the CloudNativePG operator, which is cluster-scoped: it owns the
  ## postgresql.cnpg.io CRDs, the RBAC its controller runs under, and the webhooks
  ## that validate Cluster resources. With no clusterResourceWhitelist an AppProject
  ## permits NONE of them and the sync fails with "one or more synchronization tasks
  ## are not valid". The Cluster objects themselves are namespaced and need nothing here.
  clusterResourceWhitelist:
    ## Required by backbone-cnpg-operator's CreateNamespace=true. Argo validates the
    ## namespace it creates against this list like any other resource, so without it
    ## the sync fails with "resource :Namespace is not permitted in project" and the
    ## operator never installs. cluster-configs-project declares it the same way.
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
