apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-backbone-appset-backbone
  namespace: argocd
spec:
  generators:
    - list:
        # Each element carries its own namespace because the template uses
        # {{namespace}} -- backbone services are not all in the backbone ns in
        # every environment. Every namespace listed here must also appear in
        # backbone-project's destinations, or the Application is rejected with
        # "application destination is not permitted in project".
        #
        # kafka is deliberately ABSENT. This cluster already runs a Kafka from
        # an older manual Helm install whose StatefulSet is
        # release-name-kafka-controller (48d, healthy). Adding a kafka-kraft
        # element here renders a SECOND, differently-named StatefulSet
        # (backbone-kafka-kraft-controller) with its own fresh PVCs, so the
        # cluster ends up with two Kafka clusters and services pointing at the
        # wrong one. Adopting the existing release would need its Deployment/
        # StatefulSet recreated, since spec.selector is immutable.
        #
        # releaseName is stated for every element because Argo CD otherwise
        # defaults the Helm release name to the Application name
        # (backbone-{{name}}). For charts whose StatefulSet selector contains
        # {{ .Release.Name }} that default is not cosmetic: spec.selector is
        # IMMUTABLE, so a release name that differs from the one the live
        # object was created with makes every sync fail with
        #   StatefulSet.apps "<n>" is invalid: spec: Forbidden: updates to
        #   statefulset spec for fields other than 'replicas', ... are forbidden
        # and, because the whole Application then fails to apply, it silently
        # blocks unrelated changes such as an image bump.
        #
        # The values below are the release names the LIVE objects already carry.
        # Do not "tidy" minio's to match the others - see its note.
        elements:
          # Selector is {app: elasticsearch-master} only, no release label, so
          # the name here is just the existing default made explicit.
          - name: elasticsearch-master
            namespace: backbone
            releaseName: backbone-elasticsearch-master
          - name: elasticsearch-data
            namespace: backbone
            releaseName: backbone-elasticsearch-data
          - name: kibana
            namespace: backbone
            releaseName: backbone-kibana
          # ADOPTED from an older manual Helm install whose release was literally
          # called "release-name", which is baked into the live StatefulSet's
          # immutable selector: {app: minio, release: release-name}. Anything
          # else here cannot be applied without recreating the StatefulSet.
          # Safe to set: the three Services select on {app: minio} alone, so
          # routing does not depend on the release label.
          - name: minio
            namespace: backbone
            releaseName: release-name
          - name: redis
            namespace: backbone
            releaseName: backbone-redis

  template:
    metadata:
      name: 'backbone-{{name}}'

    spec:
      project: backbone-project

      source:
        # HTTPS, not git@ SSH: backbone-project's sourceRepos must list whatever
        # is used here. The sibling egov backbone appset shipped the SSH form and
        # every app it generated failed with "InvalidSpecError: application repo
        # ... is not permitted in project 'egov-project'".
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: digit-lts
        path: deploy-as-code/helm/charts/backbone-services/{{name}}
        helm:
          # See the note on the elements list above: this must match the release
          # name the live objects were created with, not the Application name.
          releaseName: '{{releaseName}}'
          valueFiles:
            - values.yaml
            - ../../../environments/digit-lts.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'

      syncPolicy:
        automated:
          # prune:false so a rendering mistake cannot delete backbone state.
          # Note this does NOT protect against deleting the ApplicationSet or an
          # Application: the Applications carry
          # resources-finalizer.argocd.argoproj.io, so removing an element (or
          # the appset) cascade-deletes that Application's workloads. That is
          # how the elasticsearch StatefulSets were lost; only the PVCs survived,
          # via the StatefulSets' own Retain retention policy.
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        # replicas is owned by the HPA / by manual scaling, not by git.
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/replicas
