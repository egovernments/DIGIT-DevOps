apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-dev-backbone-appset-backbone
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: ingress-nginx
          - name: redis
          - name: elasticsearch-master
          - name: elasticsearch-data
          - name: kafka-kraft
          - name: cert-manager
          - name: kibana
          - name: oauth2-proxy
  template:
    metadata:
      name: 'backbone-{{name}}'

    spec:
      project: backbone-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: unified-env-lts
        path: deploy-as-code/helm/charts/backbone-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/unified-dev.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'backbone'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
