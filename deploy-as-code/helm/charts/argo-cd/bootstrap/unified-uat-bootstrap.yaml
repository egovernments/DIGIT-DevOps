## Root "app-of-apps" for unified-uat.
##
## Purpose: stop hand-applying the AppProjects and ApplicationSets under
## charts/argo-cd/unified-uat/. This Application syncs that whole directory, so a
## push to unified-uat is enough -- no kubectl apply step, and no more
## cases where the repo and the cluster silently disagree because someone
## pushed an appset change but never applied it.
##
## BOOTSTRAP (once per cluster, the only manual step that remains):
##   kubectl apply -f unified-uat-bootstrap.yaml
##
## Adoption: the existing objects were applied by hand and carry no
## argocd tracking-id. ServerSideApply lets Argo adopt them in place -- they
## are not recreated. Expect a brief OutOfSync on first sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unified-uat-bootstrap
  namespace: argocd
spec:
  ## 'default' on purpose. It is permissive (destinations '*',
  ## clusterResourceWhitelist '*') and, critically, is NOT one of the projects
  ## this Application manages -- so the root can never prune the project it
  ## itself runs under.
  project: default

  source:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
    targetRevision: unified-uat
    path: deploy-as-code/helm/charts/argo-cd/unified-uat
    directory:
      ## recurse picks up every subdirectory: backbone, cluster-configs, egov,
      ## health, monitoring, studio, urban (and anything added later).
      recurse: true
      include: '*.yaml'

  destination:
    server: https://kubernetes.default.svc
    ## AppProject and ApplicationSet are namespaced resources living in argocd.
    namespace: argocd

  syncPolicy:
    automated:
      ## prune: false to start. Removing a file from git will NOT delete the
      ## object from the cluster yet -- deliberately conservative while the
      ## existing hand-applied objects are being adopted.
      ##
      ## Flip to true once adoption looks right; that is what gives real
      ## GitOps semantics (delete the file -> the appset goes away), and it
      ## would have cleaned up cases like the egov-mdms-service element that
      ## was removed from the appset but lingered as an Application.
      prune: false
      selfHeal: true
    syncOptions:
      ## Required to adopt the pre-existing objects without recreating them.
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
