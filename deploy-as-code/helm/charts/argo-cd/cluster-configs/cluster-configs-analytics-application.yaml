## Analytics namespaces and Secrets on digit-lts: namespaces superset, clickhouse and
## clickhouse-operator, Secrets superset-secret (superset) and clickhouse-users
## (clickhouse) -- and nothing else.
##
## Its own Application, never layered onto digit-lts-cluster-configs (like crest):
## analytics-lts.yaml turns off what this chart renders for the whole cluster. The
## Secrets come from cluster-configs.secrets.generic in analytics-lts-secrets.yaml
## (SOPS, Azure Key Vault digit-lts-sops-kv, decrypted by argocd-repo-server).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digit-lts-cluster-configs-analytics
  namespace: argocd
spec:
  project: cluster-configs-project
  sources:
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: digit-lts
      path: "deploy-as-code/helm/charts/cluster-configs"
      helm:
        valueFiles:
          - values.yaml
          - ../../environments/analytics-lts.yaml
          - secrets://../../environments/analytics-lts-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
