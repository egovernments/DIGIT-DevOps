## Deploys the cluster-configs Helm chart onto the digit-lts cluster.
## The secrets:// valueFile needs argocd-repo-server SOPS/AWS KMS decryption,
## wired in deploy-as-code/helm/charts/backbone-services/argo-cd/values-azure-aks.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digit-lts-cluster-configs
  namespace: argocd
spec:
  project: cluster-configs-project
  sources:
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: digit-lts
      path: "deploy-as-code/helm/charts/cluster-configs"
      helm:
        valueFiles:
          - values.yaml
          - ../../environments/test-lts.yaml
          - secrets://../../environments/test-lts-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
