apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-configs
  namespace: argocd
spec:
  project: cluster-configs-project
  sources:
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: studio-demo
      path: "deploy-as-code/helm/charts/cluster-configs"
      helm:
        valueFiles:
          - values.yaml
          - ../../environments/studio-demo.yaml
          # helm-secrets CMP; repo-server sops-decrypts via Azure Key Vault (see README)
          - secrets://../../environments/studio-demo-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    # prune off for first adopt; flip to true after a clean diff (see README)
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 100
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
