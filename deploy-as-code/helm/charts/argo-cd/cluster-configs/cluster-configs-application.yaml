## Deploys the cluster-configs Helm chart onto the k3s-deployment single-node
## k3s cluster.
##
## The third valueFiles entry uses the secrets:// scheme, which requires
## argocd-repo-server to decrypt via SOPS with an age key -- that wiring lives
## in deploy-as-code/helm/charts/backbone-services/argo-cd/argo-cd-values.yaml
## (k3s has no cloud workload identity, so neither the AWS KMS wiring
## digit-lts/test-lts use nor uat-saas's Azure Key Vault wiring applies).
##
## valueFiles paths resolve relative to spec.sources[].path, i.e.
##   ../../environments/k3s-deployment.yaml
##     -> deploy-as-code/helm/environments/k3s-deployment.yaml          (plain values)
##   secrets://../../environments/k3s-deployment-secrets.yaml
##     -> deploy-as-code/helm/environments/k3s-deployment-secrets.yaml  (SOPS-encrypted)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-deployment-cluster-configs
  namespace: argocd
spec:
  project: cluster-configs-project
  sources:
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: k3s-deployment
      path: "deploy-as-code/helm/charts/cluster-configs"
      helm:
        valueFiles:
          - values.yaml
          - ../../environments/k3s-deployment.yaml
          - secrets://../../environments/k3s-deployment-secrets.yaml
  destination:
    server: https://kubernetes.default.svc
