## CREST services (namespace crest), one Application crest-<name> each. Their
## ConfigMaps and Secrets come from Application digit-lts-cluster-configs-crest.
##
## The charts come from the registry, not this repo, so each Application is
## multi-source:
##   - a chart from https://helm.digit.org/digit3/crest, pinned by targetRevision
##   - this repo, carrying ref "values", supplies shared and per-service values.
## Each service selects dev-mode image tags in crest-lts-<name>.yaml, so an image
## release only needs a values change. Pin the backend and its db-migration image
## separately; in dev mode the common chart's migration default is "latest".
## Update the chart version here when the chart templates themselves change.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-crest-appset-crest
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: crest
            version: "3.0.1"
          - name: crest-ui
            version: "3.0.0"

  template:
    metadata:
      name: 'crest-{{name}}'

    spec:
      project: crest-project

      sources:
        - repoURL: https://helm.digit.org/digit3/crest
          chart: '{{name}}'
          targetRevision: '{{version}}'
          helm:
            valueFiles:
              - $values/deploy-as-code/helm/environments/crest-lts.yaml
              - $values/deploy-as-code/helm/environments/crest-lts-{{name}}.yaml

        - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
          targetRevision: digit-lts
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: 'crest'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
