apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: egov-project
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git

  destinations:
    - namespace: 'egov'
      server: https://kubernetes.default.svc
    # keycloak runs in its own namespace (charts/core-services/keycloak sets
    # namespace: keycloak). An Application whose destination namespace is not
    # listed here is rejected outright with "application destination is not
    # permitted in project", so the platform appset needs this entry.
    - namespace: 'keycloak'
      server: https://kubernetes.default.svc
