apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-egov-appset-backbone
  namespace: argocd
spec:
  # Without this, removing an element below (or deleting this ApplicationSet)
  # deletes the generated Application, and because each Application carries
  # resources-finalizer.argocd.argoproj.io that cascade-deletes everything it
  # manages. That is how the elasticsearch StatefulSets were lost earlier.
  # preserveResourcesOnDeletion leaves the live objects in place and only
  # removes the Application, i.e. Argo stops managing them.
  syncPolicy:
    preserveResourcesOnDeletion: true

  generators:
    - list:
        # cert-manager and ingress-nginx are deliberately NOT managed here.
        # Both were originally installed manually, so their Deployments carry
        # spec.selector app.kubernetes.io/instance=release-name while this chart
        # renders instance=egov-<name>. spec.selector is immutable, so Argo can
        # never reconcile them -- it only managed to update the Services, which
        # left the Service selectors pointing at labels no pod had, taking the
        # endpoints to 0. For ingress-nginx that means every ingress stops
        # routing and the UI goes down.
        #
        # They are left as unmanaged (orphaned) live resources. To bring either
        # back under Argo, its Deployment must be deleted and recreated so the
        # new selector can be applied -- schedule that deliberately, because for
        # ingress-nginx it is a brief full outage of all ingress traffic.
        elements:
          - name: oauth2-proxy
          - name: pgbouncer
          - name: postgres

  template:
    metadata:
      name: 'egov-{{name}}'

    spec:
      project: egov-project

      source:
        # HTTPS, not git@ SSH: egov-project's sourceRepos permits only the https URL,
        # so the SSH form makes every generated app fail with
        # "InvalidSpecError: application repo ... is not permitted in project".
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: digit-lts
        path: deploy-as-code/helm/charts/backbone-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/test-lts.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'egov'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
