apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: studio-demo-egov-appset-common
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: billing-service
          - name: collection-services
          - name: egov-apportion-service
          - name: egov-hrms

  template:
    metadata:
      name: '{{name}}'
    spec:
      project: egov-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: studio-demo
        path: deploy-as-code/helm/charts/common-services/{{name}}
        helm:
          parameters:
            - name: name
              value: '{{name}}'
          valueFiles:
            - values.yaml
            - ../../../environments/studio-demo.yaml
            - ../../../environments/studio-demo-images.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: egov

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
