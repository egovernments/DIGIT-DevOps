## egov core-services from published charts helm.digit.org/digit3/core (base names),
## one egov-<name> Application each; chart version pinned by <service>.chart-version in test-lts.yaml.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-egov-appset-core
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - name: account
                - name: apportion
                - name: billing
                - name: boundary
                - name: boundary-management
                - name: employee
                - name: employee-onboarding
                - name: filestore
                - name: idgen
                - name: individual
                - name: localization
                - name: localization-management
                - name: mdms-v2
                - name: notification
                - name: notify
                - name: otp
                - name: pg-service
                - name: registry
                - name: template-config
                - name: url-shortener
                - name: workflow
                - name: keycloak
                  namespace: keycloak
          - git:
              repoURL: https://github.com/egovernments/DIGIT-DevOps.git
              revision: digit-lts
              files:
                - path: deploy-as-code/helm/environments/test-lts.yaml
              requeueAfterSeconds: 60

  template:
    metadata:
      name: 'egov-{{ .name }}'

    spec:
      project: egov-project

      sources:
        - repoURL: https://helm.digit.org/digit3/core
          chart: '{{ .name }}'
          targetRevision: '{{ index . .name "chart-version" }}'
          helm:
            releaseName: '{{ .name }}'
            parameters:
              - name: global.namespace
                value: '{{ dig "namespace" "egov" . }}'
            valueFiles:
              - $values/deploy-as-code/helm/environments/test-lts.yaml
        - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
          targetRevision: digit-lts
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ dig "namespace" "egov" . }}'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
