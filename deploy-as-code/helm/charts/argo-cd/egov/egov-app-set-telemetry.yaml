## Product telemetry services (cleaner + forwarder) and the citizen chat agent
## (lpms-agent) on test-lts. All charts live under
## deploy-as-code/helm/charts/telemetry-services/. Same template as the other
## egov appsets.
##   digit-telemetry-*  only need Kafka (egov-config kafka-brokers) and existing secrets
##   lpms-agent         public ingress at /lpms-agent, keys from the cluster-configs secret "lpms-agent"
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-egov-appset-telemetry
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: digit-telemetry-cleaner
          - name: digit-telemetry-forwarder
          - name: lpms-agent

  template:
    metadata:
      name: 'egov-{{name}}'

    spec:
      project: egov-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: digit-lts
        path: deploy-as-code/helm/charts/telemetry-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/test-lts.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'egov'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
