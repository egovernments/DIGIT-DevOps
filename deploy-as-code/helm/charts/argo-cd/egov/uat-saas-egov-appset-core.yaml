apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: uat-saas-egov-appset-core
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: account
            path: account
          - name: accesscontrol
            path: accesscontrol
          - name: accesscontrol-java
            path: accesscontrol-java
          - name: apportion
            path: apportion
          - name: billing
            path: billing
          - name: boundary
            path: boundary
          - name: calculator
            path: calculator
          - name: employee
            path: employee
          - name: filestore
            path: filestore
          - name: idgen
            path: idgen
          - name: individual
            path: individual
          - name: license-admin
            path: license-admin
          - name: license-certificate
            path: license-certificate
          - name: license-citizen
            path: license-citizen
          - name: license-employee
            path: license-employee
          - name: license-validator
            path: license-validator
          - name: localization
            path: localization
          - name: metabase
            path: metabase
          - name: notification
            path: notification
          - name: otp
            path: otp
          - name: pdf
            path: pdf
          - name: pdf-v3
            path: pdf-v3
          - name: pg-service
            path: pg-service
          - name: registry
            path: registry
          - name: schema-registry
            path: schema-registry
          - name: url-shortener
            path: url-shortener
          - name: vc
            path: vc
          - name: walt
            path: walt
          - name: workflow
            path: workflow

  template:
    metadata:
      name: '{{name}}'

    spec:
      project: egov-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: uat-saas
        path: deploy-as-code/helm/charts/core-services/{{path}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/uat-saas.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'egov'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
            # common/_deployment.yaml stamps this from .Release.Time, so it changes
            # on every render -- without this it would show permanent drift and
            # (if selfHeal were ever enabled) force a rollout on every sync cycle.
            - /spec/template/metadata/annotations/deployment-timestamp
