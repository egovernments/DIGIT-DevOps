## inji-certify -- step 6 of 8 in the Inji bring-up order.
##
## Apply ONLY after step 5 is Synced/Healthy. ArgoCD does not order
## Applications, so the sequence is enforced by applying these files in
## filename order, not by anything in the manifests.
## See applications/README.md for the full sequence and prerequisites.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inji-certify
  namespace: argocd
spec:
  project: inji-project
  sources:
    - repoURL: https://mosip.github.io/mosip-helm
      chart: inji-certify
      targetRevision: 0.13.1
      helm:
        ## releaseName inji-certify -> Service "inji-certify".
        releaseName: inji-certify
        valueFiles:
          - $values/deploy-as-code/helm/charts/inji-services/values/test-lts/inji-certify.yaml
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: digit-lts
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: inji
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
