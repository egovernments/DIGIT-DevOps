## AppProject for the Inji stack on the Azure AKS digit-lts (test-lts.digit.org)
## environment.
##
## Inji gets its OWN project rather than joining egov-project, because
## egov-project's destinations permit only the `egov` namespace. An Application
## targeting `inji` under that project is rejected at spec-validation time with
## "application destination is not permitted in project 'egov-project'" -- the
## workloads never get created and the error surfaces on the Application, not
## in any chart.
##
## A separate project is also what makes the Inji evaluation reversible: the
## whole stack is scoped to one namespace and one project, so tearing it down
## does not touch anything DIGIT owns.
##
## ORDERING: a namespace must appear in destinations BEFORE an element that
## targets it is added to inji-app-set-inji.yaml.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: inji-project
  namespace: argocd
spec:
  description: Inji credentialing stack (certify, mimoto, web, verify, esignet)

  sourceRepos:
    ## EVERY repoURL used by an Application in this project must be listed
    ## here, chart repos included -- not just the git repo holding the values.
    ## Argo matches the string verbatim, so the https and git@ forms of the
    ## same repo are two distinct entries, and a mismatch fails at
    ## spec-validation with "application repo ... is not permitted in project"
    ## before any sync is attempted. monitoring-project does the same thing for
    ## its four upstream chart repos.
    - https://github.com/egovernments/DIGIT-DevOps.git
    - git@github.com:egovernments/DIGIT-DevOps.git

    ## Upstream Inji/MOSIP charts. Required by every Application in
    ## charts/argo-cd/inji/applications/ -- they are multi-source, pulling the
    ## chart from here and the values from the git repo above via the $values
    ## ref. Omitting this is what made inji-config-server sit at
    ## Unknown/Unknown with InvalidSpecError instead of syncing.
    - https://mosip.github.io/mosip-helm

  destinations:
    - namespace: inji
      server: https://kubernetes.default.svc

  ## CORRECTED: an earlier version of this file asserted that nothing in the
  ## Inji charts renders a cluster-scoped object. That was wrong -- the
  ## inji-certify chart renders a ClusterRoleBinding, and step 06 failed with
  ## "one or more synchronization tasks are not valid" and
  ## ClusterRoleBinding/inji-certify stuck at Unknown.
  ##
  ## Only the specific kind is permitted, not the group:'*' kind:'*' wildcard
  ## that egov-project carries.
  clusterResourceWhitelist:
    ## inji-certify renders ClusterRoleBinding/inji-certify bound to
    ## ServiceAccount inji-certify. It references ClusterRole `inji-certify`,
    ## which NO chart in this stack creates -- certify has no clusterrole.yaml
    ## (only injiweb does). So the binding is dangling and confers no
    ## permissions at all. RBAC permits a binding to a non-existent role; it is
    ## simply inert. Permitted because it is harmless and cannot be disabled:
    ## the template is not gated on rbac.create, so rbac.create=false still
    ## renders it.
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  ## ClusterRole is deliberately NOT permitted.
  ##
  ## The injiweb chart (step 08) renders ClusterRole/injiweb with:
  ##   apiGroups: ['*']
  ##   resources: [endpoints, pods, services, configmaps, secrets,
  ##               virtualservices, gateways]
  ##   verbs: [get, list, create, update, patch]
  ## i.e. cluster-wide read AND WRITE on Secrets in every namespace, for a
  ## static nginx UI. It also references Istio kinds we do not run, so it looks
  ## like an unreviewed copy-paste. Granting that would give the web wallet
  ## access to every DIGIT secret in the cluster.
  ##
  ## Leaving it unlisted means step 08 will fail to sync the same way step 06
  ## did -- which is the intended outcome: it forces a decision rather than
  ## silently granting the permission. Resolve it before step 08, not by
  ## adding ClusterRole here without narrowing the rules.

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
