## ApplicationSet for the Inji stack on digit-lts (test-lts.digit.org).
##
## Environment file is ../../../environments/test-lts.yaml, NOT digit-lts.yaml.
## This matters: test-lts.yaml is the only one of the two whose values match
## this live cluster (domain test-lts.digit.org, db-host postgres.egov,
## es-host elasticsearch-data.backbone, kafka release-name-kafka-controller-
## headless.backbone). digit-lts.yaml points at digit-lts.digit.org and
## postgresql-lts, which is the instance being decommissioned. The sibling
## backbone appset uses digit-lts.yaml, which is the likelier cause of the
## OutOfSync backbone-* Applications than anything in those charts.
##
## The secrets:// entry needs argocd-repo-server SOPS/AWS-KMS wiring, which is
## already in place for the cluster-configs Application, so it works here too.
##
## DELETION HAZARD, and the mitigation.
##
## By default an ApplicationSet stamps resources-finalizer.argocd.argoproj.io
## onto every Application it generates, so REMOVING an element from the list
## below -- or deleting this ApplicationSet -- cascade-deletes that
## Application's workloads. prune:false does NOT protect against this; it only
## stops pruning of resources that vanish from a chart. That is how the
## backbone elasticsearch StatefulSets were lost.
##
## spec.syncPolicy.preserveResourcesOnDeletion: true suppresses that finalizer,
## so removing an element orphans the live objects instead of deleting them.
## Verified on this cluster: digit-lts-egov-appset-core sets it and its
## egov-vc Application has no finalizer, while digit-lts-backbone-appset-
## backbone does not set it and backbone-minio/backbone-redis both carry one.
##
## Cleaning up after Inji therefore becomes deliberate: delete the `inji`
## namespace, rather than relying on removing an element to tidy up.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-inji-appset-inji
  namespace: argocd
spec:
  syncPolicy:
    ## See DELETION HAZARD above. Matches digit-lts-egov-appset-core.
    preserveResourcesOnDeletion: true

  generators:
    - list:
        elements:
          ## Bootstrap only. Creates the four Inji databases/roles on
          ## postgres.egov via a PreSync Job. Intentionally listed first,
          ## though Argo does not order Applications within an appset -- the
          ## ordering guarantee comes from each module chart waiting on its own
          ## DB readiness, not from this list.
          ##
          ## Ships DISABLED (inji-db-init.enabled=false in test-lts.yaml).
          ## The Job needs the `inji-db` secret, whose four passwords must be
          ## SOPS-encrypted into test-lts-secrets.yaml first. Flip enabled to
          ## true in the same commit that adds those values.
          - name: inji-db-init

          ## The inji-stack-config ConfigMap. Required by inji-certify, mimoto
          ## and injiweb (all three list it in extraEnvVarsCM), so it must be
          ## Healthy before any of them is enabled.
          ## Ships disabled; enable via inji-stack-config.enabled in test-lts.yaml.
          - name: inji-stack-config

          ## Kubernetes Ingress objects for the modules. Every upstream Inji
          ## chart routes only through Istio and renders no Ingress, so routing
          ## lives here. Ships disabled, and each module has its own enabled
          ## flag so hosts can be turned on one at a time -- do not enable a
          ## module's ingress before its DNS A record exists, or cert-manager
          ## will fail the HTTP01 challenge and retry against rate limits.
          - name: inji-ingress

          ## The upstream modules (config-server, artifactory, softhsm x2,
          ## esignet, inji-certify, mimoto, injiweb) are NOT listed here. They
          ## come from the MOSIP Helm repo, not from a path in this repo, so
          ## they are multi-source Applications in inji-applications.yaml
          ## instead. This list generator only works for in-repo charts.

  template:
    metadata:
      name: 'inji-{{name}}'

    spec:
      project: inji-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: digit-lts
        path: deploy-as-code/helm/charts/inji-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/test-lts.yaml
            - secrets://../../../environments/test-lts-secrets.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'inji'

      syncPolicy:
        automated:
          ## prune:false matches every other appset in this repo: a rendering
          ## mistake must not be able to delete Inji state.
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          ## Fallback so an Application is not stuck if it syncs before the
          ## cluster-configs Application has created the `inji` namespace.
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        ## replicas is owned by the HPA / by manual scaling, not by git.
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/replicas
