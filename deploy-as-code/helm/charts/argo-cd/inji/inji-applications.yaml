  namespace: argocd
spec:
  project: inji-project
  sources:
    - repoURL: https://mosip.github.io/mosip-helm
      chart: injiweb
      targetRevision: 0.15.0
      helm:
        ## releaseName injiweb -> Service "injiweb", which inji-ingress targets.
        ##
        ## Note there are two chart names in the MOSIP repo: `injiweb` (0.15.0)
        ## and `inji-web` (0.11.1). `injiweb` is the maintained one.
        releaseName: injiweb
        valueFiles:
          - $values/deploy-as-code/helm/charts/inji-services/values/test-lts/injiweb.yaml
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
