# One kargo-<name> Application per project; element name = config basename = project namespace.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-kargo-appset-pipelines
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: crest-lts      # CREST pipeline (config/projects/crest-lts.yaml)
            branch: digit-lts
          - name: studio-lts     # Studio pipeline (config/projects/studio-lts.yaml)
            branch: digit-lts

  template:
    metadata:
      name: 'kargo-{{name}}'

    spec:
      project: kargo-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: '{{branch}}'
        path: deploy-as-code/helm/charts/kargo
        helm:
          valueFiles:
            - values.yaml
            - config/projects/{{name}}.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{name}}'

      # strictSemvers is a CRD default; ignoring it stops Warehouses showing OutOfSync
      ignoreDifferences:
        - group: kargo.akuity.io
          kind: Warehouse
          jqPathExpressions:
            - '.spec.subscriptions[]?.image.strictSemvers'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          # the project namespace is created + labeled by Kargo's Project controller
          - CreateNamespace=false
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
