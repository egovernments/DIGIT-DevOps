# Standalone Dex for Kargo SSO with PERSISTENT signing keys (storage: kubernetes).
# Replaces Kargo's bundled Dex, which hardcodes storage: memory and so regenerates
# its signing keys on every pod restart (e.g. an AKS node-pool roll). That left the
# Kargo API verifying tokens against a key set it could no longer refresh -> every
# SSO login failed with "failed to verify id token signature" until the API was
# restarted by hand. With kubernetes storage the keys survive restarts, so the API's
# key set stays valid and SSO is no longer broken by node rolls or reschedules.
# Kargo consumes this via api.oidc.dex.byo (see charts/kargo/config/control-plane.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-dex
  namespace: argocd
spec:
  project: kargo-project
  source:
    repoURL: https://charts.dexidp.io
    chart: dex
    targetRevision: 0.24.1        # Dex v2.44.0, matching the version Kargo 1.11.4 bundled
    helm:
      releaseName: kargo-dex
      valuesObject:
        fullnameOverride: kargo-dex
        replicaCount: 1
        https:
          enabled: true
        serviceAccount:
          create: true
        rbac:
          create: true
          createClusterScoped: true   # lets Dex create + manage its dex.coreos.com CRDs (key storage)
        envFrom:
          - secretRef:
              name: kargo-dex-github   # GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET (rendered by cluster-configs)
        volumes:
          - name: tls
            secret:
              secretName: kargo-dex-cert
        volumeMounts:
          - name: tls
            mountPath: /etc/dex-tls
            readOnly: true
        config:
          issuer: https://kargo-latest.digit.org/dex
          storage:
            type: kubernetes
            config:
              inCluster: true
          web:
            https: 0.0.0.0:5554
            tlsCert: /etc/dex-tls/tls.crt
            tlsKey: /etc/dex-tls/tls.key
          telemetry:
            http: 0.0.0.0:5558
          oauth2:
            skipApprovalScreen: true
          staticClients:
            - id: kargo-latest.digit.org
              name: Kargo
              public: true
              redirectURIs:
                - https://kargo-latest.digit.org/login
            - id: kargo-latest.digit.org-cli
              name: Kargo CLI
              public: true
          connectors:
            - type: github
              id: github
              name: GitHub
              config:
                clientID: $GITHUB_CLIENT_ID
                clientSecret: $GITHUB_CLIENT_SECRET
                redirectURI: https://kargo-latest.digit.org/dex/callback
                orgs:
                  - name: egovernments
                  - name: digitnxt
                teamNameField: slug   # groups claim = <org>:<team-slug>, unchanged from bundled Dex
          logger:
            level: info
            format: text
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
