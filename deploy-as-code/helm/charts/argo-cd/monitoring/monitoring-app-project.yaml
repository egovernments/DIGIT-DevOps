apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring-project
  namespace: argocd
spec:
  description: monitoring stack for the studio-demo Azure AKS environment

  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts

  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc
    # kube-prometheus-stack puts its coredns scrape-target Service in kube-system
    - namespace: kube-system
      server: https://kubernetes.default.svc
    # kafka-ui stays in its running namespace
    - namespace: backbone
      server: https://kubernetes.default.svc

  # kube-prometheus-stack ships the Prometheus Operator (cluster-scoped RBAC, CRDs, webhooks)
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
