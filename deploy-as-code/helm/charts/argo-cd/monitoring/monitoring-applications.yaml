apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-blackbox-exporter
  namespace: argocd
spec:
  project: monitoring-project
  source:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
    targetRevision: digit-lts
    path: deploy-as-code/helm/charts/backbone-services/prometheus-blackbox-exporter
    helm:
      releaseName: blackbox
      valueFiles:
        - values.yaml
        - ../../monitoring/values/blackbox-exporter.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
