apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-playground-appset-backbone
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: pgadmin

  template:
    metadata:
      name: 'playground-{{name}}'

    spec:
      project: playground-project

      source:
        ## HTTPS, not git@ SSH: argocd has no repository/repo-creds secret on this
        ## cluster, so SSH pulls fail with "Permission denied (publickey)". The repo
        ## is public, so HTTPS works anonymously.
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: digit-lts
        path: deploy-as-code/helm/charts/backbone-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/test-lts.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'playground'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
