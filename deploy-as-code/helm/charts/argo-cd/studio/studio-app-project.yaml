## AppProject for DIGIT Studio on the Azure AKS digit-lts (test-lts.digit.org)
## environment. Values: environments/digit-studio-lts.yaml.
##
## Destinations are studio, health (beneficiary-idgen and health-service-request,
## health services Studio depends on) AND egov: the Studio API charts render their Ingress into
## ingress.namespace (egov), because on digit-lts an Ingress must sit next to the
## Service it targets -- kong-kong-proxy, in egov. Only digit-studio's Ingress (its
## own Service) lands in studio. Nothing here renders cluster-scoped objects, and only
## these kinds: Deployment, Service, ConfigMap, Ingress.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: studio-project
  namespace: argocd
spec:
  description: DIGIT Studio services for the Azure AKS digit-lts environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git
    - https://helm.digit.org/digit3/studio
    - https://helm.digit.org/digit3/health

  destinations:
    - namespace: 'studio'
      server: https://kubernetes.default.svc
    - namespace: 'health'
      server: https://kubernetes.default.svc
    - namespace: 'egov'
      server: https://kubernetes.default.svc

  ## The first four are what the charts actually render. ReplicaSet and Pod are not
  ## rendered by anything here - argocd-server filters the resource tree by this list,
  ## so without them the UI shows only the top-level nodes and the running pods are
  ## invisible (Deployment -> ReplicaSet -> Pod is never drawn), taking pod logs and
  ## events with them. Unlike crest-project this one reaches egov as well, so it also
  ## permits bare Pods there; nothing in these charts renders one.
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: networking.k8s.io
      kind: Ingress
    - group: apps
      kind: ReplicaSet
    - group: ''
      kind: Pod
