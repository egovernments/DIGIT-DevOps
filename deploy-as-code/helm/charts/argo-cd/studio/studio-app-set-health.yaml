## Health services that DIGIT Studio depends on (namespace health), one Application
## health-<name> each, in studio-project. Values: chart values.yaml +
## environments/digit-studio-lts.yaml; their ConfigMaps and db Secret in health come
## from Application digit-lts-cluster-configs-studio.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-studio-appset-health
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: beneficiary-idgen
          - name: health-service-request

  template:
    metadata:
      name: 'health-{{name}}'

    spec:
      project: studio-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: digit-lts
        path: deploy-as-code/helm/charts/health-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/digit-studio-lts.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'health'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
