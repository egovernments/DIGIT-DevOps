## Health services DIGIT Studio depends on (namespace health) from the PUBLISHED charts
## helm.digit.org/digit3/health, one Application health-<name> each, pinned by
## <service>.chart-version in digit-studio-lts.yaml. Common layout: the whole env file is
## passed as values ($values ref). ConfigMaps and db Secret in health come from
## Application digit-lts-cluster-configs-studio.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-studio-appset-health
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - name: beneficiary-idgen
                - name: health-service-request
          - git:
              repoURL: https://github.com/egovernments/DIGIT-DevOps.git
              revision: digit-lts
              files:
                - path: deploy-as-code/helm/environments/digit-studio-lts.yaml
              requeueAfterSeconds: 60

  template:
    metadata:
      name: 'health-{{ .name }}'

    spec:
      project: studio-project

      sources:
        - repoURL: https://helm.digit.org/digit3/health
          chart: '{{ .name }}'
          targetRevision: '{{ index . .name "chart-version" }}'
          helm:
            releaseName: '{{ .name }}'
            valueFiles:
              - $values/deploy-as-code/helm/environments/digit-studio-lts.yaml
        - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
          targetRevision: digit-lts
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: 'health'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
