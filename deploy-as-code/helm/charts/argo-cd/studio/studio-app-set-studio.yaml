## Studio services (ns studio) from published charts helm.digit.org/digit3/studio, one Application
## studio-<name> each, pinned by <service>.chart-version in digit-studio-lts.yaml (Kargo-promotable later).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: digit-lts-studio-appset-studio
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - name: digit-studio
                - name: public-service
                - name: public-service-init
                - name: studio-calculator-service
                - name: studio-pdf
                - name: studio-hrms
                - name: studio-individual
                - name: studio-pdf-helper-service
                - name: studio-service-request
                - name: studio-user-otp
          - git:
              repoURL: https://github.com/egovernments/DIGIT-DevOps.git
              revision: digit-lts
              files:
                - path: deploy-as-code/helm/environments/digit-studio-lts.yaml
              requeueAfterSeconds: 60

  template:
    metadata:
      name: 'studio-{{ .name }}'

    spec:
      project: studio-project

      sources:
        - repoURL: https://helm.digit.org/digit3/studio
          chart: '{{ .name }}'
          targetRevision: '{{ index . .name "chart-version" }}'
          helm:
            releaseName: '{{ .name }}'
            valueFiles:
              - $values/deploy-as-code/helm/environments/digit-studio-lts.yaml
        - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
          targetRevision: digit-lts
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: 'studio'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
