apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: studio-demo-studio-appset
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: digit-studio
          - name: public-service
          - name: public-service-init
          - name: studio-calculator-service
          - name: studio-hrms
          - name: studio-individual
          - name: studio-pdf
          - name: studio-pdf-helper-service
          - name: studio-service-request
          - name: studio-user-otp

  template:
    metadata:
      name: '{{name}}'
    spec:
      project: studio-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: studio-demo
        path: deploy-as-code/helm/charts/studio-services/{{name}}
        helm:
          parameters:
            - name: name
              value: '{{name}}'
          valueFiles:
            - values.yaml
            - ../../../environments/studio-demo.yaml
            - ../../../environments/studio-demo-images.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: studio

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
