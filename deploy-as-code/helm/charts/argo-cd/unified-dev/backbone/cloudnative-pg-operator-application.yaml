## CloudNativePG operator -- prerequisite for charts/backbone-services/postgresql-18.
##
## SEPARATE FROM THE CHART ON PURPOSE. The operator is cluster-wide: one
## instance watches every namespace and reconciles Cluster resources, and its
## CRDs must exist before any Cluster resource can be applied. Bundling it into
## the postgresql-18 chart would mean a single Helm release that installs a CRD
## and an instance of that CRD at once, which Helm cannot order.
##
## This is the only piece pulled from an upstream chart; values are inline so
## there is no second values file to keep in step. The database itself is a
## first-class chart in this repo and takes its overrides from
## environments/<env>.yaml like every other backbone service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  annotations:
    ## Must settle before the backbone appset applies the Cluster resource.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: backbone-project
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1          # operator appVersion 1.30.1
    helm:
      releaseName: cloudnative-pg
      values: |
        crds:
          create: true
        ## Single replica is fine: the operator holds a leader-election lease
        ## and a restart does not interrupt running databases -- it only pauses
        ## reconciliation. Raise to 3 where operator downtime during a node
        ## drain is unacceptable.
        replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            memory: 500Mi
        monitoring:
          ## Needs the PodMonitor CRD; keep off so this Application has no
          ## ordering dependency on the monitoring stack.
          podMonitorEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      ## The bundled CRDs are large; client-side apply overflows the
      ## 262144-byte last-applied-configuration annotation.
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
