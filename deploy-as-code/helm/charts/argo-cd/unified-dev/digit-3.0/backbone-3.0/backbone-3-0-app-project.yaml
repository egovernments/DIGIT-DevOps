## AppProject for the backbone-3-0 Kargo project's Applications (digit3-postgresql-18, digit3-vault).
## See digit-3.0/README.md. Single namespaced destination; nothing cluster-scoped.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: backbone-3-0-project
  namespace: argocd
spec:
  description: DIGIT 3.0 backbone (postgresql-18 + vault) for the Azure AKS unified-dev environment
  sourceRepos:
    - https://helm.digit.org/digit3/backbone                # published postgresql + vault charts

  destinations:
    - namespace: 'backbone-3-0'
      server: https://kubernetes.default.svc
