## DIGIT 3.0 backbone. AppProject for the backbone-3-0 Kargo project's Applications:
## digit3-postgresql-18 (CloudNativePG Cluster + the DIGIT reconciler) and digit3-vault.
## Both are CHART-ONLY, root-layout services installed by the kargo-managed appset from the
## published charts at https://helm.digit.org/digit3/backbone; the backbone is shared by
## core-3.0 and (soon) health-3.0. (The Kargo pipeline itself -- the Project, Warehouses and
## Stages in backbone-3-0 -- is a separate Application under the kargo AppProject.)
##
## Single destination backbone-3-0. No cluster-scoped kinds are whitelisted: the CNPG Cluster
## and Database CRs are namespaced, postgres runs with the reconciler disabled (initdb
## bootstraps the role + database, so nothing is created in core-3-0), and vault runs with the
## agent injector and CSI provider disabled (services use AppRole) and auth-delegator off, so
## it renders nothing cluster-scoped. The cluster-wide CloudNativePG operator is a separate
## Application (backbone-project) that owns the postgresql.cnpg.io CRDs.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: backbone-3-0-project
  namespace: argocd
spec:
  description: DIGIT 3.0 backbone (postgresql-18 + vault) for the Azure AKS unified-dev environment
  sourceRepos:
    - https://helm.digit.org/digit3/backbone                # published postgresql + vault charts

  destinations:
    - namespace: 'backbone-3-0'
      server: https://kubernetes.default.svc
