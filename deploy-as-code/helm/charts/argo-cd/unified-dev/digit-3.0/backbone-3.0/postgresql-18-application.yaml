## PostgreSQL 18 (CloudNativePG) for DIGIT 3.0, in the backbone-3-0 namespace.
##
## DIGIT 3.0's own database (coredb + keycloak), dedicated to this module -- every other
## unified module uses Azure Flexible Server / RDS. It was previously deployed by the
## shared backbone ApplicationSet into the `backbone` namespace; here it moves under the
## digit-3.0 group as its own git-path Application.
##
## A database is infra, not an image promoted dev -> qa -> uat, so it is a plain
## Application rather than a Kargo service (Kargo would add nothing and the chart is not
## published to a Helm repo). Values come from the module env file like every service.
##
## Requires the cluster-wide CloudNativePG operator (Application cloudnative-pg-operator,
## cnpg-system), which installs the postgresql.cnpg.io CRDs the Cluster CR below depends on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digit3-postgresql-18
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: backbone-3-0-project
  source:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
    targetRevision: unified-dev
    path: deploy-as-code/helm/charts/backbone-services/postgresql-18
    helm:
      releaseName: postgresql-18
      valueFiles:
        - values.yaml
        - ../../../environments/digit-3.0/core-3.0.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: backbone-3-0
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - CreateNamespace=true
      # Lets the Cluster CR pass dry-run before the operator's CRDs are registered.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
