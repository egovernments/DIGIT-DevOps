## DIGIT 3.0 core module. AppProject for everything the core-3-0 Kargo project deploys:
## the core services, kong, keycloak and cluster-configs. Its apps are generated by the
## Kargo-managed ApplicationSets (project = kargo.argocd.project = core-3-0-project).
##
## Destinations are core-3-0 AND backbone-3-0: core-3-0-cluster-configs renders the
## postgresql-18 credential Secrets into backbone-3-0 (they are SOPS-encrypted, so they
## must be rendered by the SOPS-enabled cluster-configs Application, which is a core app),
## while everything else lands in core-3-0. The postgres Cluster CR and vault live in
## backbone-3-0 but belong to backbone-3-0-project (static, non-promotable infra).
##
## No cluster-scoped kinds are whitelisted: cluster-configs defaults some objects to shared
## namespaces (egov, health, ...), so anything rendered outside core-3-0 / backbone-3-0
## fails the sync here instead of overwriting another module's objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: core-3-0-project
  namespace: argocd
spec:
  description: DIGIT 3.0 core module (core-3.0) for the Azure AKS unified-dev environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git      # values
    - https://helm.digit.org/digit3/core                    # service charts
    - https://helm.digit.org/digit3/cluster-configs         # module ConfigMaps/Secrets

  destinations:
    - namespace: 'core-3-0'
      server: https://kubernetes.default.svc
    - namespace: 'backbone-3-0'
      server: https://kubernetes.default.svc
