## DIGIT 3.0 module (Kargo project digit-3-0). One AppProject for the whole module;
## its two sub-areas are the namespaces core-3-0 (core services, kong, keycloak,
## cluster-configs) and backbone-3-0 (postgresql-18, vault).
##
## A single project, not one per sub-area, because cluster-configs (app
## core-3-0-cluster-configs) renders objects into BOTH namespaces -- the postgresql-18
## credentials go to backbone-3-0, everything else to core-3-0 -- so it cannot belong to
## a single-destination project. The Kargo-managed ApplicationSets put every app of this
## Kargo project in this one project (kargo.argocd.project).
##
## No cluster-scoped kinds are whitelisted: the CNPG Cluster CR is namespaced and the
## CloudNativePG operator is a separate, cluster-wide Application (backbone-project).
## cluster-configs defaults some objects to shared namespaces (egov, health, ...), so
## anything that renders outside core-3-0 / backbone-3-0 fails the sync here instead of
## overwriting another module's objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: digit-3-0-project
  namespace: argocd
spec:
  description: DIGIT 3.0 module (core-3.0 + backbone-3.0) for the Azure AKS unified-dev environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git      # values + backbone-services charts
    - https://helm.digit.org/digit3/core                    # service charts
    - https://helm.digit.org/digit3/cluster-configs         # module ConfigMaps/Secrets
    - https://helm.digit.org/digit3/backbone                # vault chart

  destinations:
    - namespace: 'core-3-0'
      server: https://kubernetes.default.svc
    - namespace: 'backbone-3-0'
      server: https://kubernetes.default.svc
