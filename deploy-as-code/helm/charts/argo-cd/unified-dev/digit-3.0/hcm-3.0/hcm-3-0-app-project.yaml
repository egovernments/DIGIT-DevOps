# AppProject for the hcm-3-0 Kargo project. Single destination hcm-3-0 (reuses backbone-3-0).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hcm-3-0-project
  namespace: argocd
spec:
  description: DIGIT 3.0 HCM module (hcm-3.0) for the Azure AKS unified-dev environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git
    - https://helm.digit.org/digit3/hcm
    - https://helm.digit.org/digit3/cluster-configs
  destinations:
    - namespace: 'hcm-3-0'
      server: https://kubernetes.default.svc
