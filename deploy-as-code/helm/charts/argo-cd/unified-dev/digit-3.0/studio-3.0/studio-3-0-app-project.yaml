# AppProject for the studio-3-0 Kargo project: DIGIT Studio on DIGIT 3.0. Single destination
# studio-3-0 (reuses backbone-3-0 and core-3-0's kong + keycloak).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: studio-3-0-project
  namespace: argocd
spec:
  description: DIGIT Studio on DIGIT 3.0 (studio-3.0) for the Azure AKS unified-dev environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git
    - https://helm.digit.org/digit3/studio
    - https://helm.digit.org/digit3/cluster-configs
  destinations:
    - namespace: 'studio-3-0'
      server: https://kubernetes.default.svc
