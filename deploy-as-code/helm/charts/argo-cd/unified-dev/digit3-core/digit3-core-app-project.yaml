## DIGIT 3.0 core module (Kargo project digit-core3-0).
##
## Destination is digit3-core ONLY and no cluster-scoped kinds are whitelisted: the
## cluster-configs chart defaults some objects to shared namespaces (egov, health,
## ...), so anything that renders outside digit3-core fails the sync here instead of
## overwriting another module's objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: digit3-core-project
  namespace: argocd
spec:
  description: DIGIT 3.0 core module for the Azure AKS unified-dev environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git      # values: deploy-as-code/helm/digit3/
    - https://helm.digit.org/digit3/core                    # service charts
    - https://helm.digit.org/digit3/cluster-configs         # module ConfigMaps/Secrets

  destinations:
    - namespace: 'digit3-core'
      server: https://kubernetes.default.svc
