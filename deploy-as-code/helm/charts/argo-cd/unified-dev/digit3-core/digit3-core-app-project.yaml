## DIGIT 3.0 core (Kargo project digit-core3-0) -- see charts/kargo/config/projects/digit-core3-0.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: digit3-core-project
  namespace: argocd
spec:
  description: DIGIT 3.0 core services for the Azure AKS unified-dev environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git
    # packaged charts the Kargo-written umbrellas depend on
    - https://helm.digit.org/digit3/core

  destinations:
    - namespace: 'digit3'
      server: https://kubernetes.default.svc
