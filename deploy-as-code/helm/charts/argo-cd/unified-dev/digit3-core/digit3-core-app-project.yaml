## DIGIT 3.0 core module (Kargo project digit-core3-0). Its Applications come from the
## kargo-managed ApplicationSets (../kargo-managed/), driven by that project's Kargo config.
##
## Destinations are digit3-core and vault (kargo.argocd.namespaces in the Kargo config
## must list the same), and no cluster-scoped kinds
## are whitelisted: the cluster-configs chart defaults some objects to shared namespaces
## (egov, health, ...), so anything that renders elsewhere fails the sync here instead
## of overwriting another module's objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: digit3-core-project
  namespace: argocd
spec:
  description: DIGIT 3.0 core module for the Azure AKS unified-dev environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git      # values: deploy-as-code/helm/digit3/
    - https://helm.digit.org/digit3/core                    # service charts
    - https://helm.digit.org/digit3/cluster-configs         # module ConfigMaps/Secrets

  destinations:
    - namespace: 'digit3-core'
      server: https://kubernetes.default.svc
    # Vault (app digit3-vault) and anything else deployed with namespace: vault.
    - namespace: 'vault'
      server: https://kubernetes.default.svc
