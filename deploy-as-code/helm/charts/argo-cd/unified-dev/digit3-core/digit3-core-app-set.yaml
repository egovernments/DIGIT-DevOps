## DIGIT 3.0 core module services, promoted by Kargo (project digit-core3-0).
##
## One Application per service, digit3-<service>:
##   chart   <service> from https://helm.digit.org/digit3/core
##   version <service>.chart-version   in deploy-as-code/helm/environments/unified-digit3-core-dev.yaml
##   values  {global, <service>}       from the same file
##
## The version and the values come from ONE read of the env file (git files generator),
## so a Kargo commit that changes the chart version and the image tags together is
## deployed together. Equivalent to:
##   helm upgrade --install <service> digit3-core/<service> --version <chart-version> \
##     -n digit3-core -f unified-digit3-core-dev.yaml   (the common chart merges .Values.<service>)
##
## Add a service: promote it once in Kargo (merges <service>.chart-version and the image
## tags into the env file), then add an element below. missingkey=error fails generation
## for a listed service that has no chart-version yet.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-dev-digit3-core-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - name: localization
                - name: filestore
          - git:
              repoURL: https://github.com/egovernments/DIGIT-DevOps.git
              revision: unified-dev
              files:
                - path: deploy-as-code/helm/environments/unified-digit3-core-dev.yaml
              # Kargo's commit reaches the cluster within a minute (default is 3).
              requeueAfterSeconds: 60

  template:
    metadata:
      name: 'digit3-{{ .name }}'
    spec:
      project: digit3-core-project
      source:
        repoURL: https://helm.digit.org/digit3/core
        chart: '{{ .name }}'
        targetRevision: '{{ index . .name "chart-version" }}'
        helm:
          releaseName: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: digit3-core
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

  # Values as an object, from the same generator read as the version. toJson keeps
  # every value a literal (no template injection from the file's contents).
  templatePatch: |
    spec:
      source:
        helm:
          valuesObject:
            global: {{ toJson .global }}
            {{ .name }}: {{ toJson (index . .name) }}
