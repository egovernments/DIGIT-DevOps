## DIGIT 3.0 core module identity provider, as one Application digit3-keycloak (Kargo
## service keycloak).
##   chart   deploy-as-code/helm/charts/digit3/keycloak on unified-dev (git; based on the
##           digit-lts core-services/keycloak chart, which 2.x egov-keycloak does not use)
##   values  {global, keycloak} from deploy-as-code/helm/environments/unified-digit3-core-dev.yaml
##           -- keycloak.image.tag is written by Kargo
##
## Before Keycloak starts, the chart's db-init init container creates the database named
## in egov-config keycloak-db-url and the kc-db role on that server.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-dev-digit3-core-keycloak
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        revision: unified-dev
        files:
          - path: deploy-as-code/helm/environments/unified-digit3-core-dev.yaml
        requeueAfterSeconds: 60

  template:
    metadata:
      name: digit3-keycloak
    spec:
      project: digit3-core-project
      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: unified-dev
        path: deploy-as-code/helm/charts/digit3/keycloak
        helm:
          releaseName: keycloak
      destination:
        server: https://kubernetes.default.svc
        namespace: digit3-core
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

  # toJson keeps every value a literal (no template injection from the file's contents).
  templatePatch: |
    spec:
      source:
        helm:
          valuesObject:
            global: {{ toJson .global }}
            keycloak: {{ toJson (index . "keycloak") }}
