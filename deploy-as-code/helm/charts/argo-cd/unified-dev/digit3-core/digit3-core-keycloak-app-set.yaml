## DIGIT 3.0 core module identity provider, as one Application digit3-keycloak (Kargo
## service keycloak).
##   chart   keycloak from https://helm.digit.org/digit3/core (published from
##           deploy-as-code/helm/charts/digit3/keycloak)
##   version keycloak.chart-version in deploy-as-code/helm/environments/unified-digit3-core-dev.yaml (Kargo)
##   values  {global, keycloak} from the same file -- a common-chart service like
##           digit3-core-app-set's, kept apart only so it can wait for its chart-version.
##
## Before Keycloak starts, the chart's db-init init container creates the database named
## in egov-config keycloak-db-url and the kc-db role on that server.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-dev-digit3-core-keycloak
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        revision: unified-dev
        files:
          - path: deploy-as-code/helm/environments/unified-digit3-core-dev.yaml
        requeueAfterSeconds: 60
      # No Application until Kargo's first promotion merges keycloak.chart-version
      # (the chart is not published yet); missingkey=error would fail generation instead.
      selector:
        matchExpressions:
          - key: keycloak.chart-version
            operator: Exists

  template:
    metadata:
      name: digit3-keycloak
    spec:
      project: digit3-core-project
      source:
        repoURL: https://helm.digit.org/digit3/core
        chart: keycloak
        targetRevision: '{{ index . "keycloak" "chart-version" }}'
        helm:
          releaseName: keycloak
      destination:
        server: https://kubernetes.default.svc
        namespace: digit3-core
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

  # toJson keeps every value a literal (no template injection from the file's contents).
  templatePatch: |
    spec:
      source:
        helm:
          valuesObject:
            global: {{ toJson .global }}
            keycloak: {{ toJson (index . "keycloak") }}
