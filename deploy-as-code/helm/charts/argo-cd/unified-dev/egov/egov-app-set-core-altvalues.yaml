apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-dev-egov-appset-core-altvalues
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: egov-user

  template:
    metadata:
      name: 'egov-{{name}}'
      # Authorize the matching Kargo Stage to run argocd-update on this app.
      # Without it Argo rejects the promotion's final step, which lands AFTER the
      # tag has already been committed and pushed to unified-dev. Stage names are
      # '<service>-dev' in project unified-core; only the dev stage sets
      # argocdUpdate, so only that stage needs authorizing.
      annotations:
        kargo.akuity.io/authorized-stage: 'unified-core:{{name}}-dev'

    spec:
      project: egov-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: unified-dev
        path: deploy-as-code/helm/charts/core-services/{{name}}
        helm:
          valueFiles:
            ## these charts ship <chart>-values.yaml instead of values.yaml,
            ## which Helm does not auto-load, so it is named explicitly
            - '{{name}}-values.yaml'
            - ../../../environments/unified-dev.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'egov'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
