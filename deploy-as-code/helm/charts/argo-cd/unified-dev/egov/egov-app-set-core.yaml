apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-dev-egov-appset-core
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: audit-service
          - name: billing
          - name: boundary
          # boundary-service -> Kargo-promoted; see egov-app-set-core-promoted.yaml
          - name: egov-accesscontrol
          - name: egov-enc-service
          - name: egov-filestore
          - name: egov-idgen
          - name: egov-indexer
          - name: egov-localization
          - name: egov-location
          - name: egov-malware-detection
          # egov-notification-mail / egov-notification-sms -> Kargo-promoted; see egov-app-set-core-promoted.yaml
          - name: egov-otp
          - name: egov-persister
          - name: egov-pg-service
          - name: egov-url-shortening
          - name: egov-user-event
          - name: egov-workflow-v2
          - name: filestore
          - name: gateway
          - name: inbox
          - name: keycloak
          - name: mdms-v2
          - name: notification
          - name: pdf-service
          - name: service-request
          - name: tenant-management
          - name: url-shortener
          - name: user-otp
          - name: workflow

  template:
    metadata:
      name: 'egov-{{name}}'
      # Authorize the matching Kargo dev Stage to run argocd-update on this app.
      # Only egov-notification-mail/-sms have a Kargo Stage today; on every other
      # generated app the referenced stage does not exist, so the annotation is
      # inert. Stage names are '<service>-dev' in project unified-core.
      annotations:
        kargo.akuity.io/authorized-stage: 'unified-core:{{name}}-dev'

    spec:
      project: egov-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: unified-dev
        path: deploy-as-code/helm/charts/core-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/unified-dev.yaml
          # keep rendered manifests in the destination namespace regardless of the
          # chart default (e.g. xstate-chatbot ships namespace: urban)
          parameters:
            - name: namespace
              value: egov

      destination:
        server: https://kubernetes.default.svc
        namespace: 'egov'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
