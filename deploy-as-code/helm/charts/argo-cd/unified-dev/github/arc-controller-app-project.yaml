## AppProject for the ARC controller (ns arc-systems).
## The controller chart ships the actions.github.com CRDs plus cluster-scoped
## RBAC, so those are whitelisted here alongside the namespaced controller
## objects. CRDs are applied by ArgoCD with ServerSideApply (avoids the
## >262144-byte last-applied-annotation limit on large CRDs).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: arc-controller-project
  namespace: argocd
spec:
  description: GitHub Actions Runner Controller on unified-dev
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: arc-systems

  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Secret
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
