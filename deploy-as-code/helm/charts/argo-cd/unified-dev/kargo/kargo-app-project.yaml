apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kargo-project
  namespace: argocd
spec:
  description: Kargo control plane and promotion pipelines for the Azure AKS unified-dev environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git
    - ghcr.io/akuity/kargo-charts

  destinations:
    - namespace: kargo
      server: https://kubernetes.default.svc
    - namespace: unified-core
      server: https://kubernetes.default.svc
    - namespace: unified-health
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc

  # Kargo installs CRDs, webhooks and cluster-scoped RBAC; without these the sync is rejected
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: kargo.akuity.io
      kind: Project
    - group: ''
      kind: Namespace

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
