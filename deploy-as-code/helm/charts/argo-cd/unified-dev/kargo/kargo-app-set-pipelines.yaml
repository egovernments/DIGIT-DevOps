apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-dev-kargo-appset-pipelines
  namespace: argocd
spec:
  generators:
    # Per-element branch: each project's Kargo pipeline (chart + config/projects)
    # is read from the branch it should promote to and deploy from.
    #   - unified-core  -> unified-dev   (branch-per-env test; promotes to unified-dev/qa/uat)
    #   - unified-health -> unified-env-lts  (unchanged; promotes to + deploys from unified-env-lts)
    #   - unified-studio -> unified-env-lts  (unchanged)
    # Moving health/studio here would send their promotions to unified-dev branches
    # while their Deployments still track unified-env-lts, silently breaking them.
    - list:
        elements:
          - name: unified-core
            branch: unified-dev
          - name: unified-health
            branch: unified-dev
          - name: unified-studio
            branch: unified-dev

  template:
    metadata:
      name: 'kargo-{{name}}'

    spec:
      project: kargo-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: '{{branch}}'
        path: deploy-as-code/helm/charts/kargo
        helm:
          valueFiles:
            - values.yaml
            - config/projects/{{name}}.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{name}}'

      # strictSemvers is a CRD default; ignoring it stops Warehouses showing OutOfSync
      ignoreDifferences:
        - group: kargo.akuity.io
          kind: Warehouse
          jqPathExpressions:
            - '.spec.subscriptions[]?.image.strictSemvers'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          # namespaces are created + labeled by cluster-configs
          - CreateNamespace=false
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
