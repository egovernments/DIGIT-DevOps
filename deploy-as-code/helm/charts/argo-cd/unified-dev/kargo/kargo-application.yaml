# Kargo control plane: upstream OCI chart + values via $values ref.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
spec:
  project: kargo-project
  sources:
    - repoURL: ghcr.io/akuity/kargo-charts
      chart: kargo
      targetRevision: 1.11.4
      helm:
        releaseName: kargo
        valueFiles:
          - $values/deploy-as-code/helm/charts/kargo/config/control-plane.yaml
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: unified-env-lts
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  # AKS Admissions Enforcer injects namespaceSelector entries; ignore them so selfHeal doesn't fight AKS.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: kargo
      jqPathExpressions:
        - '.webhooks[]?.namespaceSelector.matchExpressions[]? | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
