# Kargo control plane. Upstream chart from the akuity OCI Helm registry, values
# from this git repo via the $values ref (same pattern as monitoring-applications.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
spec:
  project: kargo-project
  sources:
    - repoURL: ghcr.io/akuity/kargo-charts
      chart: kargo
      targetRevision: 1.11.4
      helm:
        releaseName: kargo
        valueFiles:
          - $values/deploy-as-code/helm/environments/kargo-unified-dev.yaml
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: unified-env-lts
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  # The AKS Admissions Enforcer appends `control-plane NotIn [true]` and
  # `kubernetes.azure.com/managedby NotIn [aks]` to every webhook's
  # namespaceSelector. Most kargo webhooks leave that field unset so the
  # addition is tolerated, but the two replicated-resource webhooks declare
  # one -- without this, selfHeal strips AKS's entries and AKS re-adds them.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: kargo
      jqPathExpressions:
        - '.webhooks[]?.namespaceSelector.matchExpressions[]? | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Required so the sync itself also leaves the ignored fields alone.
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
