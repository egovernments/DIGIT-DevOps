# unified-core Kargo project: Project/ProjectConfig + Warehouses/Stages for the
# core notification services. Pipeline config lives under the `kargo:` key in
# unified-dev.yaml. Credential + kargo-api Secrets are rendered by the
# cluster-configs chart (cluster-configs.secrets.kargo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-unified-core
  namespace: argocd
spec:
  project: kargo-project
  sources:
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: unified-env-lts
      path: "deploy-as-code/helm/charts/kargo/kargo-pipelines"
      helm:
        valueFiles:
          - values.yaml
          - ../../../environments/unified-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    # Must be set: an empty destination namespace matches no AppProject
    # destination. Every rendered resource carries its own explicit namespace,
    # so this only supplies the default for the cluster-scoped Project.
    namespace: unified-core
  # strictSemvers is a CRD default the API server fills in. It is inert under
  # the NewestBuild strategy, but unignored it holds every Warehouse OutOfSync.
  ignoreDifferences:
    - group: kargo.akuity.io
      kind: Warehouse
      jqPathExpressions:
        - '.spec.subscriptions[]?.image.strictSemvers'
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # cluster-configs creates and labels this namespace. Argo CD must not
      # create it here: it would do so unlabeled and Kargo refuses to adopt a
      # pre-existing namespace without kargo.akuity.io/project.
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
