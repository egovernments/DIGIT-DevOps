# unified-health Kargo project: scaffolded (Project + ProjectConfig + credential
# Secrets) with no Warehouses/Stages yet. Add services under the `kargo:` key in
# unified-health-dev.yaml -- no template change required.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-unified-health
  namespace: argocd
spec:
  project: kargo-project
  sources:
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: unified-env-lts
      path: "deploy-as-code/helm/charts/kargo/kargo-pipelines"
      helm:
        valueFiles:
          - values.yaml
          - ../../../environments/unified-health-dev.yaml
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
