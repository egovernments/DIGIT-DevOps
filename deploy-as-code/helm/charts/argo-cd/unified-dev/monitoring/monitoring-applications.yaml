---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-loki
  namespace: argocd
spec:
  project: monitoring-project
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      # loki-stack 2.10.1, matching monitoring-helmfile.yaml. Two reasons this is
      # NOT the standalone `loki` chart:
      #   * loki-stack bundles promtail (promtail.enabled=true), so logs are
      #     actually shipped. Plain `loki` has no collector — the stack would
      #     come up healthy and receive nothing.
      #   * values/loki-stack.yaml and the unified-dev overlay are Loki 2.x
      #     schema (boltdb-shipper / shared_store / table_manager). loki 6.x
      #     expects the 3.x layout and would silently ignore all of it.
      # Its bundled grafana and prometheus subcharts are disabled in the base
      # values, so this does not duplicate the separate Applications.
      chart: loki-stack
      targetRevision: 2.10.1
      helm:
        releaseName: loki-stack
        valueFiles:
          - $values/deploy-as-code/helm/charts/monitoring/values/loki-stack.yaml
          - $values/deploy-as-code/helm/charts/monitoring/values/unified-dev/loki.yaml
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: unified-env-lts
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
