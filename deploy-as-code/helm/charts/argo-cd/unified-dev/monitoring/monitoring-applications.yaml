## ArgoCD cannot execute monitoring-helmfile.yaml, so each helmfile release
## becomes one Application. The upstream chart comes from its own Helm repo and
## the values come from this git repo via the $values ref, which keeps the
## chart versions identical to the helmfile.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-kube-prometheus-stack
  namespace: argocd
spec:
  project: monitoring-project
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 56.6.2
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/deploy-as-code/helm/charts/monitoring/values/prometheus.yaml
          - $values/deploy-as-code/helm/charts/monitoring/values/unified-dev/prometheus.yaml
    - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
      targetRevision: unified-env-lts
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
