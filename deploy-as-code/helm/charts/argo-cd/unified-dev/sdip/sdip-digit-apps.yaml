apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sdip-digit-database
  namespace: argocd
spec:
  project: sdip-project
  source:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
    targetRevision: unified-dev
    path: deploy-as-code/helm/charts/sdip-services/sdip-digit-database
    helm:
      releaseName: sdip-digit-database
      valueFiles:
        - values.yaml
      parameters:
        - name: enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: sdip
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
