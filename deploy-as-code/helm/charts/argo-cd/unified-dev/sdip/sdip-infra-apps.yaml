---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sdip-kafka
  namespace: argocd
spec:
  project: sdip-project
  source:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
    targetRevision: unified-dev
    path: deploy-as-code/helm/charts/backbone-services/kafka-kraft
    helm:
      releaseName: sdip-kafka
      valueFiles:
        - values.yaml
        - ../../../environments/unified-sdip-infra-dev.yaml
        - ../../../environments/unified-sdip-kafka-dev.yaml
        - ../../../environments/unified-sdip-kafka-security-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sdip
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
