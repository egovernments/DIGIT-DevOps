## Cluster security scanning (Kubescape) for unified-dev.
##
## Separate from every other project because this is the only one that needs
## cluster-scoped objects: the scanner reads every resource kind in the cluster
## (ClusterRole/Binding), registers an aggregated API server for its results
## (APIService + the CRD behind it) and runs at a non-default priority so a
## busy node does not evict it (PriorityClass).
##
## It also needs ONE object outside its own namespace: the RoleBinding
## storage-auth-reader in kube-system, which binds the well-known Role
## extension-apiserver-authentication-reader to the storage ServiceAccount.
## Every aggregated API server needs it -- that Role is how the apiserver
## reads the client-CA bundle in the extension-apiserver-authentication
## ConfigMap -- so without the destination below the sync fails with
##
##   RoleBinding storage-auth-reader: namespace kube-system is not permitted
##   in project 'security-project'
##
## Both whitelists are exhaustive on purpose -- exactly what
## digit3/security/kubescape renders and nothing else, so a future chart
## version that starts creating something new fails the sync loudly instead
## of silently gaining privilege.
##
## Note the limit of the model: Argo CD scopes a whitelist to the PROJECT, not
## to a destination, so the kinds below are permitted in kube-system as well
## as in kubescape. Granting kube-system at all is therefore the decision to
## review here; the namespaced whitelist bounds what can be put there, but it
## cannot bound it to the single RoleBinding the chart actually needs.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security-project
  namespace: argocd
spec:
  description: Cluster security posture and vulnerability scanning for unified-dev
  sourceRepos:
    - https://helm.digit.org/digit3/security
  destinations:
    - namespace: kubescape
      server: https://kubernetes.default.svc
    ## storage-auth-reader only -- see the header.
    - namespace: kube-system
      server: https://kubernetes.default.svc
    ## Kyverno owns its own namespace; every other chart in this project
    ## deploys into kubescape.
    - namespace: kyverno
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    ## Not rendered by the chart -- Argo CD synthesizes a Namespace task from
    ## the Application's CreateNamespace=true syncOption, and that synthetic
    ## task is checked against this whitelist like any other. Without it a
    ## FIRST install fails with
    ##
    ##   Namespace/kubescape: resource :Namespace is not permitted in project
    ##   security-project
    ##
    ## while an environment whose namespace already exists syncs fine, because
    ## there is nothing for Argo to create. Enumerating the chart's own objects
    ## does not find this one.
    - group: ''
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: apiregistration.k8s.io
      kind: APIService
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    ## Kyverno's policies. The Pod Security set renders 11 of these.
    ## Kyverno creates its Validating/MutatingWebhookConfiguration objects at
    ## RUNTIME, not from the chart, so those are not Argo-managed and are
    ## deliberately absent here.
    - group: policies.kyverno.io
      kind: ValidatingPolicy
  ## Exactly the ten namespaced kinds the chart renders.
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: batch
      kind: CronJob
    ## Kyverno's pre-install / pre-delete Helm hooks.
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
