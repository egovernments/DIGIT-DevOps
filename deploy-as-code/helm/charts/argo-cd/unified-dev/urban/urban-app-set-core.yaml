apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-dev-urban-appset-core
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: xstate-chatbot

  template:
    metadata:
      name: 'urban-{{name}}'

    spec:
      project: urban-project

      source:
        repoURL: https://github.com/egovernments/DIGIT-DevOps.git
        targetRevision: unified-env-lts
        path: deploy-as-code/helm/charts/core-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../environments/unified-urban-dev.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: 'urban'

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
