## Kargo config-promotion pilot -- see charts/kargo/config/projects/unified-pilot.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pilot-project
  namespace: argocd
spec:
  description: Kargo config-promotion pilot (podinfo) for the Azure AKS unified-qa environment
  sourceRepos:
    - https://github.com/egovernments/DIGIT-DevOps.git

  destinations:
    - namespace: 'pilot'
      server: https://kubernetes.default.svc
