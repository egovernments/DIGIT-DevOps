{{- if and .Values.server.ingress.enabled (eq .Values.server.ingress.controller "generic") }}
{{- $insecure := index .Values.configs.params "server.insecure" | toString -}}
{{- $servicePort := eq $insecure "true" | ternary .Values.server.service.servicePortHttp .Values.server.service.servicePortHttps -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "argo-cd.server.fullname" . }}
  namespace: {{ include  "argo-cd.namespace" . }}
  labels:
    {{- include "argo-cd.labels" (dict "context" . "component" .Values.server.name "name" .Values.server.name) | nindent 4 }}
    {{- with .Values.server.ingress.labels }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- with .Values.server.ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ tpl (toString $value) $ | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.server.ingress.ingressClassName }}
  ingressClassName: {{ tpl . $ }}
  {{- end }}
  rules:
    - host: {{ tpl (.Values.server.ingress.hostname) $ | default .Values.global.domain }}
      http:
        paths:
          {{- with .Values.server.ingress.extraPaths }}
            {{- tpl (toYaml .) $ | nindent 10 }}
          {{- end }}
          - path: {{ .Values.server.ingress.path }}
            pathType: {{ $.Values.server.ingress.pathType }}
            backend:
              service:
                name: {{ include "argo-cd.server.fullname" . }}
                port:
                  number: {{ $servicePort }}
    {{- range .Values.server.ingress.extraHosts }}
    - host: {{ tpl .name $ | quote }}
      http:
        paths:
          - path: {{ default $.Values.server.ingress.path .path }}
            pathType: {{ default $.Values.server.ingress.pathType .pathType }}
            backend:
              service:
                name: {{ include "argo-cd.server.fullname" $ }}
                port:
                  number: {{ $servicePort }}
    {{- end }}
    {{- with .Values.server.ingress.extraRules }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- if or .Values.server.ingress.tls .Values.server.ingress.extraTls }}
  tls:
    {{- if .Values.server.ingress.tls }}
    - hosts:
      - {{ tpl (.Values.server.ingress.hostname) $ | default .Values.global.domain }}
      {{- range .Values.server.ingress.extraHosts }}
        {{- if .name }}
      - {{ tpl .name $ }}
        {{- end }}
      {{- end }}
      {{- /*
        Derived from the environment's domain instead of the hardcoded
        "argocd-server-tls".

        This repo issues one wildcard-per-env cert named <domain>-tls-certs -- the
        same convention cluster-configs' root-ingress and the common chart use
        (secretName: {{ $.Values.global.domain }}-tls-certs). Hardcoding
        argocd-server-tls pointed the Ingress at a Secret that nothing in this
        chart creates: server.certificate.enabled and server.certificateSecret.enabled
        are both false, so no Certificate or Secret is rendered, and nginx fell back
        to its default self-signed cert for the Argo CD host.

        Mirrors the host expression used for the rule above, so an explicit
        server.ingress.hostname wins over global.domain.

        Overrides, in order:
          1. server.ingress.tlsSecretName -- explicit name, if set
          2. argocd-server-tls            -- when the chart produces the cert itself
                                            (certificate.enabled / certificateSecret.enabled),
                                            since those templates create that name
          3. <host>-tls-certs            -- the repo-wide convention
      */ -}}
      {{- $tlsHost := tpl (.Values.server.ingress.hostname) $ | default .Values.global.domain }}
      {{- $chartOwnsCert := or .Values.server.certificate.enabled .Values.server.certificateSecret.enabled }}
      secretName: {{ .Values.server.ingress.tlsSecretName | default (ternary "argocd-server-tls" (printf "%s-tls-certs" $tlsHost) $chartOwnsCert) }}
    {{- end }}
    {{- with .Values.server.ingress.extraTls }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
