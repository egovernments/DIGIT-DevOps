---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "kibana.fullname" . }}-helm-scripts
  namespace: {{ .Values.namespace }}
  labels: {{ include "kibana.labels" . | nindent 4 }}
  annotations:
    ## `post-delete` removed from the hook list.
    ##
    ## Argo CD maps Helm hooks onto its own phases (pre-install/pre-upgrade ->
    ## PreSync, post-install/post-upgrade -> PostSync) and has no equivalent for
    ## post-delete. A resource whose hook list contains an unsupported type is
    ## skipped entirely, so this ConfigMap was never created on the cluster --
    ## while the sibling hooks (ServiceAccount, Role, RoleBinding and the
    ## pre-install Job), which only declare pre-install,pre-upgrade, all were.
    ##
    ## The Job mounts this ConfigMap as the `kibana-helm-scripts` volume, so its
    ## pod sat in ContainerCreating indefinitely with
    ##   MountVolume.SetUp failed ... configmap "…-kibana-helm-scripts" not found
    ## and the PreSync phase never completed:
    ##   waiting for completion of hook batch/Job/pre-install-…-kibana
    ## which left the whole Application stuck at HEALTH=Missing.
    ##
    ## Under Helm this only cost the post-delete cleanup pass, which Argo CD does
    ## not run anyway; hook-delete-policy still removes the ConfigMap once the
    ## hook succeeds.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- if .Values.annotations }}
    {{- range $key, $value := .Values.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- end }}
data:
  manage-es-token.js: |
    const https = require('https');
    // `http` added alongside `https`.
    //
    // The script used https.request() for BOTH the Kubernetes API and
    // Elasticsearch. The Kubernetes API is always TLS, but this Elasticsearch has
    // xpack.security.enabled=true with only *transport* TLS -- the REST layer is
    // plain HTTP with basic auth (verified in-cluster: http://…:9200 -> 401,
    // https://…:9200 -> connection failure). Sending a TLS handshake to a
    // plaintext port made every ES call die with
    //   write EPROTO ... ssl3_get_record:wrong version number
    // so the token was never created, the pre-install hook Job failed on repeat,
    // and the Application stayed at HEALTH=Missing.
    //
    // clientFor() picks the module from the URL scheme, so an https:// ES host
    // keeps working exactly as before.
    const http = require('http');
    const { URL } = require('url');
    const fs = require('fs');

    function clientFor(url) {
      return new URL(url).protocol === 'http:' ? http : https;
    }

    // Read environment variables
    function getEnvVar(name) {
      if (!process.env[name]) {
        throw new Error(name + ' environment variable is missing')
      }
      return process.env[name]
    }

    // Elasticsearch API
    const esPath = '_security/service/elastic/kibana/credential/token/{{ template "kibana.fullname" . }}';
    const esUrl = '{{ .Values.elasticsearchHosts }}' + '/' + esPath
    const esUsername = getEnvVar('ELASTICSEARCH_USERNAME');
    const esPassword = getEnvVar('ELASTICSEARCH_PASSWORD');
    const esAuth = esUsername + ':' + esPassword;
    // Only load a CA when Elasticsearch is actually reached over TLS. With a
    // plain-HTTP host there is no cert to verify, and elasticsearchCertificateAuthoritiesFile
    // may be unset -- which makes the env var a bare directory path and
    // readFileSync throw EISDIR before any request is attempted.
    const esIsTls = new URL(esUrl).protocol === 'https:';
    const esCaFile = esIsTls ? getEnvVar('ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES') : null;
    const esCa = esCaFile && fs.existsSync(esCaFile) && fs.statSync(esCaFile).isFile()
      ? fs.readFileSync(esCaFile)
      : undefined;

    // Kubernetes API
    const k8sHostname = getEnvVar('KUBERNETES_SERVICE_HOST');
    const k8sPort = getEnvVar('KUBERNETES_SERVICE_PORT_HTTPS');
    const k8sPostSecretPath = 'api/v1/namespaces/{{ .Values.namespace }}/secrets';
    const k8sDeleteSecretPath = 'api/v1/namespaces/{{ .Values.namespace }}/secrets/{{ template "kibana.fullname" . }}-es-token';
    const k8sPostSecretUrl = `https://${k8sHostname}:${k8sPort}/${k8sPostSecretPath}`;
    const k8sDeleteSecretUrl = `https://${k8sHostname}:${k8sPort}/${k8sDeleteSecretPath}`;
    const k8sBearer = fs.readFileSync('/run/secrets/kubernetes.io/serviceaccount/token');
    const k8sCa = fs.readFileSync('/run/secrets/kubernetes.io/serviceaccount/ca.crt');

    // Post Data
    const esTokenDeleteOptions = {
      method: 'DELETE',
      auth: esAuth,
      ca: esCa,
    };
    const esTokenCreateOptions = {
      method: 'POST',
      auth: esAuth,
      ca: esCa,
    };
    const secretCreateOptions = {
      method: 'POST',
      ca: k8sCa,
      headers: {
        'Authorization': 'Bearer ' + k8sBearer,
        'Accept': 'application/json',
        'Content-Type': 'application/json',
      }
    };
    const secretDeleteOptions = {
      method: 'DELETE',
      ca: k8sCa,
      headers: {
        'Authorization': 'Bearer ' + k8sBearer,
        'Accept': 'application/json',
        'Content-Type': 'application/json',
      }
    };

    // With thanks to https://stackoverflow.com/questions/57332374/how-to-chain-http-request
    function requestPromise(url, httpsOptions, extraOptions = {}) {
      return new Promise((resolve, reject) => {
        // Was https.request(...) unconditionally -- see clientFor() above.
        const request = clientFor(url).request(url, httpsOptions, response => {

          console.log('statusCode:', response.statusCode);

          let isSuccess = undefined;

          if (typeof(extraOptions.extraStatusCode) != "undefined" && extraOptions.extraStatusCode != null) {
            isSuccess = response.statusCode >= 200 && response.statusCode < 300 || response.statusCode == extraOptions.extraStatusCode;
          } else {
            isSuccess = response.statusCode >= 200 && response.statusCode < 300;
          }

          let data = '';
          response.on('data', chunk => data += chunk); // accumulate data
          response.once('end', () => isSuccess ? resolve(data) : reject(data));  // resolve promise here
        });

        request.once('error', err => {
          // This won't log anything for e.g. an HTTP 404 or 500 response,
          // since from HTTP's point-of-view we successfully received a
          // response.
          console.log(`${httpsOptions.method} ${httpsOptions.path} failed: `, err.message || err);
          reject(err);  // if promise is not already resolved, then we can reject it here
        });

        if (typeof(extraOptions.payload) != "undefined") {
          request.write(extraOptions.payload);
        }
        request.end();
      });
    }

    function createEsToken() {
      // Check if the K8S secret exists
      console.log('Checking if K8S secret exists');
      return requestPromise(k8sDeleteSecretUrl, { method: 'GET', ca: k8sCa, headers: { 'Authorization': 'Bearer ' + k8sBearer } })
          .then(() => {
              console.log('K8S secret already exists, deleting...');
              // If the secret exists, delete it
              return requestPromise(k8sDeleteSecretUrl, secretDeleteOptions);
          })
          .catch(error => {
              if (error.includes('404')) {
                  console.log('K8S secret does not exist');
                  // If the secret does not exist, simply log
              } else {
                  // If there's an error other than 404, reject the promise
                  throw error;
              }
          })
          .then(() => {
              console.log('Cleaning Elasticsearch token');
              // Clean the Elasticsearch token
              return requestPromise(esUrl, esTokenDeleteOptions, {extraStatusCode: 404});
          })
          .then(() => {
              // After cleaning, proceed to create token and secret
              console.log('Creating new token');
              return requestPromise(esUrl, esTokenCreateOptions).then(response => {
                  const body = JSON.parse(response);
                  const token = body.token.value

                  // Encode the token in base64 
                  const base64Token = Buffer.from(token, 'utf8').toString('base64');

                  // Prepare the k8s secret
                  const secretData = JSON.stringify({
                      "apiVersion": "v1",
                      "kind": "Secret",
                      "metadata": {
                          "namespace": "{{ .Values.namespace }}",
                          "name": "{{ template "kibana.fullname" . }}-es-token",
                      },
                      "type": "Opaque",
                      "data": {
                          "token": base64Token,
                      }
                  })

                  // Create the k8s secret
                  console.log('Creating K8S secret');
                  return requestPromise(k8sPostSecretUrl, secretCreateOptions, { payload: secretData })
          });
      });
    }

    const command = process.argv[2];
    switch (command) {
      case 'create':
        console.log('Creating a new Elasticsearch token for Kibana')
        createEsToken().catch(err => {
          console.error(err);
          process.exit(1);
        });
        break;
      case 'clean':
        console.log('Cleaning the Kibana Elasticsearch token')
        cleanEsToken().catch(err => {
          console.error(err);
          process.exit(1);
        });
        break;
      default:
        console.log('Unknown command');
        process.exit(1);
    }