{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.fullname" . }}
  namespace: {{ include "minio.namespace" . }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
data:
  # rootPassword is a placeholder here — the real credential lives in the cluster
  # `minio` secret. Inject it via your secret manager, or set auth.existingSecret.
  rootUser: {{ .Values.auth.rootUser | b64enc | quote }}
  rootPassword: {{ .Values.auth.rootPassword | b64enc | quote }}
{{- end }}
