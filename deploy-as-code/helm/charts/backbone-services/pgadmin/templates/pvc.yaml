{{- $envOverrides := index .Values (tpl (default .Chart.Name .Values.name) .) -}}
{{- $baseValues := .Values | deepCopy -}}
{{- $values := dict "Values" (mustMergeOverwrite $baseValues $envOverrides) -}}
{{- with mustMergeOverwrite . $values -}}
{{- $p := .Values.persistence -}}
{{- $static := or $p.aws $p.azure $p.azureCsi $p.openstack $p.iscsi -}}
{{- if and $p.enabled (not $p.existingClaim) }}
apiVersion: "v1"
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-data
{{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
{{- else }}
  namespace: {{ .Values.namespace }}
{{- end }}
  labels:
    app: {{ .Values.labels.app }}
    group: {{ .Values.labels.group }}
spec:
  accessModes:
    - {{ $p.accessMode | quote }}
  resources:
    requests:
      storage: {{ $p.dataDirSize | quote }}
  storageClassName: {{ $p.storageClassName | quote }}
  volumeMode: {{ $p.volumeMode | quote }}
  {{- if $static }}
  ## Pin the claim to the statically provisioned PV from pv.yaml. Only set for
  ## static provisioning -- with dynamic provisioning a volumeName that no PV
  ## matches leaves the claim Pending forever, and the pod never starts.
  volumeName: {{ .Chart.Name }}-data
  {{- end }}
{{- end }}
{{- end }}
