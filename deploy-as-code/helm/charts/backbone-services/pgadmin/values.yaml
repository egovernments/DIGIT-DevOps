# Common Labels
labels:
  app: "pgadmin"
  group: "pgadmin"
namespace: playground

# Ingress Configs
ingress:
  enabled: true
  context: "pgadmin"
  additionalAnnotations: |
    {{- if index .Values "whitelist-ips" }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ index .Values "whitelist-ips" | quote }}
    {{- end }}
  #   nginx.ingress.kubernetes.io/auth-signin:  https://$host/oauth2/start?rd=$escaped_request_uri
  #   nginx.ingress.kubernetes.io/auth-url:     https://$host/oauth2/auth 

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "pgadmin"
  tag: "v4.7.7"

replicas: "1"
httpPort: "8080"
dbUrl: "egov-dev-db.ctm6jbmr5mnj.ap-south-1.rds.amazonaws.com"
dbPort: "5432"
dbWriteUser: "read"
dbReadUser: "write"
maintenance-db-name: "postgres"
db-admin-username: "egov"
db-read-username: "readonly"
environment: "DEV"
data-dir: "/var/lib/pgadmin"
log-file-path: "/var/lib/pgadmin/pgadmin4.log"
sqlite-path: "/var/lib/pgadmin/pgadmin4.db"
session-path: "/var/lib/pgadmin/sessions"
storage-path: "/var/lib/pgadmin/storage"
cookie-protection: "True"
ui-languages: "{'en': 'English'}"
enable-save-password: "False"
max-query-history: "50"
max-login-attempts: "5"
# Keep False while enable-save-password is False: with no stored database
# password there is nothing for a master password to protect, and requiring one
# blocks users from saving a server registration.
master-password-required: "False"

# Second, non-admin UI login, provisioned from the read-email / read-password
# keys of the `pgadmin` Secret. pgAdmin's entrypoint only ever creates
# PGADMIN_DEFAULT_EMAIL, so without this those Secret keys are inert and the
# user cannot log in. Also loads servers.json for BOTH users -- the entrypoint
# loads it only for the default admin.
readUser:
  enabled: true
  # How long the postStart hook waits for the main container to create the
  # config DB and the default admin before giving up (and giving up is a no-op,
  # never a container failure).
  timeoutSeconds: 180
shared-storage: "[{'name': 'Shared Folder', 'path': '/var/lib/pgadmin/shared_folder', 'restricted_access': True}]"

persistence:
  enabled: false
  storageClassName: default
  accessMode: ReadWriteOnce
  volumeMode: Filesystem
#  dataDirSize: 1Gi
#  aws:
#    volumeId: "value"
#    zone: ap-south-1a
#  azure:
#    diskName: zookeeper-0
#    diskUri: value
#  openstack: f37a03aa-6212-4c62-a805-9ce139fab180
#  iscsi:
#    targetPortal: 192.0.2.100:3260
#    iqn: iqn.2017-10.local.example.server:disk1

extraVolumes: |
  - name: config
    configMap:
      name: {{ .Chart.Name }}-config
  - name: storage
    persistentVolumeClaim:
      claimName: {{ .Chart.Name }}-data

extraVolumeMounts: |
  - mountPath: /pgadmin4/servers.json
    name: config
    subPath: servers.json
    readOnly: true
  - mountPath: /pgadmin4/config_local.py
    name: config
    subPath: config_local.py
    readOnly: true
  {{- if .Values.readUser.enabled }}
  - mountPath: /pgadmin4/bootstrap-users.py
    name: config
    subPath: bootstrap-users.py
    readOnly: true
  {{- end }}
  - mountPath: /var/lib/pgadmin
    name: storage

# Runs alongside the main process once the container starts.
#
# NOT guarded with a Helm conditional: common/_deployment.yaml renders this key
# with toYaml, not tpl, so a {{ if }} here would be literal text rather than a
# template. readUser.enabled gates the script and its mount instead; with it
# disabled the file is absent, python exits non-zero and `|| true` absorbs it.
#
# `|| true` is load-bearing in any case: a non-zero postStart hook kills the
# container, and failing to provision a secondary login must never take pgAdmin
# itself down.
lifecycle:
  postStart:
    exec:
      command:
        - /bin/sh
        - -c
        - /venv/bin/python3 /pgadmin4/bootstrap-users.py >> /var/lib/pgadmin/bootstrap-users.log 2>&1 || true

securityContext:
  fsGroup: 5050

# Additional Container Envs
env: |
  - name: PGADMIN_DEFAULT_EMAIL
    valueFrom:
      secretKeyRef:
        name: pgadmin
        key: admin-email
  - name: PGADMIN_DEFAULT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pgadmin
        key: admin-password
  {{- if .Values.readUser.enabled }}
  # Consumed by bootstrap-users.py, not by pgAdmin itself -- pgAdmin has no
  # notion of a second default user. These two Secret keys already existed and
  # were read by nothing.
  - name: PGADMIN_READ_EMAIL
    valueFrom:
      secretKeyRef:
        name: pgadmin
        key: read-email
  - name: PGADMIN_READ_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pgadmin
        key: read-password
  {{- end }}
  - name: CONFIG_DATABASE_CONNECTION_POOL_SIZE
    value: "5"
  - name: PGADMIN_LISTEN_PORT
    value: {{ .Values.httpPort | quote }}
  - name: PGADMIN_DISABLE_POSTFIX
    value: "true"
  - name: SCRIPT_NAME
    value: /{{ .Values.ingress.context }}
