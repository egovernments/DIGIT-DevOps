# Common Labels
labels:
  app: "pgadmin"
  group: "pgadmin"
namespace: playground

# Ingress Configs
ingress:
  enabled: true
  context: "pgadmin"
  ## NOTE: the `nginx.ingress.kubernetes.io/configuration-snippet` annotation that
  ## used to live here (setting `proxy_set_header X-Script-Name /pgadmin`) has been
  ## removed. The ingress-nginx controller runs with
  ## `controller.allowSnippetAnnotations: false` (hardened default since
  ## CVE-2021-25742), so its admission webhook rejects the whole Ingress:
  ##
  ##   admission webhook "validate.nginx.ingress.kubernetes.io" denied the request:
  ##   nginx.ingress.kubernetes.io/configuration-snippet annotation cannot be used.
  ##   Snippet directives are disabled by the Ingress administrator.
  ##
  ## pgadmin is told about its sub-path via the SCRIPT_NAME setting in
  ## config_local.py instead (see `script-name` below), which needs no snippet and
  ## keeps snippets disabled cluster-wide.
  additionalAnnotations: |
    {{- if index .Values "whitelist-ips" }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ index .Values "whitelist-ips" | quote }}
    {{- end }}
  #   nginx.ingress.kubernetes.io/auth-signin:  https://$host/oauth2/start?rd=$escaped_request_uri
  #   nginx.ingress.kubernetes.io/auth-url:     https://$host/oauth2/auth 

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "pgadmin"
  tag: "v4.7.7"

replicas: "1"
httpPort: "8080"
dbUrl: "egov-dev-db.ctm6jbmr5mnj.ap-south-1.rds.amazonaws.com"
dbPort: "5432"
dbWriteUser: "read"
dbReadUser: "write"
maintenance-db-name: "postgres"
db-admin-username: "egov"
db-read-username: "readonly"
environment: "DEV"
data-dir: "/var/lib/pgadmin"
log-file-path: "/var/lib/pgadmin/pgadmin4.log"
sqlite-path: "/var/lib/pgadmin/pgadmin4.db"
session-path: "/var/lib/pgadmin/sessions"
storage-path: "/var/lib/pgadmin/storage"
## Sub-path pgadmin is served under, written to config_local.py as SCRIPT_NAME.
## Replaces the old X-Script-Name proxy header set via a configuration-snippet
## annotation, which the ingress-nginx admission webhook now rejects. Must match
## ingress.context above (served at https://<domain>/pgadmin).
script-name: "/pgadmin"
cookie-protection: "True"
ui-languages: "{'en': 'English'}"
enable-save-password: "False"
max-query-history: "50"
max-login-attempts: "5"
shared-storage: "[{'name': 'Shared Folder', 'path': '/var/lib/pgadmin/shared_folder', 'restricted_access': True}]"

persistence:
  enabled: false
  storageClassName: default
  accessMode: ReadWriteOnce
  volumeMode: Filesystem
  ## Must be set whenever persistence.enabled is true -- an empty
  ## resources.requests.storage makes the PVC invalid and fails the sync.
  dataDirSize: 1Gi
  ## Reclaim policy for the statically provisioned PV only (see pv.yaml).
  reclaimPolicy: Retain
  ##
  ## Leave the backends below unset to use DYNAMIC provisioning: only the PVC is
  ## created and storageClassName's provisioner supplies the volume. This is the
  ## path used on AKS (`default` -> disk.csi.azure.com).
  ##
  ## Set exactly one of these for STATIC provisioning against a pre-created disk.
  ## On AKS use azureCsi -- the in-tree `azure` source below was removed in
  ## Kubernetes 1.31 and will not bind on a current AKS cluster.
#  azureCsi:
#    diskUri: /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Compute/disks/pgadmin-data
#    fsType: ext4
#  aws:
#    volumeId: "value"
#    zone: ap-south-1a
#  azure:
#    diskName: zookeeper-0
#    diskUri: value
#  openstack: f37a03aa-6212-4c62-a805-9ce139fab180
#  iscsi:
#    targetPortal: 192.0.2.100:3260
#    iqn: iqn.2017-10.local.example.server:disk1

extraVolumes: |
  - name: config
    configMap:
      name: {{ .Chart.Name }}-config
  - name: storage
    persistentVolumeClaim:
      claimName: {{ .Chart.Name }}-data

extraVolumeMounts: |
  - mountPath: /pgadmin4/servers.json
    name: config
    subPath: servers.json
    readOnly: true
  - mountPath: /pgadmin4/config_local.py
    name: config
    subPath: config_local.py
    readOnly: true
  - mountPath: /var/lib/pgadmin
    name: storage

securityContext:
  fsGroup: 5050

# Additional Container Envs
env: |
  - name: PGADMIN_DEFAULT_EMAIL
    valueFrom:
      secretKeyRef:
        name: pgadmin
        key: admin-email
  - name: PGADMIN_DEFAULT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: pgadmin
        key: admin-password
  - name: CONFIG_DATABASE_CONNECTION_POOL_SIZE
    value: "5"
  - name: PGADMIN_LISTEN_PORT
    value: {{ .Values.httpPort | quote }}
  - name: PGADMIN_DISABLE_POSTFIX
    value: "true"
