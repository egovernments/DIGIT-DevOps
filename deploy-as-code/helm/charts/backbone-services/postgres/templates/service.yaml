# service.yaml
# Client (ClusterIP) service — this is the name DIGIT services connect to.
apiVersion: v1
kind: Service
metadata:
  name: {{ template "common.name" . }}
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- else }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
{{- include "common.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: tcp-postgresql
      port: {{ .Values.service.port }}
      targetPort: tcp-postgresql
      protocol: TCP
  selector:
{{- include "common.labels" . | nindent 4 }}
---
# Headless service — provides stable per-pod DNS for the StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ template "common.name" . }}-hl
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- else }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
{{- include "common.labels" . | nindent 4 }}
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: tcp-postgresql
      port: {{ .Values.service.port }}
      targetPort: tcp-postgresql
      protocol: TCP
  selector:
{{- include "common.labels" . | nindent 4 }}
