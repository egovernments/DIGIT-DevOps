# Chart-managed Zookeeper config. The zookeeper image generates this file at start when it is
# missing, which needs a writable /conf; the pod runs non-root, so the chart ships it instead.
# Values mirror the image defaults plus the autopurge settings from PostHog's compose file.
dataDir=/data
dataLogDir=/datalog
clientPort=2181
tickTime=2000
initLimit=5
syncLimit=2
autopurge.snapRetainCount=3
autopurge.purgeInterval=1
maxClientCnxns=60
standaloneEnabled=true
admin.enableServer=true
4lw.commands.whitelist=srvr,ruok,mntr,conf
