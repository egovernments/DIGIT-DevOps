{{- if .Values.networkPolicy.enabled }}
{{- $selector := include "posthog.selectorLabels" (list . "router") | fromYaml }}
---
# Default deny ingress for every pod of this release; pods of the release may talk to each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "posthog.fullname" . }}-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "posthog.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "posthog.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
---
# The router's ingest listener is reachable from the configured peers (ingress controller, tunnel);
# the app listener only from the identity-aware proxy. Empty lists mean nobody outside the release.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "posthog.fullname" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- with .Values.networkPolicy.ingestIngressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.router.ports.ingest }}
    {{- end }}
    {{- with .Values.networkPolicy.appIngressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.router.ports.app }}
    {{- end }}
{{- end }}
