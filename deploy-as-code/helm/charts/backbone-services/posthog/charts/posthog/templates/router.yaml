{{- /*
Router: Caddy with two listeners generated from upstream's Caddyfile routes.
  app    (:8080) everything, meant to sit behind an identity-aware proxy or private ingress
  ingest (:8081) only the paths SDKs need; identity headers are stripped
*/ -}}
{{- $up := include "posthog.upstream" . | fromYaml -}}
{{- $root := . -}}
{{- $r := .Values.router -}}
{{- $name := include "posthog.serviceName" (list . "router") -}}
{{- $web := printf "%s:8000" (include "posthog.serviceName" (list . "web")) -}}
{{- define "posthog.routerHandles" -}}
{{- $root := index . 0 }}{{ $routes := index . 1 }}
{{- range $routes }}
{{- if and (not .fallback) (not .excluded) }}
{{- $svcOv := index $root.Values.services .service | default dict }}
{{- $svcEnabled := ternary $svcOv.enabled true (hasKey $svcOv "enabled") }}
{{- if and $svcEnabled (or (not .optional) (hasKey $root.Values.services .service)) }}
    @{{ .name }} {
{{- range .paths }}
        path {{ . }}
{{- end }}
    }
    handle @{{ .name }} {
{{- with .stripPrefix }}
        uri strip_prefix {{ . }}
{{- end }}
        reverse_proxy {{ include "posthog.serviceName" (list $root .service) }}:{{ .port }} {
{{- if .streaming }}
            flush_interval -1
{{- end }}
        }
    }
{{- end }}
{{- end }}
{{- end }}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
data:
  Caddyfile: |
    {
        admin off
        auto_https off
        servers {
            trusted_proxies static private_ranges
        }
    }

    # app listener: full UI and API
    :{{ $r.ports.app }} {
        request_body {
            max_size 64MB
        }
        handle /_router/healthz {
            respond "ok" 200
        }
{{ include "posthog.routerHandles" (list . $up.routes) | indent 4 }}
        handle {
            reverse_proxy {{ $web }}
        }
    }

    # ingest listener: SDK traffic only, identity headers dropped
    :{{ $r.ports.ingest }} {
        request_body {
            max_size 64MB
        }
{{- range $r.stripHeaders }}
        request_header -{{ . }}
{{- end }}
        handle /_router/healthz {
            respond "ok" 200
        }
{{ include "posthog.routerHandles" (list . $up.routes) | indent 4 }}
        @web-public {
{{- range $r.ingest.webPaths }}
            path {{ . }}
{{- end }}
        }
        handle @web-public {
            reverse_proxy {{ $web }}
        }
        handle {
            respond "not found" 404
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: {{ $r.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" (list . "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" (list . "router") | nindent 8 }}
      annotations:
        checksum/caddyfile: {{ include "posthog.routerHandles" (list . $up.routes) | sha256sum | trunc 16 }}
        checksum/router-values: {{ toYaml $r | sha256sum | trunc 16 }}
    spec:
      {{- include "posthog.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "posthog.selectorLabels" (list . "router") | nindent 14 }}
      containers:
        - name: caddy
          image: {{ include "posthog.chartImage" (list $ $r.image) | quote }}
          imagePullPolicy: IfNotPresent
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/config
            - name: XDG_DATA_HOME
              value: /tmp/data
          ports:
            - name: app
              containerPort: {{ $r.ports.app }}
            - name: ingest
              containerPort: {{ $r.ports.ingest }}
          readinessProbe:
            httpGet: {path: /_router/healthz, port: ingest}
            periodSeconds: 10
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The caddy image carries cap_net_bind_service as a file capability with the
            # effective bit; exec fails with EPERM unless the capability is permitted.
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: ClusterIP
  selector:
    {{- include "posthog.selectorLabels" (list . "router") | nindent 4 }}
  ports:
    - name: app
      port: {{ $r.ports.app }}
      targetPort: app
    - name: ingest
      port: {{ $r.ports.ingest }}
      targetPort: ingest
{{- if and $r.podDisruptionBudget.enabled (gt (int $r.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  minAvailable: {{ $r.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" (list . "router") | nindent 6 }}
{{- end }}
{{- if $r.ingress.enabled }}
{{- $hosts := $r.ingress.hosts }}
{{- if not $hosts }}
{{- $hosts = list (dict "host" (include "posthog.siteHost" .) "listener" "app") }}
{{- if ne (include "posthog.publicHost" .) (include "posthog.siteHost" .) }}
{{- $hosts = append $hosts (dict "host" (include "posthog.publicHost" .) "listener" "ingest") }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
  {{- with $r.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $r.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $r.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: {{ .listener | default "app" }}
    {{- end }}
{{- end }}
