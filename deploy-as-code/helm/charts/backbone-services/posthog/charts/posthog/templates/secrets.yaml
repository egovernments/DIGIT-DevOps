{{- /*
Chart-managed secret. Every key can be redirected to an existing Secret via values.secrets.keys,
posthog.existingSecret, postgresql.external.existingSecret or objectStorage.existingSecret; keys
that are redirected are simply not rendered here. Missing values are generated once and reused on
upgrades through `lookup` (not available in `helm template` / Argo CD: set values there).
*/ -}}
{{- $name := include "posthog.envSecretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $out := dict -}}
{{- $gen := .Values.secrets.generate -}}
{{- define "posthog.secretValue" -}}
{{- /* args: existing, key, explicit, generator, generate */ -}}
{{- $existing := index . 0 }}{{ $key := index . 1 }}{{ $explicit := index . 2 }}{{ $length := index . 3 }}{{ $gen := index . 4 -}}
{{- if $explicit }}{{ $explicit }}
{{- else if hasKey $existing $key }}{{ index $existing $key | b64dec }}
{{- else if $gen }}{{ randAlphaNum $length }}
{{- else }}{{ fail (printf "secret key %s has no value: set it in values, map it with secrets.keys, or enable secrets.generate" $key) }}
{{- end }}
{{- end -}}
{{- $owned := list -}}
{{- $gw := .Values.geminiGateway.enabled -}}
{{- range $k := concat (ternary (list "GEMINI_API_KEY" "AI_GATEWAY_API_KEY") (list) $gw) (list "SECRET_KEY" "ENCRYPTION_SALT_KEYS" "BROWSERLESS_TOKEN" "INTERNAL_API_SECRET" "INTERNAL_REQUEST_TOKEN" "RECORDING_API_JWT_SECRET" "ANTHROPIC_API_KEY" "OPENAI_API_KEY" "DATABASE_URL" "PGUSER" "PGPASSWORD" "CLICKHOUSE_API_PASSWORD" "CLICKHOUSE_APP_PASSWORD" "CLICKHOUSE_BILLING_PASSWORD" "CLICKHOUSE_DICT_READER_PASSWORD" "CLICKHOUSE_SIGNALS_PASSWORD" "OBJECT_STORAGE_ACCESS_KEY_ID" "OBJECT_STORAGE_SECRET_ACCESS_KEY" "SESSION_RECORDING_ACCESS_KEY_ID" "SESSION_RECORDING_SECRET_ACCESS_KEY") }}
{{- if hasPrefix (printf "%s/" $name) (include "posthog.secretRef" (list $ $k)) }}{{ $owned = append $owned $k }}{{ end }}
{{- end -}}
{{- $s := .Values.posthog.secrets -}}
{{- $pg := .Values.postgresql -}}
{{- $pgPassword := "" -}}
{{- if $pg.external.host }}{{ $pgPassword = $pg.external.password }}{{ else }}{{ $pgPassword = include "posthog.secretValue" (list $existing "PGPASSWORD" $pg.auth.password 32 $gen) }}{{ end -}}
{{- $pgUser := ternary $pg.external.username $pg.auth.username (not (empty $pg.external.host)) -}}
{{- $pgHost := include "posthog.host" (list . "postgresql") -}}
{{- $pgPort := ternary $pg.external.port 5432 (not (empty $pg.external.host)) -}}
{{- $pgDb := ternary $pg.external.database $pg.auth.database (not (empty $pg.external.host)) -}}
{{- $os := .Values.objectStorage -}}
{{- $bundledOs := and $os.bundled.enabled (not $os.endpoint) -}}
{{- $osKey := ternary "any" $os.accessKeyId $bundledOs -}}
{{- $osSecret := ternary "any" $os.secretAccessKey $bundledOs -}}
{{- $sr := .Values.sessionReplay.storage -}}
{{- $values := dict
  "SECRET_KEY" (include "posthog.secretValue" (list $existing "SECRET_KEY" $s.secretKey 50 $gen))
  "ENCRYPTION_SALT_KEYS" (include "posthog.secretValue" (list $existing "ENCRYPTION_SALT_KEYS" $s.encryptionSaltKeys 32 $gen))
  "BROWSERLESS_TOKEN" (include "posthog.secretValue" (list $existing "BROWSERLESS_TOKEN" $s.browserlessToken 40 $gen))
  "INTERNAL_API_SECRET" (include "posthog.secretValue" (list $existing "INTERNAL_API_SECRET" $s.internalApiSecret 40 $gen))
  "INTERNAL_REQUEST_TOKEN" (include "posthog.secretValue" (list $existing "INTERNAL_REQUEST_TOKEN" $s.internalRequestToken 64 $gen))
  "RECORDING_API_JWT_SECRET" (include "posthog.secretValue" (list $existing "RECORDING_API_JWT_SECRET" $s.recordingApiJwtSecret 64 $gen))
  "ANTHROPIC_API_KEY" $s.anthropicApiKey
  "OPENAI_API_KEY" $s.openaiApiKey
  "PGUSER" $pgUser
  "PGPASSWORD" $pgPassword
  "DATABASE_URL" (printf "postgres://%s:%s@%s:%v/%s" $pgUser $pgPassword $pgHost $pgPort $pgDb)
  "CLICKHOUSE_API_PASSWORD" (include "posthog.secretValue" (list $existing "CLICKHOUSE_API_PASSWORD" .Values.clickhouse.users.api 32 $gen))
  "CLICKHOUSE_APP_PASSWORD" (include "posthog.secretValue" (list $existing "CLICKHOUSE_APP_PASSWORD" .Values.clickhouse.users.app 32 $gen))
  "CLICKHOUSE_BILLING_PASSWORD" (include "posthog.secretValue" (list $existing "CLICKHOUSE_BILLING_PASSWORD" .Values.clickhouse.users.billing 32 $gen))
  "CLICKHOUSE_DICT_READER_PASSWORD" (include "posthog.secretValue" (list $existing "CLICKHOUSE_DICT_READER_PASSWORD" .Values.clickhouse.users.dictReader 32 $gen))
  "CLICKHOUSE_SIGNALS_PASSWORD" (include "posthog.secretValue" (list $existing "CLICKHOUSE_SIGNALS_PASSWORD" .Values.clickhouse.users.signals 32 $gen))
  "OBJECT_STORAGE_ACCESS_KEY_ID" $osKey
  "OBJECT_STORAGE_SECRET_ACCESS_KEY" $osSecret
  "SESSION_RECORDING_ACCESS_KEY_ID" ($sr.accessKeyId | default $osKey)
  "SESSION_RECORDING_SECRET_ACCESS_KEY" ($sr.secretAccessKey | default $osSecret)
-}}
{{- if $gw }}
{{- $_ := set $values "GEMINI_API_KEY" .Values.geminiGateway.geminiApiKey }}
{{- $_ := set $values "AI_GATEWAY_API_KEY" (include "posthog.secretValue" (list $existing "AI_GATEWAY_API_KEY" .Values.geminiGateway.token 48 $gen)) }}
{{- end }}
{{- if and (not $bundledOs) (not $os.existingSecret) (not $os.accessKeyId) (not (index .Values.secrets.keys "OBJECT_STORAGE_ACCESS_KEY_ID")) }}
{{- fail "objectStorage.endpoint is set: provide accessKeyId/secretAccessKey, objectStorage.existingSecret or secrets.keys mappings" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $k := $owned }}
  {{ $k }}: {{ index $values $k | b64enc }}
{{- end }}
