- name: objectstorage
  paths:
  - /posthog
  - /posthog/
  - /posthog/*
  service: objectstorage
  port: 19000
  excluded: true
- name: app
  paths:
  - /*
  service: web
  port: 8000
  fallback: true
aliases:
  db:
    helper: postgresql
  redis7:
    helper: redis
  valkey:
    helper: valkey
  kafka:
    helper: kafka
  clickhouse:
    helper: clickhouse
  temporal:
    helper: temporal
  web:
    service: web
  plugins:
    service: plugins
  recording-api:
    service: recording-api
  feature-flags:
    service: feature-flags
  hypercache-server:
    service: hypercache-server
  livestream:
    service: livestream
  personhog-router:
    service: personhog-router
  personhog-replica:
    service: personhog-replica
  cymbal:
    service: cymbal
  cymbal-resolution:
    service: cymbal-resolution
  browserless:
    service: browserless
  capture:
    service: capture
  capture-ai:
    service: capture-ai
  replay-capture:
    service: replay-capture
  capture-logs:
    service: capture-logs
  seaweedfs:
    storage: true
  objectstorage:
    storage: true
imageDirs:
- posthog/idl
- posthog/user_scripts
- share
