# Everything under `posthog:` is passed to the vendored chart in charts/posthog,
# whose own values.yaml holds the defaults. Environment overrides go in the
# `posthog:` block of environments/unified-<env>.yaml.
posthog:
  # Fixed resource names (posthog-web, posthog-postgresql, ...) whatever the Argo
  # CD release name is. cluster-configs' posthog-db secret builds DATABASE_URL
  # against posthog-postgresql.
  fullnameOverride: posthog
