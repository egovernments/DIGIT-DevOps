{{ template "vault.mode" . }}
{{- if ne .mode "external" }}
{{- template "vault.serverServiceEnabled" . -}}
{{- if .serverServiceEnabled -}}
{{- if eq .mode "ha" }}
{{- if eq (.Values.vault.server.service.active.enabled | toString) "true" }}
# Service for active Vault pod
apiVersion: v1
kind: Service
metadata:
  name: {{ template "vault.fullname" . }}-active
  namespace: {{ include "vault.namespace" . }}
  labels:
    helm.sh/chart: {{ include "vault.chart" . }}
    app.kubernetes.io/name: {{ include "vault.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    vault-active: "true"
  annotations:
{{- template "vault.service.active.annotations" . }}
{{- template "vault.service.annotations" . }}
spec:
  {{- if .Values.vault.server.service.type}}
  type: {{ .Values.vault.server.service.type }}
  {{- end}}
  {{- if (semverCompare ">= 1.23-0" .Capabilities.KubeVersion.Version) }}
  {{- if .Values.vault.server.service.ipFamilyPolicy }}
  ipFamilyPolicy: {{ .Values.vault.server.service.ipFamilyPolicy }}
  {{- end }}
  {{- if .Values.vault.server.service.ipFamilies }}
  ipFamilies: {{ .Values.vault.server.service.ipFamilies | toYaml | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- if .Values.vault.server.service.clusterIP }}
  clusterIP: {{ .Values.vault.server.service.clusterIP }}
  {{- end }}
  {{- include "service.externalTrafficPolicy" .Values.vault.server.service }}
  publishNotReadyAddresses: {{ .Values.vault.server.service.publishNotReadyAddresses }}
  ports:
    - name: {{ include "vault.scheme" . }}
      port: {{ .Values.vault.server.service.port }}
      targetPort: {{ .Values.vault.server.service.targetPort }}
      {{- if and (.Values.vault.server.service.activeNodePort) (eq (.Values.vault.server.service.type | toString) "NodePort") }}
      nodePort: {{ .Values.vault.server.service.activeNodePort }}
      {{- end }}
    - name: https-internal
      port: 8201
      targetPort: 8201
  selector:
    app.kubernetes.io/name: {{ include "vault.name" . }}
    {{- if eq (.Values.vault.server.service.instanceSelector.enabled | toString) "true" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- end }}
    component: server
    vault-active: "true"
{{- end }}
{{- end }}
{{- end }}
{{- end }}
