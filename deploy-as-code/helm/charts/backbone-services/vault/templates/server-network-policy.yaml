{{- if eq (.Values.vault.server.networkPolicy.enabled | toString) "true"  }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "vault.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ template "vault.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ template "vault.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  ingress: {{- toYaml .Values.vault.server.networkPolicy.ingress | nindent 4 }}
  {{- if .Values.vault.server.networkPolicy.egress }}
  egress:
  {{- toYaml .Values.vault.server.networkPolicy.egress | nindent 4 }}
  {{ end }}
{{ end }}
