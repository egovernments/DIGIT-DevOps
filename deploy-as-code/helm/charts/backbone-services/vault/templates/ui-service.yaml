{{ template "vault.mode" . }}
{{- if ne .mode "external" }}
{{- template "vault.uiEnabled" . -}}
{{- if .uiEnabled -}}

apiVersion: v1
kind: Service
metadata:
  name: {{ template "vault.fullname" . }}-ui
  namespace: {{ include "vault.namespace" . }}
  labels:
    helm.sh/chart: {{ include "vault.chart" . }}
    app.kubernetes.io/name: {{ include "vault.name" . }}-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- template "vault.ui.annotations" . }}
spec:
  {{- if (semverCompare ">= 1.23-0" .Capabilities.KubeVersion.Version) }}
  {{- if .Values.vault.ui.serviceIPFamilyPolicy }}
  ipFamilyPolicy: {{ .Values.vault.ui.serviceIPFamilyPolicy }}
  {{- end }}
  {{- if .Values.vault.ui.serviceIPFamilies }}
  ipFamilies: {{ .Values.vault.ui.serviceIPFamilies | toYaml | nindent 2 }}
  {{- end }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "vault.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    component: server
    {{- if and (.Values.vault.ui.activeVaultPodOnly) (eq .mode "ha") }}
    vault-active: "true"
    {{- end }}
  publishNotReadyAddresses: {{ .Values.vault.ui.publishNotReadyAddresses }}
  ports:
    - name: {{ include "vault.scheme" . }}
      port: {{ .Values.vault.ui.externalPort }}
      targetPort: {{ .Values.vault.ui.targetPort }}
      {{- if .Values.vault.ui.serviceNodePort }}
      nodePort: {{ .Values.vault.ui.serviceNodePort }}
      {{- end }}
  type: {{ .Values.vault.ui.serviceType }}
  {{- include "service.externalTrafficPolicy" .Values.vault.ui }}
  {{- include "service.loadBalancer" .Values.vault.ui }}
{{- end -}}
{{- end }}
