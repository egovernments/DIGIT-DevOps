# Sample environment override block for the dev-bundle chart —
# paste into environments/<env>.yaml and fill in the image tags.
dev-bundle:
  image:
    repository: dev-bundle
    tag: "<bundle-image-tag>"
  # Any single env var can be overridden (maps deep-merge):
  # env:
  #   DB_HOST: {value: "postgres.egov"}
  #   TENANT_MIGRATION_ENABLED: {value: "true"}
  #   FILESTORE_S3_SOURCE: {value: "s3"}    # flip a dev pin from the bundle jar
  dbMigrations:
    idgen:
      image: {repository: idgen-java-db, tag: "<tag>"}
    template-config:
      image: {repository: template-config-java-db, tag: "<tag>"}
    billing:
      image: {repository: billing-java-db, tag: "<tag>"}
    apportion:
      image: {repository: apportion-db, tag: "<tag>"}
    url-shortener:
      image: {repository: url-shortener-java-db, tag: "<tag>"}
    pg-service:
      image: {repository: pg-service-db, tag: "<tag>"}
    otp:
      image: {repository: otp-java-db, tag: "<tag>"}
    notification:
      image: {repository: notification-java-db, tag: "<tag>"}
    employee:
      image: {repository: employee-java-db, tag: "<tag>"}
    individual:
      image: {repository: individual-db, tag: "<tag>"}
    workflow:
      image: {repository: workflow-java-db, tag: "<tag>"}
    registry:
      image: {repository: registry-java-db, tag: "<tag>"}
    filestore:
      image: {repository: filestore-java-db, tag: "<tag>"}
    localization:
      image: {repository: localization-java-db, tag: "<tag>"}
    account:
      image: {repository: account-java-db, tag: "<tag>"}
    boundary:
      image: {repository: boundary-java-db, tag: "<tag>"}
