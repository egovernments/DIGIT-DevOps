{{- include "superset.init" . -}}
{{- if .Values.beat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-beat
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
    component: beat
spec:
  replicas: 1  # Beat should always be 1 replica
  selector:
    matchLabels:
      app: {{ .Values.name }}
      component: beat
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
        component: beat
      annotations:
        # See deployment-web.yaml: a mounted ConfigMap changing does not restart
        # the container, so the pod would keep the previous superset_config.py
        # while Argo CD reported Synced.
        checksum/superset-config: {{ include (print $.Template.BasePath "/configmap-superset.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        - name: docker-registry-secret
      initContainers:
      containers:
        - name: beat
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          env:
            - name: SUPERSET_ENV
              value: "production"
          volumeMounts:
            - name: superset-config
              mountPath: /app/pythonpath
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              export PYTHONPATH="/python-packages:/app/pythonpath:$PYTHONPATH"
              exec celery --app=superset.tasks.celery_app:app beat \
                --loglevel={{ .Values.beat.logLevel }} \
                --schedule /tmp/celerybeat-schedule
          resources:
            {{- toYaml .Values.beat.resources | nindent 12 }}
      volumes:
        - name: superset-config
          configMap:
            name: {{ .Values.name }}-config
{{- end }}
