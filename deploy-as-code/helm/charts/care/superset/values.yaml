# Care Analytics (Apache Superset) Helm Chart Values
# Deploy analytics platform with /analytics context path

# General configuration
name: superset
namespace: care
contextPath: /analytics

# labels used by common.* templates (ingress)
labels:
  app: "superset"
  group: "care"

# Docker image configuration
# egovio/superset is ghcr.io/care-ecosystem/superset with the six Python
# packages below already installed into /python-packages (which PYTHONPATH puts
# first). They used to be pip-installed by an init container on EVERY pod start,
# so web/worker/beat could not start unless pypi.org was reachable at that
# moment -- on 2026-11-20 PyPI blocked unified-dev's egress IP and all three
# pods hung in Init:1/2, silently, with no crash-loop and no alert.
# Rebuild: see charts/care/superset/image/ (Dockerfile + README). It is
# pinned to a base digest, so a rebuild reproduces this image.
# Use a dated tag, never :latest -- the whole point is a reproducible pod start.
image:
  repository: egovio/superset
  tag: care-20261120
  pullPolicy: IfNotPresent

# Database configuration — host is environment-specific, overridden from
# unified-care-*.yaml (superset.database.host). Real creds/URI come from superset-secret.
database:
  host: postgres   # placeholder; set per-env in unified-care-*.yaml
  port: 5432
  name: superset
  user: superset
  # Password should be provided in secrets

# Redis configuration
redis:
  host: redis.backbone.svc.cluster.local
  port: 6379
  celeryDb: "0"
  resultsDb: "1"

# Cache configuration
cache:
  timeout: 300
  keyPrefix: "superset_"

# Query configuration
query:
  maxRows: 100000
  asyncTimeLimit: 300
  webserverTimeout: 60

# Session configuration
session:
  lifetime: 43200  # 12 hours in seconds

# Feature flags
features:
  alertReports: true
  dashboardRbac: true
  crossFilters: true
  templateProcessing: true
  drillToDetail: true
  drillBy: true

# Branding
branding:
  appName: "CARE Analytics"
  appIcon: "/static/assets/images/superset-logo.png"
  iconWidth: 126
  favicon: "/static/assets/images/favicon.png"
  primaryColor: "#006064"  # Teal color for CARE

# Secrets configuration
secrets:
  create: false  # Set to true to create secret from chart, or use existing secret
  name: superset-secret  # Name of secret (existing or to be created)
  data: {}
    # If create: true, provide base64 encoded values:
    # SECRET_KEY: "your-secret-key"
    # ADMIN_PASSWORD: "your-admin-password"
    # SQLALCHEMY_DATABASE_URI: "postgresql://user:pass@host:5432/dbname"
    # DB_HOST: "postgres-care-rw.care.svc.cluster.local"
    # DB_PORT: "5432"
    # REDIS_HOST: "redis.backbone.svc.cluster.local"
    # REDIS_PORT: "6379"

# Web deployment configuration
web:
  enabled: true
  replicas: 1

  # Gunicorn configuration
  gunicorn:
    workers: 4
    workerClass: gthread
    threads: 20
    timeout: 60
    keepAlive: 2
    maxRequests: 1000
    maxRequestsJitter: 100
    logLevel: info

  # Health probes
  probes:
    startup:
      initialDelay: 15
      timeout: 3
      failureThreshold: 60
      period: 5
    liveness:
      initialDelay: 15
      timeout: 3
      failureThreshold: 3
      period: 30
    readiness:
      initialDelay: 15
      timeout: 3
      failureThreshold: 3
      period: 15

  # Resources
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # Nginx sidecar configuration
  nginx:
    image: nginx:1.27-alpine
    port: 8080
    clientMaxBodySize: "100M"
    proxyTimeout: 300
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

# Worker deployment configuration
worker:
  enabled: true
  replicas: 1
  poolType: prefork
  concurrency: 4
  logLevel: info

  # Health probes
  probes:
    initialDelay: 120
    timeout: 60
    failureThreshold: 3
    period: 60

  # Resources
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# Beat deployment configuration
beat:
  enabled: true
  logLevel: info

  # Resources
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Authentication. Default is FAB's AUTH_DB (username/password held by Superset).
auth:
  oauth:
    # Requires OAUTH_CLIENT_ID and OAUTH_CLIENT_SECRET in the superset secret;
    # with it on and those absent, login fails for everyone, so enable it per
    # environment rather than here.
    enabled: false
    # The org that scopes everything below. Empty disables self-registration
    # entirely -- see the ConfigMap template for why.
    githubOrg: ""
    # GitHub team slug -> Superset roles. When set, membership of one of these
    # teams IS the access grant: an account in none of them is refused even if
    # it belongs to the org. Leave empty to fall back to org membership alone.
    # Slugs, not display names: "CARE Analytics" has the slug "care-analytics".
    teamRoles: {}
    # Baseline role every accepted user gets, on top of their team roles.
    # Gamma reads the dashboards and datasets it is granted; Alpha can also add
    # datasources; sql_lab is additive and grants SQL Lab.
    defaultRole: Gamma
    selfRegistration: true
    # Re-derive roles from GitHub on each login. Leaving this on means a team
    # change takes effect at next login -- and that roles assigned by hand in
    # the UI do not survive one.
    syncRolesAtLogin: true

# Init containers configuration
# Only the wait-for-postgres-redis container remains. The former
# install-python-packages container is gone: psycopg2-binary==2.9.13,
# clickhouse-connect==1.13.0, lz4==4.4.5, backports.zstd==1.8.0,
# authlib==1.9.8 and joserfc==1.8.0 are baked into the image (see image
# above) instead of being downloaded at every pod start.
#
# Why they are pinned and installed --no-deps, in case they are ever changed:
# clickhouse-connect[sqlalchemy] would drag SQLAlchemy 2.x over the 1.4.54
# Superset is built against; lz4 and backports.zstd are clickhouse-connect's
# compression codecs, which the base image does not ship; authlib and joserfc
# are required by AUTH_TYPE = AUTH_OAUTH, because FAB's BaseSecurityManager
# imports authlib.integrations.flask_client at init. Changing the list means
# rebuilding and repushing the image, then bumping image.tag above.
initContainers:
  waitImage: busybox:latest
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Database initialization job
initJob:
  enabled: true  # runs superset db upgrade + fab create-admin (ADMIN_PASSWORD from superset-secret)
  ttl: 86400  # 24 hours - time to keep completed job pods
  adminUsername: admin
  adminEmail: jagan.kumar@egovernments.org
  loadExamples: false  # Set to true to load example dashboards
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Ingress — rendered via the shared common.ingress template.
# host = global.domain, path = /{{ .Values.ingress.context }}, tls secret = <domain>-tls-certs.
# enabled is turned on per-environment (unified-care-*.yaml).
ingress:
  enabled: false
  context: analytics          # -> /analytics
  servicePort: 8080           # superset Service port (nginx sidecar)
  waf:
    enabled: false            # analytics UI; no lua WAF
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
