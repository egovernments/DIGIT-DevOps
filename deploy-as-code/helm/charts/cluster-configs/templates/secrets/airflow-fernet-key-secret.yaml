{{- with index .Values "cluster-configs" "secrets" "airflow-fernet-key" }}
{{- if index . "fernet-key" }}
{{- $cfg := . }}
{{- $namespaces := .namespace }}
{{- if kindIs "string" $namespaces }}{{- $namespaces = list $namespaces }}{{- end }}
{{- range $ns := $namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name | default "backbone-airflow-fernet-key" }}
  namespace: {{ $ns }}
type: Opaque
data:
  # Already a urlsafe-base64 encoding of 32 raw bytes (what Fernet requires);
  # b64enc here is the second, Kubernetes-level encoding of the data field.
  fernet-key: {{ index $cfg "fernet-key" | b64enc | quote }}
{{- end }}
---
{{- end }}
{{- end }}
