{{- /*
  CREST's own credentials, separate from the db Secret the postgresql reconciler owns.
  Today that is just the OpenAI key the service calls out with; keep further CREST-only
  credentials here rather than minting a Secret per key.

  Values live in <env>-secrets.yaml (SOPS); this file and the env values only name the
  Secret and the namespaces it lands in. One document per namespace, like db-secret.yaml:
  a single `---` before the range leaves every namespace but the last unapplied.
*/}}
{{- with index .Values "cluster-configs" "secrets" "crest" }}
{{- if .openaiApiKey }}
{{- $c := . }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $c.name }}
  namespace: {{ $ns }}
type: Opaque
stringData:
  openai-api-key: {{ $c.openaiApiKey | quote }}
{{- end }}
{{- end }}
{{- end }}
