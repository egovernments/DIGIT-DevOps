{{/*
db-common-secrets — the MOSIP shared database-password convention.

mock-identity-system references Secret/db-common-secrets key db-dbuser-password
by fixed name and creates nothing. Unlike the Inji modules, whose values files
we control and point at per-module keys in `inji-db`, this chart's reference is
hardcoded, so the secret has to exist under that exact name.

It carries ONLY the mock-identity role's password, not a shared one for every
module. The per-module separation established by inji-db-init (one role per
module, each with its own CONNECTION LIMIT) is preserved; this is just the name
the upstream chart insists on.

Gated on mockidPassword being set, like the other secret templates, so adding
this file cannot break a cluster-configs sync before the SOPS value exists.
*/}}
{{- with index .Values "cluster-configs" "secrets" "db-common-secrets" }}
{{- if index . "mockidPassword" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "db-common-secrets" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  db-dbuser-password: {{ index $.Values "cluster-configs" "secrets" "db-common-secrets" "mockidPassword" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
