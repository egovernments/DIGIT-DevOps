{{- with index .Values "cluster-configs" "secrets" "debezium-db" }}
{{- if index . "password" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "debezium-db" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  username: {{ index $.Values "cluster-configs" "secrets" "debezium-db" "username" | default "debezium" | b64enc | quote }}
  password: {{ index $.Values "cluster-configs" "secrets" "debezium-db" "password" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
