{{- $filestore := index .Values "egov-filestore" }}
{{- if $filestore }}
{{- with index .Values "cluster-configs" "secrets" "egov-filestore" }}
{{- if and (index $filestore "is-s3-enabled") (index . "aws-secret-key") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  awskey: {{ index . "aws-key" | b64enc | quote }}
  awssecretkey: {{ index . "aws-secret-key" | b64enc | quote }}
{{- else if and (index $filestore "is-azure-enabled") (index . "account-key") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  account-name: {{ index . "account-name" | b64enc | quote }}
  account-key: {{ index . "account-key" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
