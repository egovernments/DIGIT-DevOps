{{- /*
elasticsearch-master-credentials: the Secret the elasticsearch-master and
elasticsearch-data StatefulSets and egov-indexer read (ELASTIC_PASSWORD).
Same username/password as elasticsearch-master-creds, which stays in its own
namespace for jaeger. Created only when an env lists namespaces for it:

  cluster-configs:
    secrets:
      elasticsearch-master-credentials:
        namespace: [ backbone, egov ]
*/ -}}
{{- $creds := index .Values "cluster-configs" "secrets" "elasticsearch-master-creds" | default dict }}
{{- with index .Values "cluster-configs" "secrets" "elasticsearch-master-credentials" }}
{{- if index $creds "password" }}
{{- range .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-master-credentials
  namespace: {{ . }}
type: Opaque
data:
  username: {{ index $creds "username" | default "elastic" | b64enc | quote }}
  password: {{ index $creds "password" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
