{{- with index .Values "cluster-configs" "secrets" "elasticsearch-master-creds" }}
{{- if index . "password" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  username: {{ index . "username" | default "elastic" | b64enc | quote }}
  password: {{ index . "password" | b64enc | quote }}
{{- end }}
{{- end }}
