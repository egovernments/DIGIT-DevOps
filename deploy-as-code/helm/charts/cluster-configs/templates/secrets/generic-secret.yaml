{{- /*
  Plain key/value Secrets for charts that read their credentials from an existing
  Secret (digit3/analytics superset and clickhouse, ...), so a new one needs no new
  template here. Each entry renders one Secret:

    cluster-configs:
      secrets:
        generic:
          - name: superset-secret
            namespace: superset
            data:
              SECRET_KEY: ...

  The values belong in <env>-secrets.yaml (SOPS) only; renders nothing unless the
  list is set.
*/}}
{{- range $s := (index .Values "cluster-configs" "secrets" "generic" | default list) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "cluster-configs.secrets.generic[].name" $s.name }}
  namespace: {{ required "cluster-configs.secrets.generic[].namespace" $s.namespace }}
type: Opaque
stringData:
  {{- range $k, $v := $s.data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
