{{- with index .Values "cluster-configs" "secrets" "github-config" }}
{{- if index . "gitToken" }}
---
{{- range $ns := .namespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "github-config" "name" }}
  namespace: {{ $ns }}
type: Opaque
{{- /*
  `default ""` on every key is deliberate. b64enc raises
      invalid value; expected string
  when handed a nil, and because that happens during manifest *generation* it
  does not just skip this one Secret -- it fails `helm template` outright, so
  Argo CD reports ComparisonError and renders NOTHING for the whole
  cluster-configs Application. One absent optional key would take every other
  secret in the release down with it (this is exactly what broke
  cluster-configs-unified-studio-qa: its github-config had gitToken and
  kubeToken but no kubeapiurl).

  Rendering an empty value instead keeps the rest of the release deployable and
  turns the problem into a visible, local runtime failure in whatever consumes
  the key -- studio-pdf-helper-service reads kubeapiurl/kubeToken as
  KUBE_API_URL/KUBE_TOKEN.
*/}}
data:
  gitToken: {{ index $.Values "cluster-configs" "secrets" "github-config" "gitToken" | default "" | b64enc | quote }}
  kubeToken: {{ index $.Values "cluster-configs" "secrets" "github-config" "kubeToken" | default "" | b64enc | quote }}
  kubeapiurl: {{ index $.Values "cluster-configs" "secrets" "github-config" "kubeapiurl" | default "" | b64enc | quote }}
{{- end }}
---
{{- end }}
{{- end }}