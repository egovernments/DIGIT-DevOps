{{- with index .Values "cluster-configs" "secrets" "grafana" }}
{{- if index . "clientID" }}
{{- /*
  Grafana's GitHub OAuth credentials, rendered from the SOPS-encrypted
  environments/<env>-secrets.yaml (cluster-configs.secrets.grafana).

  Why a Secret rather than chart values: monitoring-helmfile.yaml used to inline
  these into the grafana chart's `envRenderSecret`, which put the client secret
  in plaintext in the rendered manifest. Argo CD multi-source Applications
  cannot template from the env file at all, so the values overlay references
  this Secret by name via `envFromSecret: grafana` instead — the credentials
  stay encrypted in git and are only ever decrypted by the secrets plugin.

  The key names are fixed by Grafana itself: it reads any GF_* environment
  variable as config, so GF_AUTH_GITHUB_CLIENT_ID / _SECRET map onto the
  [auth.github] client_id / client_secret settings. Do not rename them.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  GF_AUTH_GITHUB_CLIENT_ID: {{ index . "clientID" | b64enc | quote }}
  GF_AUTH_GITHUB_CLIENT_SECRET: {{ index . "clientSecret" | b64enc | quote }}
{{- end }}
{{- end }}
