{{/*
Per-module Postgres passwords for the Inji stack, consumed by the
inji-db-init Job and later by each Inji module chart.

Gated on certifyPassword being set, following the same pattern as
db-secret.yaml: until the four values are SOPS-encrypted into
environments/test-lts-secrets.yaml this renders nothing at all, so adding this
template cannot break a cluster-configs sync.

The postgres SUPERUSER credentials are deliberately not duplicated here. The
existing `db` secret already carries them; `inji` just has to be added to
cluster-configs.secrets.db.namespace so that secret is created in the Inji
namespace too.
*/}}
{{- with index .Values "cluster-configs" "secrets" "inji-db" }}
{{- if index . "certifyPassword" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "inji-db" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  certify-password: {{ index $.Values "cluster-configs" "secrets" "inji-db" "certifyPassword" | b64enc | quote }}
  mimoto-password:  {{ index $.Values "cluster-configs" "secrets" "inji-db" "mimotoPassword"  | b64enc | quote }}
  verify-password:  {{ index $.Values "cluster-configs" "secrets" "inji-db" "verifyPassword"  | b64enc | quote }}
  esignet-password: {{ index $.Values "cluster-configs" "secrets" "inji-db" "esignetPassword" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
