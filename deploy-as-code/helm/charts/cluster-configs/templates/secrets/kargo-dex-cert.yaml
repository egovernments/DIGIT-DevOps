{{- with index .Values "cluster-configs" "secrets" "kargo" }}
{{- if and .dexSecret .dexSecret.enabled }}
{{- /*
  TLS cert for the standalone Dex (argo-cd/kargo/kargo-dex-application.yaml). Dex serves
  HTTPS on this cert; the Kargo API trusts its ca.crt (api.oidc.dex.byo.caCertPath). Rendered
  only when Dex SSO is configured, same guard as the kargo-dex-github secret above.
*/}}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kargo-dex-selfsigned
  namespace: {{ .dexSecret.namespace | default "kargo" }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kargo-dex-cert
  namespace: {{ .dexSecret.namespace | default "kargo" }}
spec:
  secretName: kargo-dex-cert
  issuerRef:
    name: kargo-dex-selfsigned
    kind: Issuer
  commonName: kargo-dex.kargo.svc
  dnsNames:
    - kargo-dex.kargo.svc
    - kargo-dex.kargo.svc.cluster.local
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
{{- end }}
{{- end }}
