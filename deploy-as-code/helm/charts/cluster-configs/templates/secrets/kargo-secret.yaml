{{- with index .Values "cluster-configs" "secrets" "kargo" }}
{{- if .imageCredentials }}
{{- $k := . }}
{{- range $proj := ($k.projects | default list) }}
{{- range $i, $c := $k.imageCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "image-creds-%d" $i }}
  namespace: {{ $proj }}
  labels:
    kargo.akuity.io/cred-type: image
type: Opaque
stringData:
  repoURL: {{ $c.repoURL | quote }}
  {{- if $c.repoURLIsRegex }}
  repoURLIsRegex: {{ $c.repoURLIsRegex | quote }}
  {{- end }}
  username: {{ $c.username | quote }}
  password: {{ $c.password | quote }}
{{- end }}
{{- range $i, $c := ($k.gitCredentials | default list) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "git-creds-%d" $i }}
  namespace: {{ $proj }}
  labels:
    kargo.akuity.io/cred-type: git
type: Opaque
stringData:
  repoURL: {{ $c.repoURL | quote }}
  githubAppID: {{ $c.githubAppID | quote }}
  githubAppInstallationID: {{ $c.githubAppInstallationID | quote }}
  githubAppPrivateKey: |
{{ $c.githubAppPrivateKey | indent 4 }}
{{- end }}
{{- end }}
{{- if and $k.adminSecret $k.adminSecret.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $k.adminSecret.name }}
  namespace: {{ $k.adminSecret.namespace }}
type: Opaque
stringData:
  ADMIN_ACCOUNT_PASSWORD_HASH: {{ $k.adminSecret.passwordHash | quote }}
  ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: {{ $k.adminSecret.tokenSigningKey | quote }}
{{- end }}
{{- end }}
{{- end }}
