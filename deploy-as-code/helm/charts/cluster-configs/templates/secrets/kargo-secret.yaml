{{- with index .Values "cluster-configs" "secrets" "kargo" }}
{{- if .imageCredentials }}
{{- $k := . }}
{{- range $proj := ($k.projects | default list) }}
{{- range $i, $c := $k.imageCredentials }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "image-creds-%d" $i }}
  namespace: {{ $proj }}
  labels:
    kargo.akuity.io/cred-type: image
type: Opaque
stringData:
  repoURL: {{ $c.repoURL | quote }}
  {{- if $c.repoURLIsRegex }}
  repoURLIsRegex: {{ $c.repoURLIsRegex | quote }}
  {{- end }}
  username: {{ $c.username | quote }}
  password: {{ $c.password | quote }}
{{- end }}
{{- range $i, $c := ($k.gitCredentials | default list) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "git-creds-%d" $i }}
  namespace: {{ $proj }}
  labels:
    kargo.akuity.io/cred-type: git
type: Opaque
stringData:
  repoURL: {{ $c.repoURL | quote }}
  githubAppID: {{ $c.githubAppID | quote }}
  githubAppInstallationID: {{ $c.githubAppInstallationID | quote }}
  githubAppPrivateKey: |
{{ $c.githubAppPrivateKey | indent 4 }}
{{- end }}
{{- end }}
{{- if and $k.adminSecret $k.adminSecret.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $k.adminSecret.name }}
  namespace: {{ $k.adminSecret.namespace }}
type: Opaque
stringData:
  ADMIN_ACCOUNT_PASSWORD_HASH: {{ $k.adminSecret.passwordHash | quote }}
  ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: {{ $k.adminSecret.tokenSigningKey | quote }}
{{- end }}
{{- end }}
{{- if and .dexSecret .dexSecret.enabled }}
---
{{- /*
  GitHub OAuth credentials for Kargo's bundled Dex.

  Consumed by charts/kargo/config/control-plane.yaml, which sets
      api.oidc.dex.envFrom: [{secretRef: {name: kargo-dex-github}}]
  and references the values as $GITHUB_CLIENT_ID / $GITHUB_CLIENT_SECRET in
  the github connector. Dex expands $VAR from its environment, so these key
  names are fixed by that reference and must not be renamed.

  Deliberately OUTSIDE the `if .imageCredentials` guard above: the Dex
  credentials are independent of image/git creds, and nesting them there
  would make SSO silently fail to render whenever imageCredentials is unset.
  (Note adminSecret IS still inside that guard -- pre-existing, left alone.)
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .dexSecret.name | default "kargo-dex-github" }}
  namespace: {{ .dexSecret.namespace | default "kargo" }}
type: Opaque
stringData:
  GITHUB_CLIENT_ID: {{ .dexSecret.clientID | quote }}
  GITHUB_CLIENT_SECRET: {{ .dexSecret.clientSecret | quote }}
{{- end }}
{{- if .verifyKubeconfigs }}
{{- /* Per-env read-only kubeconfigs the Kargo verification Jobs use to reach each
       target cluster. Rendered into every project namespace that runs Jobs. */}}
{{- $vk := .verifyKubeconfigs }}
{{- range $proj := (.projects | default (list "unified-core")) }}
{{- range $env, $kc := $vk }}
---
apiVersion: v1
kind: Secret
metadata:
  name: verify-kubeconfig-{{ $env }}
  namespace: {{ $proj }}
type: Opaque
stringData:
  config: |
{{ $kc | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
