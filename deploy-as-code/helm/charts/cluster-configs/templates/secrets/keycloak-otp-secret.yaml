{{- with index .Values "cluster-configs" "secrets" "keycloak-otp" }}
{{- if index . "default-otp" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "keycloak-otp" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  default-otp: {{ index $.Values "cluster-configs" "secrets" "keycloak-otp" "default-otp" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
