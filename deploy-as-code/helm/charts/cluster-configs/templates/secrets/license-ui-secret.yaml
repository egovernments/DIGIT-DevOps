{{- with index .Values "cluster-configs" "secrets" "license-ui" }}
{{- if index . "vite_posthog_key" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
 vite_posthog_key: {{ index . "vite_posthog_key" | b64enc | quote }}
 vite_posthog_host: {{ index . "vite_posthog_host" | b64enc | quote }}
{{- end }}
{{- end }}