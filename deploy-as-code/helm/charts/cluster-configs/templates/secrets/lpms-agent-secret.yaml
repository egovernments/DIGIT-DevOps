{{- /*
  Secret for the citizen chat agent, in the same form as license-certificate-secret.yaml.
  Goes in deploy-as-code/helm/charts/cluster-configs/templates/secrets/. Values come from the environment's secrets file
  (e.g. environments/test-lts-secrets.yaml, encrypted with sops):
    cluster-configs.secrets.lpms-agent.signing-key.jwk.json   the agent's token-signing key; set once, never changed
    cluster-configs.secrets.lpms-agent.token-encryption.key   the key encrypting stored LPMS logins; set once, never changed
    cluster-configs.secrets.lpms-agent.db-password            only if the agent has a database of its own (agent.dbUrl)
  Changing either key logs every citizen out of the chat (they connect again); losing the encryption key also makes
  stored logins unreadable, which is safe (people log in again).
*/ -}}
{{- with index .Values "cluster-configs" "secrets" "lpms-agent" }}
{{- if index . "token-encryption.key" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "lpms-agent" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  {{- $jwk := index $.Values "cluster-configs" "secrets" "lpms-agent" "signing-key.jwk.json" }}
  signing-key.jwk.json: {{ (kindIs "string" $jwk | ternary $jwk (toJson $jwk)) | b64enc | quote }}
  token-encryption.key: {{ index $.Values "cluster-configs" "secrets" "lpms-agent" "token-encryption.key" | b64enc | quote }}
  db-password: {{ index $.Values "cluster-configs" "secrets" "lpms-agent" "db-password" | default "" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
