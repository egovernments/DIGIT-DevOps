{{/*
Mimoto's OIDC client keystore.

Two keys, both consumed by the mimoto chart:
  oidckeystore.p12         -- mounted at /home/mosip/certs/oidckeystore.p12
                              (mosip.oidc.p12.path=certs/, .filename=oidckeystore.p12)
  oidckeystore-password    -- injected as MIMOTO_OIDC_KEYSTORE_PASSWORD, which
                              resolves ${mimoto.oidc.keystore.password} for BOTH
                              mosip.oidc.p12.password and the keymanager
                              keystore pass.

The p12 value is the base64 of the file. It goes under `data:` (already-encoded)
rather than `stringData:`, which would double-encode it and yield a keystore the
JVM cannot parse.

Gated on p12 being set, matching db-secret.yaml, so this renders nothing until
the SOPS values exist and adding the template cannot break a cluster-configs
sync.

The keypair inside must be the one registered with eSignet under the client_id
in mimoto-issuers-config.json, with alias digitlts-mimoto-certify-oidc.
*/}}
{{- with index .Values "cluster-configs" "secrets" "mimotooidc" }}
{{- if index . "p12" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "mimotooidc" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  ## Already base64 — do NOT pipe through b64enc.
  oidckeystore.p12: {{ index $.Values "cluster-configs" "secrets" "mimotooidc" "p12" | quote }}
  oidckeystore-password: {{ index $.Values "cluster-configs" "secrets" "mimotooidc" "password" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
