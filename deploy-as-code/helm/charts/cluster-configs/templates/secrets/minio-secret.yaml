{{- with index .Values "cluster-configs" "secrets" "minio" }}
{{- if index . "accesskey" }}
{{- $cfg := . }}
{{- /*
  namespace accepts a string or a list. Secrets are namespace-scoped, so any
  namespace whose workloads consume MinIO needs its own copy: the server itself
  runs in backbone, but care-backend (BUCKET_KEY/BUCKET_SECRET) runs in care and
  cannot read a secret from another namespace. String form is still honoured so
  existing single-namespace configs keep working.
*/}}
{{- $namespaces := .namespace }}
{{- if kindIs "string" $namespaces }}{{- $namespaces = list $namespaces }}{{- end }}
---
{{- range $ns := $namespaces }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $ns }}
type: Opaque
data:
  # Application credentials. Consumed by care-backend (BUCKET_KEY/BUCKET_SECRET)
  # and egov-malware-detection (AWS_KEY/AWS_SECRETKEY). These map to a scoped
  # MinIO *user* created by the chart's post-job, not to the server root.
  accesskey: {{ index $cfg "accesskey" | b64enc | quote }}
  secretkey: {{ index $cfg "secretkey" | b64enc | quote }}
  # Root/superuser credentials, deliberately distinct from the application keys
  # above: these are what you log into the MinIO Console UI with, and they carry
  # full admin rights over every bucket and user. Keeping them separate means a
  # leaked application key cannot administer the cluster, and the UI password
  # can be rotated without redeploying the services that consume the bucket.
  rootUser: {{ index $cfg "rootUser" | required "cluster-configs.secrets.minio.rootUser is required (MinIO Console login; must differ from accesskey)" | b64enc | quote }}
  rootPassword: {{ index $cfg "rootPassword" | required "cluster-configs.secrets.minio.rootPassword is required (MinIO Console login; must differ from secretkey)" | b64enc | quote }}
---
{{- end }}
{{- end }}
{{- end }}
