{{- with index .Values "cluster-configs" "secrets" "minio" }}
{{- if index . "accesskey" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  # Application credentials. Consumed by care-backend (BUCKET_KEY/BUCKET_SECRET)
  # and egov-malware-detection (AWS_KEY/AWS_SECRETKEY). These map to a scoped
  # MinIO *user* created by the chart's post-job, not to the server root.
  accesskey: {{ index . "accesskey" | b64enc | quote }}
  secretkey: {{ index . "secretkey" | b64enc | quote }}
  # Root/superuser credentials, deliberately distinct from the application keys
  # above: these are what you log into the MinIO Console UI with, and they carry
  # full admin rights over every bucket and user. Keeping them separate means a
  # leaked application key cannot administer the cluster, and the UI password
  # can be rotated without redeploying the services that consume the bucket.
  rootUser: {{ index . "rootUser" | required "cluster-configs.secrets.minio.rootUser is required (MinIO Console login; must differ from accesskey)" | b64enc | quote }}
  rootPassword: {{ index . "rootPassword" | required "cluster-configs.secrets.minio.rootPassword is required (MinIO Console login; must differ from secretkey)" | b64enc | quote }}
{{- end }}
{{- end }}
