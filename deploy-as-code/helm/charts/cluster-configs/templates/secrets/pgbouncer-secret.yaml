{{- with index .Values "cluster-configs" "secrets" "pgbouncer" }}
{{- if index . "adminPassword" }}
{{- $db := index $.Values "cluster-configs" "secrets" "db" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "pgbouncer" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  # Consumed by the pgbouncer chart via config.existingAdminSecret (env vars).
  adminUser: {{ index $.Values "cluster-configs" "secrets" "pgbouncer" "adminUser" | b64enc | quote }}
  adminPassword: {{ index $.Values "cluster-configs" "secrets" "pgbouncer" "adminPassword" | b64enc | quote }}
  # Consumed by the pgbouncer chart via config.existingUserlistSecret (mounted as
  # /etc/userlist/userlist.txt). The postgres (backend) password is sourced from the
  # db secret so there is a single source of truth for the DB credentials.
  userlist.txt: {{ printf "\"%s\" \"%s\"\n\"%s\" \"%s\"\n"
      (index $.Values "cluster-configs" "secrets" "pgbouncer" "adminUser")
      (index $.Values "cluster-configs" "secrets" "pgbouncer" "adminPassword")
      (index $db "username")
      (index $db "password") | b64enc }}
{{- end }}
{{- end }}
{{- end }}
