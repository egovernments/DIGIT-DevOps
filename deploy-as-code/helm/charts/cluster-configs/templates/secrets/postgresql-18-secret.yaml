{{- with index .Values "cluster-configs" "secrets" "postgresql-18" }}
{{- if .password }}
{{- $s := . }}
{{- /*
  Credentials for the in-cluster PostgreSQL 18 cluster
  (charts/backbone-services/postgresql-18, managed by CloudNativePG).

  TWO secrets, because CloudNativePG consumes them through different fields:

    <name>            -> spec.bootstrap.initdb.secret.name
                         owner of the application database.
    <superuserName>   -> spec.superuserSecret.name
                         the `postgres` superuser.

  Both MUST be type kubernetes.io/basic-auth with `username` and `password`
  keys -- the operator rejects an Opaque secret here, unlike the plain `db`
  secret rendered by db-secret.yaml for the external Azure server.

  IMPORTANT, and the two behave differently:
    * The superuser password IS reconciled continuously. Change it here, push,
      and the operator applies it to the running database.
    * The owner password is read ONLY at first bootstrap (initdb runs once).
      Changing it later updates the Secret but NOT the database -- rotate the
      application user with `spec.managed.roles` or an ALTER ROLE instead.
*/}}
{{- range $ns := $s.namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name }}
  namespace: {{ $ns }}
type: kubernetes.io/basic-auth
data:
  ## Must match `bootstrap.owner` in the postgresql-18 chart values, otherwise
  ## the operator creates the database owned by a role these credentials do not
  ## authenticate as.
  username: {{ $s.username | default "app" | b64enc | quote }}
  password: {{ $s.password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.superuserName | default (printf "%s-superuser" $s.name) }}
  namespace: {{ $ns }}
type: kubernetes.io/basic-auth
data:
  ## Fixed: PostgreSQL's bootstrap superuser is always `postgres`.
  username: {{ "postgres" | b64enc | quote }}
  password: {{ required "cluster-configs.secrets.postgresql-18.superuserPassword is required when password is set" $s.superuserPassword | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
