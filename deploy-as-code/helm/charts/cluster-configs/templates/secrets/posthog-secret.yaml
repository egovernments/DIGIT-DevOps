{{- /*
  Secrets for charts/backbone-services/posthog. The `posthog:` block of
  environments/unified-<env>.yaml maps every random value to these, because
  Argo CD renders without `lookup`.

  cluster-configs.secrets.posthog:
    namespace: posthog                   # set in the env file, not the secrets file
    app: {secretKey, encryptionSaltKeys, browserlessToken, internalApiSecret,
          internalRequestToken, recordingApiJwtSecret}
    db: {password}                       # bundled posthog-postgresql, user/db `posthog`
    clickhouse: {api, app, billing, dictReader, signals}

  encryptionSaltKeys is 32 hex chars and must never change once data exists.
*/}}
{{- with index .Values "cluster-configs" "secrets" "posthog" }}
{{- $ns := .namespace | default "posthog" }}
{{- with .app }}
---
apiVersion: v1
kind: Secret
metadata:
  name: posthog-app
  namespace: {{ $ns }}
type: Opaque
data:
  SECRET_KEY: {{ required "posthog.app.secretKey" .secretKey | toString | b64enc | quote }}
  ENCRYPTION_SALT_KEYS: {{ required "posthog.app.encryptionSaltKeys" .encryptionSaltKeys | toString | b64enc | quote }}
  BROWSERLESS_TOKEN: {{ required "posthog.app.browserlessToken" .browserlessToken | toString | b64enc | quote }}
  INTERNAL_API_SECRET: {{ required "posthog.app.internalApiSecret" .internalApiSecret | toString | b64enc | quote }}
  INTERNAL_REQUEST_TOKEN: {{ required "posthog.app.internalRequestToken" .internalRequestToken | toString | b64enc | quote }}
  RECORDING_API_JWT_SECRET: {{ required "posthog.app.recordingApiJwtSecret" .recordingApiJwtSecret | toString | b64enc | quote }}
{{- end }}
{{- with .db }}
---
apiVersion: v1
kind: Secret
metadata:
  name: posthog-db
  namespace: {{ $ns }}
type: Opaque
data:
  PGPASSWORD: {{ required "posthog.db.password" .password | toString | b64enc | quote }}
  DATABASE_URL: {{ printf "postgres://posthog:%s@posthog-postgresql:5432/posthog" (.password | toString | urlquery) | toString | b64enc | quote }}
{{- end }}
{{- with .clickhouse }}
---
apiVersion: v1
kind: Secret
metadata:
  name: posthog-clickhouse-users
  namespace: {{ $ns }}
type: Opaque
data:
  CLICKHOUSE_API_PASSWORD: {{ required "posthog.clickhouse.api" .api | toString | b64enc | quote }}
  CLICKHOUSE_APP_PASSWORD: {{ required "posthog.clickhouse.app" .app | toString | b64enc | quote }}
  CLICKHOUSE_BILLING_PASSWORD: {{ required "posthog.clickhouse.billing" .billing | toString | b64enc | quote }}
  CLICKHOUSE_DICT_READER_PASSWORD: {{ required "posthog.clickhouse.dictReader" .dictReader | toString | b64enc | quote }}
  CLICKHOUSE_SIGNALS_PASSWORD: {{ required "posthog.clickhouse.signals" .signals | toString | b64enc | quote }}
{{- end }}
{{- end }}
