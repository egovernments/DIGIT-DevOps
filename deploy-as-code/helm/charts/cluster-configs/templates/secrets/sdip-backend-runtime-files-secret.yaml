{{- /*
Runtime configuration files for the SDIP backend, mounted read-only at
SDIP_RUNTIME_CONFIG_DIR. org.sdip.runtime.SharedRuntimeConfiguration reads all
three during startup validation and refuses to start if any is missing or
malformed, so the Secret must exist before the Deployment is scaled up.

Rendered only when coreFix.clientToken is present -- that value lives in the
SOPS-encrypted environments/<env>-secrets.yaml, so an env that has not supplied
it gets no half-populated Secret.
*/ -}}
{{- $cfg := index .Values "cluster-configs" "secrets" "sdip-backend-runtime-files" }}
{{- if $cfg }}
{{- if $cfg.coreFix }}
{{- if $cfg.coreFix.clientToken }}
{{- range $ns := $cfg.namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $ns }}
type: Opaque
data:
  core-fix-client.json: {{ $cfg.coreFix | toJson | b64enc | quote }}
  onboarding-runtime.json: {{ $cfg.onboarding | toJson | b64enc | quote }}
  kafka-client.json: {{ $cfg.kafka | toJson | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
