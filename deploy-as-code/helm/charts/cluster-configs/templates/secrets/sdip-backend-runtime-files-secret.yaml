{{- /*
Runtime configuration files for the SDIP backend, mounted read-only at
SDIP_RUNTIME_CONFIG_DIR. org.sdip.runtime.SharedRuntimeConfiguration reads all
three JSON files during startup validation and refuses to start if any is
missing or malformed, so the Secret must exist before the Deployment is scaled
up.

Rendered only when coreFix.clientToken is present -- that value lives in the
SOPS-encrypted environments/<env>-secrets.yaml, so an env that has not supplied
it gets no half-populated Secret.

This Secret is the ONLY supported way to get the MDMS owner credential into the
pod. The Application that renders this chart syncs with selfHeal plus
ServerSideApply, so a key added to the live Secret by hand is reverted on the
next reconcile; the value has to arrive through the SOPS file the Application
already loads as a secrets:// value file.
*/ -}}
{{- $cfg := index .Values "cluster-configs" "secrets" "sdip-backend-runtime-files" }}
{{- if $cfg }}
{{- if $cfg.coreFix }}
{{- if $cfg.coreFix.clientToken }}
{{- range $ns := $cfg.namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cfg.name }}
  namespace: {{ $ns }}
type: Opaque
data:
  core-fix-client.json: {{ $cfg.coreFix | toJson | b64enc | quote }}
  onboarding-runtime.json: {{ $cfg.onboarding | toJson | b64enc | quote }}
  kafka-client.json: {{ $cfg.kafka | toJson | b64enc | quote }}
{{- /*
Owner-issued MDMS write credential for tenant pb, read by
org.sdip.iam.bootstrap.SdipMdmsRoleSync through onboarding-runtime.json's
mdmsRoleSync.authTokenFile. A raw token, not JSON -- the runner reads the file
and strips surrounding whitespace, then rejects anything shorter than 8 or
longer than 8192 characters, or containing inner whitespace.

Rendered unconditionally, defaulting to empty, and deliberately NOT guarded on
the value being set. sdip-backend names this key in its volume `items`, and a
Secret volume naming a key the Secret does not have fails the mount outright --
"references non-existent secret key: mdms-owner.token" -- which leaves the pod
at Init:0/7 with no init container ever started. Keeping the key present
decouples pod startup from whether the token has been issued; an empty value
only makes the role sync log
outcome=STOPPED reason=INVALID_MDMS_WRITE_CREDENTIAL_FORMAT
and the application carries on serving.
*/}}
  mdms-owner.token: {{ dig "mdmsOwner" "token" "" $cfg | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
