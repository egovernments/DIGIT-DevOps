{{- with index .Values "cluster-configs" "secrets" "studio-keycloak" }}
{{- if index . "client-secret" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "studio-keycloak" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  client-secret: {{ index $.Values "cluster-configs" "secrets" "studio-keycloak" "client-secret" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
