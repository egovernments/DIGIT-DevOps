{{- with index .Values "cluster-configs" "secrets" "superset" }}
{{- if index . "SECRET_KEY" }}
---
{{- range $ns := .namespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "superset" "name" | default "superset-secret" }}
  namespace: {{ $ns }}
  labels:
    app: superset
type: Opaque
stringData:
{{- range $key, $value := index $.Values "cluster-configs" "secrets" "superset" }}
{{- if and (ne $key "namespace") (ne $key "name") (ne $key "SQLALCHEMY_DATABASE_URI") }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
  # Derived from the DB_* fields rather than stored as its own literal. Held
  # separately it silently drifted: DB_HOST was migrated to Azure while the
  # literal URI still pointed at the decommissioned AWS RDS, so the
  # wait-for-postgres-redis init container hung and superset web/worker/beat
  # died with sqlalchemy.exc.SQLAlchemyError. Deriving it keeps one source of
  # truth. Set SQLALCHEMY_DATABASE_URI_OVERRIDE to bypass this.
{{- $s := index $.Values "cluster-configs" "secrets" "superset" }}
{{- if index $s "SQLALCHEMY_DATABASE_URI_OVERRIDE" }}
  SQLALCHEMY_DATABASE_URI: {{ index $s "SQLALCHEMY_DATABASE_URI_OVERRIDE" | quote }}
{{- else }}
  SQLALCHEMY_DATABASE_URI: {{ printf "postgresql+psycopg2://%s:%s@%s:%v/%s" (index $s "DB_USER") (index $s "DB_PASS") (index $s "DB_HOST") (index $s "DB_PORT") (index $s "DB_NAME") | quote }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
