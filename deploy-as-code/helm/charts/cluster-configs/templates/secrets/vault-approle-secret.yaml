{{- with index .Values "cluster-configs" "secrets" "vault-approle" }}
{{- if index . "role-id" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "vault-approle" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  # Vault AppRole credentials for egov services (VAULT_ROLE_ID / VAULT_SECRET_ID).
  # Bound to the 'egov-role' AppRole in Vault (policy: vault-policy).
  role-id: {{ index $.Values "cluster-configs" "secrets" "vault-approle" "role-id" | b64enc | quote }}
  secret-id: {{ index $.Values "cluster-configs" "secrets" "vault-approle" "secret-id" | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
