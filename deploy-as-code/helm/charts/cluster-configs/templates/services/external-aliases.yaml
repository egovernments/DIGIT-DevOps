{{- with index .Values "cluster-configs" "external-aliases" }}
{{- if .aliases }}
{{- $namespace := .namespace }}
{{- range $name, $target := .aliases }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  type: ExternalName
  externalName: {{ $target }}
{{- end }}
{{- end }}
{{- end }}
