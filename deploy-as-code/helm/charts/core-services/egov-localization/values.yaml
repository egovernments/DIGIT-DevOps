# Common Labels
labels:
  app: "egov-localization"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "localization"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "egov_localization_schema"
    image:
      repository: "egov-localization-db"

# Container Configs
image:
  repository: "egov-localization"
replicas: "1"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx256m -Xms256m"
healthChecks:
  enabled: true
  livenessProbePath: "/localization/health"
  readinessProbePath: "/localization/health"
memory_limits: "512Mi"
cpu_limits: "300m"

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SPRING_REDIS_HOST
    value: redis.backbone
  - name: SPRING_REDIS_PORT
    value: "6379"
  - name: JAEGER_SAMPLER_PARAM
    value: "1"
  - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
    value: {{ .Values.hikariMaximumPoolSize | default "3" | quote }}
  - name: LOCALIZATION_UPSERT_ASYNC_ENABLED
    value: {{ .Values.localizationUpsertAsyncEnabled | default "true" | quote }}
  - name: LOCALIZATION_UPSERT_TOPIC
    value: {{ .Values.localizationUpsertTopic | default "save-localization-messages" | quote }}
  - name: LOCALIZATION_UPSERT_REPLY_TOPIC
    value: {{ .Values.localizationUpsertReplyTopic | default "localization-upsert-reply" | quote }}
  - name: LOCALIZATION_UPSERT_TOPIC_PARTITIONS
    value: {{ .Values.localizationUpsertTopicPartitions | default "3" | quote }}
  - name: LOCALIZATION_UPSERT_TOPIC_REPLICATION_FACTOR
    value: {{ .Values.localizationUpsertTopicReplicationFactor | default "1" | quote }}
  - name: LOCALIZATION_UPSERT_CONSUMER_BATCH_SIZE
    value: {{ .Values.localizationUpsertConsumerBatchSize | default "10" | quote }}
  - name: LOCALIZATION_UPSERT_CONSUMER_GROUP
    value: {{ .Values.localizationUpsertConsumerGroup | default "egov-localization-upsert" | quote }}
  - name: LOCALIZATION_UPSERT_REPLY_TIMEOUT_MS
    value: {{ .Values.localizationUpsertReplyTimeoutMs | default "60000" | quote }}
  - name: LOCALIZATION_SEARCH_MODULE_ABSENT_MAX_MESSAGES
    value: {{ .Values.moduleAbsentMaxMessages | default "200000" | quote }}
  - name: LOCALIZATION_CACHE_MAX_ENTRY_BYTES
    value: {{ .Values.cacheMaxEntryBytes | default "10485760" | quote }}
