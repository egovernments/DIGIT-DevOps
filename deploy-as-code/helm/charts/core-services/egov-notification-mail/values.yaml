# Common Labels
labels:
  app: "egov-notification-mail"
  group: "core"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "egov-notification-mail"
replicas: "1"
appType: "java-spring"
tracing-enabled: true
username: "egov-testing@egovernments.org"
heap: "-Xmx192m -Xms192m"
memory_limits: "256Mi"
cpu_limits: "150m"

# Additional Container Envs
env: |
  # Marker for the config-promotion pipeline. This file is this service's
  # `configPath` in charts/kargo/config/projects/unified-core.yaml, so a change
  # here becomes a git artifact in Freight and travels dev -> qa -> uat with the
  # image. Bump the value to watch a config change move through the stages.
  # Safe to delete once the pipeline is trusted.
  - name: PROMOTION_DEMO_MARKER
    value: "v1"
  - name: KAFKA_TOPICS_NOTIFICATION_MAIL_NAME
    value: egov.core.notification.email
  - name: KAFKA_TOPICS_NOTIFICATION_MAIL_ID
    value: egov.core.notification.email
  - name: KAFKA_TOPICS_NOTIFICATION_MAIL_GROUP
    value: egov.core.notification.email
  - name: MAIL_SENDER_USERNAME
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderusername                   
  - name: MAIL_SENDER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderpassword
  {{- if index .Values "mail-port" }}
  - name: MAIL_PORT
    value: {{ index .Values "mail-port" | quote }}
  - name: MAIL_HOST
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mail-host
  {{- end }}        
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: EGOV_LOCALIZATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_USER_STATE_TENANT_ID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-state-level-tenant-id        
