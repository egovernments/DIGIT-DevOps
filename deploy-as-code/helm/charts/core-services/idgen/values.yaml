# Common Labels
labels:
  app: "idgen"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "idgen"

# Init Containers Configs
# DB migration runs in an init container (preferred strategy) — same as the Go
# chart. The migration image ships the Flyway SQL + migrate.sh and runs against
# the elevated flyway credentials before the app starts; the app itself has
# in-boot Flyway disabled (SPRING_FLYWAY_ENABLED=false below). History table
# idgen_schema matches migrate.sh's -table setting.
initContainers:
  # Runs before db-migration. registry-db (V202606010001__create_idgen_tables)
  # also creates public.idgen_templates, already with the final camelCase
  # columns. If registry migrates first on a fresh database, idgen's
  # V20260427120000__standardize_audit_fields fails ("column lastmodifiedby
  # does not exist"). Until idgen's V20260427 has run, this makes sure the
  # table exists with the column names that migration renames, so idgen
  # migrates the same way whichever service starts first. Registry only does
  # CREATE TABLE IF NOT EXISTS, so it is unaffected. Does nothing once
  # V20260427 is recorded.
  extraInitContainers: |
    - name: idgen-table-prepare
      image: "postgis/postgis:15-3.4"
      imagePullPolicy: IfNotPresent
      env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
      # $prep$ quotes the DO block: Kubernetes turns $$ into $ in a command.
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          u="${DB_URL#jdbc:postgresql://}"; hp="${u%%/*}"; db="${u#*/}"; db="${db%%\?*}"
          export PGHOST="${hp%%:*}" PGPORT="${hp##*:}" PGDATABASE="$db"
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          DO $prep$
          BEGIN
            IF to_regclass('public.idgen_schema') IS NOT NULL THEN
              IF EXISTS (SELECT 1 FROM public.idgen_schema WHERE version = '20260427120000' AND success) THEN
                RETURN;
              END IF;
            END IF;
            -- Same as idgen's V20250923144005 (it uses IF NOT EXISTS too).
            CREATE TABLE IF NOT EXISTS public.idgen_templates (
              id UUID PRIMARY KEY,
              templatecode VARCHAR(64) NOT NULL,
              version INTEGER NOT NULL CHECK (version > 0),
              tenantid VARCHAR(64) NOT NULL,
              config JSONB NOT NULL,
              createdtime BIGINT,
              createdby VARCHAR(64),
              lastmodifiedtime BIGINT,
              lastmodifiedby VARCHAR(64),
              UNIQUE (tenantid, templatecode, version)
            );
            -- Created by registry first: put back the names V20260427 renames.
            IF EXISTS (SELECT 1 FROM information_schema.columns
                       WHERE table_schema = 'public' AND table_name = 'idgen_templates'
                         AND column_name = 'createdTime') THEN
              ALTER TABLE public.idgen_templates RENAME COLUMN "createdTime"  TO createdtime;
              ALTER TABLE public.idgen_templates RENAME COLUMN "createdBy"    TO createdby;
              ALTER TABLE public.idgen_templates RENAME COLUMN "modifiedTime" TO lastmodifiedtime;
              ALTER TABLE public.idgen_templates RENAME COLUMN "modifiedBy"   TO lastmodifiedby;
            END IF;
          END $prep$;
          SQL
          echo "idgen_templates ready for idgen's migrations"
  dbMigration:
    enabled: true
    schemaTable: "idgen_schema"
    image:
      repository: "idgen-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: JAVA_ENABLE_DEBUG
        value: "TRUE"
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: public
      - name: FLYWAY_DEFAULT_SCHEMA
        value: public

# Container Configs
image:
  repository: "idgen"
replicas: 1
appType: "java"
# OTel span export switch (MANAGEMENT_TRACING_EXPORT_ENABLED) — override per
# environment via the idgen block in environments/<env>.yaml
tracing-export-enabled: "false"
tracing-enabled: false
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"
healthChecks:
  enabled: false
  livenessProbePath: "/idgen/actuator/health/liveness"
  readinessProbePath: "/idgen/actuator/health/readiness"
# Resource configuration for the Java service
resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1.5Gi"

# Additional Container Envs
# The service is configured through Spring properties (relaxed env binding),
# not the Go service's env var names.
env: |
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: /idgen
  # ── Datasource ──────────────────────────────────────────────────────────
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-url
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        key: username
        name: db
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: db
  # Migration is handled by the init container above — app-boot Flyway is off
  - name: SPRING_FLYWAY_ENABLED
    value: "false"
  # ── Service ─────────────────────────────────────────────────────────────
  # Zone for {DATE:*} rendering and sequence scope keys
  - name: IDGEN_TIMEZONE
    value: UTC
  # ── Observability: OTel span export and metrics export both disabled ──────
  # NB: the span switch is MANAGEMENT_TRACING_EXPORT_ENABLED — MANAGEMENT_TRACING_ENABLED
  # does not gate Boot's OTLP span exporter.
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: "false"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: health,info
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
  # ── Template lifecycle events (same posture as the Go chart: disabled, redis backend) ──
  - name: IDGEN_EVENTS_ENABLED
    value: "false"
  - name: IDGEN_EVENTS_TOPICS_CREATE
    value: idgen-create-template
  - name: IDGEN_EVENTS_TOPICS_UPDATE
    value: idgen-update-template
  - name: IDGEN_EVENTS_TOPICS_DELETE
    value: idgen-delete-template
  # kafka, not redis: account publishes account-migration to kafka, and
  # tenant-migration below subscribes through this same backend. The redis entries
  # stay only as a quick switch back; this service has no redis cache.
  - name: TRACER_PUBSUB_TYPE
    value: kafka
  - name: SPRING_DATA_REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  # ── Per-tenant schemas (com.digit:tenant-migration) ──────────────────────
  # SCHEMA_TABLE must equal initContainers.dbMigration.schemaTable above.
  # Set once at initial deployment; not flipped on a running deployment.
  - name: TENANT_MIGRATION_ENABLED
    value: "true"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: idgen_schema
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: idgen

# Kong route, created by gateway-sync (gateway-kong chart) from these
# annotations. Same as test-lts.
service:
  additionalAnnotations: |
    gateway/route-path: idgen
    gateway/route-auth: protected
