# Common Labels
labels:
  app: "individual-java"
  group: "core"

namespace: egov

# Ingress Configs
ingress:
  namespace: egov
  enabled: true
  zuul: true
  context: "individuals-java"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "individual_schema_v3"
    image:
      repository: "individual-java-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# Container Configs
image:
  repository: "individual-java"
replicas: 1
appType: "java"
# OTel span export switch (MANAGEMENT_TRACING_EXPORT_ENABLED) — override per
# environment via the individual-java block in environments/<env>.yaml
tracing-export-enabled: "false"
tracing-enabled: false
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"
healthChecks:
  enabled: false
  livenessProbePath: "/individuals/actuator/health/liveness"
  readinessProbePath: "/individuals/actuator/health/readiness"

resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1.5Gi"

# Additional Container Envs
env: |
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_CONTEXT_PATH
    value: /individuals

  - name: CANONICAL_API_PREFIX
    value: canonical
    
  - name: DB_HOST
    value: postgres.egov
  - name: DB_PORT
    value: "5432"
  - name: DB_SSL_MODE
    value: disable
  - name: DB_NAME
    value: postgres
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        key: username
        name: db
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: db
  - name: LOG_LEVEL
    value: DEBUG

  - name: IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        key: idgen
        name: egov-service-host
  - name: IDGEN_PATH
    value: idgen/v3/generate
  - name: IDGEN_ENABLED
    value: "true"
  - name: IDGEN_INDIVIDUAL_ID_FORMAT
    value: individual

  - name: VAULT_HOST
    valueFrom:
      configMapKeyRef:
        key: vault
        name: egov-service-host
  - name: VAULT_ROLE_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: role-id
  - name: VAULT_SECRET_ID
    valueFrom:
      secretKeyRef:
        name: vault-approle
        key: secret-id
  - name: VAULT_ENABLED
    value: "true"

  - name: HMAC_SECRET
    valueFrom:
      secretKeyRef:
        name: hmac-secret
        key: hmac-secret

  - name: PUBSUB_ENABLED
    value: "false"
  - name: PUBSUB_TYPE
    value: redis
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config


  - name: REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
  - name: REDIS_DB
    value: "0"


  - name: PUBSUB_TOPIC_CREATE_INDIVIDUAL
    value: individual-create-individual
  - name: PUBSUB_TOPIC_UPDATE_INDIVIDUAL
    value: individual-update-individual
  - name: PUBSUB_TOPIC_DELETE_INDIVIDUAL
    value: individual-delete-individual
  - name: PUBSUB_TOPIC_UPSERT_CONFIG
    value: individual-upsert-config

  - name: TENANT_MIGRATION_ENABLED
    value: "false"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: individual_schema
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: individual-service


  - name: CONSOLE_LOGS_ENABLED
    value: "true"
  # ── Observability: OTel span export disabled ──────────────────────────────
  # NB: the span switch is MANAGEMENT_TRACING_EXPORT_ENABLED — MANAGEMENT_TRACING_ENABLED
  # does not gate Boot's OTLP span exporter.
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
