# Common Labels
labels:
  app: "internal-gateway-scg"
  group: "gateway"

serviceAccount: internal-gateway-scg
namespace: egov

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "internal-gateway-scg"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "internal-gateway-scg"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/health"
  readinessProbePath: "/health"
custom-filter-property: "false"
posthook-config: ""
prehook-config: ""
heap: "-Xmx192m -Xms192m"
appType: "java-spring"
tracing-enabled: true
server-tomcat-max-threads: "350"
server-tomcat-max-connections: "1500"
java-args: ""
eventlog-enabled: "false"
#eventlog-topic: "zuul-event-log"
eventlog-urls-whitelist: ""
home-isolation-chatbot-router-enabled: false

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}     
  - name: ZUUL_HOST_CONNECT_TIMEOUT_MILLIS
    value: "20000"
  - name: ZUUL_HOST_SOCKET_TIMEOUT_MILLIS
    value: "60000"
  # TRACER_OPENTRACING_ENABLED intentionally NOT set here: common's
  # extraEnv.jaeger already emits it under the same `tracing-enabled`
  # condition. Declaring it in both places produced a duplicate env key,
  # which ServerSideApply cannot build a typed value from, so Argo failed
  # with "error calculating structured merge diff: duplicate entries for
  # key [name=\"TRACER_OPENTRACING_ENABLED\"]" and the app never synced.
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}  
  - name: EGOV_SERVICE_CONFIG_PATH
    value: "https://raw.githubusercontent.com/egovernments/configs/central-instance/internal-gateway.json" 
  - name: STATE_LEVEL_TENANT_ID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-state-level-tenant-id
  - name: OTEL_TRACES_EXPORTER
    value: "none"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "org.postgresql.Driver"