{{- /*
Keycloak serves metrics on its management interface (port 9000), not on the
main HTTP port. common.service only exposes httpPort, and it is shared by every
core-service chart, so the management port gets its own Service here instead.
Nothing routes the ingress to it, which keeps /keycloak/metrics cluster-internal.
*/ -}}
{{- if index .Values "metrics-enabled" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ template "common.name" . }}-management
{{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
{{- else }}
  namespace: {{ .Values.namespace }}
{{- end }}
  labels:
{{- include "common.labels" . | nindent 4 }}
spec:
  selector:
{{- include "common.labels" . | nindent 4 }}
  ports:
  - name: management
    port: 9000
    targetPort: 9000
{{- end }}
