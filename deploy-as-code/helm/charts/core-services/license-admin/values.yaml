# Common Labels
labels:
  app: "license-admin"
  group: "web"

# global:
#     containerRegistry: rudrasharma214

# Ingress Configs
ingress:
  enabled: true
  zuul: false
  context: "license/admin"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "license-admin"
  tag: "latest"
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/license/admin/health"
  readinessProbePath: "/license/admin/health"

# Additional Container Envs
env: |
  - name: VITE_API_BASE_URL
    value: {{ index .Values "vite-api-base-url" | quote }}
  - name: VITE_API_PROXY_TARGET
    value: {{ index .Values "vite-api-proxy-target" | quote }}
  - name: VITE_MASTER_TENANT_ID
    value: {{ index .Values "vite-master-tenant-id" | quote }}
  - name: VITE_MASTER_TENANT_KEYCLOAK_CLIENT_ID
    value: {{ index .Values "vite-master-tenant-keycloak-client-id" | quote }}
  - name: VITE_KEYCLOAK_URL
    value: {{ index .Values "vite-keycloak-url" | quote }}
  - name: VITE_KEYCLOAK_CLIENT_ID
    value: {{ index .Values "vite-keycloak-client-id" | quote }}
  - name: VITE_FILESTORE_DOCUMENT_MODULE
    value: {{ index .Values "vite-filestore-document-module" | quote }}
  - name: VITE_POSTHOG_KEY
    valueFrom:
      secretKeyRef:
        name: posthog-secret
        key: vite_posthog_key
  - name: VITE_POSTHOG_HOST
    valueFrom:
      secretKeyRef:
        name: posthog-secret
        key: vite_posthog_host

resources: |
  requests:
    cpu: "100m"
    memory: "300Mi"
  limits:
    cpu: "300m"
    memory: "800Mi"
