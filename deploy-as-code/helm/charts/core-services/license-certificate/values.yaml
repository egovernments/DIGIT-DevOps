# Common Labels
labels:
  app: "license-certificate"
  group: "rainmaker"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "license"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "license_certificate_schema"
    image:
      repository: "license-certificate-db"

# Container Configs
image:
  repository: "license-certificate"
replicas: "1"
appType: "java-spring"
heap: "-Xmx1012m -Xms512m"
memory_limits: 1500Mi
memory_requests: 768Mi
healthChecks:
  enabled: false
  livenessProbePath: "/license/actuator/health"
  readinessProbePath: "/license/actuator/health"
#  livenessProbe: |
#    httpGet:
#      path: "{{ .Values.healthChecks.livenessProbePath }}"
#      port: {{ .Values.httpPort }}
#    initialDelaySeconds: 90
#    timeoutSeconds: 5
#    periodSeconds: 30
#    successThreshold: 1
#    failureThreshold: 5
#  readinessProbe: |
#    httpGet:
#      path: "{{ .Values.healthChecks.readinessProbePath }}"
#      port: {{ .Values.httpPort }}
#    initialDelaySeconds: 90
#    timeoutSeconds: 5
#    periodSeconds: 15
#    successThreshold: 1
#    failureThreshold: 5

# Additional Container Envs
env: |
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: "postgres"
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        key: username
        name: db
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: db
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      configMapKeyRef:
        key: db-url
        name: egov-config
  - name: SPRING_DATA_REDIS_HOST
    value: "redis.backbone"
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  - name: EGOV_IDGEN_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_WORKFLOW_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_WORKFLOW_INTERNAL_HOST
    value: "http://workflow.egov.svc.cluster.local:8080"
  - name: EGOV_WORKFLOW_INTERNAL_TRANSITION_SEGMENT
    value: "system"
  - name: EGOV_CALCULATION_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_CALCULATOR_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_SCHEMA_REGISTRY_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_FILESTORE_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_MDMS_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_BILLING_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_BOUNDARY_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_INDIVIDUAL_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_NOTIFICATION_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_REGISTRY_HOST
    value: "https://digit-lts.digit.org"
  - name: APP_PORT
    value: "8080"
  - name: EGOV_PDF_SERVICE_HOST
    value: "https://digit-lts.digit.org"
  - name: EGOV_VC_SERVICE_HOST
    value: "https://digit-lts.digit.org"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
