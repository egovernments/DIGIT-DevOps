# Common Labels
labels:
  app: "license-citizen"
  group: "web"

# global:
#     containerRegistry: rudrasharma214

# Ingress Configs
ingress:
  enabled: true
  zuul: false
  context: "license/citizen"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "license-citizen"
  tag: "latest"
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/license/citizen/health"
  readinessProbePath: "/license/citizen/health"

# Additional Container Envs
env: |
  - name: VITE_API_BASE_URL
    value: {{ index .Values "vite-api-base-url" | quote }}
  - name: VITE_API_PROXY_TARGET
    value: {{ index .Values "vite-api-proxy-target" | quote }}
  - name: VITE_CERTIFICATE_PROXY_TARGET
    value: {{ index .Values "vite-certificate-proxy-target" | quote }}
  - name: VITE_SCHEMA_REGISTRY_PROXY_TARGET
    value: {{ index .Values "vite-schema-registry-proxy-target" | quote }}
  - name: VITE_CALCULATION_PROXY_TARGET
    value: {{ index .Values "vite-calculation-proxy-target" | quote }}
  - name: VITE_TENANT_ID
    value: {{ index .Values "vite-tenant-id" | quote }}
  - name: VITE_FILESTORE_DOCUMENT_MODULE
    value: {{ index .Values "vite-filestore-document-module" | quote }}
  - name: VITE_KEYCLOAK_URL
    value: {{ index .Values "vite-keycloak-url" | quote }}
  - name: VITE_KEYCLOAK_REALM
    value: {{ index .Values "vite-keycloak-realm" | quote }}
  - name: VITE_KEYCLOAK_CLIENT_ID
    value: {{ index .Values "vite-keycloak-client-id" | quote }}
  - name: VITE_PAYMENT_CALLBACK_PAUSE_MS
    value: {{ index .Values "vite-payment-callback-pause-ms" | quote }}
  - name: VITE_POSTHOG_KEY
    valueFrom:
      secretKeyRef:
        name: posthog-secret
        key: posthog-key
  - name: VITE_POSTHOG_HOST
    valueFrom:
      secretKeyRef:
        name: posthog-secret
        key: posthog-host

resources: |
  requests:
    cpu: "100m"
    memory: "300Mi"
  limits:
    cpu: "300m"
    memory: "800Mi"
