# Common Labels
labels:
  app: "license-validator"
  group: "web"

# global:
#     containerRegistry: taherabharmal

# Ingress Configs
ingress:
  enabled: true
  zuul: false
  context: "license/validator"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "license-validator"
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/license/validator/health"
  readinessProbePath: "/license/validator/health"

# Additional Container Envs
env: |
  # Internal Kong gateway (service port 80 -> kong 8000). The UI nginx preserves
  # `Host: $host` (digit-lts.digit.org) when proxying, so Kong's host-based routes still
  # match — this avoids hairpinning the public ELB, which caused flaky/alternating responses.
  - name: API_PROXY_TARGET
    value: {{ index .Values "api-proxy-target" | default "http://kong-kong-proxy.egov" | quote }}
  - name: VITE_TENANT_ID
    value: {{ index .Values "vite-tenant-id" | quote }}
  - name: VITE_API_PROXY_TARGET
    value: {{ index .Values "vite-api-proxy-target" | quote }}
  - name: VITE_API_BASE_URL
    value: {{ index .Values "vite-api-base-url" | quote }}
  - name: VITE_ACCOUNTS_API_BASE_URL
    value: {{ index .Values "vite-accounts-api-base-url" | quote }}
  - name: VITE_MDMS_API_BASE_URL
    value: {{ index .Values "vite-mdms-api-base-url" | quote }}
  - name: VITE_LOCALIZATION_BASE_URL
    value: {{ index .Values "vite-localization-base-url" | quote }}
  - name: VITE_POSTHOG_KEY
    valueFrom:
      secretKeyRef:
        name: license-ui
        key: vite_posthog_key
  - name: VITE_POSTHOG_HOST
    valueFrom:
      secretKeyRef:
        name: license-ui
        key: vite_posthog_host

resources: |
  requests:
    cpu: "100m"
    memory: "300Mi"
  limits:
    cpu: "300m"
    memory: "800Mi"
