# Common Labels
labels:
  app: "metabase"
  group: "rainmaker"

# Ingress Configs
ingress:
  enabled: true
  zuul: false
  context: "metabase"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false

# Container Configs
image:
  repository: "metabase/metabase"
  tag: "v0.58.22"
replicas: "1"
appType: ""
memory_limits: 1500Mi
memory_requests: 768Mi
cpu_limits: "700m"
cpu_requests: "350m"

healthChecks:
  enabled: true
  livenessProbePath: "/metabase/livez"
  readinessProbePath: "/metabase/readyz"

# Resource configuration
resources: |
  requests:
    cpu: "350m"
    memory: "768Mi"
  limits:
    cpu: "700m"
    memory: "1500Mi"

# Additional Container Envs
env: |
  - name: MB_JETTY_PORT
    value: "8080"
  - name: MB_DB_TYPE
    value: "postgres"
  - name: DB_HOST
    value: "postgresql-lts.egov"
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: "metabase"
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: metabase
        key: username
  - name: DB_PASS
    valueFrom:
      secretKeyRef:
        name: metabase
        key: password
  - name: MB_DB_CONNECTION_URI
    value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)?user=$(DB_USER)&password=$(DB_PASS)"
