# Common Labels
labels:
  app: "metabase"
  group: "rainmaker"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "metabase"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false

# Container Configs
image:
  repository: "metabase/metabase"
  tag: "v0.58.22"
replicas: "1"
appType: ""
memory_limits: 1500Mi
memory_requests: 768Mi
cpu_limits: "700m"
cpu_requests: "350m"

healthChecks:
  enabled: true
  livenessProbePath: "/metabase/livez"
  readinessProbePath: "/metabase/readyz"

# Resource configuration
resources: |
  requests:
    cpu: "350m"
    memory: "1024Mi"
  limits:
    cpu: "700m"
    memory: "2560Mi"

# Additional Container Envs
env: |
  - name: JAVA_OPTS
    value: "-Xmx1536m -Xms512m"
  - name: MB_JETTY_PORT
    value: "8080"
  - name: MB_DB_TYPE
    value: "postgres"
  - name: MB_DB_HOST
    value: {{ index .Values "db-host" | quote }}
  - name: MB_DB_PORT
    value: "5432"
  - name: MB_DB_DBNAME
    value: "metabase_db"
  - name: MB_DB_USER
    valueFrom:
      secretKeyRef:
        name: metabase
        key: username
  - name: MB_DB_PASS
    valueFrom:
      secretKeyRef:
        name: metabase
        key: password
