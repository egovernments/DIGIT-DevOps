# Common Labels
labels:
  app: "notify"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "notify"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "notify_schema"
    image:
      repository: "notify-db"
    env: |
        - name: "DB_URL"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-url
        - name: "SCHEMA_TABLE"
          value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
        - name: "FLYWAY_USER"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-username
        - name: "FLYWAY_PASSWORD"
          valueFrom:
            secretKeyRef:
              name: db
              key: flyway-password
        - name: JAVA_ENABLE_DEBUG
          value: "TRUE"
        - name: "FLYWAY_LOCATIONS"
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: flyway-locations
        - name: FLYWAY_SCHEMAS
          value: public
        - name: FLYWAY_DEFAULT_SCHEMA
          value: public

# Container Configs
image:
  repository: "notify"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/notify/health"
  readinessProbePath: "/notify/health"
appType: "java"
# OTel span export switch (MANAGEMENT_TRACING_EXPORT_ENABLED) — override per
# environment via the notify block in environments/<env>.yaml
tracing-export-enabled: "false"
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"
gmail-from-name: "eGov Foundation"
smscountry-api-url: "http://api.smscountry.com/SMSCwebservice_bulk.aspx"
# Optional. Left blank the gateway applies the header registered against the
smscountry-sender-id: ""
resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1.5Gi"

# Nothing is mounted at /providers: the jars are baked into the image and a
# volume on that path would hide them.

# Additional Container Envs
env: |
  # The entrypoint is an explicit `java -jar`, so JAVA_OPTS is never expanded.
  - name: JAVA_TOOL_OPTIONS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: /notify
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-url
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: db
        key: username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: db
        key: password
  - name: SPRING_FLYWAY_ENABLED
    value: "false"
  - name: NOTIFY_PLUGINS_DIR
    value: /providers

  - name: NOTIFY_TOPIC_SEND_ENABLED
    value: "true"
  - name: NOTIFY_TOPIC_SEND
    value: notify-send
  - name: KAFKA_CONSUMER_GROUP
    value: notify-service
  - name: PUBSUB_TYPE
    value: kafka
  - name: KAFKA_BROKERS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-brokers
  # Each provider reads its own credentials at startup and is left unregistered
  # if any of them are missing. Host, port and content type are fixed inside the
  # provider jars, so only the account settings appear here.
  - name: GMAIL_FROM_ADDRESS
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderusername
  - name: GMAIL_APP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: egov-notification-mail
        key: mailsenderpassword
  - name: GMAIL_FROM_NAME
    value: {{ index .Values "gmail-from-name" | quote }}
  - name: SMSCOUNTRY_USERNAME
    valueFrom:
      secretKeyRef:
        name: egov-notification-sms
        key: username
  - name: SMSCOUNTRY_PASSWORD
    valueFrom:
      secretKeyRef:
        name: egov-notification-sms
        key: password
  - name: SMSCOUNTRY_API_URL
    value: {{ index .Values "smscountry-api-url" | quote }}
  - name: SMSCOUNTRY_SENDER_ID
    value: {{ index .Values "smscountry-sender-id" | quote }}
  - name: APP_TIMEZONE
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: timezone
  # base-path `/` puts the actuator endpoints under the servlet context path,
  # which is where the probes above look for them.
  - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
    value: "/"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: health,info
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: "false"
  - name: LOGGING_LEVEL_ORG_DIGIT_NOTIFY
    value: INFO
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces