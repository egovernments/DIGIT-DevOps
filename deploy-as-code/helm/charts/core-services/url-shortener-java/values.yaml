# Common Labels
labels:
  app: "url-shortener-java"
  group: "core"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "url-shortener-java"

# Init Containers Configs
# DB migration runs in an init container (preferred strategy) — same as the Go
# chart. The migration image ships the Flyway SQL + migrate.sh and runs against
# the elevated flyway credentials before the app starts; the app itself has
# in-boot Flyway disabled (SPRING_FLYWAY_ENABLED=false below). History table
# url_shortener_schema matches migrate.sh's -table setting.
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "url_shortener_schema"
    image:
      repository: "url-shortener-java-db"
    env: |
      - name: "DB_URL"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: db-url
      - name: "SCHEMA_TABLE"
        value: {{ .Values.initContainers.dbMigration.schemaTable | quote }}
      - name: "FLYWAY_USER"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-username
      - name: "FLYWAY_PASSWORD"
        valueFrom:
          secretKeyRef:
            name: db
            key: flyway-password
      - name: JAVA_ENABLE_DEBUG
        value: "TRUE"
      - name: "FLYWAY_LOCATIONS"
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: flyway-locations
      - name: FLYWAY_SCHEMAS
        value: public
      - name: FLYWAY_DEFAULT_SCHEMA
        value: public

# Container Configs
image:
  repository: "url-shortener-java"
replicas: 1
appType: "java"
# OTel span export switch (MANAGEMENT_TRACING_EXPORT_ENABLED) — override per
# environment via the url-shortener-java block in environments/<env>.yaml
tracing-export-enabled: "false"
tracing-enabled: false
heap: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=75.0"
healthChecks:
  enabled: false
  livenessProbePath: "/url-shortener/actuator/health/liveness"
  readinessProbePath: "/url-shortener/actuator/health/readiness"
# Resource configuration for Java service
resources: |
  requests:
    cpu: "150m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1.5Gi"

# Additional Container Envs
# Spring relaxed binding for env vars: uppercase, every '.' AND '-' becomes '_'
# (nothing is dropped) — e.g. url-shortener.host-name -> URL_SHORTENER_HOST_NAME.
# Verified empirically against the built jar's /actuator/env (not assumed) —
# an earlier draft of this chart used URLSHORTENER_* (hyphen collapsed) and
# SPRING_KAFKA_BOOTSTRAPSERVERS, neither of which actually bind; both silently
# fall back to the in-jar default instead of erroring, so the mistake would
# never have surfaced from a boot log alone.
env: |
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: /url-shortener-java
  # ── Datasource ──────────────────────────────────────────────────────────
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: db-url
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        key: username
        name: db
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: db
  # Migration is handled by the init container above — app-boot Flyway is off
  - name: SPRING_FLYWAY_ENABLED
    value: "false"
  # ── Service ─────────────────────────────────────────────────────────────
  - name: URL_SHORTENER_HOST_NAME
    value: https://digit-lts.digit.org
  - name: URL_SHORTENER_CACHE_ENABLED
    value: "false"
  - name: URL_SHORTENER_CACHE_TYPE
    value: redis
  - name: URL_SHORTENER_CACHE_TTL
    value: 24h
  - name: SPRING_DATA_REDIS_HOST
    value: redis.backbone.svc.cluster.local
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  - name: SPRING_DATA_REDIS_DATABASE
    value: "0"
  - name: SPRING_DATA_REDIS_PASSWORD
  # Lifecycle events (same posture as the Go chart: disabled, redis backend)
  - name: URL_SHORTENER_EVENTS_ENABLED
    value: "false"
  - name: URL_SHORTENER_EVENTS_TOPICS_CREATE_SHORT_URL
    value: url-shortener-create-short-url
  - name: URL_SHORTENER_EVENTS_TOPICS_CREATE_CONFIG
    value: url-shortener-create-url-config
  - name: URL_SHORTENER_EVENTS_TOPICS_UPDATE_CONFIG
    value: url-shortener-update-url-config
  - name: URL_SHORTENER_EVENTS_TOPICS_DELETE_CONFIG
    value: url-shortener-delete-url-config
  # kafka, not redis: account publishes account-migration to kafka, and
  # tenant-migration below subscribes through this same backend. The
  # SPRING_DATA_REDIS_* entries above stay — redis still backs the redirect
  # cache (URL_SHORTENER_CACHE_TYPE), only pub/sub moved.
  - name: TRACER_PUBSUB_TYPE
    value: kafka
  - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
    valueFrom:
      configMapKeyRef:
        key: kafka-brokers
        name: egov-config
  # ── Per-tenant schemas (com.digit:tenant-migration) ──────────────────────
  # SCHEMA_TABLE must equal initContainers.dbMigration.schemaTable above.
  # Set once at initial deployment; not flipped on a running deployment (that
  # would need a data backfill out of public, which is not built).
  - name: TENANT_MIGRATION_ENABLED
    value: "false"
  - name: TENANT_MIGRATION_SCHEMA_TABLE
    value: url_shortener_schema
  - name: TENANT_MIGRATION_CONSUMER_GROUP
    value: url-shortener
  - name: SPRING_APPLICATION_NAME
    value: url-shortener
  # ── Observability: OTel span export and metrics export both disabled ──────
  # NB: the span switch is MANAGEMENT_TRACING_EXPORT_ENABLED — MANAGEMENT_TRACING_ENABLED
  # does not gate Boot's OTLP span exporter.
  - name: MANAGEMENT_TRACING_EXPORT_ENABLED
    value: {{ index .Values "tracing-export-enabled" | quote }}
  - name: MANAGEMENT_DEFAULTS_METRICS_EXPORT_ENABLED
    value: "false"
  - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
    value: health,info
  - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
    value: http://open-telemetry-opentelemetry-collector.monitoring.svc.cluster.local:4318/v1/traces
  - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
    value: "1.0"
