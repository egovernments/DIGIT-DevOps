# Common Labels
labels:
  app: "user-otp"
  group: "user"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "user-otp"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "user-otp"
healthChecks:
  enabled: true
  livenessProbePath: "/user-otp/health"
  readinessProbePath: "/user-otp/health"
replicas: "1"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx256m -Xms256m"
memory_limits: 512Mi
java-args: ""

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: OTP_HOST
    value: http://egov-otp:8080/otp
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false" 
  - name: USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_LOCALISATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization      
  - name: SMS_TOPIC
    value: egov.core.notification.sms
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  # SECURITY_BASIC_ENABLED / MANAGEMENT_SECURITY_ENABLED are already set
  # earlier in this same env block; this was a duplicated copy-paste and the
  # repeated keys broke ServerSideApply diffing.
  # TRACER_OPENTRACING_ENABLED intentionally NOT set here: common's
  # extraEnv.jaeger already emits it under the same `tracing-enabled`
  # condition. Declaring it in both places produced a duplicate env key,
  # which ServerSideApply cannot build a typed value from, so Argo failed
  # with "error calculating structured merge diff: duplicate entries for
  # key [name=\"TRACER_OPENTRACING_ENABLED\"]" and the app never synced.
  # SPRING_DATASOURCE_URL intentionally NOT set here. common's extraEnv.java
  # emits it (key: db-url) AFTER this block, and Kubernetes takes the LAST
  # duplicate -- so this db-otel-url entry never took effect, it only created a
  # duplicate env key that ServerSideApply rejects ("duplicate entries for key").
  # Removing it is behaviour-preserving: the pod already resolved db-url.
  # NOTE: that means OpenTelemetry JDBC instrumentation is NOT active for this
  # service even though the chart looks like it enables it. egov-config does
  # define db-otel-url, so enabling it is a deliberate change: override
  # extraEnv.java, or set the value after common's block rather than before.
  - name: OTEL_TRACES_EXPORTER
    value: "none"
  - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
    value: "org.postgresql.Driver"