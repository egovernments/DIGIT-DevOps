values:
  - ../../environments/azure-k3s-secrets.dec.yaml
  - ../../environments/azure-k3s.yaml

releases:
  # cluster-configs must run first: it creates the namespaces, the egov-config /
  # egov-service-host ConfigMaps, and the secrets (db, minio, kc-db, kc-admin, ...)
  # that every other release depends on.
  - name: cluster-configs
    chart: ./cluster-configs
    namespace: egov
    installed: true
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml

  # cert-manager must come before ingress-nginx, which depends on it for TLS.
  # disableValidation skips CRD schema validation which fails before CRDs are installed.
  - name: cert-manager
    chart: ./cert-manager
    namespace: cert-manager
    installed: true
    disableValidation: true
    needs:
      - egov/cluster-configs
    values:
      - ./cert-manager/values.yaml

  # Postgres pod — replaces RDS in DIGIT 3.0. Release name matches service DNS used by app charts.
  - name: postgresql-lts
    chart: ./postgres
    namespace: egov
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ./postgres/values.yaml

  # Valkey (BSD-3-Clause, Redis protocol) — services and Kong's token-revocation plugin reach it at
  # valkey.backbone.svc.cluster.local:6379.
  - name: valkey
    chart: ./valkey
    namespace: backbone
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ./valkey/values.yaml

  # Kafka (Bitnami KRaft, single controller). Release name MUST be
  # "release-name": egov-config kafka-brokers points at
  # release-name-kafka-controller-headless.backbone:9092, matching test-lts.
  - name: release-name
    chart: ./kafka-kraft
    namespace: backbone
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ./kafka-kraft/values.yaml

  # SeaweedFS (Apache-2.0) S3 gateway — filestore stores files here via the S3 API
  # (S3_ENDPOINT seaweedfs.backbone:8333). Its S3 identity is rendered from the same
  # cluster-configs.secrets.minio keys filestore reads, so the secrets file is the input.
  - name: seaweedfs
    chart: ./seaweedfs
    namespace: backbone
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ./seaweedfs/values.yaml

  - name: ingress-nginx
    chart: ./ingress-nginx
    namespace: backbone
    installed: true
    needs:
      - cert-manager/cert-manager
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./ingress-nginx/values.yaml

  # OpenBao (MPL-2.0, Vault 1.14 API), single node, Raft storage on the default
  # StorageClass. Release name MUST be `openbao` and namespace `openbao` so
  # egov-service-host's vault (openbao.openbao.svc:8200) and vault-host
  # (openbao-0.openbao-internal.openbao.svc:8200) keys resolve. After install (and
  # after every pod restart) OpenBao must be unsealed: keys live in the sops secrets
  # file under `vault-operator:` (init is run with -key-shares=1 -key-threshold=1)
  # — scripts/04-openbao.sh deploys, initializes, unseals and configures it.
  - name: openbao
    chart: ./openbao
    namespace: openbao
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ./openbao/values.yaml
