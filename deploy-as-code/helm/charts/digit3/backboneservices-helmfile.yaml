values:
  - ../../environments/azure-k3s-secrets.dec.yaml
  - ../../environments/azure-k3s.yaml

releases:
  # cluster-configs must run first: it creates the namespaces, the egov-config /
  # egov-service-host ConfigMaps, and the secrets (db, minio, kc-db, kc-admin, ...)
  # that every other release depends on.
  - name: cluster-configs
    chart: ./cluster-configs
    namespace: egov
    installed: true
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml

  # cert-manager must come before ingress-nginx, which depends on it for TLS.
  # disableValidation skips CRD schema validation which fails before CRDs are installed.
  - name: cert-manager
    chart: ./cert-manager
    namespace: cert-manager
    installed: true
    disableValidation: true
    needs:
      - egov/cluster-configs
    values:
      - ./cert-manager/values.yaml

  # Postgres pod — replaces RDS in DIGIT 3.0. Release name matches service DNS used by app charts.
  - name: postgresql-lts
    chart: ./postgres
    namespace: egov
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ./postgres/values.yaml

  - name: redis
    chart: ./redis
    namespace: backbone
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ./redis/values.yaml

  # Kafka (Bitnami KRaft, single controller). Release name MUST be
  # "release-name": egov-config kafka-brokers points at
  # release-name-kafka-controller-headless.backbone:9092, matching test-lts.
  - name: release-name
    chart: ./kafka-kraft
    namespace: backbone
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ./kafka-kraft/values.yaml

  # Single-replica (SNSD) minio — filestore-java stores files here via the S3 API
  # (S3_ENDPOINT minio.backbone:9000, credentials from the cluster-configs `minio` secret).
  - name: minio
    chart: ./minio
    namespace: backbone
    installed: true
    needs:
      - egov/cluster-configs
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./minio/values.yaml

  - name: ingress-nginx
    chart: ./ingress-nginx
    namespace: backbone
    installed: true
    needs:
      - cert-manager/cert-manager
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./ingress-nginx/values.yaml
