{{- with index .Values "cluster-configs" "secrets" "metabase" }}
{{- if index . "username" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "metabase" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
 username: {{ index $.Values "cluster-configs" "secrets" "metabase" "username" | b64enc | quote }}
 password: {{ index $.Values "cluster-configs" "secrets" "metabase" "password" | b64enc | quote }}
 {{- end }}
{{- end }}
{{- end }}