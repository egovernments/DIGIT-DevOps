{{- with index .Values "cluster-configs" "secrets" "minio" }}
{{- if index . "accesskey" }}
{{- range $ns := .namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ index $.Values "cluster-configs" "secrets" "minio" "name" }}
  namespace: {{ $ns }}
type: Opaque
data:
  accesskey: {{ index $.Values "cluster-configs" "secrets" "minio" "accesskey" | b64enc | quote }}
  secretkey: {{ index $.Values "cluster-configs" "secrets" "minio" "secretkey" | b64enc | quote }}
  # filestore's S3 credentials. The SeaweedFS chart renders its S3 identity from the same
  # values; the secret keeps its `minio` name so service charts need no change.
{{- end }}
{{- end }}
{{- end }}
