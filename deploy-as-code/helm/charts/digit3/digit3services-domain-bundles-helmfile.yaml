# Explicit chart paths (no templating): helmfile v1 only renders Go templates
# in *.gotmpl files, so the `chart: ./{{ .Release.Name }}` pattern from the
# reference branch silently breaks here.
#
# DOMAIN-BUNDLES SHAPE: four JVMs along building-block lines
# (identity: otp/individual/employee/account; notification: template-config/
# notification/url-shortener; billing: billing/apportion/pg-service; admin:
# idgen/localization/workflow/registry/filestore/boundary). Charts are
# pre-generated under charts/bundles/ from digit3's domain-split.package.yaml.
# Deploy exactly ONE shape at a time — the shapes publish the same ingress
# context paths. Cross-bundle calls default to each bundle's cluster-DNS name
# (baked into the jars); nothing to configure in-cluster.

releases:
  - name: keycloak
    chart: ./keycloak
    namespace: keycloak
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./keycloak/values.yaml

  - name: identity-bundle
    chart: ../bundles/identity-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    needs:
      - keycloak/keycloak
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml

  - name: notification-bundle
    chart: ../bundles/notification-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml

  - name: billing-bundle
    chart: ../bundles/billing-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml

  - name: admin-bundle
    chart: ../bundles/admin-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml

  - name: gateway-kong
    chart: ./gateway-kong
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./gateway-kong/values.yaml
