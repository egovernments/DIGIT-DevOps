# Explicit chart paths (no templating): helmfile v1 only renders Go templates
# in *.gotmpl files, so the `chart: ./{{ .Release.Name }}` pattern from the
# reference branch silently breaks here.
#
# MODULITH SHAPE: the 16 bundled services (idgen, template-config, billing,
# apportion, url-shortener, pg-service, otp, notification, employee,
# individual, workflow, registry, filestore, localization, account, boundary)
# are served by the single dev-bundle release (charts/bundles/dev-bundle,
# generated by deploy-as-code/helm/bundler/generate_bundle_chart.py from the
# digit3 repo's dev-bundle.package.yaml). Their per-service release entries
# were removed here — reinstalling any of them alongside the bundle would
# clash on ingress context paths. Their env blocks remain in
# environments/azure-k3s.yaml for rollback (git-revert this file + sync).

releases:
  - name: keycloak
    chart: ./keycloak
    namespace: keycloak
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./keycloak/values.yaml

  - name: dev-bundle
    chart: ../bundles/dev-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    needs:
      - keycloak/keycloak
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml

  - name: accesscontrol-java
    chart: ./accesscontrol-java
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./accesscontrol-java/values.yaml

  - name: gateway-kong
    chart: ./gateway-kong
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./gateway-kong/values.yaml
