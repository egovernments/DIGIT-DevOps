# Explicit chart paths (no templating): helmfile v1 only renders Go templates
# in *.gotmpl files, so the `chart: ./{{ .Release.Name }}` pattern from the
# reference branch silently breaks here.
#
# PER-SERVICE SHAPE: every service its own pod (16 releases + keycloak +
# gateway-kong). Deploy exactly ONE shape at a time — the shapes publish the
# same ingress context paths. Data lives in the `postgres` database
# (egov-config db-name), unlike the bundles' bundle_db.

releases:
  - name: keycloak
    chart: ./keycloak
    namespace: keycloak
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./keycloak/values.yaml

  - name: idgen
    chart: ./idgen
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./idgen/values.yaml

  - name: localization
