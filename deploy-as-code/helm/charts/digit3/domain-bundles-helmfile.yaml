# Explicit chart paths (no templating): helmfile v1 only renders Go templates
# in *.gotmpl files, so the `chart: ./{{ .Release.Name }}` pattern from the
# reference branch silently breaks here.
#
# DOMAIN-BUNDLES SHAPE (alternative to single-container-helmfile.yaml):
# deploy ONE of the two — same ingress paths, same kong prefixes. Generated
# charts come from digit3's domain-split.package.yaml via the chart generator.
# The 16 bundled services are served by FOUR bundle
# releases (charts/bundles/{identity,notification,billing,admin}-bundle,
# generated by deploy-as-code/helm/bundler/generate_bundle_chart.py from the
# digit3 repo's feat/modulith-domain-split bundles.package.yaml):
#   identity-bundle:     otp, individual, employee, account
#   notification-bundle: template-config, notification, url-shortener
#   billing-bundle:      billing, apportion, pg-service
#   admin-bundle:        idgen, localization, workflow, registry, filestore, boundary
# Per-service release entries were removed — reinstalling any of them alongside
# its bundle would clash on ingress context paths. Their env blocks remain in
# environments/azure-k3s.yaml for rollback (git-revert this file + sync).

releases:
  # cluster-configs carries this shape's egov-service-host map (which Service answers each
  # service) from the overlay below; the backbone helmfile syncs the same release with base values
  # only, so the shape sync must re-apply it — first, before anything reads the ConfigMap.
  - name: cluster-configs
    chart: ./cluster-configs
    namespace: egov
    installed: true
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-domain-bundles.yaml

  - name: keycloak
    chart: ./keycloak
    namespace: keycloak
    installed: true
    needs:
      - egov/cluster-configs
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-domain-bundles.yaml
      - ./keycloak/values.yaml

  - name: identity-bundle
    chart: ../bundles/identity-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    needs:
      - keycloak/keycloak
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-domain-bundles.yaml
      - ../../environments/digit-tag.yaml.gotmpl

  - name: notification-bundle
    chart: ../bundles/notification-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    needs:
      - keycloak/keycloak
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-domain-bundles.yaml
      - ../../environments/digit-tag.yaml.gotmpl

  - name: billing-bundle
    chart: ../bundles/billing-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    needs:
      - keycloak/keycloak
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-domain-bundles.yaml
      - ../../environments/digit-tag.yaml.gotmpl

  - name: admin-bundle
    chart: ../bundles/admin-bundle
    namespace: egov
    installed: true
    missingFileHandler: Warn
    needs:
      - keycloak/keycloak
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-domain-bundles.yaml
      - ../../environments/digit-tag.yaml.gotmpl

  - name: gateway-kong
    chart: ./gateway-kong
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-domain-bundles.yaml
      - ./gateway-kong/values.yaml
