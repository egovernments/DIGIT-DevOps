# LnP (License & Permits) OVERLAY — additive, shape-agnostic. Deploy it on top of whichever shape
# 06-deploy.sh installed; it never touches the shape's own releases (keycloak, the 16 services or
# bundles, kong, cluster-configs). Driven by scripts/09-lnp.sh:
#
#   DOMAIN=<vm domain> DIGIT_SHAPE=<shape> ./deploy.sh -f lnp-helmfile.yaml sync
#
# Image tags: environments/azure-k3s-lnp-tags.yaml (scripts/lnp-tags.sh snapshots them from the LnP
# team's test-lts.yaml). Hosts/URLs: environments/azure-k3s-lnp.yaml.gotmpl (from DOMAIN and the
# shape's egov-service-host map). Kong routes are not Helm: 09-lnp.sh replays lnp/kong-routes.json.
# Not included on purpose: notify (platform choice, not an LnP dependency), metabase (dashboards
# only), oauth2-proxy (unrelated), OTEL export (no collector on the VMs). See LNP.md.

releases:
  - name: mdms-v2
    chart: ./mdms-v2
    namespace: egov
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ./mdms-v2/values.yaml
      - ../../environments/azure-k3s-lnp-tags.yaml
      - ../../environments/azure-k3s-lnp.yaml.gotmpl

  - name: walt
    chart: ./walt
    namespace: egov
    installed: true
    missingFileHandler: Warn
