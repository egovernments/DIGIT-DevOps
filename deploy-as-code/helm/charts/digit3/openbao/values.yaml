# OpenBao for the digit3 install. Release name MUST be `openbao` and namespace `openbao`:
# egov-service-host's `vault` / `vault-host` keys point at openbao.openbao.svc and
# openbao-0.openbao-internal.openbao.svc. scripts/04-openbao.sh initialises, unseals and
# configures it (and must be re-run after every pod restart: the Shamir seal closes).
image:
  repository: openbao/openbao
  tag: "2.7.2"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

persistence:
  size: 10Gi
  # "" = the cluster's default StorageClass
  storageClass: ""
