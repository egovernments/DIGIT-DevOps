# PER-SERVICE (microservice) shape: keycloak + the 16 digit3 services + kong,
# each service as its own release/pod. Deploy exactly ONE shape per cluster —
# this, single-container-helmfile.yaml and domain-bundles-helmfile.yaml
# publish the same ingress context paths and kong prefixes.
#
#   DIGIT_TAG=modulith-<sha> ./deploy.sh -f per-service-helmfile.yaml sync
#
# Explicit chart paths (no templating): helmfile v1 only renders Go templates
# in *.gotmpl files. Image tags come solely from DIGIT_TAG via
# environments/digit-tag.yaml.gotmpl; the shape's domain + service-host keys
# come from environments/azure-k3s-per-service.yaml.

releases:
  - name: keycloak
    chart: ./keycloak
    namespace: keycloak
    installed: true
    missingFileHandler: Warn
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-per-service.yaml
      - ./keycloak/values.yaml

  - name: idgen
    chart: ./idgen
    namespace: egov
    installed: true
    missingFileHandler: Warn
    needs:
      - keycloak/keycloak
    values:
      - ../../environments/azure-k3s-secrets.dec.yaml
      - ../../environments/azure-k3s.yaml
      - ../../environments/azure-k3s-per-service.yaml
      - ./idgen/values.yaml
      - ../../environments/digit-tag.yaml.gotmpl

