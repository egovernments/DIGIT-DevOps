{{- $creds := dig "cluster-configs" "secrets" "minio" dict .Values.AsMap -}}
{{- $bucket := .Values.s3.bucket -}}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app: seaweedfs
type: Opaque
stringData:
  # One identity for filestore, allowed only on its own bucket (no shared root credentials).
  s3.json: |
    {{- dict "identities" (list (dict
          "name" "filestore"
          "credentials" (list (dict
            "accessKey" (required "cluster-configs.secrets.minio.accesskey is required (secrets file)" $creds.accesskey)
            "secretKey" (required "cluster-configs.secrets.minio.secretkey is required (secrets file)" $creds.secretkey)))
          "actions" (list (printf "Read:%s" $bucket) (printf "Write:%s" $bucket) (printf "List:%s" $bucket) (printf "Tagging:%s" $bucket))))
        | toJson | nindent 4 }}
