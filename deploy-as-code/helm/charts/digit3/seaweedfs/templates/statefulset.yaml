apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: {{ .Release.Namespace }}
  labels:
    app: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
      annotations:
        # Restart when the S3 identities change: the s3.json config is read at start.
        checksum/s3: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: seaweedfs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=1024
            - -volume.max=100
            - -s3
            - -s3.port={{ .Values.s3.port }}
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - containerPort: {{ .Values.s3.port }}
              name: s3
          readinessProbe:
            tcpSocket:
              port: {{ .Values.s3.port }}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
