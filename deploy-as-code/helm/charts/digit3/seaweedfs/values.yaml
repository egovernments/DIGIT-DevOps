# SeaweedFS for the digit3 install. Release name MUST be `seaweedfs` in namespace `backbone`:
# filestore's S3_ENDPOINT is seaweedfs.backbone.svc.cluster.local:8333.
# Credentials: the S3 identity is rendered from cluster-configs.secrets.minio.accesskey/secretkey
# (the same values the `minio` secret gives filestore), scoped to `bucket` only. The secret keeps
# its `minio` name for now so the service charts need no change.
image:
  repository: chrislusf/seaweedfs
  tag: "4.51"
  pullPolicy: IfNotPresent

s3:
  port: 8333
  # filestore's bucket; scripts/03-backbone.sh creates it after install.
  bucket: unified-dev-bucket-s3

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  size: 50Gi
  # "" = the cluster's default StorageClass
  storageClass: ""
