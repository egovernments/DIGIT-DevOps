# Valkey for the digit3 install. Release name MUST be `valkey` in namespace `backbone`: services
# and Kong's token-revocation plugin reach it at valkey.backbone.svc.cluster.local:6379.
# Same shape as the Redis it replaces: standalone, no auth, server defaults (noeviction, RDB save
# rules, no AOF, no maxmemory), no persistent volume.
namespace: backbone

# Common Labels
labels:
  app: "valkey"

# Container Configs
image:
  repository: "valkey/valkey"
  pullPolicy: IfNotPresent
  tag: "8.1.11-alpine"
replicas: "1"
httpPort: 6379
