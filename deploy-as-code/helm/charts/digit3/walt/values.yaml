# Common Labels
labels:
  app: "walt"
  group: "rainmaker"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "walt"

# Container Configs
image:
  repository: "waltid/issuer-api"
  tag: "0.23.0"
replicas: "1"
httpPort: 7002
resources: |
  requests:
    cpu: "100m"
    memory: "384Mi"
  limits:
    cpu: "300m"
    memory: "768Mi"
healthChecks:
  enabled: false
