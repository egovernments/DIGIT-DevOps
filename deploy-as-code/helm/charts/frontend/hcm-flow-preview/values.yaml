# Common Labels
labels:
  app: "hcm-flow-preview"
  group: "web"

namespace: health

# Ingress Configs: must be on the same host as workbench-ui (the drawer talks
# to the preview over postMessage, same origin only). No rewrite: the image's
# nginx serves under /flow-preview/.
ingress:
  enabled: true
  context: "flow-preview"

# Init Containers Configs
initContainers: {}

# Container Configs (image built by DIGIT-Frontend's Build Pipeline,
# pipeline flow-preview)
image:
  repository: "hcm-flow-preview"
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/flow-preview/health"
  readinessProbePath: "/flow-preview/health"
