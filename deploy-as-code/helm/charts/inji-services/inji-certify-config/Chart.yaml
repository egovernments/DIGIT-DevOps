apiVersion: v2
name: inji-certify-config
description: >-
  Seeds Certify's credential_config via its own validated REST API. Idempotent:
  GETs the configuration first and POSTs only when absent. Never issues PUT or
  DELETE, so it cannot modify or remove an existing configuration.
