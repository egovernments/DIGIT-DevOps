# Seeds Certify's credential_config via its own REST API.
#
# WHY THE API AND NOT SQL
# certify.credential_config is a 28-column table with four partial unique
# indexes, and Certify validates signatureCryptoSuite, signatureAlgo,
# keyManagerAppId and keyManagerRefId against
# mosip.certify.credential-config.* / signature-algo.key-alias-mapper before
# accepting a configuration. A raw INSERT bypasses all of that and can produce
# a row Certify will not use -- or one that violates a uniqueness rule it
# expects to enforce itself. docs/Credential-Issuer-Configuration.md is
# explicit that configurations are managed through the endpoints.
#
# SAFETY: the Job GETs the configuration first and POSTs only when it is
# absent. It never issues PUT or DELETE, so an existing configuration is never
# modified or removed. Re-running is a no-op.
enabled: false

# Reached in-cluster; no ingress or TLS involved.
# /v1/certify/credential-configurations/** is in Certify's ignore-auth-urls, so
# no token is required. Verified: GET of a nonexistent id returns 404, not 401.
certify:
  service: "inji-certify"
  ## The SERVICE port, not the container port.
  ##
  ## This was set to 8090 -- the containerPort -- and the Job died with
  ## DeadlineExceeded: the health-wait loop never connected, exhausted its 30
  ## tries, retried, and hit activeDeadlineSeconds. Measured from inside the
  ## namespace:
  ##   http://inji-certify.inji:8090/v1/certify/actuator/health -> 000
  ##   http://inji-certify.inji:80/v1/certify/actuator/health   -> 200
  ## The chart renders Service port 80 -> targetPort 8090.
  port: 80
  servletPath: "/v1/certify"

# PAYLOAD FIELDS: files/credential-config.json carries only fields that exist on
# CredentialConfigurationDTO in mosip/inji-certify@v0.13.1.
#
# The upstream postman collections include three extra snake_case fields --
# cryptographic_binding_methods_supported, credential_signing_alg_values_supported
# and proof_types_supported. This DTO has NO such fields, and Jackson rejects the
# whole request:
#   JSON parse error: Unrecognized field "cryptographic_binding_methods_supported"
#   (class CredentialConfigurationDTO), not marked as ignorable
# Those three are GLOBAL properties (mosip.certify.credential-config.*), already
# set in certify-default.properties -- they are not per-configuration. The
# collections evidently target a different Certify version.
#
# Must match credentialConfigKeyId in files/credential-config.json -- the Job
# uses it for the existence check.
credentialConfigKeyId: "DigitLicenseCredential"

image:
  # curl + jq for the GET/POST and response parsing.
  repository: "curlimages/curl"
  tag: "8.11.1"
  pullPolicy: IfNotPresent

job:
  backoffLimit: 3
  activeDeadlineSeconds: 300

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

labels:
  app: "inji-certify-config"
  group: "inji"
