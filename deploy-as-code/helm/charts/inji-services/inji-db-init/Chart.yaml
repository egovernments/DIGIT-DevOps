apiVersion: v2
name: inji-db-init
description: >-
  Bootstraps the Inji stack's databases, schemas and roles on postgres.egov.
  Runs as an ArgoCD PreSync Job so the databases exist before any Inji module
  Application syncs. Idempotent: safe to re-run on every sync.
type: application
version: 0.1.0
appVersion: 0.1.0

## No dependency on the `common` library chart. common provides
## deployment/service/ingress/cronjob helpers; this chart renders only a
## ConfigMap and a Job, and pulling common in would force a set of
## global.* values this chart has no use for.
