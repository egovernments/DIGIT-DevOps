{{- $v := include "inji-esignet-client.mergedValues" . | fromYaml -}}
{{- if $v.enabled }}
{{- $sum := include "inji-esignet-client.checksum" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inji-esignet-client-{{ $sum }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
{{- range $k, $val := $v.labels }}
    {{ $k }}: {{ $val | quote }}
{{- end }}
data:
  client.json: |
{{ .Files.Get "files/client.json" | indent 4 }}
  register.sh: |
{{ .Files.Get "files/register.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inji-esignet-client-{{ $sum }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
{{- range $k, $val := $v.labels }}
    {{ $k }}: {{ $val | quote }}
{{- end }}
spec:
  backoffLimit: {{ $v.job.backoffLimit }}
  activeDeadlineSeconds: {{ $v.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
{{- range $k, $val := $v.labels }}
        {{ $k }}: {{ $val | quote }}
{{- end }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: register
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: BASE
              value: "http://{{ $v.esignet.service }}.{{ .Release.Namespace }}:{{ $v.esignet.port }}{{ $v.esignet.servletPath }}"
            - name: CLIENT_ID
              value: {{ $v.clientId | quote }}
          command:
            - /bin/sh
            - /scripts/register.sh
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
{{- toYaml $v.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: inji-esignet-client-{{ $sum }}
        - name: scripts
          configMap:
            name: inji-esignet-client-{{ $sum }}
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
{{- end }}
