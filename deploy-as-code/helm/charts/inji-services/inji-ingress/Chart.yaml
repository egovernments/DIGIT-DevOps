apiVersion: v2
name: inji-ingress
description: >-
  Kubernetes Ingress objects for the Inji modules. The upstream Inji charts
  route only through Istio (gateway.yaml / virtualservice.yaml, both gated on
  istio.enabled) and render no Ingress; digit-lts has no Istio, so the routing
  layer lives here. Backends point at each module's Service directly, bypassing
  Kong.
type: application
version: 0.1.0
appVersion: 0.1.0
