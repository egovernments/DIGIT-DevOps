# Kubernetes Ingress objects for the Inji modules.
#
# WHY THIS CHART EXISTS
# Every upstream Inji chart routes exclusively through Istio -- gateway.yaml
# and virtualservice.yaml, both gated on `istio.enabled`. There is no Istio in
# digit-lts, and none of those charts renders a Kubernetes Ingress. Setting
# istio.enabled=false leaves a clean Deployment + Service + ConfigMaps (verified
# by rendering injiweb 0.15.0), so the routing layer is supplied here instead.
#
# Keeping all the Ingresses in one chart rather than patching five upstream
# charts means one place to reason about hosts, TLS and annotations, and no
# forks to rebase on an Inji version bump.
#
# These bypass Kong entirely: each backend is the module's own Service, not
# kong-kong-proxy. Kong here performs DIGIT-specific auth (keycloak-rbac,
# dynamic-jwt, header-enrichment, tenant metadata) which would fight OIDC4VCI.
# Nothing in this chart touches an existing DIGIT ingress or Kong's config.
enabled: false

ingressClassName: "nginx"

# letsencrypt-prod is the cluster's working issuer (HTTP01 solver against
# ingressClass nginx). Switch to letsencrypt-staging while iterating on
# hostnames: prod caps duplicate certificates at 5 per week per name, and a
# wrong host burns an issuance.
certIssuer: "letsencrypt-prod"

annotations:
  # The controller configmap sets no proxy-body-size, so the cluster default of
  # 1 MB applies. Inji Verify accepts QR/PDF uploads and Mimoto handles
  # credential payloads that exceed that. Set per-ingress here rather than
  # raising it globally, which would change behaviour for every DIGIT service.
  nginx.ingress.kubernetes.io/proxy-body-size: "25m"
  # Matches the timeouts already set cluster-wide for DIGIT (300s).
  nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

# One entry per module. `enabled: false` on any of them renders nothing, so
# modules can be turned on one at a time.
#
# host: must already have an A record to 4.224.237.122 -- cert-manager solves
#       HTTP01 against the real hostname.
# service/port: the Service the upstream chart renders. Upstream charts have no
#       fullnameOverride support, so the Service name follows the ArgoCD
#       Application's helm.releaseName. These must match the releaseName values
#       in charts/argo-cd/inji/inji-applications.yaml.
modules:
  injiweb:
    enabled: false
    host: "injiweb.test-lts.digit.org"
    service: "injiweb"
    port: 80

  injicertify:
    enabled: false
    host: "injicertify.test-lts.digit.org"
    service: "inji-certify"
    port: 80
    ## Host-root .well-known rewrite -- REQUIRED, not optional.
    ##
    ## Certify serves issuer metadata and did.json under its servlet path, but
    ## OIDC4VCI expects the metadata at the host root, and our DID
    ## (did:web:injicertify.test-lts.digit.org) resolves to
    ## https://injicertify.test-lts.digit.org/.well-known/did.json -- also the
    ## host root. Without this, both 404 and the DID cannot be resolved by a
    ## verifier. Replicates the two exact-match Istio rewrites in the upstream
    ## chart's istio.uriMatches.
    wellKnownRewrite:
      enabled: true
      pathRegex: "/\\.well-known/(openid-credential-issuer|did\\.json)"
      target: "/v1/certify/issuance/.well-known/$1"
    # CORRECTED: an earlier version of this comment claimed the default "/"
    # prefix rule already served the host-root .well-known paths, so no extra
    # rule was needed. That was wrong. Owning the hostname makes the paths
    # REACHABLE, but nginx passes them through unmodified and Certify serves
    # them only under its servlet path -- verified against the running pod:
    #   /.well-known/openid-credential-issuer  -> 404
    #   /.well-known/did.json                  -> 404
    # Hence the wellKnownRewrite above.

  esignet:
    enabled: false
    host: "esignet.test-lts.digit.org"
    service: "esignet"
    port: 80
    ## Deny these paths at the edge.
    ##
    ## eSignet runs with mosip.esignet.security.auth.{post,put,get}-urls={} --
    ## the mock plugin's intended posture -- and SecurityConfig:73 turns that
    ## into anyRequest().permitAll() with no OAuth2 resource server. That is
    ## what makes the client-management API usable without a Keycloak realm we
    ## do not have, but it also leaves the admin endpoints unauthenticated to
    ## anyone who can reach the host.
    ##
    ## eSignet is publicly exposed, so the admin surface is blocked here
    ## instead. In-cluster callers reach the Service directly and are
    ## unaffected -- which is how inji-esignet-client registers the Mimoto
    ## client.
    ##
    ## Not a substitute for real authorization: if eSignet is ever pointed at a
    ## working IdP, repopulate the auth.*-urls maps and drop this.
    denyPaths:
      - /v1/esignet/client-mgmt
      - /v1/esignet/system-info

  injiverify:
    enabled: false
    host: "injiverify.test-lts.digit.org"
    service: "inji-verify-ui"
    port: 80

# Mimoto has no entry on purpose: it is cluster-internal only. injiweb's own
# nginx proxies /v1/mimoto to it, so the browser never addresses Mimoto
# directly. It would need a host only for the Inji mobile wallet, which is out
# of scope.

labels:
  app: "inji-ingress"
  group: "inji"
