apiVersion: v2
name: inji-mimoto-keygen
description: >-
  Creates the mimoto-keygen-keymanager PVC and seeds it with an
  encryptionkeystore.p12, the writable PKCS12 keystore Mimoto's keymanager
  uses. Replaces the upstream keygen step, which has no GitOps equivalent.
  Idempotent: the keystore is generated only if absent.
type: application
version: 0.1.0
appVersion: 0.1.0
