apiVersion: v2
name: inji-stack-config
description: >-
  The inji-stack-config ConfigMap: the single place every Inji module reads its
  hostnames from. Required by inji-certify, mimoto and injiweb (all three list
  it in extraEnvVarsCM), so it must exist before any of them start.
type: application
version: 0.1.0
appVersion: 0.1.0

## No `common` dependency -- this chart renders one ConfigMap and has no use
## for common's deployment/service/ingress helpers or the global.* values they
## require. Values from the environment file are merged explicitly instead;
## see templates/_helpers.tpl.
