{{- $v := include "inji-stack-config.mergedValues" . | fromYaml -}}
{{- if $v.enabled }}
{{- if $v.configServerGitSecret.enabled }}
## The `config-server` Secret, holding key `github-token`.
##
## Rendered here rather than in the config-server chart because that chart
## references the secret but never creates it:
## templates/deployment.yaml sets
##   - name: SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD
##     valueFrom: { secretKeyRef: { name: <fullname>, key: github-token } }
## UNCONDITIONALLY -- it is not gated on gitRepo.private. So config-server
## fails with CreateContainerConfigError without this secret even though
## deploy-as-code/inji-config lives in a public repo and needs no token.
##
## It lives in this chart because inji-stack-config is already the "must exist
## before the modules" Application, so the ordering is free.
##
## The token is EMPTY by default, which is correct for a public repo. If the
## config directory ever moves to a private repo, set gitToken from a
## SOPS-encrypted value in test-lts-secrets.yaml -- never inline here.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.configServerGitSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- range $k, $val := $v.labels }}
    {{ $k }}: {{ $val | quote }}
{{- end }}
type: Opaque
stringData:
  github-token: {{ $v.configServerGitSecret.gitToken | quote }}
{{- end }}
{{- end }}
