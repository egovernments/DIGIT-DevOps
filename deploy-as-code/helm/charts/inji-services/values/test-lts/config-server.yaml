# config-server (mosip/config-server 12.0.4) for digit-lts.
#
# Serves the .properties files that esignet, inji-certify and mimoto read at
# startup, and publishes the `config-server-share` ConfigMap those charts list
# in extraEnvVarsCM. Nothing downstream starts cleanly without it, so this is
# the first Application to bring up.

## Forces the Service name to `config-server` regardless of release name.
## config-server is the only Inji-related chart that supports this -- the
## others derive the Service name from helm.releaseName.
fullnameOverride: config-server

replicaCount: 1

## Config properties live in a subfolder of THIS repo, not a separate
## inji-config fork. searchFolders is what makes that work: config-server
## clones the repo at `version` and then looks inside the listed folders.
##
## The repo is public, so gitRepo.private stays false and no token is needed.
## If deploy-as-code/inji-config is ever moved to a private repo, set
## private: true and supply username/token from a SOPS-encrypted secret.
gitRepo:
  uri: https://github.com/egovernments/DIGIT-DevOps
  version: digit-lts
  searchFolders: deploy-as-code/inji-config
  private: false
  ## token feeds the chart's own Secret, which the Deployment reads as
  ## SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD. That reference is
  ## UNCONDITIONAL -- not gated on `private` -- so the Secret must exist even
  ## for a public repo. The chart creates it, so nothing extra is needed here.
  ##
  ## TRAP if you ever set a real token: templates/secret.yaml writes
  ##   data:
  ##     github-token: {{ .Values.gitRepo.token | quote }}
  ## straight into `data:` with NO b64enc, so the value must already be
  ## base64 (`printf %s <token> | base64`). A plaintext token yields a Secret
  ## Kubernetes cannot decode. Same shape as the softhsm securityPIN trap.
  ## Empty is valid and is what a public repo needs.
  token: ""
  username: ""

## Published to every module in the config-server-share ConfigMap as
## active_profile_env, which each chart passes to the container.
##
## `digit-landregistry` activates certify-digit-landregistry.properties -- our
## own Certify profile, selecting the Postgres data-provider plugin. Upstream's
## certify-postgres-landregistry.properties is deliberately NOT activated: it
## points at a database name we do not have and at MOSIP's own did:web. It
## stays in the directory as the diff base.
##
## The list is shared by all modules, which is harmless: Spring ignores a
## profile with no matching {application}-{profile}.properties file, so
## esignet and mimoto simply see nothing for digit-landregistry.
##
## `inji-default` is what the deployment doc means by "ensure
## config-server-share has active_profile_env: default,inji-default,standalone".
activeProfileEnv: "default,inji-default,standalone,digit-landregistry"

## RESOLVED. Upstream wires 17 ConfigMap/Secret references into this
## Deployment -- activemq-activemq-artemis-share, global, keycloak-host,
## msg-gateway, postgres-setup-config, s3, conf-secrets-various,
## db-common-secrets, keycloak-client-secrets, mosip-captcha, softhsm-ida,
## softhsm-kernel and more. Every one was confirmed MISSING in the inji
## namespace; each would be a CreateContainerConfigError.
##
## They exist so a full MOSIP install can inject secrets INTO the config
## stream, overriding properties as they are served to clients. digit-lts does
## not need that: each Inji module receives its own credentials directly as
## env vars from the `inji-db` and softhsm secrets (see the other values files
## in this directory). So config-server's only job here is to serve the files
## in deploy-as-code/inji-config verbatim, and every override is cleared.
##
## BOTH lists must be emptied -- the template has two separate range blocks,
## and clearing only envVariables leaves two postgres-setup-config references
## behind from extraEnvVars.
envVariables: []

## extraEnvVars is emptied of upstream's MOSIP references, but carries ONE
## entry we need.
##
## THE GIT LABEL. gitRepo.version is NOT wired into the server by this chart --
## configmap-env-vars.yaml only emits GIT_SEARCHPATHS, GIT_URI and
## GIT_USERNAME. gitRepo.version is used solely to build client-facing URLs in
## configmap-share.yaml (spring_config_label_env, cache_config_url_env, ...).
##
## So the server falls back to Spring's default label, `master`, and
## deploy-as-code/inji-config does not exist on master -- it is on digit-lts.
## The observed symptom was the startup probe on /config/*/* returning 404
## while the log showed "Reset label master to version AnyObjectId[987e6aa...]":
## the clone succeeded, the branch was simply the wrong one.
##
## Each entry needs `enabled: true` -- the template's range is gated on it and
## silently skips entries without it.
extraEnvVars:
  - name: SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL
    enabled: true
    value: "digit-lts"

resources:
  limits:
    cpu: 500m
    memory: 1536Mi
  requests:
    cpu: 100m
    memory: 768Mi

## No Ingress. config-server is consumed in-cluster only; exposing it would
## publish every property, including credentials, to the internet.
ingress:
  enabled: false
