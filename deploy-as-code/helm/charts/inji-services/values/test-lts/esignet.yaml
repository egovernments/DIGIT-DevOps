# esignet (mosip/esignet 1.8.0) for digit-lts — the OIDC provider that
# authenticates the wallet user before a credential is issued.
#
# Own hostname, esignet.test-lts.digit.org, because the OIDC issuer identifier
# and its authorization/token endpoints must be browser-reachable and must not
# change shape once clients are registered.

replicaCount: 1

## Istio off. Note this chart's default gateways are
## [istio-system/public, istio-system/internal] -- references to an Istio
## install that does not exist here. Routing comes from inji-ingress, targeting
## the Service named `esignet` (from helm.releaseName) on port 80.
istio:
  enabled: false

service:
  type: ClusterIP
  port: 80

## esignet-softhsm-share comes from the softhsm-esignet Application.
## inji-stack-config is added so eSignet resolves the same hostnames as the
## rest of the stack; upstream's default list contains only the softhsm entry.
extraEnvVarsCM:
  - esignet-softhsm-share
  - inji-stack-config
  - config-server-share

## Database and HSM credentials.
##
## esignet-default.properties (served from deploy-as-code/inji-config, copied
## from mosip/mosip-config since inji-config does not carry it) already defines
##   spring.datasource.url=jdbc:postgresql://${mosip.esignet.database.hostname}:...
##                         /mosip_esignet?currentSchema=esignet
##   spring.datasource.username=esignetuser
##   spring.datasource.password=${db.dbuser.password}
## and application-default.properties overrides
## mosip.esignet.database.hostname to postgres.egov.
##
## So only the password is injected, and as DB_DBUSER_PASSWORD -- Spring's
## relaxed binding maps it onto the ${db.dbuser.password} placeholder.
## SPRING_DATASOURCE_PASSWORD would leave the placeholder unresolved.
extraEnvVars:
  - name: DB_DBUSER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: inji-db
        key: esignet-password
  ## Resolves ${softhsm.esignet.security.pin}. Secret created by the
  ## softhsm-esignet Application, named after its fullnameOverride.
  - name: SOFTHSM_ESIGNET_SECURITY_PIN
    valueFrom:
      secretKeyRef:
        name: esignet-softhsm
        key: security-pin


## NOT YET DECIDED — the identity plugin.
##
## pluginNameEnv/pluginUrlEnv select what eSignet authenticates against. The
## sandbox default is the mock identity system; a real deployment points at an
## actual identity provider. Left unset rather than guessed, because the choice
## determines whether a mock-identity-system Application is also needed and
## what the credential subject data looks like. inji-stack-config currently
## maps esignet-mock-host to the real eSignet host as a placeholder.
# pluginNameEnv: ""
# pluginUrlEnv: ""

## MUST stay identical to activeProfileEnv in config-server.yaml.
##
## This chart renders active_profile_env as a LITERAL env entry, and an
## explicit `env:` value overrides anything of the same name arriving via
## envFrom -- so this value wins over the config-server-share ConfigMap, even
## though that ConfigMap is in this chart's extraEnvVarsCM.
##
## That is a real trap. It cost a debugging round: config-server-share
## correctly advertised
##   default,inji-default,standalone,digit-lts,digit-landregistry
## while the pod requested only
##   default,inji-default,standalone
## so esignet-digit-lts.properties was never loaded and startup failed on
## ${redis.port} -- which lives in exactly that file. The commit and the
## served config were both current; only the requested profile list was stale.
##
## inji-certify, mimoto and injiweb do NOT expose activeProfileEnv, so they
## inherit the list from config-server-share and cannot drift this way.
## eSignet is the only module where these two files must be kept in step.
activeProfileEnv: "default,inji-default,standalone,digit-lts,digit-landregistry"

persistence:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 1Gi
