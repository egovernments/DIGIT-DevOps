# inji-certify (mosip/inji-certify 0.13.1) for digit-lts — the credential issuer.
#
# Runs ALONGSIDE the existing walt.id issuer (egov/vc -> egov/walt), which is
# left untouched. Own hostname, injicertify.test-lts.digit.org.
#
# The hostname is not cosmetic. OIDC4VCI locates credential issuer metadata by
# inserting /.well-known/openid-credential-issuer between host and path, i.e.
# at the HOST ROOT. This chart's own istio.uriMatches declares exact matches
# for /.well-known/openid-credential-issuer and /.well-known/did.json,
# confirming it. With a bare hostname the inji-ingress "/" prefix rule serves
# both automatically; under a path prefix they would be unreachable.

replicaCount: 1

## Istio off. This chart's gateway.yaml and virtualservice.yaml are both gated
## on istio.enabled and it renders no Kubernetes Ingress. digit-lts has no
## Istio; routing comes from the local inji-ingress chart, which targets the
## Service named `inji-certify` (from helm.releaseName) on port 80.
istio:
  enabled: false

service:
  type: ClusterIP
  port: 80

## softhsm-certify-share comes from the softhsm-certify Application — a
## SEPARATE softhsm instance from eSignet's. The issuer's signing keys and the
## OIDC provider's are different trust domains and upstream keeps them apart.
extraEnvVarsCM:
  - inji-stack-config
  - config-server-share
  - artifactory-share
  - softhsm-certify-share

## Database and HSM credentials.
##
## Only the password is injected here. certify-default.properties already
## defines:
##   spring.datasource.url=jdbc:postgresql://${mosip.certify.database.hostname}:...
##                         /${mosip.certify.database.name}?currentSchema=certify
##   spring.datasource.username=certifyuser
##   spring.datasource.password=${db.dbuser.password}
##   mosip.certify.database.name=inji_certify
## and inji-config/application-default.properties overrides
## mosip.certify.database.hostname to postgres.egov. So the URL, database name
## and username all come from config-server.
##
## The env var MUST be DB_DBUSER_PASSWORD, not SPRING_DATASOURCE_PASSWORD:
## Spring's relaxed binding maps DB_DBUSER_PASSWORD onto the
## ${db.dbuser.password} placeholder. Setting SPRING_DATASOURCE_PASSWORD would
## leave that placeholder unresolved and fail startup, because the property
## file resolves the placeholder rather than reading the env var directly.
extraEnvVars:
  - name: DB_DBUSER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: inji-db
        key: certify-password
  ## Resolves ${softhsm.certify.security.pin}, used by
  ## mosip.kernel.keymanager.hsm.keystore-pass. The secret is created by the
  ## softhsm-certify Application and named after its fullnameOverride.
  - name: SOFTHSM_CERTIFY_SECURITY_PIN
    valueFrom:
      secretKeyRef:
        name: softhsm-certify
        key: security-pin

## The image is inji-certify-with-plugins, so the HSM plugin ships in the
## image; upstream's default for installHSMPlugin is kept.

persistence:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 1Gi

## Make the chart's ServiceMonitor actually scrapeable.
## Prometheus here selects ServiceMonitors by label
## (release=kube-prometheus-stack) across all namespaces; the MOSIP charts do
## not set it, so this ServiceMonitor existed for 27h without being scraped.
## See the fuller note in mimoto.yaml.
metrics:
  ## Override the chart default, which is WRONG for this image.
  ## inji-certify 0.13.1 ships
  ##   endpointPath: /v1/inji-certify/actuator/prometheus
  ## but the app's servlet context is /v1/certify, so the chart's own path
  ## 404s. Verified against the running pod on containerPort 8090:
  ##   /v1/inji-certify/actuator/prometheus -> 404 (106 bytes)
  ##   /v1/certify/actuator/prometheus      -> 200 (51263 bytes)
  ## Left unfixed, adding the release label below would register a target that
  ## fails every scrape -- worse than having no target, because it alerts.
  endpointPath: /v1/certify/actuator/prometheus

  serviceMonitor:
    additionalLabels:
      release: kube-prometheus-stack
