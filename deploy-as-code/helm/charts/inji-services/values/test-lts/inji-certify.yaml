# inji-certify (mosip/inji-certify 0.13.1) for digit-lts — the credential issuer.
#
# Runs ALONGSIDE the existing walt.id issuer (egov/vc -> egov/walt), which is
# left untouched. Own hostname, injicertify.test-lts.digit.org.
#
# The hostname is not cosmetic here. OIDC4VCI locates credential issuer
# metadata by inserting /.well-known/openid-credential-issuer between host and
# path, i.e. at the HOST ROOT. This chart's own istio.uriMatches declares exact
# matches for /.well-known/openid-credential-issuer and /.well-known/did.json,
# confirming it. With a bare hostname the inji-ingress "/" prefix rule serves
# both automatically; under a path prefix they would be unreachable.

replicaCount: 1

## Istio off. Routing comes from inji-ingress, targeting the Service named
## `inji-certify` (from helm.releaseName) on port 80.
istio:
  enabled: false

service:
  type: ClusterIP
  port: 80

## softhsm-certify-share comes from the softhsm-certify Application — a
## SEPARATE softhsm instance from eSignet's. The issuer's signing keys and the
## OIDC provider's are different trust domains and upstream keeps them apart.
extraEnvVarsCM:
  - inji-stack-config
  - config-server-share
  - artifactory-share
  - softhsm-certify-share

## Role certifyuser, database inji_certify, schema certify, on postgres.egov.
## Upstream expects a shared db-common-secrets/db-dbuser-password; digit-lts
## uses one role per module, so this targets the per-module key in `inji-db`.
extraEnvVars:
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgres.egov:5432/inji_certify?currentSchema=certify"
  - name: SPRING_DATASOURCE_USERNAME
    value: "certifyuser"
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: inji-db
        key: certify-password

## The image is inji-certify-with-plugins, so the HSM plugin is already in the
## image; leave upstream's default rather than re-installing at startup.
# installHSMPlugin: false

persistence:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 1Gi
