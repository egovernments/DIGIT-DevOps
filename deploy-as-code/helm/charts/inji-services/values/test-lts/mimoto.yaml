# mimoto (mosip/mimoto 0.20.0) for digit-lts — the wallet backend-for-frontend.
#
# CLUSTER-INTERNAL ONLY. No Ingress, no hostname, no certificate. The web
# wallet reaches it through injiweb's own nginx (proxy_pass to
# mimoto-service/v1/mimoto), so the browser never addresses it directly.
# A hostname would only be needed for the Inji MOBILE wallet, where the phone
# talks to Mimoto itself — out of scope here.
#
# The Application MUST set helm.releaseName: mimoto-service. This chart has no
# fullnameOverride, so the Service name comes from the release name, and
# injiweb.yaml's inji_web.inji_web_service_host points at exactly that name.

replicaCount: 1

## Istio off — see injiweb.yaml. Unlike the other charts, mimoto has no
## gateway.yaml at all, only virtualservice.yaml, because upstream attaches it
## to inji-web's gateway.
istio:
  enabled: false

service:
  type: ClusterIP
  ## Service listens on 80 and targets the container's 8099. injiweb's nginx
  ## proxies to `mimoto-service` with no port, i.e. 80, so this must stay 80.
  port: 80
  containerPort: 8099

## artifactory-share comes from the artifactory Application; config-server-share
## from config-server. Both must be Healthy before mimoto starts or the pod
## fails on a missing ConfigMap reference.
extraEnvVarsCM:
  - inji-stack-config
  - config-server-share
  - artifactory-share

## google-client backs the wallet's optional Google sign-in.
##
## CORRECTED: an earlier draft said this secret had to be created externally.
## It does not -- the mimoto chart renders the `google-client` Secret itself
## (verified: it emits keys MOSIP_INJIWEB_GOOGLE_CLIENT_ID and
## MOSIP_INJIWEB_GOOGLE_CLIENT_SECRET), so the reference resolves with the
## chart's own empty defaults and the pod starts. Supply real values here only
## if Google sign-in is actually wanted.
extraEnvVarsSecret:
  - google-client

## Database and keystore credentials.
##
## Upstream expects one shared `db-common-secrets`/db-dbuser-password for every
## module; digit-lts has a separate role per module, so this points at the
## per-module key in the `inji-db` secret created by cluster-configs.
##
## CORRECTED from an earlier draft that set SPRING_DATASOURCE_*.
## mimoto-default.properties defines keymanager_database_url /
## keymanager_database_username itself and reads the password as
## ${db.dbuser.password}; application-default.properties overrides
## inji.mimoto.database.hostname to postgres.egov. So only the password is
## injected, via DB_DBUSER_PASSWORD (relaxed binding onto the placeholder).
extraEnvVars:
  - name: DB_DBUSER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: inji-db
        key: mimoto-password
  ## Resolves ${mimoto.oidc.keystore.password}, used for BOTH
  ## mosip.oidc.p12.password and the keymanager keystore pass.
  ## STILL TO BE CREATED -- see the keystore note below.
  - name: MIMOTO_OIDC_KEYSTORE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mimotooidc
        key: oidckeystore-password

## NOT YET RESOLVED — mimoto will not start without these two keystores:
##
##  1. `mimotooidc` secret, key oidckeystore.p12, mounted at /home/mosip/certs.
##     These are the issuer keys the wallet uses to talk to Certify. They have
##     to be generated, then SOPS-encrypted into test-lts-secrets.yaml.
##  2. `mimoto-keygen-keymanager` PVC providing
##     /home/mosip/encryption/encryptionkeystore.p12, produced upstream by a
##     keygen job that is not part of this chart.
##
## Left unset rather than guessed: a wrong mount path here produces a pod that
## starts and then fails at first credential download, which is much harder to
## diagnose than a missing-volume error.
# extraVolumes: []
# extraVolumeMounts: []

## No PVC for the landing folder. Upstream defaults to storageClass nfs-csi,
## which does not exist here (digit-lts has azurefile / managed-csi). Enable
## with storageClass: azurefile only if a shared landing folder is needed.
persistence:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 1Gi

## Prometheus scrape path. REQUIRED HERE -- it is an upstream chart packaging
## bug, not a preference.
##
## mimoto 0.20.0's values.yaml ships `endpointPath:` with NO value, while
## templates/servicemonitor.yaml renders it unguarded:
##     path: {{ .Values.metrics.endpointPath }}
## so the ServiceMonitor comes out with a null path and the CRD rejects it:
##   ServiceMonitor.monitoring.coreos.com "mimoto-service" is invalid:
##     spec.endpoints[0].path: Invalid value: "null":
##     spec.endpoints[0].path in body must be of type string
##
## The sibling charts do not have this problem -- esignet 1.8.0 ships
## endpointPath: /v1/esignet/actuator/prometheus -- which is why esignet,
## inji-certify and mock-identity-system all have working ServiceMonitors and
## mimoto had none at all.
##
## CONSEQUENCE IF LEFT UNSET: the Application never reaches Synced. ArgoCD
## retries the apply (limit 10, backoff to 5m) and inji-mimoto sits
## OutOfSync/Healthy indefinitely -- Healthy because the Deployment itself is
## fine, so this is easy to mistake for cosmetic drift. It also means no Mimoto
## metrics are scraped.
##
## Value verified against the running pod, not inferred from the servlet path:
##   /v1/mimoto/actuator/prometheus -> HTTP 200, 43176 bytes
## and the actuator index exposes health, info, metrics, prometheus.
## The template pairs it with targetPort: {{ .Values.service.containerPort }}
## = 8099, which matches the Service's targetPort.
metrics:
  endpointPath: /v1/mimoto/actuator/prometheus
