# Kargo control-plane install values (single instance serving all projects/stages).
# Admin creds come from the kargo-api Secret (rendered by cluster-configs) via api.secret.name.
api:
  host: kargo.digit.org
  basePath: ""
  # nginx terminates TLS; terminatedUpstream keeps generated URLs https (assets not mixed-content).
  tls:
    enabled: false
    terminatedUpstream: true
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      selfSignedCert: false
      secretName: kargo.digit.org-tls-certs
    pathType: Prefix
  adminAccount:
    # Keep enabled until GitHub SSO below is confirmed working, then set false
    # so the shared admin password stops being a valid way in.
    enabled: true
    tokenTTL: 24h
  secret:
    name: kargo-api

  # ---------------------------------------------------------------------
  # GitHub SSO.
  #
  # GitHub speaks OAuth2, not OIDC, so Kargo cannot consume it directly --
  # Dex bridges the two and re-issues a proper OIDC token. Same pattern as
  # ArgoCD and Grafana in this cluster.
  #
  # Needs its OWN GitHub OAuth App; the callback is unique per app so the
  # ArgoCD/Grafana ones cannot be reused:
  #   Homepage URL:     https://kargo.digit.org
  #   Authorization cb: https://kargo.digit.org/dex/callback
  # (Dex's issuer is <api.baseURL>/dex, and its callback is always
  #  <issuer>/callback. The API server reverse-proxies /dex, so the existing
  #  kargo-api Ingress already covers it -- no extra ingress rule.)
  #
  # Credentials are NOT here: they come from the kargo-dex-github Secret,
  # which cluster-configs renders from the SOPS-encrypted
  # environments/<env>-secrets.yaml (cluster-configs.secrets.kargo.dexSecret).
  # ---------------------------------------------------------------------
  oidc:
    enabled: true

    # ---------------------------------------------------------------
    # DELIBERATELY NO admins/users/viewers/projectCreators CLAIMS HERE.
    #
    # Those keys do one thing: annotate the ServiceAccounts
    # kargo-{admin,project-creator,user,viewer} in this namespace with
    # `rbac.kargo.akuity.io/claims`. Kargo then matches an OIDC token's
    # claims against ServiceAccount annotations and inherits that account's
    # RBAC. Nothing about them is privileged config -- they are sugar for
    # annotating four fixed ServiceAccounts.
    #
    # Using them would mean listing every GitHub team twice: once here for
    # login / project-list, and again in config/projects/<project>.yaml for
    # in-project rights. The two lists then have to be kept in step by hand,
    # and the failure when they drift is quiet -- the team logs in fine and
    # lands on an empty "Projects" screen, with only an API-server line
    #     projects.kargo.akuity.io is forbidden: list is not permitted
    # to say why.
    #
    # So groups are declared ONCE, in the per-project `teams:` lists, and
    # charts/kargo/templates/rbac.yaml renders the same annotated-
    # ServiceAccount pattern from them -- including a "global" ServiceAccount
    # per team in this namespace, which is what actually grants login and the
    # project list. Adding a team to a project is a one-line change there and
    # needs no edit to this file.
    # ---------------------------------------------------------------

    dex:
      enabled: true
      envFrom:
        - secretRef:
            name: kargo-dex-github
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $GITHUB_CLIENT_ID
            clientSecret: $GITHUB_CLIENT_SECRET
            redirectURI: https://kargo.digit.org/dex/callback
            orgs:
              - name: egovernments
            # REQUIRED for per-project access. Without it the groups claim
            # carries only the org, so every team collapses to "egovernments"
            # and the per-project RBAC in templates/rbac.yaml cannot
            # distinguish them. With it: "egovernments:<team-slug>".
            teamNameField: slug
  argocd:
    urls:
      "": https://unified-dev.digit.org/argocd

controller:
  argocd:
    integrationEnabled: true
    namespace: argocd
    watchArgocdNamespaceOnly: true
  gitClient:
    name: kargo
    email: kargo@digit.org
