# Kargo control-plane install values for the digit-lts AKS cluster (single instance
# serving every project/stage on this cluster). Admin creds come from the kargo-api
# Secret (rendered by cluster-configs) via api.secret.name.
api:
  host: kargo-latest.digit.org
  basePath: ""
  # nginx terminates TLS; terminatedUpstream keeps generated URLs https (assets not mixed-content).
  tls:
    enabled: false
    terminatedUpstream: true
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      selfSignedCert: false
      secretName: kargo-latest.digit.org-tls-certs
    pathType: Prefix
  adminAccount:
    # Keep enabled until GitHub SSO below is confirmed working, then set false
    # so the shared admin password stops being a valid way in.
    enabled: true
    tokenTTL: 24h
  secret:
    name: kargo-api

  # ---------------------------------------------------------------------
  # GitHub SSO.
  #
  # GitHub speaks OAuth2, not OIDC, so Kargo cannot consume it directly --
  # Dex bridges the two and re-issues a proper OIDC token. Same pattern as
  # ArgoCD and Grafana.
  #
  # Needs its OWN GitHub OAuth App; the callback is unique per app so the
  # ArgoCD/Grafana ones cannot be reused:
  #   Homepage URL:     https://kargo-latest.digit.org
  #   Authorization cb: https://kargo-latest.digit.org/dex/callback
  # (Dex's issuer is <api.baseURL>/dex, and its callback is always
  #  <issuer>/callback. The API server reverse-proxies /dex, so the existing
  #  kargo-api Ingress already covers it -- no extra ingress rule.)
  #
  # TWO ORGS: this cluster's teams live in BOTH egovernments and digitnxt, so
  # the github connector lists both. One OAuth App still suffices (callback is
  # per-app, not per-org). Each org with OAuth-App access restrictions enabled
  # must APPROVE this app (Org -> Settings -> Third-party access) or Dex cannot
  # read that org's PRIVATE team membership and those users land on an empty
  # project list. teamNameField: slug makes the groups claim "<org>:<team-slug>"
  # for both orgs, which the per-project teams: lists match.
  #
  # Credentials are NOT here: they come from the kargo-dex-github Secret,
  # which cluster-configs renders from the SOPS-encrypted
  # environments/<env>-secrets.yaml (cluster-configs.secrets.kargo.dexSecret).
  # ---------------------------------------------------------------------
  oidc:
    enabled: true
    # No admins/users/viewers/projectCreators claims here on purpose: groups are
    # declared ONCE in each project's teams: list and templates/rbac.yaml renders
    # the annotated-ServiceAccount login + project-list grant from them. (Full
    # rationale in the unified-dev control-plane.yaml.)
    dex:
      enabled: true
      envFrom:
        - secretRef:
            name: kargo-dex-github
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $GITHUB_CLIENT_ID
            clientSecret: $GITHUB_CLIENT_SECRET
            redirectURI: https://kargo-latest.digit.org/dex/callback
            orgs:
              - name: egovernments
              - name: digitnxt
            teamNameField: slug
  argocd:
    urls:
      "": https://test-lts.digit.org/argocd

controller:
  argocd:
    integrationEnabled: true
    namespace: argocd
    watchArgocdNamespaceOnly: true
  gitClient:
    name: kargo
    email: kargo@digit.org

# Extra webhook replica so bulk Warehouse/Stage applies survive transient load
# without the mutating webhook timing out (context deadline exceeded).
webhooksServer:
  replicas: 2
