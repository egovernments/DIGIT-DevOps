# Kargo control-plane install values for the digit-lts AKS cluster. See ../../argo-cd/kargo/README.md.
api:
  host: kargo-latest.digit.org
  basePath: ""
  tls:
    enabled: false
    terminatedUpstream: true    # nginx terminates TLS; keep generated URLs https
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
      selfSignedCert: false
      secretName: kargo-latest.digit.org-tls-certs
    pathType: Prefix
  adminAccount:
    enabled: true               # local admin until GitHub SSO is confirmed, then set false
    tokenTTL: 24h
  secret:
    name: kargo-api
  oidc:
    enabled: true
    # External (BYO) Dex deployed by argo-cd/kargo/kargo-dex-application.yaml, which uses
    # persistent (storage: kubernetes) signing keys. The bundled Dex is disabled because it
    # hardcodes storage: memory and regenerates keys on every restart, which breaks SSO after
    # any node-pool roll. Issuer/clients/connector match the previous bundled config, so the
    # groups claim (<org>:<team>) and all existing RBAC are unchanged.
    issuerURL: https://kargo-latest.digit.org/dex
    clientID: kargo-latest.digit.org
    cliClientID: kargo-latest.digit.org-cli
    usernameClaim: email
    additionalScopes:
      - groups
    dex:
      enabled: false
      byo:
        enabled: true
        serverAddress: https://kargo-dex.kargo.svc:5554
        caCertPath: /etc/dex-ca/ca.crt
  # Trust the self-signed cert the standalone Dex serves (ca.crt from the kargo-dex-cert secret).
  volumes:
    - name: dex-ca
      secret:
        secretName: kargo-dex-cert
        items:
          - key: ca.crt
            path: ca.crt
  volumeMounts:
    - name: dex-ca
      mountPath: /etc/dex-ca
      readOnly: true
  # Block API startup until Dex discovery is reachable so the OIDC key set initialises cleanly
  # (the original outage began with an API-before-Dex startup race after a node-pool roll).
  initContainers:
    - name: wait-for-dex
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - |
          until curl -sfk https://kargo-dex.kargo.svc:5554/dex/.well-known/openid-configuration >/dev/null; do
            echo "waiting for dex..."; sleep 3;
          done
  argocd:
    urls:
      "": https://test-lts.digit.org/argocd

controller:
  argocd:
    integrationEnabled: true
    namespace: argocd
    watchArgocdNamespaceOnly: true
  gitClient:
    name: kargo
    email: kargo@digit.org

webhooksServer:
  replicas: 2                    # survive bulk Warehouse/Stage applies without webhook timeout
