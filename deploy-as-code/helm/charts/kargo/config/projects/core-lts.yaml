# egov CORE Kargo pipeline on digit-lts. See ../../../argo-cd/kargo/README.md.
kargo:
  # Dedicated project namespace, not the app ns `egov` (Kargo creates+labels its own).
  project: core-lts
  registry: docker.io/egovio
  argocdAppPrefix: egov-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
  chartRepo: https://helm.digit.org/digit3/core
  chartSemver: "^3.0.0"
  # Broad: core build-tag families are heterogeneous (master-<sha>, billing-tenant-<sha>,
  # develop-modulith-<sha>, mdms-pagination-fix-<sha>, workflow-migration-<sha>-<n>, ...).
  # Anchor on the trailing sha (+ optional build number); keeps -amd64/-arm64 manifest
  # children and latest/multiarch out of Freight. The uat-saas stage then gates to master-* only.
  allowTags: '^.+-[0-9a-f]{7,}(-[0-9]+)?$'
  masterOnlyStages: [uat-saas]   # digit-lts promotes any build; uat-saas accepts only master-* images
  envFileWrite: merge
  verify:
    enabled: true
    namespace: egov              # core services deploy to ns egov (keycloak overrides below)

  services:
    - name: account
      chart: account
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: apportion
      chart: apportion
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: billing
      chart: billing
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: boundary
      chart: boundary
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: boundary-management
      chart: boundary-management
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: employee
      chart: employee
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: employee-onboarding
      chart: employee-onboarding
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: filestore
      chart: filestore
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: idgen
      chart: idgen
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: individual
      chart: individual
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: localization
      chart: localization
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: localization-management
      chart: localization-management
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: mdms-v2
      chart: mdms-v2
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: notification
      chart: notification
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: notify
      chart: notify
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: otp
      chart: otp
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: pg-service
      chart: pg-service
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: registry
      chart: registry
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: template-config
      chart: template-config
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: url-shortener
      chart: url-shortener
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: workflow
      chart: workflow
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    # Keycloak: custom SPI image in ns keycloak, self-migrates (no db-migration init).
    # Its tags are not master-*, so it promotes to digit-lts but is blocked by the
    # uat-saas master-only gate (promote keycloak to uat-saas manually if/when needed).
    - name: keycloak
      chart: keycloak
      namespace: keycloak
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s

  stages:
    - name: digit-lts
      color: "#3BA9C2"
      branch: digit-lts
      envFile: deploy-as-code/helm/environments/test-lts.yaml
      verifyKubeconfigSecret: verify-kubeconfig-digit-lts
      autoPromotion: false
    - name: uat-saas
      from: digit-lts               # only Freight already promoted to digit-lts
      color: "#C2873B"
      branch: uat-saas
      envFile: deploy-as-code/helm/environments/uat-saas.yaml
      verifyKubeconfigSecret: verify-kubeconfig-uat-saas
      autoPromotion: false

  teams:
    - name: kargo-core                # view + create Freight + promote to digit-lts only (not uat-saas, not admin)
      role: promoter
      promoteStages: [digit-lts]
      manageFreight: true
      groups: [egovernments:kargo-core]
    - name: devops                    # micro-service-devops needs core admin (same as crest-lts)
      role: admin
      groups: [egovernments:micro-service-devops]
