# CREST Kargo pipeline on digit-lts. See ../../../argo-cd/kargo/README.md.
kargo:
  # Dedicated project namespace, not the app ns `crest` (Kargo creates+labels its own).
  project: crest-lts
  registry: docker.io/egovio
  argocdAppPrefix: crest-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
  chartRepo: https://helm.digit.org/digit3/crest
  chartSemver: "^3.0.0"
  allowTags: '^(main|master)-.*[0-9a-f]{7,}$'
  masterOnlyStages: []          # uat-saas accepts the same build tags as digit-lts (no master-* convention)
  envFileWrite: merge
  verify:
    enabled: true
    namespace: crest            # crest + crest-ui both deploy to ns crest

  services:
    - name: crest
      chart: crest
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: crest-ui
      chart: crest-ui
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s

  stages:
    - name: digit-lts
      color: "#3BA9C2"
      branch: digit-lts
      envFile: deploy-as-code/helm/environments/crest-lts.yaml
      verifyKubeconfigSecret: verify-kubeconfig-digit-lts
      autoPromotion: false
    - name: uat-saas
      from: digit-lts               # only Freight already promoted to digit-lts
      color: "#C2873B"
      branch: uat-saas
      envFile: deploy-as-code/helm/environments/uat-saas.yaml
      verifyKubeconfigSecret: verify-kubeconfig-uat-saas
      autoPromotion: false

  teams:
    - name: kargo-crest
      role: admin                     # create Freight + promote to digit-lts
      groups: [egovernments:kargo-crest]
    - name: devops                    # micro-service-devops needs crest admin (re-adopts pre-rename RBAC)
      role: admin
      groups: [egovernments:micro-service-devops]
