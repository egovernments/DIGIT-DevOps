# digit-core3-0 Kargo pipeline: DIGIT 3.0 core module, DEV -> QA -> UAT.
# (Project name is "digit-core3.0" with the dot replaced: a Kargo Project is a
# Kubernetes namespace, and namespace names cannot contain ".")
#
# Freight per service = image tag + packaged Helm chart version. No git artifact.
# Promotion MERGES them into the module's own env file on the stage's branch,
# creating the keys if absent (nothing is seeded):
#
#   deploy-as-code/helm/environments/unified-digit3-core-<env>.yaml
#     <service>.chart-version                             <- chart (Freight)
#     <service>.image.tag                                 <- image (Freight)
#     <service>.initContainers.dbMigration.image.tag      <- same tag, <service>-db image
#     kong.chart-version, kong.image.tag                  <- chart, image (Freight)
#     keycloak.chart-version, keycloak.image.tag          <- chart, image (Freight)
#     vault.chart-version                                 <- chart (Freight)
#     cluster-configs.chart-version                       <- chart (Freight)
#
# A separate file, not environments/unified-<env>.yaml: the DIGIT 2.x charts share
# these names and read that file's top-level <name>: sections.
#
# Argo CD creates the Applications from this file's kargo.argocd and each service's
# deploy (charts/argo-cd/unified-dev/kargo-managed/): Application digit3-<service>
# installs chart <service> at <service>.chart-version with that file's values, once
# the first promotion has merged chart-version. Adding a service here is all it takes.
#
# NOTHING IS AUTOMATIC: Freight is assembled by hand (freightCreationPolicy: Manual)
# and every promotion is clicked by a person (autoPromotion: false). Promotion is
# linear: dev takes Freight from the Warehouse, qa only from dev, uat only from qa;
# uat also takes master-* builds only.
kargo:
  project: digit-core3-0
  registry: docker.io/egovio
  argocdAppPrefix: digit3-
  # Argo CD side, read by the kargo-managed ApplicationSets (one per layout):
  #   Application  <argocdAppPrefix><service>  (deploy.app overrides)
  #   project      argocd.project
  #   namespace    deploy.namespace, else argocd.namespace
  #   layout       deploy.layout, else argocd.layout -- how the chart takes its values:
  #                  common   DIGIT common chart: {global, <service>} from the env file
  #                  root     the <service> section (minus chart-version) as root values
  #                  configs  the env file + its -secrets.yaml (cluster-configs chart)
  # namespaces must match digit3-core-project's destinations; templates/argocd-deploy.yaml
  # fails the render for a layout or namespace outside them.
  argocd:
    project: digit3-core-project
    namespace: digit3-core
    namespaces: [digit3-core, vault]
    layout: common
  # Write promoted keys by merge -- creates them in the env file, no seeding needed.
  envFileWrite: merge
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
  # Service charts. https://helm.digit.org/digit3/core/index.yaml holds every core
  # chart; each Warehouse subscribes by name, so it lists only its own versions,
  # newest first.
  chartRepo: https://helm.digit.org/digit3/core
  # mainline and flyway-branch builds; anchored on the trailing sha so the
  # -amd64/-arm64 children stay out of Freight.
  allowTags: '^(master|flyway-branch)-.*[0-9a-f]{7,}$'
  # masterOnlyStages: [uat] (chart default) -- flyway-branch builds reach dev/qa only.
  verify:
    enabled: false

  # Every service: Freight = egovio/<service> image tag (written to the app AND the
  # <service>-db migration image) + chart <service> from chartRepo. Warehouses re-scan
  # Docker Hub and the Helm repo every 5 minutes (interval).
  services:
    - name: idgen
      chart: idgen
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: localization
      chart: localization
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: url-shortener
      chart: url-shortener
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: notification
      chart: notification
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: template-config
      chart: template-config
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: workflow
      chart: workflow
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: account
      chart: account
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: boundary
      chart: boundary
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: filestore
      chart: filestore
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: registry
      chart: registry
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: individual
      chart: individual
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: employee
      chart: employee
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: otp
      chart: otp
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: billing
      chart: billing
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: apportion
      chart: apportion
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: pg-service
      chart: pg-service
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: notify
      chart: notify
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: boundary-management
      chart: boundary-management
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    - name: mdms-v2
      chart: mdms-v2
      dbMigration: true
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    # API gateway: the zuul: true ingresses route to kong-kong-proxy (app digit3-kong).
    # Freight = egovio/kong image tag + chart kong. No -db image: Kong runs its own
    # migrations (init container) in the module database.
    - name: kong
      chart: kong
      deploy:
        layout: root
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    # Identity (account, employee, Kong plugins). Freight = egovio/keycloak image tag +
    # chart keycloak (published from charts/digit3/keycloak). No -db image: the chart's
    # db-init container creates its database.
    # master/flyway-branch (project default) + the keycloak-spi-custom-build family,
    # today's only Keycloak builds. Sha-anchored to keep the -amd64 / -arm64 manifest
    # children out of Freight. These reach dev/qa; uat stays master-only.
    - name: keycloak
      chart: keycloak
      extraAllowTags: '^keycloak-spi-custom-build-.*[0-9a-f]{7,}$'
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 5m0s
    # Secrets engine (otp, individual, registry). Chart only: the HashiCorp image comes
    # from the chart (there is no egovio/vault build yet).
    - name: vault
      image: false
      chart: vault
      deploy:
        layout: root
        namespace: vault
      freightCreationPolicy: Manual
      discoveryLimit: 20
      interval: 5m0s
    # The module's namespace-scoped ConfigMaps/Secrets (digit3-core-cluster-configs).
    # Chart only: Freight carries just the chart version.
    - name: cluster-configs
      image: false
      chart: cluster-configs
      chartRepo: https://helm.digit.org/digit3/cluster-configs
      valuesKey: cluster-configs
      deploy:
        layout: configs
        app: digit3-core-cluster-configs
        releaseName: digit3-core-cluster-configs
      freightCreationPolicy: Manual
      discoveryLimit: 20
      interval: 5m0s

  stages:
    - name: dev
      color: "#3BA9C2"
      branch: unified-dev
      envFile: deploy-as-code/helm/environments/unified-digit3-core-dev.yaml
      autoPromotion: false
    - name: qa
      color: "#D64550"
      from: dev
      branch: unified-qa
      envFile: deploy-as-code/helm/environments/unified-digit3-core-qa.yaml
      autoPromotion: false
    - name: uat
      color: "#F2C230"
      from: qa
      branch: unified-uat
      envFile: deploy-as-code/helm/environments/unified-digit3-core-uat.yaml
      autoPromotion: false

  teams:
    - name: devops
      role: admin
      groups: [egovernments:micro-service-devops]
