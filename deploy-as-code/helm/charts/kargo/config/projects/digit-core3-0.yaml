# digit-core3-0 Kargo pipeline: DIGIT 3.0 core services, DEV -> QA -> UAT.
# (Project name is "digit-core3.0" with the dot replaced: a Kargo Project is a
# Kubernetes namespace, and namespace names cannot contain ".")
#
# Freight per service pins three artifacts:
#   image   docker.io/egovio/<service>           app image; its tag is ALSO written
#                                                to the <service>-db migration image
#   chart   helm.digit.org/digit3/core <chart>   packaged chart version
#   git     deploy-as-code/helm/digit3-core/<service>   umbrella + per-env values
#
# Promotion writes deploy-as-code/helm/releases/digit3-core/<service> on the
# stage's branch: the umbrella pinned to the chart version, values.yaml merged
# from values.yaml + stages/<stage>.yaml, and the image tags. Only unified-dev has
# an Argo CD consumer (namespace digit3); qa/uat promotions write their branches
# but deploy nothing until those appsets exist.
#
# notify and boundary-management are left out: no DIGIT 3.0 chart exists yet.
kargo:
  project: digit-core3-0
  registry: docker.io/egovio
  argocdAppPrefix: digit3-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
  # Work in progress: this repo has no index.yaml yet, so the chart subscription
  # discovers nothing and no Freight can be assembled until charts are published.
  chartRepo: https://helm.digit.org/digit3/core
  # App images drive: mainline and the flyway-branch builds. Anchored on the
  # trailing sha so the -amd64/-arm64 children stay out of Freight.
  allowTags: '^(master|flyway-branch)-.*[0-9a-f]{7,}$'
  # masterOnlyStages: [uat] (chart default) -- flyway-branch builds reach dev/qa only.
  # Off until DIGIT 3.0's DB/secrets are wired in namespace digit3: the check needs
  # a Ready pod, so a failing dev rollout would block every promotion to qa.
  verify:
    enabled: false
    namespace: digit3

  services:
    - name: idgen
      namespace: digit3
      chart: idgen
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
      dbMigration: true
      configPath: deploy-as-code/helm/digit3-core/idgen
      releasePath: deploy-as-code/helm/releases/digit3-core/idgen
    - name: localization
      namespace: digit3
      chart: localization
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
