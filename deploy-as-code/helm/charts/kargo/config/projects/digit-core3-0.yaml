      releasePath: deploy-as-code/helm/releases/digit3-core/mdms-v2

  # envFile is unused in releasePath mode; each stage only names its branch.
  stages:
    - name: dev
      color: "#3BA9C2"
      branch: unified-dev
      autoPromotion: false
      argocdUpdate: true
      argocdNamespace: argocd
      verifyKubeconfigSecret: verify-kubeconfig-dev
    - name: qa
      color: "#D64550"
      from: dev
      # release Freight may also come straight from the Warehouse, skipping dev
      direct: true
      branch: unified-qa
      autoPromotion: false
    - name: uat
      color: "#F2C230"
      from: qa
      # release Freight may also come straight from the Warehouse, skipping dev
      # and qa -- still master-* only, still a manual promotion
      direct: true
      branch: unified-uat
      autoPromotion: false

  teams:
    - name: devops
      role: admin
      groups: [egovernments:micro-service-devops]
