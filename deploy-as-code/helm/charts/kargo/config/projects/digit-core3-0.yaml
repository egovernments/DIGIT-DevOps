# digit-core3-0 Kargo pipeline: DIGIT 3.0 core services, DEV -> QA -> UAT.
# (Project name is "digit-core3.0" with the dot replaced: a Kargo Project is a
# Kubernetes namespace, and namespace names cannot contain ".")
#
# Each service has FOUR Warehouses (envConfig mode):
#
#   <service>              RELEASE Freight -- promoted dev -> qa -> uat, or
#                          straight to any stage (qa/uat set `direct: true`)
#     image  docker.io/egovio/<service>   app tag, ALSO written to <service>-db
#     chart  helm.digit.org/digit3/core/<chart>   packaged chart version
#     git    digit3-core/<service>/{Chart.yaml,values.yaml}   shared config
#
#   <service>-dev-config   ENV CONFIG Freight -- git digit3-core/<service>/stages/dev.yaml
#   <service>-qa-config      only, promoted straight to that one stage; never
#   <service>-uat-config     reaches any other environment
#
# A Stage holds one release Freight and one env-config Freight. Promoting either
# re-renders deploy-as-code/helm/releases/digit3-core/<service> on the stage's
# branch from both: umbrella pinned to the chart version, values.yaml +
# stages/<stage>.yaml, and the image tags. A new build keeps the env's config; a
# config change keeps the env's build.
#
# NOTHING IS AUTOMATIC: every Warehouse uses freightCreationPolicy: Manual
# (Freight is assembled by a person) and every stage has autoPromotion: false.
# uat accepts only master-* builds, whichever way the Freight arrives.
#
# Only unified-dev has an Argo CD consumer (namespace digit3); qa/uat promotions
# write their branches but deploy nothing until those appsets exist.
#
# notify and boundary-management are left out: no DIGIT 3.0 chart exists yet.
kargo:
  project: digit-core3-0
  registry: docker.io/egovio
  argocdAppPrefix: digit3-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
  # One Helm repo PER CHART: https://helm.digit.org/digit3/core/<chart>/index.yaml.
  # Work in progress: none is published yet, so the chart subscriptions discover
  # nothing and no release Freight can be assembled until they are.
  chartRepo: https://helm.digit.org/digit3/core
  chartRepoPerChart: true
  # App images drive: mainline and the flyway-branch builds. Anchored on the
  # trailing sha so the -amd64/-arm64 children stay out of Freight.
  allowTags: '^(master|flyway-branch)-.*[0-9a-f]{7,}$'
  # masterOnlyStages: [uat] (chart default) -- flyway-branch builds reach dev/qa only.
  # Off until DIGIT 3.0's DB/secrets are wired in namespace digit3: the check needs
  # a Ready pod, so a failing dev rollout would block every promotion to qa.
  verify:
    enabled: false
    namespace: digit3
  # Per-stage config Warehouses for every service below (see header).
  envConfig: true

  services:
    - name: idgen
      namespace: digit3
      chart: idgen
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
      dbMigration: true
      configPath: deploy-as-code/helm/digit3-core/idgen
      releasePath: deploy-as-code/helm/releases/digit3-core/idgen
    - name: localization
      namespace: digit3
      chart: localization
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
      dbMigration: true
      configPath: deploy-as-code/helm/digit3-core/localization
      releasePath: deploy-as-code/helm/releases/digit3-core/localization
    - name: url-shortener
