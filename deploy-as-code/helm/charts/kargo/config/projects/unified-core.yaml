# unified-core Kargo pipeline: notification services, DEV -> QA -> UAT.
kargo:
  project: unified-core
  registry: docker.io/egovio
  argocdAppPrefix: egov-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git

  # `namespace` is where each service's Deployment runs in the target cluster
  # (used by verification); services may live in different namespaces.
  services:
    - name: egov-notification-mail
      namespace: egov
      freightCreationPolicy: Manual
      # keep matched tags to ~20-40 (runbook §8): NewestBuild fetches a blob per matched tag
      allowTags: '^(master|sandbox|base-docker-upgrade)-[0-9a-f]+'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
    - name: egov-notification-sms
      namespace: egov
      freightCreationPolicy: Manual
      allowTags: '^(master|sandbox|base-docker-upgrade)-[0-9a-f]+'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
    - name: boundary-service
      namespace: egov
      freightCreationPolicy: Manual
      # DB-migration service: the promotion must also bump the dbMigration
      # init-container tag (boundary-service-db shares the app's tag).
      dbMigration: true
      # Built from the master-persister-changes-2.0 branch (no plain master-<sha>
      # image exists). Anchored with $ so the -amd64/-arm64 manifest children
      # are excluded from freight.
      allowTags: '^master-persister-changes-2\.0-[0-9a-f]+$'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
    - name: pdf-service
      namespace: egov
      freightCreationPolicy: Manual
      allowTags: '^(master|multiarch-master)-[0-9a-f]{7,}$'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
    - name: egov-localization
      namespace: egov
      freightCreationPolicy: Manual
      dbMigration: true          # egov-localization-db shares the app's tag
      allowTags: '^(master|redis-localization-key)-.*[0-9a-f]{7,}$'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s


  # Post-promotion verification: assert each env's Deployment runs the promoted
  # tag and is healthy (uniform across dev/qa/uat via a per-env read-only kubeconfig).
  verify:
    enabled: true

  # Only DEV shares the cluster with Kargo (argocdUpdate); QA/UAT are cross-cluster git-push.
  stages:
    - name: dev
      color: "#3BA9C2"
      branch: unified-env-lts
      envFile: deploy-as-code/helm/environments/unified-dev.yaml
      autoPromotion: false
      argocdUpdate: true
      argocdNamespace: argocd
      verifyKubeconfigSecret: verify-kubeconfig-dev
    - name: qa
      color: "#D64550"
      from: dev
      branch: unified-env-lts
      envFile: deploy-as-code/helm/environments/unified-qa.yaml
      autoPromotion: false
      verifyKubeconfigSecret: verify-kubeconfig-qa
    - name: uat
      color: "#F2C230"
      from: qa
      branch: unified-env-lts
      envFile: deploy-as-code/helm/environments/unified-uat.yaml
      autoPromotion: false
      verifyKubeconfigSecret: verify-kubeconfig-uat

  # GitHub teams with access to THIS project only. A team absent here has no
  # ServiceAccount in the unified-core namespace and therefore no access to it.
  teams:
    - name: devops
      role: admin
      groups: [egovernments:micro-service-devops]
    - name: core-devs
      role: promoter
      groups: [egovernments:unified-dev]
