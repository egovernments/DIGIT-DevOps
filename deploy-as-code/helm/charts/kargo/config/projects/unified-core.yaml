# unified-core Kargo pipeline: notification, boundary and user services, DEV -> QA -> UAT.
kargo:
  project: unified-core
  registry: docker.io/egovio
  argocdAppPrefix: egov-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git

  # Project-level discovery default: mainline master-* builds, anchored on the
  # commit sha ([0-9a-f]{7,}$) so the per-architecture manifest children
  # (-amd64 / -arm64) are kept OUT of Freight (the main tag is already a multi-arch
  # index). Services on extra branch families add them via `extraAllowTags`; a
  # service on a different scheme replaces this with its own `allowTags`.
  allowTags: '^master-.*[0-9a-f]{7,}$'

  # `namespace` is where each service's Deployment runs in the target cluster
  # (used by verification); services may live in different namespaces.
  services:
    - name: egov-notification-mail
      namespace: egov
      freightCreationPolicy: Manual
      # CONFIG PROMOTION (reference implementation -- this is the only service
      # with it so far). The chart directory joins the image in Freight, so a
      # promotion carries both and qa/uat receive the config dev was tested with.
      #
      # Consequence: env vars that must be the SAME in every environment belong
      # in this chart's values.yaml `env:` block, where they already are. Env
      # vars that must DIFFER per environment stay in
      # environments/unified-<env>.yaml under egov-notification-mail.extraEnv.app
      # -- common.deployment concatenates extraEnv.app last and dedupes by name
      # keeping the last entry, so those still win.
      configPath: deploy-as-code/helm/charts/core-services/egov-notification-mail
      # master (project default) + sandbox / base-docker-upgrade families.
      # These extra families reach dev/qa; uat stays master-only (see stages).
      extraAllowTags: '^(sandbox|base-docker-upgrade)-.*[0-9a-f]{7,}$'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
    - name: egov-notification-sms
      namespace: egov
      freightCreationPolicy: Manual
      extraAllowTags: '^(sandbox|base-docker-upgrade)-.*[0-9a-f]{7,}$'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
    - name: boundary-service
      namespace: egov
      freightCreationPolicy: Manual
      # DB-migration service: the promotion must also bump the dbMigration
      # init-container tag (boundary-service-db shares the app's tag).
      dbMigration: true
      # Built from the master-persister-changes-2.0 branch; pin to it (replaces the
      # project default) so other master-* branches are not discovered. Sha-anchored
      # to exclude the -amd64 / -arm64 manifest children.
      allowTags: '^master-persister-changes-2\.0-.*[0-9a-f]{7,}$'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
    - name: egov-user
      namespace: egov
      freightCreationPolicy: Manual
      # DB-migration service: egov-user-db is built from the same commit and
      # published under the SAME tag, so one tag drives both the app image and
      # the dbMigration init-container (same arrangement as boundary-service).
      dbMigration: true
      # master (project default, the only family uat accepts) + every feature-*
      # branch (feature-sso-impl, -multitenant, -multitenant-test, ...) +
      # feat-cicd-906-immutable-artifacts + user-bulk-upgrade, which is the family
      # ALREADY deployed to dev/qa/uat (user-bulk-upgrade-960226f) -- without it the
      # first promotion would move the service off its running tag.
      # user-bulk-upgrade.* covers the -sso branch; the HCMPRE-*-prefixed
      # variants are excluded by the ^ anchor. Sha-anchored to keep the
      # -amd64 / -arm64 manifest children out of Freight.
      #
      # `fix` is a FAMILY, not a branch, exactly as `feature` is above:
      # build.yaml maps '/' to '-' when it derives the tag, so every fix/* branch
      # arrives as fix-<slug>-<sha> and is discovered without another edit here.
      # The literal '-' after the group keeps this to fix/* alone (fixup-* does
      # not match). fix/* reaches dev and qa only -- the stage template's
      # ^master- guard blocks it from uat.
      #
      # NB: as of unified-dev 26ba5c073 the RUNNING family here is fix, not
      # user-bulk-upgrade; the latter is retained above as the rollback target.
      extraAllowTags: '^(feature|feat-cicd-906-immutable-artifacts|fix|user-bulk-upgrade)-.*[0-9a-f]{7,}$'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s
    - name: egov-accesscontrol
      namespace: egov
      freightCreationPolicy: Manual
      # DB-migration service, but unlike egov-user the init container is NOT in
      # the chart -- core-services/egov-accesscontrol ships `initContainers: {}`,
      # so unified-dev 26ba5c073 enables it per-environment. The key that
      # yaml-update rewrites (initContainers.dbMigration.image.tag) therefore
      # exists in unified-dev.yaml but NOT in the qa/uat env files, which must be
      # seeded before this service can be promoted past dev.
      dbMigration: true
      # The running family is fix (fix-sqli-user-accesscontrol-*, digest-pinned in
      # unified-dev.yaml); base-docker-upgrade is kept as the rollback target --
      # base-docker-upgrade-0aec2ff is what the service ran before. Sha-anchored
      # to keep the -amd64 / -arm64 manifest children out of Freight.
      #
      # NB: the env file pins tag@sha256 digests. yaml-update writes a PLAIN tag,
      # so the first promotion drops the digest pin on both this service and
      # egov-user. Freight still records the digest, but the env file stops
      # asserting it.
      extraAllowTags: '^(base-docker-upgrade|fix)-.*[0-9a-f]{7,}$'
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 20
      interval: 30m0s

  # Post-promotion verification: assert each env's Deployment runs the promoted
  # tag and is healthy (uniform across dev/qa/uat via a per-env read-only kubeconfig).
  verify:
    enabled: true
    namespace: egov

  # BRANCH-PER-ENVIRONMENT. Each stage writes to its OWN environment's branch,
  # so a promotion is a commit onto the branch that environment's Argo CD
  # actually tracks. The envFile path is unchanged -- that file lives on the
  # TARGET branch, which is why unified-qa.yaml / unified-uat.yaml are not
  # present on this branch and must not be re-added here.
  #
  # Consequence: promotion to qa or uat fails until those branches exist with
  # the matching env file. Kargo itself runs only in unified-dev and drives all
  # three, so this project config stays here in full.
  stages:
    - name: dev
      color: "#3BA9C2"
      branch: unified-dev
      envFile: deploy-as-code/helm/environments/unified-dev.yaml
      autoPromotion: false
      argocdUpdate: true
      argocdNamespace: argocd
      verifyKubeconfigSecret: verify-kubeconfig-dev
    - name: qa
      color: "#D64550"
      from: dev
      branch: unified-qa
      envFile: deploy-as-code/helm/environments/unified-qa.yaml
      autoPromotion: false
      verifyKubeconfigSecret: verify-kubeconfig-qa
    - name: uat
      color: "#F2C230"
      from: qa
      branch: unified-uat
      envFile: deploy-as-code/helm/environments/unified-uat.yaml
      autoPromotion: false
      verifyKubeconfigSecret: verify-kubeconfig-uat

  # GitHub teams with access to THIS project only. View and promote are SEPARATE
  # entries (same shape as unified-health / unified-studio): the whole team reads
  # the project, and per-environment promoter teams add promotion into one stage.
  # A team absent here has no ServiceAccount in the unified-core namespace and so
  # no access. Replace the group slugs with real GitHub teams as they are created.
  teams:
    - name: devops
      role: admin
      groups: [egovernments:micro-service-devops]

    # Whole team: read the project, promote nothing.
    - name: core-devs
      role: viewer
      groups: [egovernments:unified-core-dev]

    # manageFreight is set ONLY here: Freight is project-level and cannot be
    # scoped to a stage, so this grants create/update/delete over all Freight in
    # unified-core. The qa and uat promoters below promote existing Freight only.
    - name: core-dev-promoters
      role: promoter
      promoteStages: [dev]
      manageFreight: true
      groups: [egovernments:unified-core-dev-promote]

    - name: core-qa-promoters
      role: promoter
      promoteStages: [qa]
      groups: [egovernments:unified-core-qa-promote]

    - name: core-uat-promoters
      role: promoter
      promoteStages: [uat]
      groups: [egovernments:unified-core-uat-promote]
