# unified-health Kargo pipeline: health services (health namespace), DEV -> QA -> UAT.
# Service list + dbMigration extracted from the health ns across dev/qa/uat clusters.
kargo:
  project: unified-health
  registry: docker.io/egovio
  argocdAppPrefix: health-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git

  # Post-promotion verification: assert each env's Deployment runs the promoted
  # tag and is healthy. All these services run in the `health` namespace.
  verify:
    enabled: true
    namespace: health

  # All tags discovered (no allowTags filter); discoveryLimit raised to 50.
  services:
    - name: airflow-trigger-service
      namespace: health
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 50
      interval: 30m0s
    - name: auth-proxy
      namespace: health
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 50
      interval: 30m0s
    - name: beneficiary-idgen
      namespace: health
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 50
      interval: 30m0s
      dbMigration: true
    - name: boundary-management
