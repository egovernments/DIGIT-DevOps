  # Stages + colours identical to unified-core; envFiles are the health overlays.
  stages:
    - name: dev
      color: "#3BA9C2"
      branch: unified-env-lts
      envFile: deploy-as-code/helm/environments/unified-health-dev.yaml
      autoPromotion: false
      argocdUpdate: true
      argocdNamespace: argocd
      verifyKubeconfigSecret: verify-kubeconfig-dev
    - name: qa
      color: "#D64550"
      from: dev
      branch: unified-env-lts
      envFile: deploy-as-code/helm/environments/unified-health-qa.yaml
      autoPromotion: false
      verifyKubeconfigSecret: verify-kubeconfig-qa
    - name: uat
      color: "#F2C230"
      from: qa
      branch: unified-env-lts
      envFile: deploy-as-code/helm/environments/unified-health-uat.yaml
      autoPromotion: false
      verifyKubeconfigSecret: verify-kubeconfig-uat

  # GitHub teams with access to THIS project only. Deliberately a different set
  # (and different roles) from unified-core.
  teams:
    - name: devops
      role: admin
      groups: [egovernments:micro-service-devops]
    - name: health-devs
      role: viewer
      groups: [egovernments:unified-health-dev]
