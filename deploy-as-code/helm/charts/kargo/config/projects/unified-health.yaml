# unified-health Kargo pipeline: scaffold only. Add services + a stages chain to onboard.
kargo:
  project: unified-health
  registry: docker.io/egovio
  argocdAppPrefix: health-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
  services: []
  stages: []

  # GitHub teams with access to THIS project only. Deliberately a different
  # set from unified-core.
  teams:
    - name: devops
      role: admin
      groups: [egovernments:micro-service-devops]
    - name: health-devs
      role: viewer
      groups: [egovernments:unified-health-dev]
