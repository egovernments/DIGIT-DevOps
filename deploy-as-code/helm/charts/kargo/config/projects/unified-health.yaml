# unified-health Kargo pipeline: health services (health namespace), DEV -> QA -> UAT.
# Service list + dbMigration extracted from the health ns across dev/qa/uat clusters.
kargo:
  project: unified-health
  registry: docker.io/egovio
  argocdAppPrefix: health-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git

  # Project-level default: only mainline master-* builds are discovered, to keep
  # NewestBuild's per-tag config fetches bounded. Services on other branch families
  # set a per-service allowTags override below.
  allowTags: '^master-'

  # Post-promotion verification against the health namespace on each target cluster.
  verify:
    enabled: true
    namespace: health

  services:
    - name: airflow-trigger-service
      namespace: health
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      allowTags: '^(master|HCMPRE)-'
      cacheByTag: true
      discoveryLimit: 50
      interval: 30m0s
    - name: auth-proxy
      namespace: health
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      cacheByTag: true
      discoveryLimit: 50
      interval: 30m0s
