# unified-sdip Kargo pipeline: SDIP backend + UI (sdip namespace), DEV -> QA -> UAT.
# QA and UAT promote (commit the tag to their branch) but do not yet deploy --
# see the note above `stages:`.
#
# Namespace split follows the other projects: the pipeline lives in
# `unified-sdip`, the workloads in `sdip` -- the same relationship as
# unified-core/egov, unified-health/health and unified-studio/studio.
kargo:
  project: unified-sdip
  registry: docker.io/egovio
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git

  # The SDIP ApplicationSet names its Applications after the element -- plain
  # `sdip-backend` / `sdip-ui`, with no product prefix -- so argocd-update must
  # not prepend one. (unified-core uses egov-, studio uses studio-.)
  argocdAppPrefix: ""

  # Project-level discovery default: mainline only, anchored on the trailing
  # commit sha so the per-arch manifest children (-amd64 / -arm64) stay out of
  # Freight; the main tag is already a multi-arch index.
  #
  # As with unified-studio, NO SDIP image is built from master today. SDIP's
  # pipeline (egovernments/SDIP .github/workflows/build.yaml) tags
  # <branch>-<short-sha>, and every published tag so far is dev-* or
  # sdip-phase2-import-*. The default below therefore matches nothing right now
  # and both services carry an extraAllowTags. That is deliberate: it keeps the
  # mainline default honest, so services are discovered unchanged once they move
  # to master, and retiring a branch family is just dropping a line.
  allowTags: '^master-.*[0-9a-f]{7,}$'

  # Post-promotion verification runs against the sdip namespace on unified-dev.
  # Both charts name the Deployment after the Argo CD release name, which equals
  # the service name, so no deploymentName override is needed.
  verify:
    enabled: true
    namespace: sdip

  services:
    - name: sdip-backend
      namespace: sdip
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      # dev-<short-sha>, e.g. dev-eaa3988. The sha anchor keeps the per-arch
      # children out; it also excludes the stale sdip-phase2-import-* builds,
      # which predate the unified-dev profile entirely and must never be
      # promoted (they crash-loop: no application-unified-dev.properties and no
      # org.sdip.runtime package).
      extraAllowTags: '^dev-[0-9a-f]{7,}$'
      cacheByTag: true
      discoveryLimit: 50
      interval: 30m0s
    - name: sdip-ui
      namespace: sdip
      freightCreationPolicy: Manual
      imageSelectionStrategy: NewestBuild
      extraAllowTags: '^dev-[0-9a-f]{7,}$'
      cacheByTag: true
      discoveryLimit: 50
      interval: 30m0s

  # BRANCH-PER-ENVIRONMENT, as in unified-core and unified-studio: each stage
  # writes to the branch its own environment's Argo CD tracks, so a promotion is
  # a commit onto that branch. Only DEV shares a cluster with Kargo
  # (argocdUpdate); qa and uat are cross-cluster git-push, picked up by that
  # cluster's own Argo CD.
  #
  # QA AND UAT PROMOTE BUT DO NOT YET DEPLOY. Promotion writes the tag to the
  # env file on the target branch and pushes, which is real and reviewable -- but
  # neither cluster has an SDIP ApplicationSet, the uat cluster has no sdip
  # namespace at all, and the qa one is empty. So a successful promotion records
  # intent; it does not roll anything out. Verification is deliberately left OFF
  # for both (no verifyKubeconfigSecret) -- with nothing deployed to check, an
  # enabled AnalysisRun would fail every time and paint the pipeline red for a
  # condition that is expected.
  #
  # To make either environment actually deploy, add on that branch: an SDIP
  # ApplicationSet + AppProject, a cluster-configs-unified-sdip-<env>
  # Application, the namespace, and unified-sdip-<env>-secrets.yaml. Each also
  # needs its own database, ingress host, runtime Secret values and schema
  # migrations. Then set verifyKubeconfigSecret on the stage to turn
  # verification back on -- the Secret is already rendered into this namespace.
  stages:
    - name: dev
      color: "#3BA9C2"
      branch: unified-dev
      envFile: deploy-as-code/helm/environments/unified-sdip-dev.yaml
      # Promotion stays a deliberate act: Freight is discovered automatically,
      # but a human picks which build reaches dev.
      autoPromotion: false
      # DEV shares the cluster with Kargo, so the promotion can force an
      # immediate Argo CD sync instead of waiting for the next poll.
      argocdUpdate: true
      argocdNamespace: argocd
      verifyKubeconfigSecret: verify-kubeconfig-dev
    - name: qa
      color: "#D64550"
      from: dev
      branch: unified-qa
      envFile: deploy-as-code/helm/environments/unified-sdip-qa.yaml
      autoPromotion: false
      # verifyKubeconfigSecret omitted on purpose -- see the note above.
    - name: uat
      color: "#F2C230"
      from: qa
      branch: unified-uat
      envFile: deploy-as-code/helm/environments/unified-sdip-uat.yaml
      autoPromotion: false
      # masterOnlyStages defaults to [uat] and is NOT overridden here, so this
      # stage accepts master-* Freight only. SDIP publishes no master-* tags
      # today (every build is <branch>-<sha> off dev), so a uat promotion fails
      # loudly with "REJECTED: only master-* images may be promoted to uat".
      # That is the intended signal: it says SDIP has no mainline build yet,
      # rather than quietly letting a branch build into uat. Remove the guard
      # only by setting masterOnlyStages: [] at the top of this file, which
      # drops a guarantee every other project here honours.

  # GitHub teams with access to THIS project only. Starting with devops alone,
  # as unified-studio did. Add SDIP-specific entries the same way once the team
  # slugs exist, e.g.
  #   - name: sdip-devs
  #     role: viewer
  #     groups: [egovernments:<sdip-team-slug>]
  #   - name: sdip-dev-promoters
  #     role: promoter
  #     promoteStages: [dev]
  #     manageFreight: true
  #     groups: [egovernments:<sdip-dev-promote-slug>]
  teams:
    - name: devops
      role: admin
      groups: [egovernments:micro-service-devops]
