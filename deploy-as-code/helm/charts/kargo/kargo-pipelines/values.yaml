# Defaults. Real values come from the shared env file (e.g. unified-dev.yaml)
# under a top-level `kargo:` key. Credentials + the kargo-api admin Secret are
# rendered separately by the cluster-configs chart from
# cluster-configs.secrets.kargo (see charts/cluster-configs).
kargo:
  # Kargo project name (== namespace the CRs live in).
  project: ""

  # Docker image registry root; service repo is <registry>/<service.name>.
  registry: docker.io/egovio

  # Prefix used to derive the ArgoCD Application name from a service name.
  argocdAppPrefix: egov-

  git:
    # HTTPS is required by Kargo's GitHub App credential provider.
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git

  # One Warehouse per service, one Stage per (service x stage).
  services: []
    # - name: egov-notification-mail
    #   allowTags: '^(master|base-docker-upgrade|sandbox)-'
    #   discoveryLimit: 20
    #   cacheByTag: true
    #   interval: 30m

  # Promotion chain. Order matters: `from` references the previous stage.
  stages: []
    # - name: dev
    #   envFile: deploy-as-code/helm/environments/unified-dev.yaml
    #   branch: unified-env-lts
    #   autoPromotion: false
    #   argocdUpdate: true         # only where ArgoCD shares the cluster with Kargo
    #   argocdNamespace: argocd
