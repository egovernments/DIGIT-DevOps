{{- $k := .Values.kargo }}
{{- range $svc := $k.services }}
{{- /* envConfig mode (needs configPath + releasePath): stages/<stage>.yaml leaves
       this Warehouse and gets one Warehouse per stage (below), so a per-env change
       is promoted straight to that env without touching any other. */}}
{{- $envConfig := and $svc.configPath $svc.releasePath (or $svc.envConfig $k.envConfig) }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $svc.name }}
  namespace: {{ $k.project }}
spec:
  freightCreationPolicy: {{ $svc.freightCreationPolicy | default "Automatic" }}
  {{- if $svc.interval }}
  interval: {{ $svc.interval }}
  {{- end }}
  subscriptions:
    - image:
        repoURL: {{ $k.registry }}/{{ $svc.repo | default $svc.name }}
        imageSelectionStrategy: {{ $svc.imageSelectionStrategy | default "NewestBuild" }}
        {{- $allowTags := $svc.allowTags | default $k.allowTags }}
        {{- if $svc.extraAllowTags }}
        {{- $allowTags = printf "%s|%s" $allowTags $svc.extraAllowTags }}
        {{- end }}
        {{- if $allowTags }}
        allowTagsRegexes:
          - {{ $allowTags | quote }}
        {{- end }}
        cacheByTag: {{ $svc.cacheByTag | default false }}
        discoveryLimit: {{ $svc.discoveryLimit | default 10 }}
    {{- if $svc.chart }}
    # Packaged Helm chart artifact: the chart VERSION joins the image tag in
    # Freight, so a promotion pins which chart release renders this build.
    - chart:
        repoURL: {{ $svc.chartRepo | default $k.chartRepo }}
        name: {{ $svc.chart }}
        {{- with ($svc.chartSemver | default $k.chartSemver) }}
        semverConstraint: {{ . | quote }}
        {{- end }}
        discoveryLimit: {{ $svc.discoveryLimit | default 10 }}
    {{- end }}
    {{- if $svc.configPath }}
    # Config artifact. Makes the service's chart directory part of Freight, so a
    # promotion carries the image tag AND the config it was tested with, pinned
    # together. This is Kargo's "Common Case": one Warehouse subscribing to an
    # image repo *and* a git repo.
    #
    # includePaths entries are EXACT paths by default (a directory implicitly
    # selects everything under it) -- no glob:/regex: prefix wanted here.
    #
    # It is also what prevents a feedback loop: the dev Stage pushes its own
    # promotion commits to this same branch, but those touch the env file under
    # environments/, not this path, so they create no new Freight.
    - git:
        repoURL: {{ $k.git.repoURL }}
        branch: {{ $k.configBranch | default (index $k.stages 0).branch }}
        commitSelectionStrategy: NewestFromBranch
        includePaths:
          {{- if $envConfig }}
          # shared config only; stages/ belongs to the per-stage Warehouses
          - {{ printf "%s/Chart.yaml" $svc.configPath | quote }}
          - {{ printf "%s/values.yaml" $svc.configPath | quote }}
          {{- else }}
          - {{ $svc.configPath | quote }}
          {{- end }}
        discoveryLimit: {{ $svc.discoveryLimit | default 10 }}
    {{- end }}
{{- if $envConfig }}
{{- range $stage := $k.stages }}
---
# Per-environment config for {{ $svc.name }} in {{ $stage.name }}: only
# stages/{{ $stage.name }}.yaml. Feeds Stage {{ $svc.name }}-{{ $stage.name }} alone.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $svc.name }}-{{ $stage.name }}-config
  namespace: {{ $k.project }}
spec:
  freightCreationPolicy: {{ $svc.freightCreationPolicy | default "Automatic" }}
  {{- if $svc.interval }}
  interval: {{ $svc.interval }}
  {{- end }}
  subscriptions:
    - git:
        repoURL: {{ $k.git.repoURL }}
        branch: {{ $k.configBranch | default (index $k.stages 0).branch }}
        commitSelectionStrategy: NewestFromBranch
        includePaths:
          - {{ printf "%s/stages/%s.yaml" $svc.configPath $stage.name | quote }}
        discoveryLimit: {{ $svc.discoveryLimit | default 10 }}
{{- end }}
{{- end }}
{{- end }}
