# Defaults; overridden per project by config/projects/<project>.yaml.
# Credentials + the kargo-api admin Secret are rendered by the cluster-configs chart.
kargo:
  project: ""
  registry: docker.io/egovio
  argocdAppPrefix: egov-
  git:
    repoURL: https://github.com/egovernments/DIGIT-DevOps.git
  services: []
  stages: []

  # GitHub teams granted access to THIS project (see templates/rbac.yaml).
  # Set per project in config/projects/<project>.yaml -- each project gets its
  # own list, so access is never shared across projects.
  #   role: admin | promoter | viewer  -> the kargo-<role> Role that Kargo
  #   creates in every project namespace.
  # groups are "<org>:<team-slug>" as emitted by the Dex github connector
  # configured with teamNameField: slug.
  #
  # This list is the SINGLE source of truth for Kargo access: rbac.yaml
  # derives both the in-project role and the cluster-scoped login /
  # project-list grant from it. Nothing needs adding to
  # config/control-plane.yaml when a team is added here.
  teams: []

  # Namespace for the "global" per-team ServiceAccounts that grant login and
  # the project list. MUST match the API server's
  # GLOBAL_SERVICE_ACCOUNT_NAMESPACES (the Kargo release namespace by
  # default; extend via api.oidc.globalServiceAccounts.namespaces). If this
  # points somewhere Kargo does not scan, the ServiceAccounts are created but
  # silently ignored and users see an empty project list.
  globalNamespace: kargo
