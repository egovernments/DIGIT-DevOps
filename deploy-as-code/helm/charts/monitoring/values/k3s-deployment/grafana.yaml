# grafana — k3s-deployment (single-node k3s) overlay
#
# Materialises the `grafana:` block from environments/k3s-deployment.yaml plus the
# ingress/persistence settings the helmfile used to supply via `set:`.

ingress:
  enabled: true
  ingressClassName: nginx
  path: /monitoring
  pathType: Prefix
  hosts:
    - k3s-deployment.digit.org
  tls:
    - secretName: k3s-deployment.digit.org-tls-certs
      hosts:
        - k3s-deployment.digit.org

persistence:
  enabled: true
  type: pvc
  size: 2Gi
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]

# The PVC above is ReadWriteOnce -- a local-path volume is pinned to the node
# that created it -- and this Deployment runs a single replica. (Inherited from
# the multi-node AKS setup; on the single k3s node the deadlock below cannot
# occur, but Recreate is still harmless and keeps the overlays in step.)
# Under the chart's default RollingUpdate, maxUnavailable rounds down to 0 for
# one replica, so Kubernetes starts the replacement pod before stopping the old one. If the two land on
# different nodes the new pod cannot attach the disk and waits on the old one,
# which the Deployment will not remove until the new one is Ready: a deadlock
# that needs a manual scale to 0 to clear (seen on the Kong dashboard rollout,
# FailedAttachVolume / Multi-Attach).
#
# Recreate stops the old pod first, so the disk is free before the new pod is
# scheduled. Same brief downtime, but the rollout completes on its own.
deploymentStrategy:
  type: Recreate

# GF_AUTH_GITHUB_CLIENT_ID / _SECRET come from the SOPS-backed secret that
# cluster-configs renders into this namespace.
# Verified present: monitoring/grafana-oauth with both keys.
envFromSecret: grafana-oauth

# without this the chart mints a random admin password on every render, so the
# Secret and the Deployment's checksum/secret annotation never stop drifting
admin:
  existingSecret: grafana-oauth
  userKey: admin-user
  passwordKey: admin-password

grafana.ini:
  server:
    domain: k3s-deployment.digit.org
    root_url: https://k3s-deployment.digit.org/monitoring
    serve_from_sub_path: true
  auth.github:
    enabled: true
    # env: grafana.github.allowed_organizations
    allowed_organizations:
      - egovernments
    # env: grafana.github.role_attribute_path
    role_attribute_path: "contains(groups[*], '@egovernments/micro-service-uat') && 'Viewer'"
