# kube-prometheus-stack — k3s-deployment (single-node k3s) overlay
#
# Materialises the `prometheus:` block from environments/k3s-deployment.yaml. ArgoCD
# multi-source Applications cannot template from an env file, so those values
# are restated here. Keep them in step with the env file.

alertmanager:
  # env: prometheus.alertmanager.enabled
  #
  # Disabled: k3s-deployment is a test sandbox with no alert routing, and its
  # secrets file deliberately carries no cluster-configs.secrets.alertmanager
  # block, so cluster-configs renders no alertmanager-main Secret.
  #
  # Do NOT just flip this back to true. The chart's generated config from the
  # shared values/prometheus.yaml is invalid (route uses `receiver: default`,
  # which is not in `receivers:`), and the operator then never creates the
  # StatefulSet. To re-enable, restore the alertmanager block in
  # environments/k3s-deployment-secrets.yaml and point
  # alertmanagerSpec.configSecret at alertmanager-main, as uat-saas does.
  enabled: false

prometheus:
  prometheusSpec:
    # env: prometheus.externalLabels — identifies this cluster in federated views
    externalLabels:
      cluster: k3s-deployment
    retention: 15d
    # local-path does not enforce the PVC size below -- every volume is a
    # directory on the node's 128 GiB OS disk -- so cap the TSDB here instead.
    # Whichever of retention / retentionSize is hit first wins.
    retentionSize: 15GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # env: prometheus.additionalScrapeConfigs
    additionalScrapeConfigs:
      - job_name: nginx-ingress-metrics
        static_configs:
          - targets:
              # verified present: svc egov/ingress-nginx-controller-metrics:10254
              - ingress-nginx-controller-metrics.egov:10254
      - job_name: blackbox
        metrics_path: /probe
        params:
          module: [http_2xx]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - replacement: prometheus-blackbox-exporter:9115
            target_label: __address__
        static_configs:
          - targets:
              - https://k3s-deployment.digit.org
      - job_name: blackbox_exporter
        static_configs:
          - targets:
              - prometheus-blackbox-exporter:9115
      - job_name: digit-services-otel
        metrics_path: /metrics
        scrape_interval: 5s
        static_configs:
          - targets:
              - open-telemetry-opentelemetry-collector:8889
      # Kong's status listener (8100) is internal-only -- the chart's own values
      # note it "cannot be exposed through a service or ingress", and
      # kong-kong-proxy only publishes 80/443. So discover the pods and scrape
      # the container port directly rather than going through a Service.
      #
      # Pod role emits one target per declared container port; keeping
      # container_port_name=status pins us to 8100 without hardcoding it.
      #
      # Requires the Kong Prometheus plugin to be enabled in the cluster,
      # otherwise /metrics on this listener returns 404.
      - job_name: kong
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - egov
        relabel_configs:
          # labels come from kong.selectorLabels: name=kong, component=app
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            action: keep
            regex: kong;app
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: status
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

# Grafana is deployed as its own Application, not as this chart's subchart.
grafana:
  enabled: false

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false

# k3s embeds etcd/sqlite, controller-manager, scheduler and kube-proxy in the
# single k3s server process -- there are no separate pods/Services for these
# scrapers to discover, and their metrics bind to localhost, so they would only
# ever produce down targets
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
