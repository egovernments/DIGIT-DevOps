# grafana - studio-demo (Azure AKS) overlay

ingress:
  hosts:
    - studio-demo.digit.org
  tls:
    - secretName: studio-demo.digit.org-tls-certs
      hosts:
        - studio-demo.digit.org

# GitHub OAuth creds (grafana-oauth Secret rendered by cluster-configs from SOPS)
envFromSecret: grafana-oauth

grafana.ini:
  auth.github:
    allowed_organizations: [egovernments]
    # restricted to the egovernments/studio-demo team (same as oauth2-proxy), Viewer role
    role_attribute_path: "contains(groups[*], '@egovernments/studio-demo') && 'Viewer'"
    role_attribute_strict: true

# built-in admin login (grafana-admin Secret rendered by cluster-configs from SOPS)
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
