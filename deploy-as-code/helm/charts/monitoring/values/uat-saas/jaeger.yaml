# jaeger — uat-saas (Azure AKS) overlay
#
# ES lives in the backbone namespace on this cluster, and the password is
# injected from a secret rather than committed in the base values.
# Verified present: svc backbone/elasticsearch-data:9200 and
# monitoring/elasticsearch-master-creds (keys: username, password).
storage:
  type: elasticsearch
  elasticsearch:
    url: http://elasticsearch-data.backbone:9200

# the chart's own ingress only supports enabled/annotations/labels/pathType and
# renders path "/", which would swallow the whole domain -- so it stays off and
# the ingress is declared explicitly below
extraObjects:
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: jaeger-query
      namespace: monitoring
    spec:
      ingressClassName: nginx
      tls:
        - secretName: uat-saas.digit.org-tls-certs
          hosts:
            - uat-saas.digit.org
      rules:
        - host: uat-saas.digit.org
          http:
            paths:
              - path: /jaeger
                pathType: Prefix
                backend:
                  service:
                    name: jaeger
                    port:
                      number: 16686

jaeger:
  extraEnv:
    - name: ES_USERNAME
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-creds
          key: username
    - name: ES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: elasticsearch-master-creds
          key: password

userconfig:
  extensions:
    jaeger_storage:
      backends:
        primary_store_elasticsearch:
          elasticsearch:
            server_urls:
              - http://elasticsearch-data.backbone:9200
            auth:
              basic:
                username: ${env:ES_USERNAME}
                password: ${env:ES_PASSWORD}
        archive_store_elasticsearch:
          elasticsearch:
            server_urls:
              - http://elasticsearch-data.backbone:9200
            auth:
              basic:
                username: ${env:ES_USERNAME}
                password: ${env:ES_PASSWORD}
