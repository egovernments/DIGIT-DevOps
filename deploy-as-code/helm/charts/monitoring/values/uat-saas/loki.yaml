# loki — uat-saas (Azure AKS) overlay
#
# Targets the grafana/loki chart (6.x), matching this branch's convention --
# NOT loki-stack. Materialises the `loki:` block from environments/uat-saas.yaml.

loki:
  # env: loki.limitsConfig
  limits_config:
    retention_period: 168h
    reject_old_samples_max_age: 720h

  # Loki promotes only a fixed set of OTLP resource attributes to index labels;
  # anything else becomes structured metadata, which is returned in query
  # results but CANNOT be used in a stream selector. The stock "Kubernetes Logs
  # from Loki" dashboard queries
  #     {namespace=~"$namespace", pod=~"$pod"}
  # so namespace/pod/container/job have to be indexed, not just the k8s_* forms.
  # The otel overlay's transform/loki_labels processor is what sets them.
  #
  # MUST live under `distributor`, not `limits_config`, on this version:
  # Loki 3.0.0 reads the mapping from distributor.otlp_config and only moved it
  # under limits_config in a later release. Placed under limits_config it is
  # parsed without any error and silently ignored -- the built-in index-label
  # list stays in force and the dashboard stays empty. Verified against the
  # running build: `/config` exposes distributor.otlp_config, and
  # `/config?mode=diff` showed limits_config as entirely default.
  # SCHEMA NOTE (Loki 3.0.0): distributor.otlp_config is of Go type
  # push.GlobalOTLPConfig, whose only field is the flat list below. The nested
  #     otlp_config: {resource_attributes: {attributes_config: [...]}}
  # form belongs to the per-tenant limits_config.otlp_config of LATER Loki
  # releases. Using the nested form here is a hard startup failure:
  #     failed parsing config: field resource_attributes not found
  #     in type push.GlobalOTLPConfig
  # which crash-loops Loki and stops all ingestion.
  #
  # This list REPLACES Loki's built-in default, so the k8s.*/service.* entries
  # have to be restated -- dropping them would unindex the labels that already
  # work today.
  distributor:
    otlp_config:
      default_resource_attributes_as_index_labels:
        - service.name
        - service.namespace
        - service.instance.id
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.replicaset.name
        - k8s.job.name
        - k8s.cronjob.name
        - namespace
        - pod
        - container
        - job

  # env: loki.compactor
  compactor:
    compaction_interval: 10m
  # env: loki.schemaConfig — uat-saas declares a single tsdb/v13 schema from
  # 2026-08-31. Unlike test-lts there is no earlier boltdb-shipper period,
  # because this cluster has no pre-existing Loki data to stay compatible with.
  schemaConfig:
    configs:
      - from: "2026-08-31"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: tsdb_index_
          period: 24h

singleBinary:
  persistence:
    enabled: true
    # env: loki.persistence.size
    size: 50Gi
    storageClass: default
