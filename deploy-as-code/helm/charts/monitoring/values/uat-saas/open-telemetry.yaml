# opentelemetry-collector (GATEWAY) — uat-saas (Azure AKS) overlay
#
# Traces and metrics only. Log collection lives in a separate DaemonSet release
# (values/uat-saas/open-telemetry-logs.yaml) because the filelog receiver can
# only read the node it runs on -- see that file for the full reasoning.
#
# This stays a Deployment: applications need one stable OTLP endpoint to send
# to, and Prometheus scrapes a single target at
#   open-telemetry-opentelemetry-collector:8889
# via the digit-services-otel job in the prometheus overlay. Making this a
# DaemonSet would turn that static target into 4 pods and silently return only
# one node's metrics per scrape.
mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

command:
  name: otelcol-contrib

presets:
  # Disabled here on purpose. Previously this was enabled and was the ONLY log
  # collector, which limited Loki to a single node's logs (4 of 67 deployments).
  # Owned by the DaemonSet release now; enabling it in both would double-ingest
  # every line from whichever node this pod lands on.
  logsCollection:
    enabled: false
  # Still useful for traces/metrics: tags spans and series with the pod,
  # namespace and deployment they came from.
  kubernetesAttributes:
    enabled: true

config:
  service:
    pipelines:
      # Removed: the logs pipeline moves wholesale to the DaemonSet release.
      # `null` deletes the base file's pipeline during values merge.
      logs: null
