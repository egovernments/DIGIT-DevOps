# opentelemetry-collector — uat-saas (Azure AKS) overlay
#
# Nothing in environments/uat-saas.yaml configures the collector; these are the
# settings the helmfile applied via `set:`, carried over unchanged so the
# ArgoCD Application produces the same collector.
#
# Prometheus scrapes this collector at
#   open-telemetry-opentelemetry-collector:8889
# via the digit-services-otel job in the prometheus overlay.
mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

command:
  name: otelcol-contrib

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: true
