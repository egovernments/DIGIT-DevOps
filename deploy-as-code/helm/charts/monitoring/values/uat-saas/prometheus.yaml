# kube-prometheus-stack — uat-saas (Azure AKS) overlay
#
# Materialises the `prometheus:` block from environments/uat-saas.yaml. ArgoCD
# multi-source Applications cannot template from an env file, so those values
# are restated here. Keep them in step with the env file.

alertmanager:
  # env: prometheus.alertmanager.enabled
  enabled: true
  alertmanagerSpec:
    # Use the SOPS-backed Secret rendered by cluster-configs from
    # cluster-configs.secrets.alertmanager, rather than the config the chart
    # generates from the shared values/prometheus.yaml.
    #
    # This is not just about keeping the Slack webhook out of git: the shared
    # base config is itself invalid -- its route sets `receiver: default` while
    # `receivers:` only defines slack-notification and email-notification, so
    # the operator refuses it with
    #     provision alertmanager configuration: failed to initialize from
    #     secret: undefined receiver "default" used in route
    # and never creates the StatefulSet. Pointing at configSecret makes the
    # operator ignore the generated config entirely.
    #
    # The referenced Secret must be self-consistent in the same way: every
    # receiver named by route.receiver and by each nested route must appear in
    # its `receivers:` list.
    configSecret: alertmanager-main
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: default
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

prometheus:
  prometheusSpec:
    # env: prometheus.externalLabels — identifies this cluster in federated views
    externalLabels:
      cluster: uat-saas
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: default
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # env: prometheus.additionalScrapeConfigs
    additionalScrapeConfigs:
      - job_name: nginx-ingress-metrics
        static_configs:
          - targets:
              # verified present: svc egov/ingress-nginx-controller-metrics:10254
              - ingress-nginx-controller-metrics.egov:10254
      - job_name: blackbox
        metrics_path: /probe
        params:
          module: [http_2xx]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - replacement: prometheus-blackbox-exporter:9115
            target_label: __address__
        static_configs:
          - targets:
              - https://uat-saas.digit.org
      - job_name: blackbox_exporter
        static_configs:
          - targets:
              - prometheus-blackbox-exporter:9115
      - job_name: digit-services-otel
        metrics_path: /metrics
        scrape_interval: 5s
        static_configs:
          - targets:
              - open-telemetry-opentelemetry-collector:8889
      # Kong's status listener (8100) is internal-only -- the chart's own values
      # note it "cannot be exposed through a service or ingress", and
      # kong-kong-proxy only publishes 80/443. So discover the pods and scrape
      # the container port directly rather than going through a Service.
      #
      # Pod role emits one target per declared container port; keeping
      # container_port_name=status pins us to 8100 without hardcoding it.
      #
      # Requires the Kong Prometheus plugin to be enabled in the cluster,
      # otherwise /metrics on this listener returns 404.
      - job_name: kong
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - egov
        relabel_configs:
          # labels come from kong.selectorLabels: name=kong, component=app
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            action: keep
            regex: kong;app
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: status
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

# Grafana is deployed as its own Application, not as this chart's subchart.
grafana:
  enabled: false

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false

# AKS runs a managed control plane -- etcd, controller-manager and scheduler are
# not reachable from the cluster, and kube-proxy metrics bind to localhost, so
# these scrapers would only ever produce down targets
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
