# loki-stack — unified-qa (Azure AKS) overlay
#
# Materialises what monitoring-helmfile.yaml injected from
# environments/unified-qa.yaml. NOTE this targets chart grafana/loki-stack
# 2.10.1 (the version in the helmfile), not grafana/loki 6.x — the config below
# is Loki 2.x schema (boltdb-shipper, shared_store, table_manager), which the
# 6.x chart does not accept. loki-stack also bundles promtail, which plain loki
# does not; without it nothing ships logs.

loki:
  # env: loki.persistence — 15Gi, half of unified-dev's 30Gi. That is this
  # environment's own sizing, kept as-is; it pairs with the shorter retention
  # configured below.
  persistence:
    enabled: true
    accessModes:
    - ReadWriteOnce
    size: 15Gi
    # AKS: the cluster default StorageClass is disk.csi.azure.com. Naming it
    # explicitly avoids inheriting whatever default a future cluster sets.
    # Note the AKS built-in classes use reclaimPolicy: Delete — if these logs
    # matter beyond the retention window, switch to a Retain-based class.
    storageClassName: managed-csi

  # NOT in environments/unified-qa.yaml — carried over from the unified-dev
  # overlay because it is an AKS concern rather than an env choice:
  # OnRootMismatch avoids re-chowning the whole volume on every restart, which
  # gets slow once the PVC has many chunks.
  securityContext:
    fsGroupChangePolicy: OnRootMismatch

  # NOT in environments/unified-qa.yaml — carried over from unified-dev.
  # 300s initial delay because Loki replays its WAL before serving /ready, and
  # a shorter delay restart-loops on a full volume.
  livenessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 300
    periodSeconds: 30
    failureThreshold: 5

  # env: loki.serviceAccount
  serviceAccount:
    annotations: {}

  # unified-qa.yaml sets no loki.nodeSelector, so unlike unified-dev there is
  # nothing to strip here. For the record the same constraint applies: none of
  # the 7 unified-qa nodes carries a workload-type label, so a
  # {workload-type: stateful} selector would leave the pod unschedulable.

  # env: loki.additionalConfigs — the helmfile mapped these into loki.config.*
  config:
    schema_config:
      configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/index_cache
        shared_store: filesystem
        # env: 24h (unified-dev uses 72h)
        cache_ttl: 24h
      filesystem:
        directory: /data/loki/chunks
    compactor:
      working_directory: /data/loki/boltdb-shipper-compactor
      shared_store: filesystem
      retention_enabled: true
      # DELIBERATE DEVIATION from environments/unified-qa.yaml, which sets
      # compaction_interval: 72h. That is how often the compactor runs, not how
      # long data is kept — at 72h it would only enforce the 72h retention once
      # every three days, so the PVC holds up to ~6 days of logs and can fill.
      # unified-dev uses 10m, which is also the chart default. Set back to 72h
      # if that value was intentional.
      compaction_interval: 10m
      retention_delete_delay: 2h
    table_manager:
      retention_deletes_enabled: true
      # env: 72h (3 days). unified-dev keeps 720h (30 days).
      retention_period: 72h
    # NOT in environments/unified-qa.yaml — carried over from unified-dev and
    # aligned to this environment's 72h. Without limits_config.retention_period
    # the compactor falls back to its default rather than the table_manager
    # value, so the two can silently disagree.
    limits_config:
      retention_period: 72h
      max_query_lookback: 72h
    chunk_store_config:
      max_look_back_period: 72h

promtail:
  # NOT in environments/unified-qa.yaml (unified-dev has it) — operator: Exists
  # so the log agent runs on every node including tainted ones, which is the
  # point of a DaemonSet collector. Without it, logs from tainted nodes are
  # silently missing.
  tolerations:
    - operator: Exists
