# grafana — unified-uat (Azure AKS) overlay
#
# PROVENANCE: environments/unified-uat.yaml contains NO `grafana:` block, so
# this file is seeded from the unified-dev overlay rather than migrated. The
# GitHub org/role mapping below is therefore unified-dev's policy — confirm it
# is the intended access model for UAT.

ingress:
  # The base values/grafana.yaml hardcodes hosts: ["mukta.odisha.gov.in"] and
  # tls.hosts: [""] — placeholders from another environment. They MUST be
  # overridden or the ingress is issued for the wrong hostname.
  # grafana.ini server.root_url templates off (ingress.hosts | first) + path,
  # so fixing hosts here also fixes the generated root_url and OAuth callback.
  hosts:
    - unified-uat.digit.org
  tls:
    - secretName: unified-uat.digit.org-tls-certs
      hosts:
        - unified-uat.digit.org

# GitHub OAuth credentials, loaded as environment variables from a Secret so
# they stay encrypted in git. The Secret must contain exactly these two keys:
#     GF_AUTH_GITHUB_CLIENT_ID
#     GF_AUTH_GITHUB_CLIENT_SECRET
# Rendered by charts/cluster-configs/templates/secrets/grafana-secret.yaml from
# cluster-configs.secrets.grafana. Named grafana-oauth, not grafana: the chart
# itself owns a Secret called "grafana", and reusing that name makes two Argo
# apps fight over it.
#
# !! PREREQUISITE — NOT YET SATISFIED !!
# environments/unified-uat-secrets.yaml has NO `grafana` entry (unified-dev and
# unified-qa both do). Until clientID/clientSecret are added there, Secret
# grafana-oauth is not rendered and the pod fails with
#     CreateContainerConfigError: secret "grafana-oauth" not found
# Add the entry, or comment out this line to run with admin login only.
#
# The GitHub OAuth app also needs its callback URL registered as
#     https://unified-uat.digit.org/monitoring/login/github
# Credentials from another environment's app will authenticate but be rejected
# at the callback.
envFromSecret: grafana-oauth

grafana.ini:
  auth.github:
    allowed_organizations: [egovernments]
    # Grants Admin to egov-devops and Viewer to micro-service-qa; everyone else
    # is refused by role_attribute_strict (set true in the base values).
    role_attribute_path: "contains(groups[*], '@egovernments/egov-devops') && 'Admin' || contains(groups[*], '@egovernments/micro-service-qa') && 'Viewer'"

# Built-in admin login.
#
# Without this the chart renders its own Secret/grafana, whose password comes
# from `randAlphaNum 40` on every render: grafana.password only reuses an
# existing password via `lookup`, and lookup is empty during `helm template` —
# which is how Argo's repo-server generates manifests. The result was
# Secret/grafana and Deployment/grafana permanently OutOfSync, with selfHeal
# free to rotate the admin password on any sync.
#
# Pointing at an existing Secret makes grafana.secretsData skip its own Secret
# entirely, so the credential is stable and lives encrypted in SOPS.
# Rendered by charts/cluster-configs/templates/secrets/grafana-admin-secret.yaml.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
