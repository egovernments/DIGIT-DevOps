# loki-stack — unified-uat (Azure AKS) overlay
#
# PROVENANCE: environments/unified-uat.yaml contains NO `loki:` or `promtail:`
# block — logging was never configured for this environment under the helmfile.
# This file is seeded from the unified-dev overlay rather than migrated, so the
# sizing below is unified-dev's, not a UAT-specific choice. Review 30Gi/720h
# against how long UAT logs actually need to be kept (unified-qa uses 15Gi/72h).
#
# NOTE this targets chart grafana/loki-stack 2.10.1 (the version in the
# helmfile), not grafana/loki 6.x — the config below is Loki 2.x schema
# (boltdb-shipper, shared_store, table_manager), which the 6.x chart does not
# accept. loki-stack also bundles promtail, which plain loki does not; without
# it nothing ships logs.

loki:
  persistence:
    enabled: true
    accessModes:
    - ReadWriteOnce
    size: 30Gi
    # AKS: the cluster default StorageClass is disk.csi.azure.com. Naming it
    # explicitly avoids inheriting whatever default a future cluster sets.
    # Note the AKS built-in classes use reclaimPolicy: Delete — if these logs
    # matter beyond the retention window, switch to a Retain-based class.
    storageClassName: managed-csi

  # OnRootMismatch avoids re-chowning the whole volume on every restart, which
  # gets slow once the PVC has many chunks.
  securityContext:
    fsGroupChangePolicy: OnRootMismatch

  # 300s initial delay because Loki replays its WAL before serving /ready, and
  # a shorter delay restart-loops on a full volume.
  livenessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 300
    periodSeconds: 30
    failureThreshold: 5

  serviceAccount:
    annotations: {}

  # DELIBERATELY OMITTED — the unified-dev EKS-era config paired a
  # nodeSelector {workload-type: stateful} with a matching toleration. That
  # targets a dedicated stateful nodegroup which does NOT exist here: none of
  # the 8 unified-uat nodes carries a workload-type label, so copying it over
  # would leave the Loki pod permanently Pending. Re-add both together if a
  # labelled/tainted nodepool is created.

  config:
    schema_config:
      configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/index_cache
        shared_store: filesystem
        cache_ttl: 72h
      filesystem:
        directory: /data/loki/chunks
    compactor:
      working_directory: /data/loki/boltdb-shipper-compactor
      shared_store: filesystem
      retention_enabled: true
      retention_delete_delay: 2h
      compaction_interval: 10m
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h
    limits_config:
      retention_period: 720h
      max_query_lookback: 720h
    chunk_store_config:
      max_look_back_period: 720h

promtail:
  # operator: Exists so the log agent runs on every node including tainted
  # ones, which is the point of a DaemonSet collector.
  tolerations:
    - operator: Exists
