# configmap.yaml -- renders .Values.configFiles (file name -> content) for /configs
{{- if .Values.configFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-files
  {{- if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{- else }}
  namespace: {{ .Values.namespace }}
  {{- end }}
  labels:
    app: {{ .Values.name }}
data:
  {{- range $file, $content := .Values.configFiles }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
