# pilot-resources -- DEV-only values. Merged over ../values.yaml by Kargo when a
# Freight is promoted to dev.
replicas: "1"
resources: |
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
extraEnv:
  app: |
    - name: PODINFO_UI_MESSAGE
      value: "pilot-resources on DEV: 1 replica(s), 10m/32Mi requested"
