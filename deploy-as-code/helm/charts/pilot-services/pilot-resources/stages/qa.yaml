# pilot-resources -- QA-only values. Merged over ../values.yaml by Kargo when a
# Freight is promoted to qa.
replicas: "2"
resources: |
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 150m
    memory: 96Mi
extraEnv:
  app: |
    - name: PODINFO_UI_MESSAGE
      value: "pilot-resources on QA: 2 replica(s), 25m/48Mi requested"
