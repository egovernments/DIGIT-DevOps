# pilot-resources -- UAT-only values. Merged over ../values.yaml by Kargo when a
# Freight is promoted to uat.
replicas: "2"
resources: |
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
extraEnv:
  app: |
    - name: PODINFO_UI_MESSAGE
      value: "pilot-resources on UAT: 2 replica(s), 50m/64Mi requested"
