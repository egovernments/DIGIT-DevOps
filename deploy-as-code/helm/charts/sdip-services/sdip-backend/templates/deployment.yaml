{{- $cfg := mergeOverwrite (deepCopy .Values) (get .Values .Chart.Name | default dict) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- with $cfg.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $cfg.httpPort }}
              protocol: TCP
          {{- with $cfg.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          {{- with $cfg.env }}
          env:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $cfg.volumeMounts }}
          volumeMounts:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $cfg.healthChecks.startup }}
          startupProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $cfg.healthChecks.readiness }}
          readinessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $cfg.healthChecks.liveness }}
          livenessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with $cfg.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}
      {{- with $cfg.volumes }}
      volumes:
{{ toYaml . | indent 8 }}
      {{- end }}
