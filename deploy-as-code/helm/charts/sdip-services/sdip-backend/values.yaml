image:
  repository: registry.invalid/sdip-backend
  tag: "unconfigured"
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicas: 1
httpPort: 8080

service:
  type: ClusterIP
  port: 8080

envFromSecret: ""
env: []

# Probes are defined per environment, not here.
#
# deployment.yaml merges this file with the `sdip-backend` block of the env file
# via mergeOverwrite, which deep-merges: a tcpSocket default here survived
# alongside an httpGet override there, producing a probe with two handlers that
# the API server rejects with "may not specify more than 1 handler type".
# Keeping the key present but empty lets `{{- with $cfg.healthChecks.startup }}`
# resolve without a nil dereference.
healthChecks: {}

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
