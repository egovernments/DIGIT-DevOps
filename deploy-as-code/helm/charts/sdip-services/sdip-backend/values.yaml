image:
  repository: registry.invalid/sdip-backend
  tag: "unconfigured"
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicas: 1
httpPort: 8080

service:
  type: ClusterIP
  port: 8080

envFromSecret: ""
env: []

healthChecks:
  readiness:
    tcpSocket:
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    tcpSocket:
      port: http
    initialDelaySeconds: 60
    periodSeconds: 20

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
