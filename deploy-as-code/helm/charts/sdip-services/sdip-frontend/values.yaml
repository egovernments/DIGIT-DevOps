image:
  repository: registry.invalid/sdip-frontend
  tag: "unconfigured"
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicas: 1
httpPort: 8080

service:
  type: ClusterIP
  port: 8080

envFromSecret: ""
env: []

healthChecks:
  readiness:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: false
  className: nginx
  host: "sdip.example.invalid"
  tlsSecretName: ""
