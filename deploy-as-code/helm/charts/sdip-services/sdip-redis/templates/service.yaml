{{- $v := include "sdipredis.values" . | fromYaml }}
apiVersion: v1
kind: Service
metadata:
  name: sdip-redis-headless
  namespace: {{ $v.namespace | quote }}
spec:
  clusterIP: None
  selector:
    app: sdip-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: sdip-redis
  namespace: {{ $v.namespace | quote }}
spec:
  type: ClusterIP
  selector:
    app: sdip-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
