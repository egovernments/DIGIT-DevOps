namespace: sdip

image:
  repository: egovio/redis
  tag: "7.2.4"
  pullPolicy: IfNotPresent

auth:
  existingSecret: sdip-redis-auth

replicas: 1

persistence:
  storageClass: managed-csi-premium
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
