# Common Labels
labels:
  app: "studio-user-otp"
  group: "core"

namespace: studio

# Ingress Configs
ingress:
  namespace: egov
  enabled: true
  zuul: true
  context: "studio-user-otp"

# Init Containers Configs
initContainers: {}

resources: |
  limits:
    cpu: "200m"
    memory: "512Mi"
  requests:
    cpu: "200m"
    memory: "512Mi"

# Container Configs
image:
  repository: "studio-user-otp"
healthChecks:
  enabled: true
  livenessProbePath: "/studio-user-otp/health"
  readinessProbePath: "/studio-user-otp/health"
replicas: "1"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"
java-args: ""
memory_limits: "512Mi"
cpu_limits: "200m"

# Additional Container Envs
env: |
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: "/studio-user-otp"
  - name: SERVER_PORT
    value: "8080"
  - name: SPRING_DATA_REDIS_HOST
    value: redis.backbone
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  - name: OTP_HOST
    value: http://egov-otp:8080/otp
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_LOCALISATION_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-localization
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: SMS_TOPIC
    value: egov.core.notification.sms
  - name: FLAG_DIGITSTUDIO_URL
    value: "true"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  {{- if index .Values "tracing-enabled" }}
  - name: TRACER_OPENTRACING_ENABLED
    value: "true"
  {{- end }}
