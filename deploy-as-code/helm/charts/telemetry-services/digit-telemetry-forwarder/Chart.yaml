apiVersion: v2
name: digit-telemetry-forwarder
description: >-
  Reads digit-product-telemetry and sends each event to PostHog through the gateway (Keycloak client-credentials
  login), with retry topics, two dead-letter topics and a heartbeat. No database, no ingress.
type: application
version: 0.1.0
appVersion: 0.1.0

dependencies:
- name: common
  version: 0.0.5
  repository: file://../../common
