apiVersion: v2
name: lpms-agent
description: >-
  Citizen chat for LPMS: a connector (MCP server) that lets a citizen find, apply for and track a licence from a chat
  with Claude, using their own LPMS login. One account per deployment. Needs a public https address and a small
  database of its own (logins and applications waiting for the person's confirmation).
type: application
version: 0.1.3
appVersion: 0.1.3

dependencies:
- name: common
  version: 0.0.5
  repository: file://../../common
