# apportion: values shared by EVERY environment. Keys nest under the chart name
# because this is an umbrella chart. Image tags are written by Kargo -- never set
# them here. Per-environment differences go in stages/<env>.yaml.
egov-apportion-service:
  namespace: digit3
  # Off: ingress would publish on the shared unified-dev host, where DIGIT 2.x
  # services in egov already serve paths -- a 3.0 route must not shadow them.
  ingress:
    enabled: false
  # chart default is egov-apportion-service; the images are published as egovio/apportion(-db)
  image:
    repository: apportion
  initContainers:
    dbMigration:
      image:
        repository: apportion-db
