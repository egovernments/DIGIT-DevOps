# DIGIT 3.0 core module -- unified-dev.
#
# One values file per module per environment branch (unified-qa / unified-uat get
# their own copy of this path). Argo CD deploys, from this file only:
#   digit3-<service>              chart <service> from https://helm.digit.org/digit3/core
#                                 at <service>.chart-version, values {global, <service>}
#   digit3-core-cluster-configs   chart cluster-configs from https://helm.digit.org/digit3/cluster-configs
#                                 at cluster-configs.chart-version, values = this file + core-secrets.yaml
#
# Kargo (project digit-core3-0) writes the keys marked "Kargo" on promotion. They must
# stay present: Kargo's yaml-update only replaces existing keys. Everything else is
# edited by PR.

global:
  # The common chart puts every object in this namespace.
  namespace: digit3-core
  domain: unified-dev.digit.org

localization:
  chart-version: 1.0.1
  image:
    tag: master-00fdef3
  initContainers:
    dbMigration:
      enabled: true
      image:
        tag: master-00fdef3
  replicas: 1
  ingress:
    enabled: false                             # no route on the shared unified-dev host
  extraEnv:
    app: |
      - name: ENV_BOOTSRAP
        value: "true"
      - name: THREAD_COUNT
        value: "10000"

filestore:
  chart-version: "1.0.0"                       # Kargo (Freight: chart)
  image:
    tag: flyway-branch-18c74fe                 # Kargo (Freight: image) -> egovio/filestore
  initContainers:
    dbMigration:
      enabled: true
      image:
        tag: flyway-branch-18c74fe             # Kargo (same tag)       -> egovio/filestore-db
  replicas: 1
  ingress:
    enabled: false

