# Shape overlay — layered AFTER azure-k3s.yaml by this shape's helmfile.
# Four-bundle domain split: each service key points at its bundle's Service.
# Image tags are NOT here: every digit3 image tag comes from the DIGIT_TAG
# environment variable via digit-tag.yaml.gotmpl (deploy fails loudly without it).
global:
  domain: domain-split.digit.org

# The egov-service-host map (which Service answers each catalogue service) is GENERATED from the
# manifest into environments/generated/domain-bundles-service-hosts.yaml — do not restate it here.

# Bundle blocks (dev-bundle, identity/notification/billing/admin-bundle) are GENERATED from the manifest +
# environments/bundle-defaults.yaml into environments/generated/<shape>-bundles.yaml.gotmpl — do not restate them here.
