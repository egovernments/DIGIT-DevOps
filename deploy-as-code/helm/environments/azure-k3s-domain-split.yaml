# Shape overlay — layered AFTER azure-k3s.yaml by this shape's helmfile.
# Four-bundle domain split: each service key points at its bundle's Service.
# Image tags are NOT here: every digit3 image tag comes from the DIGIT_TAG
# environment variable via digit-tag.yaml.gotmpl (deploy fails loudly without it).
global:
  domain: domain-split.digit.org

cluster-configs:
    configmaps:
        egov-service-host:
            data:
                otp: "http://identity-bundle.egov.svc.cluster.local:8080/"
                individual: "http://identity-bundle.egov.svc.cluster.local:8080/"
                employee: "http://identity-bundle.egov.svc.cluster.local:8080/"
                template-config: "http://notification-bundle.egov.svc.cluster.local:8080/"
                notification: "http://notification-bundle.egov.svc.cluster.local:8080/"
                billing: "http://billing-bundle.egov.svc.cluster.local:8080/"
                apportion: "http://billing-bundle.egov.svc.cluster.local:8080/"
                idgen: "http://admin-bundle.egov.svc.cluster.local:8080/"
                localization: "http://admin-bundle.egov.svc.cluster.local:8080/"
                workflow: "http://admin-bundle.egov.svc.cluster.local:8080/"
                registry: "http://admin-bundle.egov.svc.cluster.local:8080/"
                filestore: "http://admin-bundle.egov.svc.cluster.local:8080/"
                boundary: "http://admin-bundle.egov.svc.cluster.local:8080/"

identity-bundle:
  env:
    KEYCLOAK_PUBLIC_BASE_URL:
      value: "https://domain-split.digit.org/keycloak"
    URL_SHORTENER_HOST_NAME:
      value: "https://domain-split.digit.org"

notification-bundle:
  env:
    KEYCLOAK_PUBLIC_BASE_URL:
      value: "https://domain-split.digit.org/keycloak"
    URL_SHORTENER_HOST_NAME:
      value: "https://domain-split.digit.org"

billing-bundle:
  env:
    KEYCLOAK_PUBLIC_BASE_URL:
      value: "https://domain-split.digit.org/keycloak"
    URL_SHORTENER_HOST_NAME:
      value: "https://domain-split.digit.org"

admin-bundle:
  env:
    KEYCLOAK_PUBLIC_BASE_URL:
      value: "https://domain-split.digit.org/keycloak"
    URL_SHORTENER_HOST_NAME:
      value: "https://domain-split.digit.org"
