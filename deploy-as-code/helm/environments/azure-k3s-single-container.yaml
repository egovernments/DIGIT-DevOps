# Shape overlay — layered AFTER azure-k3s.yaml by this shape's helmfile.
# Single-modulith shape: every service key points at the dev-bundle Service.
# Image tags are NOT here: every digit3 image tag comes from the DIGIT_TAG
# environment variable via digit-tag.yaml.gotmpl (deploy fails loudly without it).
global:
  domain: modulith-test.digit.org

cluster-configs:
    configmaps:
        egov-service-host:
            data:
                otp: "http://dev-bundle.egov.svc.cluster.local:8080/"
                individual: "http://dev-bundle.egov.svc.cluster.local:8080/"
                employee: "http://dev-bundle.egov.svc.cluster.local:8080/"
                template-config: "http://dev-bundle.egov.svc.cluster.local:8080/"
                notification: "http://dev-bundle.egov.svc.cluster.local:8080/"
                billing: "http://dev-bundle.egov.svc.cluster.local:8080/"
                apportion: "http://dev-bundle.egov.svc.cluster.local:8080/"
                idgen: "http://dev-bundle.egov.svc.cluster.local:8080/"
                localization: "http://dev-bundle.egov.svc.cluster.local:8080/"
                workflow: "http://dev-bundle.egov.svc.cluster.local:8080/"
                registry: "http://dev-bundle.egov.svc.cluster.local:8080/"
                filestore: "http://dev-bundle.egov.svc.cluster.local:8080/"
                boundary: "http://dev-bundle.egov.svc.cluster.local:8080/"

dev-bundle:
  env:
    KEYCLOAK_PUBLIC_BASE_URL:
      value: "https://modulith-test.digit.org/keycloak"
    URL_SHORTENER_HOST_NAME:
      value: "https://modulith-test.digit.org"
