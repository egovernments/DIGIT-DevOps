global:
  # Drives BOTH ingress hosts + TLS secret names: the jenkins chart ingress and
  # the cluster-configs root-ingress both template host from global.domain (they
  # ignore jenkins.master.ingress.hostName entirely).
  domain: jenkins-upgrade.digit.org
cluster-configs:
  namespaces:
    create: true
    values: [ jenkins ]
  root-ingress:
    namespace: jenkins
    serviceName: jenkins
    servicePort: 8080
    appRoot: ""
    cert-issuer: "letsencrypt-prod"

  git-sync:
    namespace: monitoring  

jenkins:
  vcs:
    provider: github
    webUrl: ""    # leave empty for github.com; GHE e.g. https://github.mycompany.com
    apiUrl: ""    # leave empty for api.github.com; GHE: https://github.mycompany.com/api/v3
  CIOps:
    repo: git@github.com:egovernments/CIOps.git
    branch: egov-jenkins
  persistence:
    enabled: true
    size: "350Gi"
    # --- Azure (unified-dev AKS) ---
    # Cluster default StorageClass: disk.csi.azure.com, WaitForFirstConsumer.
    # With no `azure:` block the chart skips the static PV in home-pv.yaml and
    # AKS provisions the disk dynamically.
    storageClass: "default"
    # The chart defaults volumeName to "jenkins", which pins the PVC to a static
    # PV of that name. No static PV is created here, so it must be cleared or the
    # claim stays Pending forever.
    volumeName: ""
    # --- EKS (retired) -------------------------------------------------------
    # storageClass: "gp3"
    # aws:
    #   volumeId: "vol-0bb1df0e78bb51334"
    #   zone: "ap-south-1b"
  oauth:
    # Disabled during migration verification. The GitHub OAuth app (client
    # 827a2255...) has its callback registered at builds.digit.org, so OAuth
    # login on jenkins-upgrade.digit.org bounces to builds.digit.org. With this
    # off, Jenkins uses local auth (jenkins-admin-user / jenkins-admin-password
    # from the jenkins-credentials secret). Re-enable once the OAuth app has a
    # jenkins-upgrade.digit.org callback (or a dedicated app is created).
    enabled: false
    acl:
      admin:
        - egovernments*micro-service-devops
      user:
        - egovernments*unified-dev
        - egovernments*unified-qa
        - egovernments*unified-uat
        - egovernments*jenkins-user
        - egovernments*digit-lts
        - egovernments*sandbox-prod
        - egovernments*moz-health-prd
        - egovernments*hcm-demo
        - egovernments*central-instance
        - egovernments*central-instance-staging
        - egovernments*unified-studio-uat
        - egovernments*unified-studio-dev
        - egovernments*unified-studio-qa
        - egovernments*studio-demo

  jobBuilder:
    repos:
      - HCM-MOZ-IMPEL/DIGIT-Dev-Moz-Impl
      - digitnxt/digit3
      # Default branch is 'main', not 'master'. Pinned explicitly so the Job
      # Builder does not have to fall back to remote-default resolution.
      - name: digitnxt/license-certificate
        branch: main
      - egovernments/core-services
      - egovernments/business-services
      - egovernments/municipal-services
      - egovernments/utilities
      - egovernments/frontend
      - egovernments/requester-dashboard
      - egovernments/approver-dashboard
      - egovernments/punjab-rainmaker-customization
      - egovernments/egov-coexistence
      - egovernments/test-automation
      - egovernments/CoronaSafe
      - egovernments/eGov-dcr-service
      - egovernments/digit-ui
      - egovernments/DIGIT-Works
      - egovernments/health-campaign-services
      - egovernments/punjab-mgramseva
      - egovernments/SANITATION
      - egovernments/Digit-Core
      - egovernments/iFix-Dev
      - egovernments/bihar-mgramseva
      - egovernments/DIGIT-Frontend
      - egovernments/DIGIT-UI-LIBRARIES
      - egovernments/Program-Management-Services
      - egovernments/unified-benefits-administration
      - egovernments/DIGIT-Common
      - egovernments/DIGIT-Analytics
      - egovernments/URBAN
      - egovernments/naljal-digit
      - egovernments/Citizen-Complaint-Resolution-System

  deploymentJobs:
    # ---------------------------------------------------------------------------
    # CI (1)
    # ---------------------------------------------------------------------------
    - name: ci #devops
      repo: git@github.com:egovernments/DIGIT-DevOps.git
      branch: egov-jenkins
      acl: [egovernments*micro-service-devops]

    # ---------------------------------------------------------------------------
    # Central Instance  (4) #Pradeep/#Vinoth
    # ---------------------------------------------------------------------------
    - name: central-instance
      repo: git@github.com:egovernments/DIGIT-DevOps.git
      branch: central-instance-deployment
      acl: [egovernments*central-instance]
    - name: central-instance-staging
      repo: git@github.com:egovernments/DIGIT-DevOps.git
      branch: central-instance-deployment
      acl: [egovernments*central-instance-staging]

    # ---------------------------------------------------------------------------
    # Sandbox  (2) #Pradeep
    # ---------------------------------------------------------------------------
    - name: sandbox-demo
      repo: git@github.com:egovernments/DIGIT-DevOps.git
      branch: sandbox-demo
      acl: [egovernments*sandbox-demo]
    - name: sandbox-prod
      repo: git@github.com:egovernments/DIGIT-DevOps.git
      branch: sandbox-prod
      acl: [egovernments*sandbox-prod]

    # ---------------------------------------------------------------------------
    # Studio  (1) #Tulika
    # ---------------------------------------------------------------------------
    - name: studio-demo
      repo: git@github.com:egovernments/DIGIT-DevOps.git
      branch: studio-demo
      acl: [egovernments*studio-demo]

  master:
    # host/TLS come from global.domain (see above); the chart ingress template
    # reads only .Values.global.domain, so hostName/tls here would be dead config.
    ingress:
      enabled: true
    resources:
      limits:
        cpu: "2500m"
        memory: "5120Mi"
    javaOpts: >-
      -Xms3100M -Xmx3100M
      -Djava.awt.headless=true
      -Dfile.encoding=UTF-8
      -Duser.timezone=Asia/Calcutta
      -XX:+UseG1GC
      -XX:+ExplicitGCInvokesConcurrent
      -XX:+ParallelRefProcEnabled
      -XX:+DisableExplicitGC
      -XX:+AlwaysPreTouch
    # Pin Jenkins to the dedicated `jenkins` node pool on AKS unified-dev. The
    # pool is tainted dedicated=egov-jenkins:NoSchedule and labelled
    # dedicated=egov-jenkins, so the toleration lets Jenkins onto it and the
    # nodeSelector keeps Jenkins off every other pool. Same key/value/effect as
    # the egov-jenkins nodegroup on EKS unified-dev.
    nodeSelector:
      dedicated: egov-jenkins
    tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: egov-jenkins

binfmt:
  namespace: kube-system

ingress-nginx:
  default-backend-service: "jenkins/jenkins"
  namespaceOverride: jenkins
  cert-issuer: "letsencrypt-prod"
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "EECDH+CHACHA20:EECDH+AES"
  ssl-ecdh-curve: "X25519:prime256v1:secp521r1:secp384r1"
  controller:
    replicas: 1
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
      prometheusRule:
        enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 100m
        memory: 200Mi
    addHeaders:
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "SAMEORIGIN"
      X-XSS-Protection: "1; mode=block"
      Access-Control-Allow-Origin: "https://jenkins-upgrade.digit.org"
      Access-Control-Allow-Methods: "GET, POST, OPTIONS"
      Access-Control-Allow-Headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range"
    setSslTls: "jenkins-upgrade.digit.org-tls-certs"

cert-manager:
  namespace: jenkins
  email: "devops-team@egov.org.in"


       
