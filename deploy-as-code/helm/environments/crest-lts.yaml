# CREST on the digit-lts AKS cluster, namespace crest, host crest.test-lts.digit.org.
#
# Read by two Applications:
#   digit-lts-cluster-configs-crest  - this file + the cluster-configs chart values,
#                                      renders the namespace, egov-config and the db Secret
#   crest-<service>                  - this file as the values override for the charts
#                                      pulled from helm.digit.org/digit3/crest
#
# Never layered onto test-lts.yaml: egov-config here would replace egov's.
#
# The charts are published, not in this repo. Anything environment-specific belongs
# here; the charts carry only platform-neutral defaults.

global:
  # Both charts render their Ingress against this. crest-ui takes "/" and crest takes
  # "/api" on the same host, because the UI bundle fetches same-origin /api/v1.
  # *.test-lts.digit.org already resolves (wildcard A record), so no DNS change is needed;
  # cert-manager issues crest.test-lts.digit.org-tls-certs on first sync.
  domain: crest.test-lts.digit.org
  setup: fullsetup
  namespace: crest
  containerRegistry: egovio
  mode: prod

cluster-configs:
  # Everything this renders must land in namespace crest: crest-project allows no other
  # destination. The cluster-wide RBAC, the root ingress and the egov db Service belong
  # to digit-lts-cluster-configs, so they are switched off here.
  cluster-roles:
    enabled: false
  root-ingress: null
  db: null
  nginx-errors: null

  namespaces:
    create: true
    values: [ crest ]

  configmaps:
    egov-config:
      name: egov-config
      namespace: [ crest ]
      data:
        # The PostgreSQL 18 cluster in backbone, NOT the 15.8 server in egov: CREST's
        # migrations use uuidv7(), a built-in that only exists from 18. Every other
        # service stays on postgres.egov - only CREST is pointed here.
        #
        # postgresql.backbone is an ExternalName the postgresql chart renders onto the
        # operator's postgresql-rw Service, so a failover does not change this value.
        #
        # db-name is also what the chart's reconciler reads to decide which database
        # to create, so this names CREST's own database rather than a shared one.
        # No currentSchema: CREST owns the whole database and uses public, which is
        # what its own docker-compose and test containers do.
        # Only the three keys something actually reads. chart 3.0.1 sets appType ""
        # (CREST's application.yml owns the Hikari pool and conflicts with the
        # injected one), so common injects no shared datasource, Tomcat, timezone or
        # Kafka env here - the keys feeding that block were dead weight and are gone.
        # Re-add them alongside any move back to appType "java".
        #
        # db-name  -> read by the postgresql chart's reconciler, to decide which
        #             database to create; also names CREST's own database.
        # db-url   -> CREST_DB_URL for the app, DB_URL for the flyway init container.
        db-name: crest
        db-url: jdbc:postgresql://postgresql.backbone:5432/crest
        # The crest-db image ships its migrations at /flyway/sql.
        flyway-locations: "filesystem:/flyway/sql"
    # Not used by CREST: it calls no other platform service.
    egov-service-host: null
    hcm-moz-impl: null

  secrets:
    # Values live in crest-lts-secrets.yaml (SOPS). A dedicated "crest" role on the
    # new cluster, not the platform superuser: the postgresql chart's reconciler
    # creates the role from this Secret, and reusing "postgres" would collide with
    # CloudNativePG's own superuser.
    db:
      name: db
      namespace: [ crest ]
    kc-db: null
    kc-admin: null
    egov-notification-sms: null
    egov-notification-mail: null
    wordpress: null
    kafka-kraft: null
    hmac-secret: null
    minio: null
    vault-approle: null
