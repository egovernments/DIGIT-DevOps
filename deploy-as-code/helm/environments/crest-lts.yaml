# CREST on the digit-lts AKS cluster, namespace crest, host crest.test-lts.digit.org.
#
# Read by two Applications:
#   digit-lts-cluster-configs-crest  - this file + the cluster-configs chart values,
#                                      renders the namespace, egov-config and the db Secret
#   crest-<service>                  - this file as the values override for the charts
#                                      pulled from helm.digit.org/digit3/crest
#
# Never layered onto test-lts.yaml: egov-config here would replace egov's.
#
# The charts are published, not in this repo. Anything environment-specific belongs
# here; the charts carry only platform-neutral defaults.

global:
  # The UI's host. crest-ui takes "/" here; the API lives on test-lts.digit.org/crest
  # (crest.ingress.hostName below) and the UI calls it cross-origin, see crest-ui.
  # *.test-lts.digit.org already resolves (wildcard A record), so no DNS change is needed;
  # cert-manager issues crest.test-lts.digit.org-tls-certs on first sync.
  domain: crest.test-lts.digit.org
  setup: fullsetup
  namespace: crest
  containerRegistry: egovio
  # dev: each service runs the image.tag pinned in its section below, instead of the
  # chart's appVersion. Lets a UI/backend image be updated without a new chart version.
  mode: dev
cluster-configs:
  # Everything this renders must land in namespace crest: crest-project allows no other
  # destination. The cluster-wide RBAC, the root ingress and the egov db Service belong
  # to digit-lts-cluster-configs, so they are switched off here.
  cluster-roles:
    enabled: false
  root-ingress: null
  db: null
  nginx-errors: null
  namespaces:
    create: true
    values: [crest]
  configmaps:
    egov-config:
      name: egov-config
      namespace: [crest]
      data:
        # The PostgreSQL 18 cluster in backbone, NOT the 15.8 server in egov: CREST's
        # migrations use uuidv7(), a built-in that only exists from 18. Every other
        # service stays on postgres.egov - only CREST is pointed here.
        #
        # postgresql.backbone is an ExternalName the postgresql chart renders onto the
        # operator's postgresql-rw Service, so a failover does not change this value.
        #
        # db-name is also what the chart's reconciler reads to decide which database
        # to create, so this names CREST's own database rather than a shared one.
        # No currentSchema: CREST owns the whole database and uses public, which is
        # what its own docker-compose and test containers do.
        db-host: postgresql.backbone
        db-port: "5432"
        db-name: crest
        db-url: jdbc:postgresql://postgresql.backbone:5432/crest
        # The crest-db image ships its migrations at /flyway/sql.
        flyway-locations: "filesystem:/flyway/sql"
        # crest-ui's runtime settings, mounted as /config.js (see crest-ui below).
        # One UI image runs everywhere; only this file differs per environment.
        # keycloak switches sign-in on: console uses the employee client, worker
        # the citizen client. apiBaseUrl is where the browser calls the API.
        config.js: |
          window.crestConfig = {
            apiBaseUrl: 'https://test-lts.digit.org/crest',
            keycloak: {
              url: 'https://test-lts.digit.org/keycloak',
              realm: 'CREST',
              consoleClientId: 'employee',
              workerClientId: 'citizen',
            },
          };
        # Everything below is read by nobody today and kept only so this file still
        # describes the environment if CREST later opts back into the shared block.
        # chart 3.0.1 sets appType "" (its application.yml owns the Hikari pool and
        # conflicts with the injected one), so common injects no datasource, Tomcat,
        # timezone or Kafka env. CREST itself publishes nothing to Kafka.
        db-pool-max-size: "10"
        db-pool-min-idle: "2"
        db-pool-connection-timeout-ms: "5000"
        timezone: "Asia/Kolkata"
        spring-jpa-show-sql: "false"
        server-tomcat-threads-max: "200"
        server-tomcat-max-connections: "8192"
        kafka-brokers: "kafka-controller-headless.backbone:9092"
    # Not used by CREST: it calls no other platform service.
    egov-service-host: null
    hcm-moz-impl: null
  secrets:
    # Values live in crest-lts-secrets.yaml (SOPS). A dedicated "crest" role on the
    # new cluster, not the platform superuser: the postgresql chart's reconciler
    # creates the role from this Secret, and reusing "postgres" would collide with
    # CloudNativePG's own superuser.
    db:
      name: db
      namespace: [crest]
    # CREST's own credentials - the OpenAI key the service calls out with. Separate
    # from `db` above, which the postgresql chart's reconciler also reads. The value
    # lives in crest-lts-secrets.yaml under the same path; only the Secret name and
    # its namespaces are declared here.
    crest:
      name: crest
      namespace: [crest]
    kc-db: null
    kc-admin: null
    egov-notification-sms: null
    egov-notification-mail: null
    wordpress: null
    kafka-kraft: null
    hmac-secret: null
    minio: null
    vault-approle: null
# Per-service values, one section per chart. The ApplicationSet gives each service
# `global` plus its own section as the chart's root values (the charts read plain root
# values: .Values.image.tag, .Values.global). chart-version pins the published chart;
# image.tag is the running build (global.mode: dev makes the chart honour it).
# Keep BOTH services here -- one env file per environment, never a file per service.
crest:
  chart-version: "3.0.1"
  image:
    tag: "main-0c68b6e"
  # dev mode defaults the migration image to "latest"; pin it to the backend build.
  initContainers:
    dbMigration:
      image:
        tag: "main-0c68b6e"
  # Front the API with kong on the main domain: test-lts.digit.org/crest. hostName
  # overrides global.domain (crest-ui stays on the subdomain until its own move). The
  # backend ingress (crest ns) points at the local kong-proxy ExternalName the
  # gateway-sync reconciler creates; route + keycloak plugins come from the Service
  # annotations below. context crest -> path /crest and Service gateway/route-path crest.
  ingress:
    gateway: true
    hostName: test-lts.digit.org
    context: crest
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/upstream-vhost: test-lts.digit.org
      # The UI (crest.test-lts.digit.org) calls this API cross-origin with a bearer
      # token. The Ingress answers the CORS preflight itself, before kong, whose
      # dynamic-jwt would reject the token-less OPTIONS. Do not also add kong's cors
      # plugin: duplicate CORS headers make browsers reject the response.
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "https://crest.test-lts.digit.org"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, Accept"
      nginx.ingress.kubernetes.io/cors-max-age: "3600"
  service:
    additionalAnnotations: |
      gateway/route-auth: protected
  # Probes hit the pod directly; context-path /crest moves them under /crest.
  healthChecks:
    enabled: true
    livenessProbe: |
      httpGet:
        path: "/crest/health/liveness"
        port: {{ .Values.httpPort }}
      initialDelaySeconds: 30
      timeoutSeconds: 3
      periodSeconds: 60
      failureThreshold: 5
    readinessProbe: |
      httpGet:
        path: "/crest/health/readiness"
        port: {{ .Values.httpPort }}
      initialDelaySeconds: 30
      timeoutSeconds: 3
      periodSeconds: 30
      failureThreshold: 5
  # common merges extraEnv.app onto the chart's own `env` block by name, last wins, so
  # this adds the key without a chart release. Chart 3.0.1 declares no OpenAI env of its
  # own; move this into the chart's values once it does.
  extraEnv:
    app: |
      - name: CREST_OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: crest
            key: openai-api-key
      - name: SERVER_SERVLET_CONTEXT_PATH
        value: /crest
crest-ui:
  chart-version: "3.0.1"
  image:
    tag: "main-533cea7"
  # Serve the environment's settings at /config.js from egov-config (rendered by
  # cluster-configs above). subPath mounts do not follow ConfigMap edits: restart the
  # pod after changing config.js.
  extraVolumes: |
    - name: runtime-config
      configMap:
        name: egov-config
        items:
          - key: config.js
            path: config.js
  extraVolumeMounts: |
    - name: runtime-config
      mountPath: /usr/share/nginx/html/config.js
      subPath: config.js
      readOnly: true
