# ==========================================================================
#  API GATEWAY & IDENTITY
#  Kong gateway and Keycloak identity
# ==========================================================================

keycloak:  # Identity (Keycloak)
  replicas: 1
  ingress:
    enabled: true
    zuul: false
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod
  chart-version: '3.1.1'
  image:
    tag: 'keycloak-spi-custom-build-3348b03'

kong:  # API gateway (Kong)
  chart-version: 3.1.7
  fullnameOverride: kong-kong
  namespace: core-3-0
  initContainers:
    extraInitContainers: |
      - name: kong-migration
        image: {{ include "kong.image" (dict "Values" .Values "repository" .Values.image.repository "tag" .Values.image.tag) }}
        imagePullPolicy: IfNotPresent
        args:
        - -c
        - kong migrations bootstrap && kong migrations up && kong migrations finish
        command:
        - /bin/sh
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-host
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: db
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db
        - name: KONG_PG_DATABASE
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-name
  image:
    tag: 'master-154c0db'
  # Gateway-sync reconciler: watches annotated Services in these namespaces and
  # writes Kong routes/plugins. dryRun first (logs intended changes, writes nothing)
  # until the keycloak app realm + auth client are bootstrapped.
  gatewaySync:
    enabled: true
    dryRun: true
    domain: digit-3.unified-dev.digit.org
    kongAdminUrl: http://kong-kong-admin.core-3-0:8001
    keycloakBaseUrl: http://keycloak.core-3-0:8080/keycloak
    clientId: auth-server
    namespaces:
      - core-3-0
      - hcm-3-0

# ==========================================================================
#  BACKBONE
#  Datastores and secrets backing the module
# ==========================================================================

minio:  # Object storage (MinIO)
  chart-version: '3.5.0'
  fullnameOverride: minio
  persistence:
    size: 20Gi
    storageClass: managed-csi
  auth:
    existingSecret: minio
    existingSecretKeys:
      rootUser: rootUser
      rootPassword: rootPassword
  ingress:
    enabled: false

postgresql-18:  # In-cluster Postgres 18
  chart-version: '3.0.3'
  fullnameOverride: postgresql-18
  namespaceOverride: backbone-3-0
  cluster:
    instances: 1
    storage:
      size: 50Gi
      storageClass: managed-csi
    affinity:
      topologyKey: topology.kubernetes.io/zone
    monitoring:
      enabled: true
    enableSuperuserAccess: true
    superuserSecret: postgresql-18-superuser-db
    initdb:
      # owner MUST equal the username in postgresql-18-db; initdb runs ONCE.
      database: coredb
      owner: coredev
      secret:
        name: postgresql-18-db
    postgresql:
      extensions:
        - name: postgis
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-202611091303-18-trixie
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
  databases:
    - name: coredb
      owner: coredev
      extensions:
        - name: postgis
          version: "3.7.0"
  reconciler:
    enabled: false

vault:  # Secrets (Vault)
  chart-version: '3.0.1'
  global:
    namespace: backbone-3-0
  injector:
    enabled: false
  server:
    authDelegator:
      enabled: false
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: "cd751896-4e17-4521-a425-6daad4d7cbad"
    extraLabels:
      azure.workload.identity/use: "true"
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "raft" {
            path = "/vault/data"
          }
          seal "azurekeyvault" {
            tenant_id  = "593ce202-d1a9-4760-ba26-ae35417c00cb"
            vault_name = "unified-dev-sops-kv"
            key_name   = "vault-unseal"
          }
          service_registration "kubernetes" {}

# ==========================================================================
#  JOBS
#  Scheduled / one-off jobs
# ==========================================================================

# needs a cdc-audit vault-token secret, an ecdsa transit key, and postgres logical replication.
cdc-audit:  # CDC audit trail
  chart-version: '3.0.0'
  cdc-vault-base-url: "http://vault.backbone-3-0:8200"

employee-onboarding:  # Employee onboarding
  chart-version: '3.1.3'

localization-management:  # Localization management
  chart-version: '3.1.4'
# CDC audit trail. Vault transit signing points at the backbone-3-0 vault; it also
