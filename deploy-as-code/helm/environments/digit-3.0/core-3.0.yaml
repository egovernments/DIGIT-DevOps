# API gateway (chart kong, app digit3-kong). Unlike the DIGIT service charts it reads
# ROOT values, so Argo CD passes this section, minus chart-version, as the chart's
# values (layout root in the Kargo config). Kargo merges kong.chart-version and kong.image.tag.
kong:
  chart-version: 3.1.1
  # Service kong-kong-proxy: the backend of every zuul: true ingress.
  fullnameOverride: kong-kong
  namespace: core-3-0
  # The chart's kong-migration init container sets KONG_DATABASE from egov-config
  # db-name ("coredb"); Kong wants the database TYPE there ("postgres"), and the name in
  # KONG_PG_DATABASE. Same container as the chart's (kong 3.1.1), with that one fix.
  # Drop this override once the chart is fixed.
  initContainers:
    extraInitContainers: |
      - name: kong-migration
        image: {{ include "kong.image" (dict "Values" .Values "repository" .Values.image.repository "tag" .Values.image.tag) }}
        imagePullPolicy: IfNotPresent
        args:
        - -c
        - kong migrations bootstrap && kong migrations up && kong migrations finish
        command:
        - /bin/sh
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-host
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: db
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db
        - name: KONG_PG_DATABASE
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-name
  image:
    tag: 'master-154c0db'
# Keycloak (chart keycloak, app digit3-keycloak), a common-chart service like the ones
# above: it lands in global.namespace. Database URL from egov-config keycloak-db-url;
# the chart's db-init container creates that database and the kc-db role (as postgres,
# db/superuserPassword). Kargo merges keycloak.chart-version and keycloak.image.tag; the
# Application appears once chart-version exists.
keycloak:
  replicas: 1
  ingress:
    enabled: true
    zuul: false
    # cert-manager (ClusterIssuer letsencrypt-prod, HTTP-01) issues digit3.digit.org-tls-certs
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod
  chart-version: '3.0.0'
  image:
    tag: 'keycloak-spi-custom-build-3348b03'
# Vault (app digit3-vault) in the backbone-3-0 namespace -- egov-service-host's
# vault key points at vault.backbone-3-0:8200. Static git-path Application
# (argo-cd/unified-dev/digit-3.0/backbone-3.0/vault-application.yaml), NOT a Kargo
# service: backbone is non-promotable infra, so there is no chart-version here.
# Chart charts/backbone-services/vault, re-rooted to a nested vault: key, so Argo CD
# passes this section below as the chart's values.
#
# Raft storage + Azure Key Vault auto-unseal: the pod unseals itself from the KMS key on
# every restart (no manual `vault operator unseal`). Auth is Azure Workload Identity -- the
# server ServiceAccount is federated to the user-assigned identity below, so no client secret
# is stored. The identity, the federated credential and the key are created at cutover; set
# serviceAccount client-id then (tracked in DIGIT-DevOps#5762).
vault:
  global:
    namespace: backbone-3-0
  # Vault Agent injector not used: services read secrets via AppRole, not sidecar
  # injection. Disabling it drops the injector Deployment and its cluster-scoped
  # ClusterRole/ClusterRoleBinding, so backbone-3-0-project needs no cluster whitelist.
  injector:
    enabled: false
  server:
    # The auth-delegator ClusterRoleBinding is only for Kubernetes auth; services use
    # AppRole, and the backbone-3-0 AppProject allows no cluster-scoped objects.
    authDelegator:
      enabled: false
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: "SET-AT-CUTOVER"  # vault-kms-unseal MI (DIGIT-DevOps#5762)
    extraLabels:
      azure.workload.identity/use: "true"
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "raft" {
            path = "/vault/data"
          }
          seal "azurekeyvault" {
            tenant_id  = "593ce202-d1a9-4760-ba26-ae35417c00cb"
            vault_name = "unified-dev-sops-kv"
            key_name   = "vault-unseal"
          }
          service_registration "kubernetes" {}
# Namespace-scoped ConfigMaps/Secrets for this module, rendered by the cluster-configs
# chart (app core-3-0-cluster-configs). Every object pins namespace: [core-3-0] --
# the chart's defaults point at shared namespaces (egov, health, ...), and the
# core-3-0 AppProject only permits core-3-0, so a missing namespace fails the sync
# instead of touching another module. Secret VALUES live in core-3.0-secrets.yaml
# (SOPS, unified-dev Azure Key Vault).
cluster-configs:
  chart-version: 3.1.0
  namespaces:
    create: false # core-3-0 / backbone-3-0 are created by cluster-configs-unified-dev (namespaces.values)
  configmaps:
    egov-config:
      namespace: [core-3-0]
      data:
        # DIGIT 3.0 uses its own PostgreSQL 18 (CloudNativePG, backbone-3-0/postgresql-18),
        # database coredb -- never the DIGIT 2.x unified-dev-db.
        db-host: postgresql-18-rw.backbone-3-0
        db-name: coredb
        db-url: jdbc:postgresql://postgresql-18-rw.backbone-3-0:5432/coredb
        flyway-locations: filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa
        kafka-brokers: kafka-kraft-controller-headless.backbone:9092
        timezone: Asia/Kolkata
        egov-services-fqdn-name: https://digit3.digit.org/
        # Keycloak's own database on the same server; its db-init container creates
        # it (and the kc-db role) before Keycloak starts.
        keycloak-db-url: jdbc:postgresql://postgresql-18-rw.backbone-3-0:5432/keycloak
        # account, employee. The chart default (keycloak.keycloak.svc) is not this
        # module's Keycloak: app digit3-keycloak serves under KC_HTTP_RELATIVE_PATH /keycloak.
        keycloak-base-url: http://keycloak.core-3-0:8080/keycloak
        # mdms-v2 (same values as DIGIT 2.x on unified-dev)
        server-tomcat-max-connections: "500"
        server-tomcat-max-threads: "10"
        spring-datasource-tomcat-initialSize: "1"
        spring-datasource-tomcat-max-active: "2"
        spring-jpa-show-sql: "true"
        # Read by the 3.1.1 service charts (redis: boundary-management, employee,
        # filestore, idgen, individual, localization, notify, otp, registry,
        # url-shortener, workflow; smtp/mail: account, notification; otel: apportion,
        # pg-service, template-config). Same values as the cluster-configs 3.1.1
        # defaults, set here so they apply whatever cluster-configs version is promoted.
        redis-host: redis.backbone
        redis-port: "6379"
        redis-address: redis.backbone:6379
        otel-tracing-export-otlp-endpoint: http://open-telemetry-opentelemetry-collector.monitoring:4318/v1/traces
        smtp-host: smtp.gmail.com
        smtp-port: "587"
        mail-sender-name: eGov Foundation
        sms-provider-url: http://api.smscountry.com/SMSCwebservice_bulk.aspx
        platform-tenant: default
    # Internal service URLs. Every DIGIT 3.0 service is <name>:8080 in core-3-0; the
    # *-java keys (boundary-management) point at the DIGIT 3.0 services of that name.
    egov-service-host:
      namespace: [core-3-0]
      data:
        # account, boundary-management, employee, notify, pg-service, url-shortener and
        # workflow: added by cluster-configs 3.1.1 with 2.x egov-namespace defaults
        # (account.egov, ...); these are the DIGIT 3.0 services in core-3-0.
        account: http://account.core-3-0:8080/
        apportion: http://apportion.core-3-0:8080/
        billing: http://billing.core-3-0:8080/
        boundary: http://boundary.core-3-0:8080/
        boundary-java: http://boundary.core-3-0:8080/
        boundary-management: http://boundary-management.core-3-0:8080/
        employee: http://employee.core-3-0:8080/
        filestore: http://filestore.core-3-0:8080/
        filestore-java: http://filestore.core-3-0:8080/
        idgen: http://idgen.core-3-0:8080/
        individual: http://individual.core-3-0:8080/
        # cluster-configs 3.1.0 adds localization, defaulting to the 2.x egov namespace.
        localization: http://localization.core-3-0:8080/
        localization-java: http://localization.core-3-0:8080/
        mdms-v2: http://mdms-v2.core-3-0:8080/
        notification: http://notification.core-3-0:8080/
        notify: http://notify.core-3-0:8080/
        otp: http://otp.core-3-0:8080/
        pg-service: http://pg-service.core-3-0:8080/
        registry: http://registry.core-3-0:8080/
        template-config: http://template-config.core-3-0:8080/
        url-shortener: http://url-shortener.core-3-0:8080/
        workflow: http://workflow.core-3-0:8080/
        vault: http://vault.backbone-3-0:8200/
  secrets:
    db:
      namespace: [core-3-0] # username/password/flyway-*/superuserPassword
    minio:
      namespace: [core-3-0] # accesskey/secretkey/rootUser/rootPassword
    docker-registry-secret:
      namespace: [core-3-0] # dockerconfigjson
    egov-notification-mail:
      namespace: [core-3-0] # mailsenderusername/-password (account, notification)
    egov-notification-sms:
      namespace: [core-3-0] # username/password (notification)
    # Keycloak: admin account and the clients account/employee use.
    kc-admin:
      namespace: [core-3-0] # username/password (account, keycloak)
    kc-db:
      namespace: [core-3-0] # username/password: keycloak's role on postgresql-18
    employee-iam-secret:
      namespace: [core-3-0] # employee-iam-client-secret (account, employee)
    citizen-broker-secret:
      namespace: [core-3-0] # citizen-broker-client-secret (account)
    # AppRole unified-dev-core-3-0 (policy unified-dev-core-3-0-transit) on vault.backbone-3-0
    vault-approle:
      namespace: [core-3-0] # role-id/secret-id (otp, individual)
    hmac-secret:
      namespace: [core-3-0] # hmac-secret (otp, individual blind-index hashes)
    # PostgreSQL 18 (CloudNativePG) credentials, rendered into backbone-3-0 where the
    # database runs: postgresql-18-db (owner coredev, bootstrap) + postgresql-18-superuser-db.
    postgresql-18:
      name: postgresql-18-db
      superuserName: postgresql-18-superuser-db
      namespace: [backbone-3-0] # username/password/superuserPassword

# PostgreSQL 18 (CloudNativePG). Overrides charts/backbone-services/postgresql-18.
postgresql-18:
  # DIGIT 3.0's own database namespace (the chart default is the shared `backbone`).
  namespace: backbone-3-0
  # Single instance: this node pool is tight -- a node recently sat at 103% CPU
  # and restart-looped every Java service on it. Raise to 3 once three
  # schedulable nodes have headroom; that is what buys automated failover.
  instances: 1
  storage:
    size: 50Gi
    # Azure managed disk. The chart default is empty (cluster default class),
    # named here so it cannot move if the default-class annotation is changed.
    storageClass: managed-csi
  affinity:
    # AKS labels nodes with zone, so replicas spread across availability zones
    # rather than merely across nodes. The chart defaults to hostname because
    # on-prem clusters have no zone labels.
    topologyKey: topology.kubernetes.io/zone
  monitoring:
    # kube-prometheus-stack is installed here, so the PodMonitor CRD exists.
    enabled: true
  bootstrap:
    # owner MUST equal the `username` in the postgresql-18-db secret
    # (cluster-configs.secrets.postgresql-18.username). If they differ, the
    # database is created owned by a role those credentials cannot authenticate
    # as -- and because initdb runs ONCE, it cannot be corrected without
    # recreating the cluster.
    owner: coredev
    database: coredb

  auth:
    # Secrets rendered by cluster-configs from unified-dev-secrets.yaml
    # (cluster-configs.secrets.postgresql-18). Without these the operator
    # generates its own random passwords instead.
    existingSecret: postgresql-18-db
    superuserSecret: postgresql-18-superuser-db
  postgresql:
    # PostGIS for digit3 boundary (migration V20260818120000 adds a geometry
    # column). Mounted as an image volume; the PostgreSQL image is unchanged.
    # Pinned to a dated build: the plain 3.7.0-18-trixie tag is rebuilt in place.
    # GDAL_DATA/PROJ_DATA use ${image_root} (CloudNativePG 1.29+).
    extensions:
      - name: postgis
        image:
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-202611091303-18-trixie
        ld_library_path:
          - system
        env:
          - name: GDAL_DATA
            value: ${image_root}/share/gdal
          - name: PROJ_DATA
            value: ${image_root}/share/proj
  # coredb is the bootstrap database (adopted, not recreated). The operator
  # creates postgis as superuser; the boundary migration runs as coredev, which
  # may not, and its CREATE EXTENSION IF NOT EXISTS then finds it present.
  databases:
    - name: coredb
      owner: coredev
      extensions:
        - name: postgis
          version: "3.7.0"
