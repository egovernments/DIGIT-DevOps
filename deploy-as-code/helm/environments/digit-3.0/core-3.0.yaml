mdms-v2:
  extraEnv:
    app: |
      - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: otel-tracing-export-otlp-endpoint
  initContainers:
    dbMigration:
      enabled: true
      image:
        tag: 'master-154c0db'
  replicas: 1
  ingress:
    enabled: true
    zuul: true
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod
  chart-version: '3.1.4'
  image:
    tag: 'master-154c0db'
kong:
  chart-version: 3.1.7
  fullnameOverride: kong-kong
  namespace: core-3-0
  initContainers:
    extraInitContainers: |
      - name: kong-migration
        image: {{ include "kong.image" (dict "Values" .Values "repository" .Values.image.repository "tag" .Values.image.tag) }}
        imagePullPolicy: IfNotPresent
        args:
        - -c
        - kong migrations bootstrap && kong migrations up && kong migrations finish
        command:
        - /bin/sh
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-host
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: db
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db
        - name: KONG_PG_DATABASE
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-name
  image:
    tag: 'master-154c0db'
keycloak:
  replicas: 1
  ingress:
    enabled: true
    zuul: false
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod
  chart-version: '3.1.0'
  image:
    tag: 'keycloak-spi-custom-build-3348b03'
vault:
  chart-version: '3.0.1'
  global:
    namespace: backbone-3-0
  injector:
    enabled: false
  server:
    authDelegator:
      enabled: false
    serviceAccount:
      annotations:
        azure.workload.identity/client-id: "cd751896-4e17-4521-a425-6daad4d7cbad"
    extraLabels:
      azure.workload.identity/use: "true"
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "raft" {
            path = "/vault/data"
          }
          seal "azurekeyvault" {
            tenant_id  = "593ce202-d1a9-4760-ba26-ae35417c00cb"
            vault_name = "unified-dev-sops-kv"
            key_name   = "vault-unseal"
          }
          service_registration "kubernetes" {}
cluster-configs:
  chart-version: 3.1.1
  namespaces:
    create: false
  configmaps:
    egov-config:
      namespace: [core-3-0]
      data:
        db-host: postgresql-18-rw.backbone-3-0
        db-name: coredb
        db-url: jdbc:postgresql://postgresql-18-rw.backbone-3-0:5432/coredb
        flyway-locations: filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa
        kafka-brokers: kafka-kraft-controller-headless.backbone:9092
        timezone: Asia/Kolkata
        egov-services-fqdn-name: https://digit-3.unified-dev.digit.org/
        keycloak-db-url: jdbc:postgresql://postgresql-18-rw.backbone-3-0:5432/keycloak
        keycloak-base-url: http://keycloak.core-3-0:8080/keycloak
        server-tomcat-max-connections: "500"
        server-tomcat-max-threads: "10"
        spring-datasource-tomcat-initialSize: "1"
        spring-datasource-tomcat-max-active: "2"
        spring-jpa-show-sql: "true"
        redis-host: redis.backbone
        redis-port: "6379"
        redis-address: redis.backbone:6379
        otel-tracing-export-otlp-endpoint: http://open-telemetry-opentelemetry-collector.monitoring:4318/v1/traces
        smtp-host: smtp.gmail.com
        smtp-port: "587"
        mail-sender-name: eGov Foundation
        sms-provider-url: http://api.smscountry.com/SMSCwebservice_bulk.aspx
        platform-tenant: default
    egov-service-host:
      namespace: [core-3-0]
      data:
        account: http://account.core-3-0:8080/
        apportion: http://apportion.core-3-0:8080/
        billing: http://billing.core-3-0:8080/
        boundary: http://boundary.core-3-0:8080/
        boundary-java: http://boundary.core-3-0:8080/
        boundary-management: http://boundary-management.core-3-0:8080/
        employee: http://employee.core-3-0:8080/
        filestore: http://filestore.core-3-0:8080/
        filestore-java: http://filestore.core-3-0:8080/
        idgen: http://idgen.core-3-0:8080/
        individual: http://individual.core-3-0:8080/
        localization: http://localization.core-3-0:8080/
        localization-java: http://localization.core-3-0:8080/
        mdms-v2: http://mdms-v2.core-3-0:8080/
        notification: http://notification.core-3-0:8080/
        notify: http://notify.core-3-0:8080/
        otp: http://otp.core-3-0:8080/
        pg-service: http://pg-service.core-3-0:8080/
        registry: http://registry.core-3-0:8080/
        template-config: http://template-config.core-3-0:8080/
        url-shortener: http://url-shortener.core-3-0:8080/
        workflow: http://workflow.core-3-0:8080/
        vault: http://vault.backbone-3-0:8200/
  secrets:
    db:
      namespace: [core-3-0]
    minio:
      namespace: [core-3-0]
    docker-registry-secret:
      namespace: [core-3-0]
    egov-notification-mail:
      namespace: [core-3-0]
    egov-notification-sms:
      namespace: [core-3-0]
    kc-admin:
      namespace: [core-3-0]
    kc-db:
      namespace: [core-3-0]
    employee-iam-secret:
      namespace: [core-3-0]
    citizen-broker-secret:
      namespace: [core-3-0]
    vault-approle:
      namespace: [core-3-0]
    hmac-secret:
      namespace: [core-3-0]
    postgresql-18:
      name: postgresql-18-db
      namespace: [backbone-3-0]
    # CNPG superuser (postgres) secret; keycloak db-init connects as postgres with this.
    postgresql-18-superuser:
      name: postgresql-18-superuser-db
      type: kubernetes.io/basic-auth
      namespace: [backbone-3-0]
postgresql-18:
  chart-version: '3.0.3'
  fullnameOverride: postgresql-18
  namespaceOverride: backbone-3-0
  cluster:
    instances: 1
    storage:
      size: 50Gi
      storageClass: managed-csi
    affinity:
      topologyKey: topology.kubernetes.io/zone
    monitoring:
      enabled: true
    enableSuperuserAccess: true
    superuserSecret: postgresql-18-superuser-db
    initdb:
      # owner MUST equal the username in postgresql-18-db; initdb runs ONCE.
      database: coredb
      owner: coredev
      secret:
        name: postgresql-18-db
    postgresql:
      extensions:
        - name: postgis
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-202611091303-18-trixie
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
  databases:
    - name: coredb
      owner: coredev
      extensions:
        - name: postgis
          version: "3.7.0"
  reconciler:
    enabled: false
