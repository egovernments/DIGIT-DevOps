# DIGIT Studio on the digit-lts AKS cluster (domain test-lts.digit.org).
# Based on unified-studio-qa.yaml (unified-qa branch). Environment values (database,
# Kafka, Elasticsearch, domain) are the live digit-lts ones from test-lts.yaml.
#
# Not deployed yet: no AppProject or ApplicationSet reads this file. Like unified-qa,
# the module's ConfigMaps/Secrets are meant for their own cluster-configs Application
# (values.yaml + this file + digit-studio-lts-secrets.yaml), never layered onto
# test-lts.yaml: egov-config here would replace egov's.
#
# Differences from unified-qa:
#   - no global.localGateway / cluster-configs.gateway-alias: digit-lts's common and
#     cluster-configs charts do not support them, so Ingresses render into
#     ingress.namespace (egov), like every other digit-lts service.
#   - egov-service-host still points at the DIGIT 2.x services in egov (egov-user,
#     mdms-v2, workflow-v2, persister, ...). Most of them are NOT running on digit-lts.
global:
   domain: test-lts.digit.org ## Add your Domain Name "Eg: site.mydomain.com" Do not use the dummy domain
   setup: fullsetup

cluster-configs:
  # Rendered by its own cluster-configs Application (with the chart's values.yaml), so
  # everything here must stay in namespace studio: the cluster-wide RBAC and the root
  # ingress belong to digit-lts-cluster-configs, and these chart defaults (other
  # namespaces, values only in test-lts-secrets.yaml) are switched off.
  cluster-roles:
    enabled: false
  root-ingress: null
  namespaces:  
    create: true
    values: [ studio ]
      
  configmaps:
    # Also in health: the Studio dependencies beneficiary-idgen and
    # health-service-request run there. (Namespace health itself belongs to
    # digit-lts-cluster-configs, so namespaces.values stays [ studio ].)
    egov-config:
      namespace: [ studio, health ]
      data:
        # digit-lts database (same server and database as test-lts.yaml); studio tables
        # live in schema studio.
        db-host: postgres.egov
        db-name: postgres
        db-url: jdbc:postgresql://postgres.egov:5432/postgres
        db-url-no-schema: "jdbc:postgresql://postgres.egov:5432/postgres"
        studio-db-url: jdbc:postgresql://postgres.egov:5432/postgres?currentSchema=studio
        studio-db-url-no-schema: "jdbc:postgresql://postgres.egov:5432/postgres"
        health-db-url: jdbc:postgresql://postgres.egov:5432/postgres?currentSchema=health
        domain: "https://test-lts.digit.org"
        egov-services-fqdn-name: "https://test-lts.digit.org/"
        state-level-tenantid-length: "2"
        state-schema-index-position-tenantid: "1"
        is-environment-central-instance: "false"
        egov-state-level-tenant-id: "pg" 
        s3-assets-bucket: "(pg-egov-assets|egov-playground-assets)"
        es-host: "elasticsearch-data.backbone"
        es-indexer-host: "http://elasticsearch-data.backbone:9200/"
        flyway-locations: "filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa"
        kafka-brokers: release-name-kafka-controller-headless.backbone:9092
        kafka-infra-brokers: kafka-v2-infra.kafka-cluster:9092
        logging-level-jdbc: "DEBUG"
        mobile-validation-workaround: "true"
        serializers-timezone-in-ist: "true"
        server-tomcat-max-connections: "500"
        server-tomcat-max-threads: "10"
        sms-enabled: "true"
        spring-datasource-tomcat-initialSize: "1"
        spring-datasource-tomcat-max-active: "2"
        spring-jpa-show-sql: "true"
        sms-isAdditonalFieldRequired: true
        timezone: Asia/Kolkata
        tracer-errors-provideexceptionindetails: "true"
        egov-bnd-freedownload-tenants: "pg.testing"
        egov-bnd-live-citizen-tenants: "pg.testing"
        kibana-base-path: kibana-upgrade 
        kibana-host: "http://kibana-v1.es-upgrade:5601/"
        egov-internal-microservice-user-uuid: 4fef6612-07a8-4751-97e9-0e0ac0687ebe

    egov-service-host:
      namespace: [ studio, health ]
      data:
        studio-pdf-helper-service: "http://studio-pdf-helper-service.studio:8080/"
        keycloak: "http://keycloak.keycloak:8080/"
