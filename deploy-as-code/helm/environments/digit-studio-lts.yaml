digit-studio:
  namespace: studio
  resources: |
    limits:
      cpu: "100m"
      memory: "256Mi"
    requests:
      cpu: "30m"
      memory: "100Mi"
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://egov-dev-assets.s3.ap-south-1.amazonaws.com/analytics/analytics.js type=text/javascript async></script>     
      <script src=https://egov-dev-assets.s3.ap-south-1.amazonaws.com/globalConfigsStudioQA.js type=text/javascript></script>
      ';"

  image:
    tag: studio-develop-dev-f9b92fd-2097
public-service:
  # postgres.egov has no SSL (unified-qa's Azure database does).
  db-sslmode: disable
  replicas: 1
  namespace: studio
  heap: '-Xmx256m -Xms118m'
  memory_limits: 512Mi
  mdms-search-enpoint: "mdms-v2/v1/_search"
  mdms-search-v2-endpoint: "mdms-v2/v2"
  mdms-v2-search-endpoint: "mdms-v2/v2/_search"
  mdms-v2-create-endpoint: "mdms-v2/v2/_create"
  mdms-service-host: "http://mdms-v2.egov:8080/"
  mdms-v2-update-endpoint: "mdms-v2/v2/_update"
  auto-escalation-system-user-uuid: "069bcd98-8ee2-4a60-9a44-9716da096527"

  image:
    tag: studio-java-migration-4ae788c
  initContainers:
    dbMigration:
      image:
        tag: studio-java-migration-4ae788c
public-service-init:
  # postgres.egov has no SSL (unified-qa's Azure database does).
  db-sslmode: disable
  replicas: 1
  namespace: studio
  heap: '-Xmx256m -Xms118m'
  memory_limits: 512Mi
  mdms-search-enpoint: "mdms-v2/v1/_search"
  mdms-search-v2-endpoint: "mdms-v2/v2"
  mdms-v2-search-endpoint: "mdms-v2/v2/_search"
  mdms-v2-create-endpoint: "mdms-v2/v2/_create"
  mdms-service-host: "http://mdms-v2.egov:8080/"
  mdms-v2-update-endpoint: "mdms-v2/v2/_update"
  # Schema per tenant (as notify on digit-lts): a tenant's schema is created and
  # migrated when account-java publishes account-migration. Tenants that existed
  # before this (e.g. STUDIO) need one in-cluster POST /internal/migrate each.
  tenant-migration-enabled: true
  keycloak-client-secret:
    name: studio-keycloak
    key: client-secret
  healthChecks:
    enabled: true
    livenessProbePath: /health/liveness
    readinessProbePath: /health/readiness

  image:
    tag: studio-digit3-migration-078addb
  initContainers:
    dbMigration:
      image:
        tag: studio-digit3-migration-078addb
studio-pdf:
  namespace: studio
  resources: |
    limits:
      cpu: "100m"
      memory: "512Mi"
    requests:
      cpu: "50m"
      memory: "256Mi"

  image:
    tag: studio-dynamic-dashboard-backend-353d7fd
studio-pdf-helper-service:
  # postgres.egov has no SSL (unified-qa's Azure database does).
  db-sslmode: disable
  namespace: studio
  # The helper commits pdf-service config to egovernments/configs (this branch) and to
  # DIGIT-DevOps (branch + file below), then restarts pdf-service in egov through the
  # Kubernetes API in secret github-config. egovernments/configs has no DIGIT-LTS branch
  # yet; it must be created before this service runs.
  github-config-branch: "DIGIT-LTS"
  github-devops-file-path: "deploy-as-code/helm/environments/test-lts.yaml"
  github-devops-branch: "digit-lts"
  resources: |
    limits:
      cpu: "100m"
      memory: "512Mi"
    requests:
      cpu: "50m"
      memory: "256Mi"

  image:
    tag: java-migration-5bd1009
  initContainers:
    dbMigration:
      image:
        tag: java-migration-5bd1009
studio-calculator-service:
  replicas: 1
  namespace: studio
  memory_limits: 256Mi
  image:
    tag: java-migration-5bd1009
  resources: |
    limits:
      cpu: "200m"
      memory: "512Mi"
    requests:
      cpu: "50m"
      memory: "256Mi"
studio-hrms:
  # digit-lts mdms-v2 serves under /mdms-v2 (unified-qa runs it as /egov-mdms-service).
  mdmsV1SearchEndpoint: "/mdms-v2/v1/_search"
  mdmsLegacySearchPath: "mdms-v2/v1/_search"
  image:
    tag: develop-df51598
  initContainers:
    dbMigration:
      image:
        tag: develop-df51598
        namespace: studio
  heap: "-Xmx256m -Xms256m"
  memory_limits: "512Mi"
  cpu_limits: "200m"
  tracing-enabled: true

studio-individual:
  mdmsV1SearchEndpoint: "/mdms-v2/v1/_search"
  image:
    tag: studio-dynamic-dashboard-backend-f283291
  initContainers:
    dbMigration:
      image:
        tag: studio-dynamic-dashboard-backend-f283291
  namespace: studio
  heap: "-Xmx256m -Xms256m"
  memory_limits: 512Mi
  tracing-enabled: true
  java-enable-debug: true
  aadhaar-pattern: "\\d{12}"
  mobile-pattern: "\\d+"
  notification-sms-disabled-roles: "ORG_ADMIN"
  egov-boundary-hierarchy: ADMIN
  kafka-mdc-enabled: "true"

studio-service-request:
  mdmsV1SearchEndpoint: "/mdms-v2/v1/_search"
  image:
    tag: studio-dynamic-dashboard-backend-44ee338
  initContainers:
    dbMigration:
      image:
        tag: studio-dynamic-dashboard-backend-44ee338
  namespace: studio
  heap: "-Xmx320m -Xms256m"
  memory_limits: "512Mi"
  cpu_limits: "200m"

studio-user-otp:
  # The existing digit-lts otp service (Deployment otp-java), not 2.x egov-otp.
  otp-host: "http://otp-java.egov:8080/otp"
  image:
    tag: studio-dynamic-dashboard-backend-76cd340
  namespace: studio
  heap: "-Xmx192m -Xms192m"
  memory_limits: "512Mi"
  cpu_limits: "200m"
  tracing-enabled: true

# Health services Studio depends on (namespace health, ApplicationSet
# digit-lts-studio-appset-health). From unified-health-qa.yaml (unified-qa branch);
# mdms path for digit-lts mdms-v2 (/mdms-v2).
beneficiary-idgen:
  namespace: health
  image:
    tag: master-perf-2d35084
  initContainers:
    dbMigration:
      image:
        tag: master-perf-2d35084
  idformat-from-mdms: "true"
  java-args: -Dspring.profiles.active=monitoring
  autocreate-new-seq: "true"
  egov-mdms-service-host-key: "mdms-service-v2"
  egov-mdms-service-endpoint-key: "mdms-v2/v1/_search"
  redis-ttl-in-days: 1
  java-enable-debug: true
  limit-id-user-device-per-day-enabled: "true"
  limit-id-user-device-per-day: 100
  limit-id-user-device-total: 6000
  limit-id-user-device-per-day-expire-days: 10
  limit-id-user-device-total-expire-days: 30
  id-pool-generation-max-records-per-persist-batch: 100
  id-pool-generation-max-size: 20000
  id-dispatch-retrieval-limit-to-today-enabled: "true"
  kafka-topics-consumer-bulk-update-topic: "beneficiary-id-gen-bulk-update-health-topic"
  kafka-topics-consumer-bulk-create-topic: "beneficiary-id-gen-bulk-create-health-topic"
  kafka:
    topics:
      saveInIdPool: "save-in-id-pool"
      updateIdPoolStatus: "update-id-pool-status"
      saveInDispatchLog: "save-dispatch-id-log"
  spring:
    redis:
      host: "redis.backbone"
      port: 6379
      cache:
        type: "redis"
        timeToLive: 86400
        autoExpiry: true
  redisson:
    redis:
      host: "redis.backbone"
      port: 6379
      timeout: 10000
      connectionPoolSize: 20
      connectionMinimumIdleSize: 10
      threads: 4
      nettyThreads: 4
  idPool:
    validation:
      enabled: true
    create:
      maxBatchSize: 500
  idgen:
    pool:
      seqCode: "id.pool.number.random"
    random:
      buffer: 5
  heap: "-Xmx768m -Xms256m"
  memory_limits: "1Gi"
  cpu_limits: "300m"

health-service-request:
  namespace: health
  image:
    tag: master-product-2.2-d6ca977
  initContainers:
    dbMigration:
      image:
        tag: master-product-2.2-d6ca977
  central-instance-name: health
  central-instance-build: true
  central-instance-enabled: false
  db-schema-names: "kano,kebbi"
  heap: "-Xmx512m -Xms512m"
  memory_limits: 1024Mi
