# cert-manager -- k3s-deployment (single-node k3s) overlay
#
# Third value file of backbone-cert-manager, after the chart's values.yaml and
# environments/k3s-deployment.yaml.

global:
  leaderElection:
    # The chart default, kube-system, renders a Role/RoleBinding pair there
    # for both cert-manager and cainjector. backbone-project does not permit
    # kube-system, so keep the lease in the release namespace instead.
    namespace: egov

# HTTP-01 issuance for k3s-deployment.digit.org needs the DNS record pointing
# at the VM and port 80 open to the internet in the VM's NSG.
