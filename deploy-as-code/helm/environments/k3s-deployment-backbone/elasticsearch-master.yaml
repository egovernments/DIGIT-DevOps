# elasticsearch-master -- k3s-deployment (single-node k3s) overlay
#
# Third value file of backbone-elasticsearch-master, after the chart's
# values.yaml and environments/k3s-deployment.yaml.

# The chart's 3 replicas with antiAffinity "hard" leave 2 of 3 pods Pending
# forever on one node, and a 3-node initial_master_nodes list never elects a
# master. One master-eligible node: the chart then renders
# cluster.initial_master_nodes=elasticsearch-master-0.
replicas: 1
minimumMasterNodes: 1
antiAffinity: soft

volumeClaimTemplate:
  storageClassName: local-path
