# ingress-nginx -- k3s-deployment (single-node k3s) overlay
#
# Third value file of backbone-ingress-nginx, after the chart's values.yaml and
# environments/k3s-deployment.yaml.
#
# Intentionally no overrides. The chart's defaults already fit:
#   - controller.service.type LoadBalancer is served by k3s ServiceLB, which
#     binds :80/:443 on the node (Traefik is disabled on this VM).
#   - namespaceOverride egov matches the prometheus scrape target
#     ingress-nginx-controller-metrics.egov:10254.
