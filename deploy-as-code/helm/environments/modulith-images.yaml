# Image pins for the INDIVIDUAL-SERVICES deployment (demo 1) — modulith-branch
# builds of every per-service chart. Passed as an extra values file on each
# helm command; keys are chart names because common.name merges the chart-name
# block over the top-level values (so these win over any stale pins in
# azure-k3s.yaml). Charts default to egovio/<chart>-java images that were
# never published for this branch — the published repos drop the -java suffix.

idgen-java:
  image:
    repository: "idgen"
    tag: "modulith-c45279f"
  initContainers:
    dbMigration:
      image:
        repository: "idgen-db"
        tag: "modulith-c45279f"

