# API gateway (chart kong, app digit3-kong). Unlike the DIGIT service charts it reads
# ROOT values, so Argo CD passes this section, minus chart-version, as the chart's
# values (layout root in the Kargo config). Kargo merges kong.chart-version and kong.image.tag.
kong:
  chart-version: 3.1.1
  # Service kong-kong-proxy: the backend of every zuul: true ingress.
  fullnameOverride: kong-kong
  namespace: digit3-core
  # The chart's kong-migration init container sets KONG_DATABASE from egov-config
  # db-name ("coredb"); Kong wants the database TYPE there ("postgres"), and the name in
  # KONG_PG_DATABASE. Same container as the chart's (kong 3.1.1), with that one fix.
  # Drop this override once the chart is fixed.
  initContainers:
    extraInitContainers: |
      - name: kong-migration
        image: {{ include "kong.image" (dict "Values" .Values "repository" .Values.image.repository "tag" .Values.image.tag) }}
        imagePullPolicy: IfNotPresent
        args:
        - -c
        - kong migrations bootstrap && kong migrations up && kong migrations finish
        command:
        - /bin/sh
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_HOST
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-host
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: db
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db
        - name: KONG_PG_DATABASE
          valueFrom:
            configMapKeyRef:
              name: egov-config
              key: db-name
  image:
    tag: 'master-154c0db'
# Keycloak (chart keycloak, app digit3-keycloak), a common-chart service like the ones
# above: it lands in global.namespace. Database URL from egov-config keycloak-db-url;
# the chart's db-init container creates that database and the kc-db role (as postgres,
# db/superuserPassword). Kargo merges keycloak.chart-version and keycloak.image.tag; the
# Application appears once chart-version exists.
keycloak:
  replicas: 1
  ingress:
    enabled: true
    zuul: false
    # cert-manager (ClusterIssuer letsencrypt-prod, HTTP-01) issues digit3.digit.org-tls-certs
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod
  chart-version: '3.0.0'
  image:
    tag: 'keycloak-spi-custom-build-3348b03'
# Vault (chart vault, app digit3-vault) in its own namespace, vault -- egov-service-host's
# vault key points at vault.vault:8200. The HashiCorp chart reads ROOT values, so Argo CD
# passes this section, minus chart-version, as the chart's values (layout root, namespace
# vault in the Kargo config). Kargo merges vault.chart-version; the Application waits for
# it like keycloak.
# Chart from https://helm.digit.org/digit3/backbone (kargo vault.chartRepo).
vault:
  global:
    namespace: vault
  server:
    # The auth-delegator ClusterRoleBinding is only for Kubernetes auth; services use
    # AppRole, and the digit3-core AppProject allows no cluster-scoped objects.
    authDelegator:
      enabled: false
    ha:
      replicas: 1
  chart-version: '3.0.1'
# Namespace-scoped ConfigMaps/Secrets for this module, rendered by the cluster-configs
# chart (app digit3-core-cluster-configs). Every object pins namespace: [digit3-core] --
# the chart's defaults point at shared namespaces (egov, health, ...), and the
# digit3-core AppProject only permits digit3-core, so a missing namespace fails the sync
# instead of touching another module. Secret VALUES live in unified-digit3-core-dev-secrets.yaml
# (SOPS, unified-dev Azure Key Vault).
cluster-configs:
  chart-version: 3.1.0
  namespaces:
    create: false # digit3-core is created by cluster-configs-unified-dev
  configmaps:
    egov-config:
      namespace: [digit3-core]
      data:
        # DIGIT 3.0 uses its own PostgreSQL 18 (CloudNativePG, backbone/postgresql-18),
        # database coredb -- never the DIGIT 2.x unified-dev-db.
        db-host: postgresql-18-rw.backbone
        db-name: coredb
        db-url: jdbc:postgresql://postgresql-18-rw.backbone:5432/coredb
        flyway-locations: filesystem:/flyway/sql,filesystem:/flyway/seed,filesystem:/flyway/qa
        kafka-brokers: kafka-kraft-controller-headless.backbone:9092
        timezone: Asia/Kolkata
        egov-services-fqdn-name: https://digit3.digit.org/
        # Keycloak's own database on the same server; its db-init container creates
        # it (and the kc-db role) before Keycloak starts.
        keycloak-db-url: jdbc:postgresql://postgresql-18-rw.backbone:5432/keycloak
        # account, employee. The chart default (keycloak.keycloak.svc) is not this
        # module's Keycloak: app digit3-keycloak serves under KC_HTTP_RELATIVE_PATH /keycloak.
        keycloak-base-url: http://keycloak.digit3-core:8080/keycloak
        # mdms-v2 (same values as DIGIT 2.x on unified-dev)
        server-tomcat-max-connections: "500"
        server-tomcat-max-threads: "10"
        spring-datasource-tomcat-initialSize: "1"
        spring-datasource-tomcat-max-active: "2"
        spring-jpa-show-sql: "true"
        # Read by the 3.1.1 service charts (redis: boundary-management, employee,
        # filestore, idgen, individual, localization, notify, otp, registry,
        # url-shortener, workflow; smtp/mail: account, notification; otel: apportion,
        # pg-service, template-config). Same values as the cluster-configs 3.1.1
        # defaults, set here so they apply whatever cluster-configs version is promoted.
        redis-host: redis.backbone
        redis-port: "6379"
        redis-address: redis.backbone:6379
        otel-tracing-export-otlp-endpoint: http://open-telemetry-opentelemetry-collector.monitoring:4318/v1/traces
        smtp-host: smtp.gmail.com
        smtp-port: "587"
        mail-sender-name: eGov Foundation
        sms-provider-url: http://api.smscountry.com/SMSCwebservice_bulk.aspx
        platform-tenant: default
    # Internal service URLs. Every DIGIT 3.0 service is <name>:8080 in digit3-core; the
    # *-java keys (boundary-management) point at the DIGIT 3.0 services of that name.
    egov-service-host:
      namespace: [digit3-core]
      data:
        # account, boundary-management, employee, notify, pg-service, url-shortener and
        # workflow: added by cluster-configs 3.1.1 with 2.x egov-namespace defaults
        # (account.egov, ...); these are the DIGIT 3.0 services in digit3-core.
        account: http://account.digit3-core:8080/
        apportion: http://apportion.digit3-core:8080/
        billing: http://billing.digit3-core:8080/
        boundary: http://boundary.digit3-core:8080/
        boundary-java: http://boundary.digit3-core:8080/
        boundary-management: http://boundary-management.digit3-core:8080/
        employee: http://employee.digit3-core:8080/
        filestore: http://filestore.digit3-core:8080/
        filestore-java: http://filestore.digit3-core:8080/
        idgen: http://idgen.digit3-core:8080/
        individual: http://individual.digit3-core:8080/
        # cluster-configs 3.1.0 adds localization, defaulting to the 2.x egov namespace.
        localization: http://localization.digit3-core:8080/
        localization-java: http://localization.digit3-core:8080/
        mdms-v2: http://mdms-v2.digit3-core:8080/
        notification: http://notification.digit3-core:8080/
        notify: http://notify.digit3-core:8080/
        otp: http://otp.digit3-core:8080/
        pg-service: http://pg-service.digit3-core:8080/
        registry: http://registry.digit3-core:8080/
        template-config: http://template-config.digit3-core:8080/
        url-shortener: http://url-shortener.digit3-core:8080/
        workflow: http://workflow.digit3-core:8080/
        vault: http://vault.vault:8200/
  secrets:
    db:
      namespace: [digit3-core] # username/password/flyway-*/superuserPassword
    minio:
      namespace: [digit3-core] # accesskey/secretkey/rootUser/rootPassword
    docker-registry-secret:
      namespace: [digit3-core] # dockerconfigjson
    egov-notification-mail:
      namespace: [digit3-core] # mailsenderusername/-password (account, notification)
    egov-notification-sms:
      namespace: [digit3-core] # username/password (notification)
    # Keycloak: admin account and the clients account/employee use.
    kc-admin:
      namespace: [digit3-core] # username/password (account, keycloak)
    kc-db:
      namespace: [digit3-core] # username/password: keycloak's role on postgresql-18
    employee-iam-secret:
      namespace: [digit3-core] # employee-iam-client-secret (account, employee)
    citizen-broker-secret:
      namespace: [digit3-core] # citizen-broker-client-secret (account)
    # AppRole unified-dev-digit3-core (policy unified-dev-digit3-core-transit) on vault.vault
    vault-approle:
      namespace: [digit3-core] # role-id/secret-id (otp, individual)
    hmac-secret:
      namespace: [digit3-core] # hmac-secret (otp, individual blind-index hashes)
