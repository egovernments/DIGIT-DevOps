mdms-v2:
  # The common chart gives mdms-v2 only OTEL_EXPORTER_OTLP_ENDPOINT (host:port, no
  # scheme), which the app turns into its trace URL; OtlpHttpSpanExporter rejects it
  # ("must start with http://"). Set the full trace URL the way idgen/otp get it.
  extraEnv:
    app: |
      - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
        valueFrom:
          configMapKeyRef:
            name: egov-config
            key: otel-tracing-export-otlp-endpoint
  initContainers:
    dbMigration:
      enabled: true
      image:
        tag: 'master-154c0db'
  replicas: 1
  ingress:
    enabled: true
    zuul: true
    # cert-manager (ClusterIssuer letsencrypt-prod, HTTP-01) issues digit3.digit.org-tls-certs
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod
  chart-version: '3.1.1'
  image:
