# DIGIT 3.0 core module -- unified-dev (Kargo project digit-core3-0).
#
# Its own env file, separate from environments/unified-dev.yaml: the DIGIT 2.x charts
# share these names (filestore, boundary, workflow, billing, ...) and read that file's
# top-level <name>: sections, and egov-config / secrets here hold DIGIT 3.0 values.
# Top-level keys are chart names -- the common chart reads .Values.<chart-name> -- so
# this is exactly `helm ... -f unified-digit3-core-dev.yaml`.
#
# Argo CD (charts/argo-cd/unified-dev/kargo-managed/) deploys from this file, one
# Application per service of the Kargo project (its config sets the layout), once
# Kargo has merged the service's chart-version:
#   digit3-<service>              chart <service> from https://helm.digit.org/digit3/core
#                                 at <service>.chart-version, values {global, <service>}
#   digit3-kong, digit3-vault     same chart source, values = the section as root values
#   digit3-core-cluster-configs   chart cluster-configs at cluster-configs.chart-version,
#                                 values this file + unified-digit3-core-dev-secrets.yaml (SOPS)
#
# Kargo MERGES <service>.chart-version, <service>.image.tag and
# <service>.initContainers.dbMigration.image.tag on promotion, creating them if absent.
# Do not seed tags here. Everything else is edited by PR.
global:
  namespace: digit3-core
  # The digit3 common chart (3.0.x) picks the image tag by mode: prod (its default)
  # ALWAYS uses the chart's appVersion and ignores image.tag; dev uses image.tag when
  # set. Kargo promotes image.tag separately from the chart, so dev must be in dev mode
  # or every promoted tag is ignored.
  mode: dev
  # DIGIT 3.0 has its own host, so its routes (/localization, /filestore, ...) never
  # clash with the DIGIT 2.x paths on unified-dev.digit.org. Ingress hosts and the TLS
  # secret (digit3.digit.org-tls-certs) derive from this.
  domain: digit3.digit.org
idgen:
  initContainers:
    dbMigration:
      enabled: true
      image:
        tag: 'master-154c0db'
  replicas: 1
  ingress:
    enabled: true
    zuul: true
    # cert-manager (ClusterIssuer letsencrypt-prod, HTTP-01) issues digit3.digit.org-tls-certs
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod
  chart-version: '3.1.1'
  image:
    tag: 'master-154c0db'
localization:
  chart-version: 3.1.1
  image:
    tag: master-154c0db
  initContainers:
    dbMigration:
      enabled: true
