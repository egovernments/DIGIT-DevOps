sdip-backend:
  # Do not store credentials in this file.
  # Built by egovernments/SDIP .github/workflows/build.yaml; the tag is
  # <branch>-<short-sha> of the SDIP commit the image was built from.
  image:
    repository: egovio/sdip-backend
    tag: "sdip-phase2-import-30e0cdb"

  replicas: 1
  envFromSecret: ""

  env:
    - name: SDIP_DB_JDBC_URL
      valueFrom:
        configMapKeyRef:
          name: egov-config
          key: db-url
    - name: SDIP_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: db
          key: username
    - name: SDIP_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db
          key: password
    - name: SDIP_RUNTIME_MODE
      value: "unified-dev"
    - name: SDIP_RUNTIME_CONFIG_DIR
      value: "/etc/sdip/runtime"
    - name: SDIP_SERVICE_NAMESPACE
      value: "egov"
    - name: SDIP_DIGIT_USER_URL
      value: "http://egov-user.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_ACCESSCONTROL_URL
      value: "http://egov-accesscontrol.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_MDMS_URL
      value: "http://mdms-v2.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_MDMS_V2_URL
      value: "http://mdms-v2.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_WORKFLOW_URL
      value: "http://egov-workflow-v2.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_OTP_URL
      value: "http://egov-otp.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_FILESTORE_URL
      value: "http://egov-filestore.egov.svc.cluster.local:8080"
    - name: SDIP_CLAMAV_HOST
      value: "clamav.security.svc.cluster.local"
    - name: SDIP_CLAMAV_PORT
      value: "3310"
    - name: SDIP_KAFKA_BOOTSTRAP_SERVERS
      value: "kafka-kraft.backbone.svc.cluster.local:9092"
    - name: SDIP_PUBLIC_BASE_URL
      value: "https://sdip.unified-dev.digit.org"
    - name: SDIP_NOTIFICATION_EMAIL_TOPIC
      value: "sdip.dev.notification.email"
    - name: SDIP_EMAIL_DISPATCH_ENABLED
      value: "false"
    - name: SPRING_PROFILES_ACTIVE
      value: "unified-dev"
    - name: SERVER_PORT
      value: "8080"
    - name: SERVER_ADDRESS
      value: "0.0.0.0"

  # Proposed runtime Secret name; DevOps must confirm before merge.
  volumeMounts:
    - name: sdip-runtime-files
      mountPath: /etc/sdip/runtime
      readOnly: true

  volumes:
    - name: sdip-runtime-files
      secret:
        secretName: sdip-backend-runtime-files
        items:
          - key: core-fix-client.json
            path: digit/core-fix-client.json
          - key: onboarding-runtime.json
            path: onboarding-runtime.json
          - key: kafka-client.json
            path: kafka-client.json

sdip-ui:
  # Same build pipeline and tag scheme as sdip-backend above.
  image:
    repository: egovio/sdip-ui
    tag: "sdip-phase2-import-c93a6dc"

  replicas: 1

  # SDIP needs its own host: this Ingress claims "/" for the SPA, and "/" on
  # unified-dev.digit.org already redirects to the DIGIT 2.x /citizen/ UI.
  # sdip.unified-dev.digit.org resolves to the shared nginx ingress LB.
  # This single Ingress also routes /api/v1 to sdip-backend, so disabling
  # sdip-ui removes the backend route with it.
  ingress:
    enabled: true
    className: nginx
    host: sdip.unified-dev.digit.org
    tlsSecretName: sdip.unified-dev.digit.org-tls-certs
    annotations:
      # HTTP-01; the host must already resolve or issuance fails and retries.
      cert-manager.io/cluster-issuer: letsencrypt-prod
