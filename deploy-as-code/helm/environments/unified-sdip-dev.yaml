global:
   ## SDIP gets its own host: "/" on unified-dev.digit.org already redirects to
   ## the DIGIT 2.x citizen UI, so the SPA cannot claim root there.
   domain: sdip.unified-dev.digit.org
   setup: fullsetup

cluster-configs:
  ## `sdip` is already in cluster-configs-unified-dev's namespaces list
  ## (environments/unified-dev.yaml), so creating it here too would leave both
  ## Applications fighting over the same Namespace object with
  ## SharedResourceWarning. Unlike urban/health -- where nothing else created
  ## the namespace and `create: false` broke the sync -- the namespace does
  ## exist, so this env only populates it.
  namespaces:
    create: false
    values: [ sdip ]

  ## Only cluster-configs-unified-dev renders the cluster-wide singletons
  ## (digit-admin / digit-user ClusterRoles and the shared root-ingress).
  ## Leaving these on would make every product Application render them too, and
  ## whichever synced last would claim ownership while the rest sat permanently
  ## OutOfSync with SharedResourceWarning.
  cluster-roles:
    enabled: false
  root-ingress: null

  configmaps:
    egov-config:
      namespace: [ sdip ]
      data:
        db-host: unified-dev-server.postgres.database.azure.com
        db-name: sdip
        db-url: jdbc:postgresql://unified-dev-server.postgres.database.azure.com:5432/sdip
        db-url-no-schema: "jdbc:postgresql://unified-dev-server.postgres.database.azure.com:5432/sdip"
        domain: "https://sdip.unified-dev.digit.org"
        egov-services-fqdn-name: "https://sdip.unified-dev.digit.org/"
        ## Shared backbone, same values the other unified-dev product envs use.
        ## kafka-kraft-controller-headless is a headless Service -- clients
        ## resolve the broker pods directly through it.
        kafka-brokers: kafka-kraft-controller-headless.backbone:9092
        redis-host: redis.backbone
        logging-level-jdbc: "DEBUG"
        serializers-timezone-in-ist: "true"
        server-tomcat-max-connections: "500"
        server-tomcat-max-threads: "10"
        spring-datasource-tomcat-initialSize: "1"
        spring-datasource-tomcat-max-active: "2"
        spring-jpa-show-sql: "true"
        timezone: Asia/Kolkata
        tracer-errors-provideexceptionindetails: "true"

    egov-service-host:
      namespace: [ sdip ]
      data:
        ## Service name is the Argo CD release name (sdip-app-set.yaml sets
        ## releaseName to the element name), and both charts expose port 8080.
        sdip-backend: "http://sdip-backend.sdip:8080/"
        sdip-ui: "http://sdip-ui.sdip:8080/"

        ## Shared DIGIT platform services, which run in the egov namespace. The
        ## ConfigMap lives in sdip, so every entry must be namespace-qualified --
        ## a bare "http://egov-user:8080/" would resolve to sdip and fail.
        ## Generated from the Services actually present in egov on unified-dev,
        ## so stale entries from the older env files are not carried over.
        audit-service: "http://audit-service.egov:8080/"
        billing: "http://billing.egov:8080/"
        billing-service: "http://billing-service.egov:8080/"
        boundary: "http://boundary.egov:8080/"
        boundary-service: "http://boundary-service.egov:8080/"
        collection-services: "http://collection-services.egov:8080/"
        dashboard-analytics: "http://dashboard-analytics.egov:8080/"
        digit-user-preferences-service: "http://digit-user-preferences-service.egov:8080/"
        egov-accesscontrol: "http://egov-accesscontrol.egov:8080/"
        egov-apportion-service: "http://egov-apportion-service.egov:8080/"
        egov-enc-service: "http://egov-enc-service.egov:8080/"
        egov-filestore: "http://egov-filestore.egov:8080/"
        egov-hrms: "http://egov-hrms.egov:8080/"
        egov-idgen: "http://egov-idgen.egov:8080/"
        egov-indexer: "http://egov-indexer.egov:8080/"
        egov-localization: "http://egov-localization.egov:8080/"
        egov-location: "http://egov-location.egov:8080/"
        egov-malware-detection: "http://egov-malware-detection.egov:8080/"
        egov-mdms-service: "http://egov-mdms-service.egov:8080/"
        egov-notification-mail: "http://egov-notification-mail.egov:8080/"
        egov-notification-sms: "http://egov-notification-sms.egov:8080/"
        egov-otp: "http://egov-otp.egov:8080/"
        egov-persister: "http://egov-persister.egov:8080/"
        egov-pg-service: "http://egov-pg-service.egov:8080/"
        egov-url-shortening: "http://egov-url-shortening.egov:8080/"
        egov-user: "http://egov-user.egov:8080/"
        egov-user-egov: "http://egov-user.egov:8080/"
        egov-user-event: "http://egov-user-event.egov:8080/"
        egov-workflow: "http://workflow.egov:8080/"
        egov-workflow-v2: "http://egov-workflow-v2.egov:8080/"
        filestore: "http://filestore.egov:8080/"
        gateway: "http://gateway.egov:8080/"
        inbox: "http://inbox.egov:8080/"
        individual: "http://individual.egov:8080/"
        keycloak: "http://keycloak.egov:8080/"
        mdms-service-v2: "http://mdms-v2.egov:8080/"
        mdms-v2: "http://mdms-v2.egov:8080/"
        notification: "http://notification.egov:8080/"
        pdf-service: "http://pdf-service.egov:8080/"
        project: "http://project.egov:8080/"
        service-request: "http://service-request.egov:8080/"
        tenant-management: "http://tenant-management.egov:8080/"
        url-shortener: "http://url-shortener.egov:8080/"
        user-otp: "http://user-otp.egov:8080/"
        workflow: "http://workflow.egov:8080/"

  ## RuntimeConnections.validateService() accepts an endpoint only when its host
  ## ends with ".<SDIP_SERVICE_NAMESPACE>.svc.cluster.local", and that setting
  ## takes a single namespace. It is applied to the seven DIGIT URLs *and* to
  ## every Kafka broker, the ClamAV host and the object-store origin -- which on
  ## unified-dev live in backbone and security, not egov. These CNAME aliases
  ## give the out-of-namespace dependencies an egov-resolvable name without
  ## weakening the validator or touching the real Services.
  ##
  ## Kafka: only the bootstrap string is validated. Broker metadata still
  ## advertises *.backbone.svc.cluster.local, which the client dials directly.
  external-aliases:
    namespace: egov
    aliases:
      sdip-kafka: kafka-kraft-controller-headless.backbone.svc.cluster.local
      sdip-clamav: clamav.security.svc.cluster.local
      sdip-objectstore: minio.backbone.svc.cluster.local

  secrets:
    db:
      namespace: [ sdip ]
      name: db

    ## Mounted at SDIP_RUNTIME_CONFIG_DIR. The backend reads all three files
    ## during startup validation (org.sdip.runtime.SharedRuntimeConfiguration)
    ## and refuses to start if any is missing or malformed.
    ##
    ## Only coreFix.clientToken is a credential; it lives in
    ## unified-sdip-dev-secrets.yaml and this Secret is not rendered until it is
    ## set. The other values are deployment inputs, kept here so they are
    ## reviewable in a diff.
    sdip-backend-runtime-files:
      namespace: [ sdip ]
      name: sdip-backend-runtime-files

      ## baseUrl must carry no path -- DigitProtectedDataClient appends
      ## /egov-enc-service/crypto/... itself and rejects a non-empty path.
      ##
      ## WARNING: stock egov-enc-service does not implement crypto/v2/_digest.
      ## That endpoint only exists in SDIP's fork
      ## (SDIP Phase-2/infra/digit/encryption-fix). Startup checks the URL shape
      ## and token length only, so the pod will go Ready against the stock
      ## service while every digest-backed flow (email lookup, invitations,
      ## onboarding, password links) fails at runtime.
      coreFix:
        baseUrl: http://egov-enc-service.egov.svc.cluster.local:8080

      ## digestKeyRef is not a secret: it is the active symmetric key id for
      ## tenant pb in the enc service's key store, passed through as `keyId`.
      ## Read it from any crypto/v1/_encrypt response -- the envelope is
      ## prefixed "<keyId>|". Must be an integer >= 1.
      onboarding:
        digestKeyRef: 1
        invitationLifetimeDays: 7

      ## charts/backbone-services/kafka-kraft sets listeners.client.protocol to
      ## PLAINTEXT with no SASL and no ACLs on this cluster. Only the ten
      ## security.protocol / sasl.* / ssl.* keys the backend allowlists may
      ## appear here; anything else aborts startup.
      kafka:
        security.protocol: PLAINTEXT

sdip-backend:
  # Do not store credentials in this file.
  # Built by egovernments/SDIP .github/workflows/build.yaml; the tag is
  # <branch>-<short-sha> of the SDIP commit the image was built from.
  #
  # dev @ eaa3988 (SDIP PR #421), published 2026-11-13, linux/amd64 + arm64.
  #
  # Caveat for whoever debugs this image: PR #421 unblocked the build by
  # switching the Dockerfile from -DskipTests to -Dmaven.test.skip=true, which
  # skips test *compilation*. Seven missing-symbol errors are therefore hidden,
  # not fixed -- three ServiceQuorumWorkflow* test classes reference
  # DigitWorkflowClient.upgradeServiceQuorum and OwnerLiveSupport.personForRole,
  # neither of which exists on dev (the implementation is on
  # feature/sdip-phase2-workflow-configuration, e391bfe). Production sources are
  # unaffected, so the image is sound; the test/code gap is still open upstream.
  image:
    repository: egovio/sdip-backend
    tag: dev-eaa3988

  replicas: 1
  envFromSecret: ""

  env:
    ## ---- profile / mode ------------------------------------------------
    - name: SPRING_PROFILES_ACTIVE
      value: "unified-dev"
    - name: SDIP_RUNTIME_MODE
      value: "unified-dev"
    - name: SERVER_PORT
      value: "8080"
    - name: SERVER_ADDRESS
      value: "0.0.0.0"

    ## ---- runtime Secret mount -------------------------------------------
    ## Must match the volumeMounts path below; the validator requires an
    ## absolute path.
    - name: SDIP_RUNTIME_CONFIG_DIR
      value: "/etc/sdip/runtime"

    ## ---- the single approved service namespace ---------------------------
    - name: SDIP_SERVICE_NAMESPACE
      value: "egov"

    ## ---- DIGIT platform services (all in egov) ---------------------------
    - name: SDIP_DIGIT_USER_URL
      value: "http://egov-user.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_ACCESSCONTROL_URL
      value: "http://egov-accesscontrol.egov.svc.cluster.local:8080"
    ## v1 MDMS is a distinct Service from mdms-v2 on unified-dev; SDIP calls both.
    - name: SDIP_DIGIT_MDMS_URL
      value: "http://egov-mdms-service.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_MDMS_V2_URL
      value: "http://mdms-v2.egov.svc.cluster.local:8080"
    ## A path is permitted by validateService -- only query and fragment are not.
    - name: SDIP_DIGIT_WORKFLOW_URL
      value: "http://egov-workflow-v2.egov.svc.cluster.local:8080/egov-workflow-v2/egov-wf"
    - name: SDIP_DIGIT_OTP_URL
      value: "http://egov-otp.egov.svc.cluster.local:8080"
    - name: SDIP_DIGIT_FILESTORE_URL
      value: "http://egov-filestore.egov.svc.cluster.local:8080"

    ## ---- object store: alias -> minio.backbone ---------------------------
    ## validateStorageOrigin() additionally forbids any path component.
    - name: SDIP_OBJECTSTORE_URL
      value: "http://sdip-objectstore.egov.svc.cluster.local:9000"

    ## ---- Kafka: alias -> kafka-kraft-controller-headless.backbone --------
    ## Every broker is validated and an explicit port is mandatory.
    - name: SDIP_KAFKA_BOOTSTRAP_SERVERS
      value: "sdip-kafka.egov.svc.cluster.local:9092"
    - name: SDIP_NOTIFICATION_EMAIL_TOPIC
      value: "sdip.unified-dev.notification.email"
    - name: SDIP_EMAIL_DISPATCH_ENABLED
      value: "false"

    ## ---- ClamAV: alias -> clamav.security --------------------------------
    ## scannerHost() requires DNS only: no scheme, no port, no path.
    - name: SDIP_CLAMAV_HOST
      value: "sdip-clamav.egov.svc.cluster.local"
    - name: SDIP_CLAMAV_PORT
      value: "3310"

    ## ---- synthetic exchange ----------------------------------------------
    ## Mandatory in shared mode. Keep false: `true` additionally requires
    ## SDIP_EVENT_TOPIC_PREFIX (which must not start with "sdip.dev."),
    ## SDIP_EVENT_REPLICATION_FACTOR (1-3) and SDIP_EVENT_ALLOW_TOPIC_CREATE.
    - name: SDIP_SYNTHETIC_EXCHANGE_ENABLED
      value: "false"

    ## ---- public origin ----------------------------------------------------
    ## Must be an HTTPS origin with an empty or "/" path in shared mode.
    - name: SDIP_PUBLIC_BASE_URL
      value: "https://sdip.unified-dev.digit.org"

    ## ---- Redis ------------------------------------------------------------
    ## application-unified-dev.properties interpolates these with no Spring
    ## default, so the context fails to build if they are unset. The backbone
    ## redis runs without requirepass, hence the empty password.
    - name: SDIP_REDIS_HOST
      value: "redis.backbone.svc.cluster.local"
    - name: SDIP_REDIS_PORT
      value: "6379"
    - name: SDIP_REDIS_PASSWORD
      value: ""

    ## ---- shared PostgreSQL (SDIP PR #419) ---------------------------------
    ## Setting any one of these switches RuntimeConnections.source(owner) to the
    ## shared login and removes the need for the six
    ## <owner>-database-credentials.json files.
    - name: SDIP_DB_JDBC_URL
      valueFrom:
        configMapKeyRef:
          name: egov-config
          key: db-url
    - name: SDIP_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: db
          key: username
    - name: SDIP_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db
          key: password
    ## Six owner pools share one login. The default of 4 each would put 24
    ## connections per replica on the shared unified-dev-server instance.
    - name: SDIP_DB_POOL_MAX_PER_OWNER
      value: "3"

  volumeMounts:
    - name: sdip-runtime-files
      mountPath: /etc/sdip/runtime
      readOnly: true

  volumes:
    - name: sdip-runtime-files
      secret:
        secretName: sdip-backend-runtime-files
        ## 0444, not 0400. Secret volume files are owned by root:root unless the
        ## Pod sets securityContext.fsGroup, and this chart sets no
        ## securityContext at all, while the image runs USER sdip. With 0400 the
        ## application could not read its own runtime files:
        ## RuntimeConnections.secret() threw "Runtime file missing or invalid",
        ## LocalRuntimeGuard replaced that with its generic "Shared runtime
        ## configuration is incomplete or invalid" message, and the pod
        ## CrashLoopBackOff'd with no indication of the real cause.
        ## Verified in-cluster: a non-root uid reading a 0400 root-owned file in
        ## this exact projection gets EACCES.
        defaultMode: 0444
        items:
          ## core-fix-client.json is read as "digit/core-fix-client.json".
          - key: core-fix-client.json
            path: digit/core-fix-client.json
          - key: onboarding-runtime.json
            path: onboarding-runtime.json
          - key: kafka-client.json
            path: kafka-client.json

  ## /internal/health/ready probes all six database pools plus Redis, cached for
  ## three seconds, so its timeout has to exceed the sum of those checks.
  healthChecks:
    startup:
      httpGet:
        path: /internal/health/live
        port: http
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 36
    readiness:
      httpGet:
        path: /internal/health/ready
        port: http
      periodSeconds: 10
      timeoutSeconds: 15
      failureThreshold: 3
    liveness:
      httpGet:
        path: /internal/health/live
        port: http
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3

sdip-ui:
  # Same build pipeline and tag scheme as sdip-backend above.
  image:
    repository: egovio/sdip-ui
    tag: dev-935efee

  replicas: 1

  # SDIP needs its own host: this Ingress claims "/" for the SPA, and "/" on
  # unified-dev.digit.org already redirects to the DIGIT 2.x /citizen/ UI.
  # sdip.unified-dev.digit.org resolves to the shared nginx ingress LB.
  # This single Ingress also routes /api/v1 to sdip-backend, so disabling
  # sdip-ui removes the backend route with it.
  ingress:
    enabled: true
    className: nginx
    host: sdip.unified-dev.digit.org
    tlsSecretName: sdip.unified-dev.digit.org-tls-certs
    annotations:
      # HTTP-01; the host must already resolve or issuance fails and retries.
      cert-manager.io/cluster-issuer: letsencrypt-prod
