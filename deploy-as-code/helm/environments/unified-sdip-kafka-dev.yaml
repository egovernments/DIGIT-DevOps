# SDIP dedicated Kafka KRaft deployment.
# Combined with unified-sdip-infra-dev.yaml.
# No application workload is reused from another namespace.

namespace: sdip

controller:
  replicaCount: 3
  controllerOnly: false
  persistence:
    enabled: true
    storageClass: managed-csi-premium
    size: 8Gi

broker:
  replicaCount: 0

externalAccess:
  enabled: false

kraft:
  existingClusterIdSecret: sdip-kafka-kraft-id
  enabled: true
  clusterId: "xPbNUC1rO0-y5Dm72wz08w"
