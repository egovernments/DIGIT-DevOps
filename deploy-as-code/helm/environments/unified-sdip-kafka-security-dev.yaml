# Dedicated SDIP Kafka security configuration.
# Credentials and TLS private keys are NOT stored in Git.
# Required Kubernetes Secrets must exist in namespace sdip.

listeners:
  client:
    protocol: SASL_SSL
  controller:
    protocol: SASL_SSL
  interbroker:
    protocol: SASL_SSL

sasl:
  enabledMechanisms: PLAIN
  interBrokerMechanism: PLAIN
  controllerMechanism: PLAIN
  client:
    users:
      - sdip_client
  existingSecret: sdip-kafka-auth

tls:
  type: PEM
  autoGenerated: false
  existingSecret: sdip-kafka-tls
  sslClientAuth: none
