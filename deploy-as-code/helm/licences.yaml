# Licence map for every Helm chart in deploy-as-code/helm/charts and every chart Argo CD pulls from a Helm repo.
# Checked by .claude/hooks/check-helm-licences.py (Claude Code hook and the 'Helm licence check' workflow).
#
# Adding a chart:
#   - DIGIT's own service  -> add its path to first_party.
#   - third-party software -> add a third_party entry:
#       component       what the chart deploys
#       tag_source      where the deployed version lives: appVersion, a values.yaml path (server.image.tag),
#                       or <values file>:<path>; env overrides in helm/environments/*.yaml are checked too
#       tag             the deployed tag(s) this licence was checked for
#       licence         SPDX expression of the component's licence
#       licence_ref     the upstream release tag or commit the link is pinned to (never main/master/latest)
#       licence_url     link(s) to the licence text at licence_ref
#       licence_sha256  sha256 of each linked file: python3 .claude/hooks/check-helm-licences.py --pin <chart>
#   The gate fetches each link and fails if the text does not contain the declared licence, if its hash changed,
#   if the deployed tag differs from `tag`, or if the licence is not Category A or B in .claude/hooks/license-policy.json.
#   A non-Category-A licence needs a licence-owner exception in license-policy.json: {key: <chart>, reason, approved_by}.

