# Secrets TEMPLATE (placeholders only, never deployed).
# On the first "install" run the workflow copies this, fills every <placeholder> with a fresh
# random value (scripts/generate-secrets.sh), encrypts it with SOPS using the team's own
# Azure Key Vault key and commits the result to the fork as digit-secrets.yaml.
# Plaintext never touches the repo. Integrations left as "not-configured" stay off until a
# team puts real provider credentials in with:  sops digit-secrets.yaml
secrets:
  db:                         # Azure PostgreSQL admin (Terraform) - also used by all services
    username: <db_user>
    password: <db_password>
  minio:                      # in-cluster MinIO root user = filestore S3 credentials
    username: <minio_user>
    password: <minio_password>
  kafka:
    clusterId: <kafka_cluster_id>        # KRaft cluster id (22-char base64url UUID)
  elasticsearch:
    password: <elasticsearch_password>   # user "elastic" (Kibana, Jaeger)
  keycloak:
    adminUsername: <keycloak_admin_user>
    adminPassword: <keycloak_admin_password>
    dbUsername: <keycloak_db_user>
    dbPassword: <keycloak_db_password>
    employeeIamClientSecret: <employee_iam_client_secret>
    citizenBrokerClientSecret: <citizen_broker_client_secret>
  hmac: <hmac_secret>         # blind-index hashes (otp, individual)
  notification:
    mailUsername: not-configured
    mailPassword: not-configured
    smsUsername: not-configured
    smsPassword: not-configured
  stripeSecretKey: not-configured
  grafana:
    adminPassword: <grafana_admin_password>
