########################################################################
# digit-lts environment values for the Inji stack.
#
# THIS IS THE ONLY FILE IN THIS DIRECTORY WE OWN.
# Every other .properties / .json / .html file is a verbatim copy from
# inji/inji-config@2952358 (2026-04-27), kept unmodified so it stays diffable
# against upstream on an Inji version bump. All environment-specific values are
# concentrated here instead of being edited into those files.
#
# Spring Cloud Config serves `application-<profile>.properties` to EVERY
# application, so this file is the natural place for shared placeholders.
# Module-specific overrides live in the module's own file.
#
# WHY THIS FILE IS NECESSARY
# The upstream certify/mimoto defaults assume a complete MOSIP platform and
# reference 26 placeholders they never define. Spring fails at startup on an
# unresolved placeholder, so every one has to resolve to something even when
# the feature behind it is unused. Enumerated by diffing referenced ${...}
# tokens against defined keys across the served files.
#
# NOT DEFINED HERE, BY DESIGN -- these come from env vars so no credential is
# ever committed to this public repo. Spring's relaxed binding maps the env var
# to the placeholder:
#   db.dbuser.password            <- DB_DBUSER_PASSWORD        (secret inji-db)
#   softhsm.certify.security.pin  <- SOFTHSM_CERTIFY_SECURITY_PIN (secret softhsm-certify)
#   mimoto.oidc.keystore.password <- MIMOTO_OIDC_KEYSTORE_PASSWORD (secret mimotooidc)
#   redis.password                <- REDIS_PASSWORD, unset: redis.backbone has no auth
# Also supplied by Spring/the chart, not here:
#   server.servlet.path, spring.application.name, spring.profiles.active,
#   spring.cloud.config.uri, spring.cloud.config.label
########################################################################

# ---------------------------------------------------------------------
# Hostnames
#
# Per-module hostnames, NOT path prefixes on the shared DIGIT host. inji-web
# and inji-verify's UI are Create React App builds with a bare <BrowserRouter>
# and no basename, so they cannot be served from a subpath. Per-module hosts
# also place /.well-known/openid-credential-issuer at a host root, which is
# where OIDC4VCI expects it.
#
# Each of these needs an A record to 4.224.237.122.
# ---------------------------------------------------------------------
mosip.hostname=test-lts.digit.org

injiweb.host=injiweb.test-lts.digit.org
mosip.injicertify.host=injicertify.test-lts.digit.org
mosipid.identity.esignet.host=esignet.test-lts.digit.org

# api.public / api.internal exist upstream because MOSIP fronts everything with
# a pair of Istio gateways. There is no Istio here and no api gateway in front
# of Inji, so both point at the Certify host -- the only externally reachable
# Inji API in the web-wallet scope.
mosip.api.public.host=injicertify.test-lts.digit.org
mosip.api.internal.host=injicertify.test-lts.digit.org

# Mock identity system. Not deployed: the credential source is decided by the
# Certify plugin profile (see certify section below). Pointed at the real
# eSignet host so the placeholder resolves rather than rendering an empty URL
# that fails obscurely at first use.
mosip.api.mockidentitysystem.host=esignet.test-lts.digit.org
mosip.esignet.mock.host=esignet.test-lts.digit.org
mosip.injicertify.mock.host=injicertify.test-lts.digit.org

# ---------------------------------------------------------------------
# Shared DIGIT infrastructure, reused rather than duplicated
# ---------------------------------------------------------------------
# redis.backbone, the existing in-cluster Redis. No password configured on it,
# so redis.password is deliberately left to resolve to empty via env.
mosip.redis.host=redis.backbone

# Database hosts are NOT set here -- they would have no effect.
#
# certify-default / mimoto-default / esignet-default all DEFINE
# *.database.hostname, and Spring Cloud Config precedence is
#   {application}-{profile}  >  application-{profile}
# so anything set in this file loses to upstream's value. Verified against the
# running config-server: it served postgres-postgresql.postgres while
# postgres.egov sat in this file being ignored.
#
# The authoritative values therefore live in the per-application profile files:
#   certify-digit-landregistry.properties   mosip.certify.database.hostname
#   mimoto-digit-lts.properties             inji.mimoto.database.hostname
#   esignet-digit-lts.properties            mosip.esignet.database.hostname
#
# Keys upstream only REFERENCES as ${placeholders} are still correct to define
# here -- nothing else defines them, so there is nothing to shadow them.

# ---------------------------------------------------------------------
# Inji Certify
# ---------------------------------------------------------------------
# Issuer identity. A bare host with no path segment, deliberately: OIDC4VCI
# locates issuer metadata by inserting /.well-known/openid-credential-issuer
# between host and path, so a path component would put the metadata somewhere
# clients disagree about. certify-default derives
# mosip.certify.discovery.issuer-id from this.
mosip.certify.domain.url=https://injicertify.test-lts.digit.org

# eSignet, which Certify validates access tokens against. certify-default
# builds authn.issuer-uri and authn.jwk-set-uri by appending /v1/esignet to it.
mosip.certify.authorization.url=https://esignet.test-lts.digit.org

# Left empty upstream and only used by the data-provider plugin. Set once a
# plugin profile is chosen -- see the note below.
mosip.certify.data-provider-plugin.did-url=
mosip.certify.data-provider-plugin.id-field-prefix-uri=

# ---------------------------------------------------------------------
# Mimoto
# ---------------------------------------------------------------------
mosip.inji.web.url=https://injiweb.test-lts.digit.org

# DataShare. Only used when Mimoto issues through a datashare service; the
# standalone profile does not. Pointed at the in-cluster name so the
# placeholder resolves.
mosip.inji.datashare.host=datashare.inji.svc.cluster.local:8097
mosip.datashare.url=http://datashare.inji.svc.cluster.local:8097

# MOSIP platform services that do not exist in digit-lts. Mimoto's defaults
# reference them for the resident/mobile-binding flows, which the web wallet
# does not use. Set to the cluster-local Certify host so they resolve to
# something addressable; any call that actually reaches them will fail loudly
# rather than silently succeeding against the wrong system.
mosip.resident.url=https://injicertify.test-lts.digit.org
mosip.kernel.keymanager.url=https://injicertify.test-lts.digit.org

# Mobile wallet binding. OUT OF SCOPE -- web wallet only. Left empty so the
# placeholder resolves; the binding endpoints are never called from the web
# flow. If the Inji mobile wallet is ever added, these need real values and
# mpartner.default.mobile.secret must move to a SOPS-encrypted secret.
mimoto.wallet.binding.partner.api.key=
mpartner.default.mobile.secret=

# ---------------------------------------------------------------------
# eSignet
#
# esignet-default.properties is a verbatim copy from
# mosip/mosip-config@v1.2.0.1-B3 -- it is NOT in inji/inji-config, which is
# why config-server has to serve it from here. It adds 11 more placeholders of
# its own.
# ---------------------------------------------------------------------
mosip.esignet.host=esignet.test-lts.digit.org

# postgres.egov, overriding the upstream postgres-postgresql.postgres default.
# esignet-default.properties builds its own datasource URL from these against
# database mosip_esignet, schema esignet, user esignetuser -- so only the
# password needs injecting, via DB_DBUSER_PASSWORD.
# database host: see esignet-digit-lts.properties (precedence, as above)

# Kafka.
#
# kafka.profile is deliberately NOT set here. Setting it to an empty string
# was a mistake: esignet-default.properties builds
#   spring.kafka.bootstrap-servers=kafka-0.kafka-headless.${kafka.profile}:${kafka.port},...
# so an empty profile produced the malformed host "kafka-headless.:9092" and
# eSignet died on "Failed to start bean internalKafkaListenerEndpointRegistry".
#
# The whole pattern assumes a 3-broker StatefulSet called `kafka` with a
# `kafka-headless` service, which is not how DIGIT runs Kafka
# (release-name-kafka-controller-headless.backbone). Rather than patch the
# profile, eSignet overrides bootstrap-servers wholesale and disables the
# Kafka listeners entirely -- see esignet-digit-lts.properties.
kafka.port=9092

# OTP validity in seconds. Only used by the OTP authenticator, which the mock
# and postgres Certify plugins do not exercise.
mosip.kernel.otp.expiry-time=180

# Captcha. Disabled -- upstream sources these from a `mosip-captcha` secret
# that does not exist here. Empty so the placeholders resolve; eSignet only
# enforces captcha when the feature is switched on.
esignet.captcha.site.key=
esignet.captcha.secret.key=

# MOSIP IDA client secret. Only meaningful with the MOSIP identity plugin,
# which is not the plugin in use. Empty so the placeholder resolves.
mosip.ida.client.secret=

# NOT defined here, supplied by the chart as env vars:
#   active_profile_env, spring_config_url_env, spring_config_label_env
#     -> set by the esignet chart; used to build the amr-acr-mapping.json URL
#   softhsm.esignet.security.pin
#     -> SOFTHSM_ESIGNET_SECURITY_PIN, from the esignet-softhsm secret

# ---------------------------------------------------------------------
# Certify plugin-usecase host
#
# certify-digit-landregistry.properties uses this for the Redis key prefix,
# where upstream references ${mosip.injicertify.landregistry.host} with NO
# default -- an undefined value there is a startup failure, not an empty
# prefix. Same host as mosip.injicertify.host: there is one Certify instance,
# and the per-usecase host exists upstream only to run several side by side.
# ---------------------------------------------------------------------
mosip.injicertify.landregistry.host=injicertify.test-lts.digit.org

# ---------------------------------------------------------------------
# Mimoto issuer registration
#
# Referenced by mimoto-issuers-config.json. The value must be a client_id
# REGISTERED WITH eSIGNET, whose registered public key is the certificate held
# in oidckeystore.p12 under alias digitlts-mimoto-certify-oidc.
#
# Registration is a separate step against eSignet's client-management API and
# has NOT been done -- until it is, the authorization request fails with
# invalid_client. Set the id here once registered; it is an identifier, not a
# secret, so it belongs in this file rather than in SOPS.
# ---------------------------------------------------------------------
## Set now that the client is registered by the inji-esignet-client Job.
## MUST match request.clientId in
## charts/inji-services/inji-esignet-client/files/client.json, and the key
## registered there must be the public half of oidckeystore.p12 alias
## digitlts-mimoto-certify-oidc.
mimoto.oidc.digitlts.partner.clientid=digitlts-mimoto

# Inji Verify host. Referenced by mimoto-trusted-verifiers.json, which upstream
# leaves as a placeholder. Defined even though inji-verify is not deployed yet:
# an undefined placeholder in that file breaks Mimoto's startup parse.
mosip.injiverify.host=injiverify.test-lts.digit.org

# ---------------------------------------------------------------------
# Keycloak
#
# WHY THIS IS HERE AND NOT SOMEWHERE ELSE
# eSignet crash-looped on startup with:
#   IllegalArgumentException: Could not resolve placeholder
#   'keycloak.external.url' in value
#   "${keycloak.external.url}/auth/realms/mosip/protocol/openid-connect/certs"
#
# The placeholder IS defined upstream -- but in mimoto-default.properties, and
# Spring Cloud Config only serves {application}-* files to that application.
# eSignet never sees mimoto's files. Defining it here fixes it because
# application-* is served to EVERY application.
#
# Nothing in esignet's own file set defines these, so there is no shadowing
# (unlike the *.database.hostname keys, which upstream defines per-application
# and which therefore had to move into the per-application profile files).
#
# DIGIT's existing Keycloak is reused rather than deploying a second one.
# External route taken from the live keycloak ingress: host
# test-lts.digit.org, path /keycloak.
keycloak.external.url=https://test-lts.digit.org/keycloak
keycloak.internal.url=http://keycloak.keycloak

# CAVEAT, not yet exercised: the consuming property appends
# /auth/realms/mosip/protocol/openid-connect/certs. Realm `mosip` is unlikely
# to exist in DIGIT's Keycloak, and Keycloak 17+ dropped the /auth prefix, so
# that URL would 404 if it were ever fetched. It is only fetched when eSignet's
# Keycloak-authenticated admin APIs are used, which the Certify postgres
# data-provider flow does not. Resolving the placeholder is what startup needs;
# revisit if an admin API is ever called.
