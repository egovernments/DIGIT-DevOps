########################################################################
# Inji Certify — digit-lts profile, Postgres data-provider plugin.
#
# Profile name is `digit-landregistry` (Spring derives it from the filename:
# {application}-{profile}.properties). It is activated by adding that name to
# active_profile_env, which config-server publishes to every module via the
# config-server-share ConfigMap.
#
# WHY A PROFILE WE OWN, rather than activating upstream's
# certify-postgres-landregistry.properties directly:
#
#  1. Upstream sets `mosip.certify.database.name=inji_certify_landregistry`.
#     Our databases are already provisioned as `inji_certify` (the inji-db-init
#     Job ran 2026-09-16 and created inji_certify/inji_mimoto/inji_verify/
#     mosip_esignet with their roles, grants and connection limits). Activating
#     the upstream profile would point Certify at a database that does not
#     exist; creating one would leave `inji_certify` orphaned. Overriding the
#     name here is the cheaper fix -- and profile files take precedence over
#     application-default.properties, so it could not be overridden there.
#  2. The DID must be ours. Upstream ships
#     did:web:inji.github.io:inji-config:dev-int-inji:landregistry, which
#     resolves to MOSIP's own GitHub-hosted DID document -- credentials issued
#     with it would claim an issuer we do not control.
#  3. scope-query-mapping has to point at our table, not upstream's
#     statement_data / registration_receipt_data demo tables.
#
# certify-postgres-landregistry.properties stays in this directory unmodified,
# as the diff base for upstream changes. It is NOT in the active profile list.
########################################################################

## ------------------------------------------- Plugin enable properties
## Copied from upstream certify-postgres-landregistry.properties. These four
## select the Postgres data-provider plugin; they are not environment-specific
## and should be re-checked against upstream on a version bump.
mosip.certify.integration.scan-base-package=io.mosip.certify.postgresdataprovider.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.data-provider-plugin=PostgresDataProviderPlugin
mosip.certify.plugin-mode=DataProvider

## ------------------------------------------- DataProvider configuration
# Credential validity. ISO-8601 duration, days to seconds only.
mosip.certify.data-provider-plugin.vc-expiry-duration=P730d
mosip.certify.rendering-template.cache-max-age-days=1

## ------------------------------------------- Issuer identity
## did:web resolves by fetching https://<host>/.well-known/did.json, and
## Certify serves that route itself -- the upstream chart declares an explicit
## match for it. This is one of the reasons Certify has its own hostname
## instead of a path prefix on test-lts.digit.org.
##
## In a did:web identifier the host keeps its dots; only PATH segments are
## encoded as colons. Upstream's value has four colon-separated path segments
## (inji.github.io + inji-config/dev-int-inji/landregistry) because the DID
## document is served from a GitHub Pages subdirectory. Ours is host-only, so
## the host appears verbatim with no trailing segments.
mosip.certify.data-provider-plugin.did-url=did:web:injicertify.test-lts.digit.org
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020

## Prefix for the credential subject id. Upstream notes this is a temporary
## workaround (INJIWEB-1202) and will be removed in a later release.
mosip.certify.data-provider-plugin.id-field-prefix-uri=https://injicertify.test-lts.digit.org/credential/

## Rendering template. This UUID must exist as a row in the rendering_template
## table of inji_certify; Certify's own migration seeds it. Kept at upstream's
## value deliberately -- inventing a new UUID here would reference a row that
## does not exist. Upstream marks the property for removal in a future release.
mosip.certify.data-provider-plugin.rendering-template-id=5b9c2a12-810a-7388-2dc8-13ee7ad88bac

## ------------------------------------------- Credential source: our table
## Maps an OIDC scope to the SQL that produces the credential subject. `:id` is
## bound from the access token's `sub` claim.
##
## The table lives in schema `certify_source` of inji_certify, created by the
## inji-db-init Job. A DEDICATED table, deliberately not a DIGIT table.
##
## Measured, not assumed: certifyuser CAN connect to the shared `postgres`
## database (PUBLIC connect predates our REVOKE, which covered only the four
## Inji databases), but the only tables it can read there are the three PostGIS
## metadata tables PostGIS grants to PUBLIC. Kong's routes/consumers are
## unreadable and the DIGIT tenant schemas grant it no USAGE. Pointing this
## query at DIGIT data would therefore need new explicit grants, not just a
## different SQL string. Populate this table by ETL instead and the isolation
## holds.
mosip.certify.data-provider-plugin.postgres.scope-query-mapping={\
    'digit_license_vc_ldp': 'select * from certify_source.license_data where license_id=:id'\
  }

## Fields lifted into the credential index for lookup. JSONPath against the
## row returned above.
mosip.certify.indexed-mappings.holderName=$.holder_name
mosip.certify.indexed-mappings.licenseType=$.license_type
mosip.certify.indexed-mappings.validUpto=$.valid_upto

## ------------------------------------------- Usecase overrides
## Own hostname. The fallback chain matches upstream's shape so setting
## mosip.injicertify.landregistry.host is optional, but it IS required by the
## redis key-prefix below, which upstream leaves without a default.
mosip.certify.domain.url=https://${mosip.injicertify.landregistry.host:${mosip.injicertify.host}}
mosip.certify.identifier=${mosip.certify.domain.url}

## Authorization server. The Postgres data-provider plugin does NOT
## self-authorize -- unlike the PreAuth plugin, which sets this to its own
## domain and needs no external OIDC provider. So eSignet stays in the stack
## for this profile.
mosip.certify.authorization.url=https://${mosipid.identity.esignet.host}

## Overrides upstream's inji_certify_landregistry -- see the header.
mosip.certify.database.name=inji_certify

## Falls back to the shared certify PIN if no landregistry-specific one is set.
mosip.kernel.keymanager.hsm.keystore-pass=${softhsm.certify.landregistry.security.pin:${softhsm.certify.security.pin}}

## Redis key prefix. Upstream references
## ${mosip.injicertify.landregistry.host} with NO default, so this placeholder
## must be defined or Certify fails at startup. Defined in
## application-default.properties.
mosip.certify.cache.redis.key-prefix=${mosip.injicertify.landregistry.host}::

## Issuer display name, shown in the wallet.
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'DIGIT LTS Trade License',\
    'locale': 'en'\
  }\
}

## ------------------------------------------- Database host
## MUST live in this file, not application-default.properties.
## certify-default.properties DEFINES
##   mosip.certify.database.hostname=postgres-postgresql.postgres
## and {application}-{profile} outranks application-{profile}, so a value set
## in application-default.properties is silently shadowed by upstream's.
## Confirmed against the running config-server: it served
## postgres-postgresql.postgres until this was moved here.
##
## Only keys upstream DEFINES need this treatment. Keys upstream merely
## REFERENCES as ${placeholders} are still fine to define in
## application-default.properties, because nothing else defines them.
mosip.certify.database.hostname=postgres.egov
mosip.certify.database.port=5432

## ------------------------------------------- CSRF matchers
## PRE-EMPTIVE FIX, same bug class as eSignet's ignore-auth-urls.
##
## certify-default.properties prefixes the CSRF exemption list with
## ${server.servlet.path}, giving /v1/certify/issuance/** etc. But
## certify-service SecurityConfig consumes it as
##   http.csrf(e -> e.ignoringRequestMatchers(ignoreCsrfCheckUrls))
## and those matchers are evaluated RELATIVE to the servlet path, which is
## already /v1/certify (set in bootstrap.properties). So the prefixed entries
## can never match and CSRF protection stays ACTIVE on the POST endpoints --
## including /v1/certify/issuance/credential, the wallet's actual credential
## request. A wallet does not send a CSRF token, so that POST would be
## rejected with 403.
##
## Note ignore-auth-urls in the same upstream file already uses bare paths and
## is therefore correct; only the CSRF list is affected. The entries that
## already start with ** are left untouched -- a leading ** matches at any
## depth either way.
##
## Derived from certify-default.properties by removing the ${server.servlet.path}
## prefix; no paths added or removed.
mosip.certify.security.ignore-csrf-urls=/actuator/**,/error,/swagger-ui/**,/v3/api-docs/**,/issuance/**,**/system-info/**,**/credential-configurations/**,**/.well-known/**,**/credentials/**,**/ledger-search/**,**/oauth/**,**/credential-offer-data/**,**/pre-authorized-data/**
