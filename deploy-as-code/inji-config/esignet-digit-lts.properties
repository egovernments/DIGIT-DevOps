########################################################################
# eSignet — digit-lts overrides.
#
# Profile `digit-lts`. Exists to outrank upstream's
# esignet-default.properties, which DEFINES the database host and therefore
# shadows anything set in application-default.properties
# ({application}-{profile} > application-{profile}).
#
# esignet-default.properties is itself a copy from
# mosip/mosip-config@v1.2.0.1-B3 -- inji-config does not carry one.
########################################################################

## postgres.egov, overriding upstream's postgres-postgresql.postgres.
## esignet-default.properties builds spring.datasource.url from this against
## database mosip_esignet, schema esignet, user esignetuser; only the password
## is injected as an env var (DB_DBUSER_PASSWORD).
mosip.esignet.database.hostname=postgres.egov
mosip.esignet.database.port=5432

## ------------------------------------------- Placeholders the JAR needs
## These are referenced by esignet's OWN bundled application-default.properties
## (inside esignet-service.jar), not by anything in this directory -- which is
## why a sweep of the config files alone did not catch them. Each one was an
## unresolved placeholder that kills startup before any of our config is read.
##
## Found by fetching the bundled file from mosip/esignet@v1.8.0
## (esignet-service/src/main/resources/application-default.properties) and
## sweeping it against what config-server actually serves for `esignet`.
##
## Redis. Bundled lines 196-197:
##   spring.data.redis.host=${redis.host}
##   spring.data.redis.port=${redis.port}
## Nothing we serve overrides spring.data.redis.*, so these apply directly.
## This was the crash: "Failed to bind properties under
## 'spring.data.redis.port' to int ... For input string: "${redis.port}"".
## Reusing the existing backbone Redis; no password is set on it, so
## redis.password resolves empty via the env var.
redis.host=redis.backbone
redis.port=6379

## Database. Bundled lines 302-306 build mosip.esignet.database.* from these
## generic keys. hostname/port are already overridden above, so those two are
## belt-and-braces; name and username are NOT overridden anywhere we serve, so
## without them the bundled ${database.name}/${database.username} would fail.
## Values match what inji-db-init provisioned: database mosip_esignet, role
## esignetuser, on postgres.egov.
database.host=postgres.egov
database.port=5432
database.name=mosip_esignet
database.username=esignetuser

## Signup service. NOT DEPLOYED -- MOSIP's self-registration service is out of
## scope for the web wallet. Bundled line 389 is
##   mosip.signup.domain.url=https://${mosip.signup.host}
## which only needs to resolve; nothing in the Certify postgres data-provider
## flow calls it. Pointed at the eSignet host so the value is at least a real
## address rather than a dangling URL.
mosip.signup.host=esignet.test-lts.digit.org
