########################################################################
# eSignet — digit-lts overrides.
#
# Profile `digit-lts`. Exists to outrank upstream's
# esignet-default.properties, which DEFINES the database host and therefore
# shadows anything set in application-default.properties
# ({application}-{profile} > application-{profile}).
#
# esignet-default.properties is itself a copy from
# mosip/mosip-config@v1.2.0.1-B3 -- inji-config does not carry one.
########################################################################

## postgres.egov, overriding upstream's postgres-postgresql.postgres.
## esignet-default.properties builds spring.datasource.url from this against
## database mosip_esignet, schema esignet, user esignetuser; only the password
## is injected as an env var (DB_DBUSER_PASSWORD).
mosip.esignet.database.hostname=postgres.egov
mosip.esignet.database.port=5432

## ------------------------------------------- Placeholders the JAR needs
## These are referenced by esignet's OWN bundled application-default.properties
## (inside esignet-service.jar), not by anything in this directory -- which is
## why a sweep of the config files alone did not catch them. Each one was an
## unresolved placeholder that kills startup before any of our config is read.
##
## Found by fetching the bundled file from mosip/esignet@v1.8.0
## (esignet-service/src/main/resources/application-default.properties) and
## sweeping it against what config-server actually serves for `esignet`.
##
## Redis. Bundled lines 196-197:
##   spring.data.redis.host=${redis.host}
##   spring.data.redis.port=${redis.port}
## Nothing we serve overrides spring.data.redis.*, so these apply directly.
## This was the crash: "Failed to bind properties under
## 'spring.data.redis.port' to int ... For input string: "${redis.port}"".
## Reusing the existing backbone Redis; no password is set on it, so
## redis.password resolves empty via the env var.
redis.host=redis.backbone
redis.port=6379

## Database. Bundled lines 302-306 build mosip.esignet.database.* from these
## generic keys. hostname/port are already overridden above, so those two are
## belt-and-braces; name and username are NOT overridden anywhere we serve, so
## without them the bundled ${database.name}/${database.username} would fail.
## Values match what inji-db-init provisioned: database mosip_esignet, role
## esignetuser, on postgres.egov.
database.host=postgres.egov
database.port=5432
database.name=mosip_esignet
database.username=esignetuser

## Signup service. NOT DEPLOYED -- MOSIP's self-registration service is out of
## scope for the web wallet. Bundled line 389 is
##   mosip.signup.domain.url=https://${mosip.signup.host}
## which only needs to resolve; nothing in the Certify postgres data-provider
## flow calls it. Pointed at the eSignet host so the value is at least a real
## address rather than a dangling URL.
mosip.signup.host=esignet.test-lts.digit.org

## ------------------------------------------- Integration plugins
## esignet-default.properties (from mosip-config) selects the MOSIP IDA
## implementations:
##   mosip.esignet.integration.audit-plugin=IdaAuditPluginImpl
##   mosip.esignet.integration.authenticator=IdaAuthenticatorImpl
##   mosip.esignet.integration.key-binder=IdaKeyBinderImpl
## Those classes live in io.mosip.authentication.esignet.integration -- the
## MOSIP ID-Authentication plugin, which is NOT in the image we run. The
## mosipid/esignet-with-plugins:1.8.0 image installs only
## esignet-mock-plugin.jar (io.mosip.esignet.mock.integration), per its own
## startup log.
##
## Symptom of the mismatch:
##   Field auditWrapper in ClientManagementServiceImpl required a bean of type
##   'io.mosip.esignet.api.spi.AuditPlugin' that could not be found.
## IdaAuditPluginImpl was named, no such class was on the classpath, so no
## AuditPlugin bean existed and startup failed.
##
## Each implementation is a @Component gated by @ConditionalOnProperty on
## these exact property values -- verified by reading the classes in
## mosip/esignet@v1.8.0, not inferred from the docs.

## io.mosip.esignet.core.util.LoggerAuditService
##   @ConditionalOnProperty(value="mosip.esignet.integration.audit-plugin",
##                          havingValue="LoggerAuditService")
## Lives in esignet-core, so it is always on the classpath and needs no plugin
## jar. Audits to the log rather than to MOSIP's audit service.
mosip.esignet.integration.audit-plugin=LoggerAuditService

## io.mosip.esignet.core.util.NoOpKeyBinderImpl
##   @ConditionalOnProperty(value="mosip.esignet.integration.key-binder",
##                          havingValue="NoOpKeyBinder")
## NOTE the property value is NoOpKeyBinder, NOT the class name
## NoOpKeyBinderImpl -- a mismatch here silently yields no bean.
## Key binding is a mobile-wallet feature; the web wallet does not use it.
mosip.esignet.integration.key-binder=NoOpKeyBinder

## From esignet-mock-plugin.jar, which the image installs.
mosip.esignet.integration.authenticator=MockAuthenticationService

## Narrowed to the package that actually exists in this image. Upstream also
## lists io.mosip.authentication.esignet.integration; scanning an absent
## package is harmless, but naming only what is present makes the intent
## explicit and avoids half-loading IDA classes if the image ever changes.
mosip.esignet.integration.scan-base-package=io.mosip.esignet.mock.integration

## ------------------------------------------- Kafka
## DISABLED. eSignet uses Kafka for exactly one feature: the "linked"
## (QR-code / wallet-scan) authorization flow. Both listeners live in
## oidc-service-impl AuthorizationHelperService:
##   @KafkaListener(..., autoStartup = "${kafka.enabled:true}",
##                  topics = "${mosip.esignet.kafka.linked-session.topic}")
##   @KafkaListener(..., autoStartup = "${kafka.enabled:true}",
##                  topics = "${mosip.esignet.kafka.linked-auth-code.topic}")
## and KafkaConfig is @ConditionalOnProperty(value="kafka.enabled",
## havingValue="true"). Setting this false therefore skips the config bean and
## leaves both listeners registered-but-not-started -- no connection attempt,
## no DNS failure.
##
## The web wallet uses the ordinary OIDC authorize -> token flow, not the
## linked flow, so nothing we need is lost. This also avoids creating
## esignet-linked / esignet-consented topics in DIGIT's shared Kafka for a
## feature that is switched off.
##
## Symptom before this: bootstrap.servers resolved to
##   [kafka-0.kafka-headless.:9092, kafka-1.kafka-headless.:9092, ...]
## -> DNS resolution failed -> "Failed to start bean
##    org.springframework.kafka.config.internalKafkaListenerEndpointRegistry".
kafka.enabled=false

## Corrected anyway, so that enabling the linked flow later does not
## reintroduce a bad address. esignet-default.properties DEFINES
## spring.kafka.bootstrap-servers, so it must be overridden here rather than in
## application-default.properties -- {application}-{profile} outranks
## application-{profile}.
##
## DIGIT's brokers, matching kafka-brokers in environments/test-lts.yaml.
spring.kafka.bootstrap-servers=release-name-kafka-controller-headless.backbone:9092
