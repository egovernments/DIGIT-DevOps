########################################################################
# Mimoto — digit-lts overrides.
#
# Profile `digit-lts`, which sits AFTER default/inji-default/standalone and
# BEFORE digit-landregistry in active_profile_env. It exists only to outrank
# upstream's mimoto-default.properties.
#
# Needed because Spring Cloud Config precedence is
#   {application}-{profile}  >  application-{profile}
# so a value in application-default.properties loses to any key that
# mimoto-default.properties DEFINES. That is not a hypothetical: the running
# config-server served postgres-postgresql.postgres for the database host until
# this file existed.
########################################################################

## postgres.egov, NOT upstream's postgres-postgresql.postgres and NOT
## postgresql-lts (which is being decommissioned). mimoto-default.properties
## builds keymanager_database_url from this against database inji_mimoto,
## schema mimoto, user mimotouser; only the password is injected as an env var
## (DB_DBUSER_PASSWORD).
inji.mimoto.database.hostname=postgres.egov
inji.mimoto.database.port=5432

## AND the mosip.* namespace -- BOTH are required, for different consumers.
##
## The two disagree because the IMAGE and the config repo were built from
## different commits:
##   mosipid/mimoto:0.20.0, BOOT-INF/classes/application-default.properties:144
##     spring.datasource.url=jdbc:postgresql://${mosip.mimoto.database.hostname}:${mosip.mimoto.database.port}/inji_mimoto
##   mosip-config mimoto-default.properties:239
##     keymanager_database_url = jdbc:postgresql://${inji.mimoto.database.hostname}:${inji.mimoto.database.port}/inji_mimoto
##
## The served file overrides keymanager_database_url, so the inji.* pair is
## consumed there. It does NOT define spring.datasource.url, so the jar's line
## applies and needs the mosip.* pair. Defining only inji.* produced:
##   JDBC URL invalid port number: ${mosip.mimoto.database.port}
## followed by "Could not obtain connection to query metadata" and a failed
## encryptionDecryptionUtil bean.
##
## VERIFICATION NOTE: this was missed because my earlier sweep read the
## git tag v0.20.0 source, not the image. The image is authoritative -- it is
## what actually runs, and here it diverges from its own tag. Sweeps for
## bundled placeholders must extract from the image.
mosip.mimoto.database.hostname=postgres.egov
mosip.mimoto.database.port=5432

## ------------------------------------------- Partner crypto keystore
## BREAKS STARTUP WITHOUT THIS. mimoto-default.properties (mosip-config) has
##   mosip.partner.crypto.p12.password=${mosip.partner.crypto.p12.password}
## i.e. the property references ITSELF. Spring raises
##   IllegalArgumentException: Circular placeholder reference
##     'mosip.partner.crypto.p12.password' in property definitions
## which fails cryptoCoreUtil -> joseUtil -> idpServiceImpl and the whole
## context. Upstream expects the value to arrive as an env var, which makes the
## self-reference resolve; we supply it here instead so it is visible in config.
##
## A scan of the effective config for self-referential properties across
## certify / mimoto / esignet / injiweb found this as the ONLY instance.
##
## VALUE: abc123, which is what the image's own application-local.properties
## uses. Verified it actually opens the keystore bundled in the jar at
## BOOT-INF/classes/keystore.p12:
##   openssl pkcs12 -legacy -in keystore.p12 -passin pass:abc123  -> OK
## (-legacy is needed only because the file uses pbeWithSHA1And40BitRC2-CBC,
## which OpenSSL 3 disables by default; the JVM reads it natively.)
##
## NOT A SECRET: this is the password to a keystore shipped inside the public
## mosipid/mimoto image, identical for every deployment. It protects nothing
## of ours, so it belongs in config rather than SOPS. The partner keystore is
## used for MOSIP partner-mediated flows the web wallet does not exercise; it
## simply has to load for the context to start.
mosip.partner.crypto.p12.password=abc123
mosip.partner.crypto.p12.alias=partner
