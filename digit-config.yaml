# =====================================================================================
#  DIGIT one-click install on Azure  -  the ONLY file you change.
#  Step-by-step guide: ONE-CLICK-AZURE.md (Part 1). Every allowed key, its type, default and
#  rules: ONE-CLICK-AZURE.md (Part 2 - Reference). AI assistants: follow Part 2 exactly.
#  NEVER put passwords or keys in this file - it is public. Use the GitHub secret DIGIT_SECRETS.
# =====================================================================================

# ---- Fill in these 3 lines, then click "Commit changes". ----------------------------

# A short name for your DIGIT. Use 3 to 20 small letters, numbers or "-".
# It must start with a letter. Example: "team-a-digit"
name: "<name>"

# The web address people will open, for example "digit.example.com".
# You must own this domain, because you will point it at DIGIT after the install.
domain: "<domain>"

# Your email address. It is used to get the free HTTPS certificate.
email: "<email>"


# ---- How DIGIT is deployed. Choose ONCE, before the first install. ----------------------
# false = helmfile (default): the GitHub workflow deploys DIGIT with helmfile.
# true  = Argo CD: the workflow installs Argo CD, and Argo CD deploys every DIGIT service from
#         this repository and keeps it in sync with your commits.
#         Screen: https://<your domain>/argocd  (user admin, password argocd.adminPassword)
argocd:
  enabled: false


# ---- Everything below is OPTIONAL. Leave it as it is if you are not sure. ---------------

# Azure region where everything is created.
location: "centralindia"

# Machine sizes and counts (see infra-as-code/terraform/azure/variables.tf).
terraform:
  node_count: 4                  # number of worker machines
  # main_vm_size: "Standard_D8s_v3"

# Change any default from deploy-as-code/helm/defaults.yaml here, for example:
# components: {monitoring: false}              # do not install monitoring
# releases: {jaeger: {enabled: false}}         # do not install one release
# sizing: {elasticsearch: {dataReplicas: 3}}
# versions: {workflow: 3.1.3}

# Helm values for one release (release name = chart name). Never put passwords here:
# this file is public. Passwords live in digit-secrets.yaml, which the install creates
# and locks (encrypts) for you.
values: {}
#  workflow:
#    replicas: 2
