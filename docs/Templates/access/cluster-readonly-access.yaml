## Debugging access for a service team: view workloads, logs and configuration,
## exec / port-forward / attach, delete pods (to restart them). NO access to Secrets,
## and no create/update/delete of Deployments.
## Prefer RoleBindings in the team's namespaces over this ClusterRoleBinding when the
## team works in a fixed set of namespaces.
## Revoke: delete the token Secret (and the binding).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: <team>-readonly
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: <team>-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status, services, endpoints, configmaps, events, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward, pods/attach]
    verbs: [create, get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: <team>-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: <team>-readonly
subjects:
  - kind: ServiceAccount
    name: <team>-readonly
    namespace: kube-system
---
## Long-lived token for the kubeconfig. Treat the resulting kubeconfig as a secret.
apiVersion: v1
kind: Secret
metadata:
  name: <team>-readonly-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: <team>-readonly
type: kubernetes.io/service-account-token
