## STRUCTURE ONLY. Never commit this file with real values, and never commit it
## unencrypted. Create the real file as <module>-<env>-secrets.yaml, then:
##   sops --encrypt --in-place <environments-dir>/<module>-<env>-secrets.yaml
## (the .sops.yaml rule matching the file name must exist first), and edit it only
## with:  sops <environments-dir>/<module>-<env>-secrets.yaml
cluster-configs:
  secrets:
    db:
      username: <db-username>
      password: <db-password>
      flywayUsername: <db-migration-username>
      flywayPassword: <db-migration-password>
