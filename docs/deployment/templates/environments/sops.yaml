## Add to the repository's .sops.yaml. Rules are evaluated in order; the first
## match wins, so put specific rules above general ones. Create the rule BEFORE the
## secrets file. Use one of the key types per rule.
creation_rules:
  # Azure Key Vault key
  - path_regex: environments/<module>\-<env>\-secrets\.yaml$
    azure_keyvault: 'https://<vault-name>.vault.azure.net/keys/<key-name>/<key-version>'
  # AWS KMS key
  - path_regex: environments/<other-module>\-<env>\-secrets\.yaml$
    kms: 'arn:aws:kms:<region>:<account-id>:key/<key-id>'
