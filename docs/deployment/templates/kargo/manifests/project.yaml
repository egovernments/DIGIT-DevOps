## Raw Kargo manifests, for teams that do not use the pipeline chart. They are what
## the chart renders for one service. Kargo v1.x API (kargo.akuity.io/v1alpha1).
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: <project>
---
## Every promotion is manual: one entry per Stage, auto-promotion off.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: <project>
  namespace: <project>
spec:
  promotionPolicies:
    - stage: <service>-dev
      autoPromotionEnabled: false
    - stage: <service>-qa
      autoPromotionEnabled: false
    - stage: <service>-uat
      autoPromotionEnabled: false
