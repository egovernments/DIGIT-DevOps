## Downstream stages take Freight only from the stage before them (linear path).
## uat additionally accepts master-* images only: the git-clone guard returns a
## string for any other tag, which fails the Promotion loudly before anything is
## written; the later steps repeat the check as a second line of defence.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: <service>-qa
  namespace: <project>
  annotations:
    kargo.akuity.io/color: "#D64550"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: <service>
      sources:
        stages:
          - <service>-dev
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/<org>/<repo>.git
            checkout:
              - branch: <qa-branch>
                path: ./repo
        - uses: file-write
          config:
            path: ./kargo-promoted-values.yaml
            overwrite: true
            contents: |
              <service>:
                image:
                  tag: '${{ imageFrom("docker.io/<registry-org>/<service>").Tag }}'
                initContainers:
                  dbMigration:
                    image:
                      tag: '${{ imageFrom("docker.io/<registry-org>/<service>").Tag }}'
                chart-version: '${{ chartFrom("https://helm.digit.org", "<service>").Version }}'
        - uses: yaml-merge
          config:
            inFiles:
              - ./repo/<environments-dir>/<module>-qa.yaml
              - ./kargo-promoted-values.yaml
            outFile: ./repo/<environments-dir>/<module>-qa.yaml
        - uses: git-commit
          config:
            path: ./repo
            message: "kargo: promote <service> to qa"
        - uses: git-push
          config:
            path: ./repo
            targetBranch: <qa-branch>
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: <service>-uat
  namespace: <project>
  annotations:
    kargo.akuity.io/color: "#F2C230"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: <service>
      sources:
        stages:
          - <service>-qa
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          if: "${{ imageFrom(\"docker.io/<registry-org>/<service>\").Tag matches '^master-' ? true : 'REJECTED: only master-* images may be promoted to uat' }}"
          config:
            repoURL: https://github.com/<org>/<repo>.git
            checkout:
              - branch: <uat-branch>
                path: ./repo
        - uses: file-write
          if: "${{ imageFrom(\"docker.io/<registry-org>/<service>\").Tag matches '^master-' }}"
          config:
            path: ./kargo-promoted-values.yaml
            overwrite: true
            contents: |
              <service>:
                image:
                  tag: '${{ imageFrom("docker.io/<registry-org>/<service>").Tag }}'
                initContainers:
                  dbMigration:
                    image:
                      tag: '${{ imageFrom("docker.io/<registry-org>/<service>").Tag }}'
                chart-version: '${{ chartFrom("https://helm.digit.org", "<service>").Version }}'
        - uses: yaml-merge
          if: "${{ imageFrom(\"docker.io/<registry-org>/<service>\").Tag matches '^master-' }}"
          config:
            inFiles:
              - ./repo/<environments-dir>/<module>-uat.yaml
              - ./kargo-promoted-values.yaml
            outFile: ./repo/<environments-dir>/<module>-uat.yaml
        - uses: git-commit
          if: "${{ imageFrom(\"docker.io/<registry-org>/<service>\").Tag matches '^master-' }}"
          config:
            path: ./repo
            message: "kargo: promote <service> to uat"
        - uses: git-push
          if: "${{ imageFrom(\"docker.io/<registry-org>/<service>\").Tag matches '^master-' }}"
          config:
            path: ./repo
            targetBranch: <uat-branch>
