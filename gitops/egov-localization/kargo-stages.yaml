apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: egov-localization
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: egov-localization
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          config:
            apps:
              - name: egov-localization-dev
                namespace: argocd
                sources:
                  - repoURL: https://github.com/egovernments/DIGIT-DevOps.git
                    helm:
                      images:
                        - key: image.tag
                          value: ${{ imageFrom("egovio/egov-localization").Tag }}
                        - key: initContainers.dbMigration.image.tag
                          value: ${{ imageFrom("egovio/egov-localization").Tag }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: qa
  namespace: egov-localization
spec:
