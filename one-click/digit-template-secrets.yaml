# =====================================================================================
#  DIGIT one-click secrets TEMPLATE (same layout as egov-demo-secrets.yaml). Do not edit.
#
#  On the first install the workflow copies this to <your-environment-name>-secrets.yaml,
#  fills every <placeholder> with a fresh random value (the same placeholder gets the same
#  value everywhere), adds the GitHub secret DIGIT_SECRETS on top, locks the file with SOPS
#  and your own Azure Key Vault key, and commits it. You never encrypt anything yourself.
#
#  ONE format: every secret is cluster-configs.secrets.<name> = a Kubernetes Secret <name>
#  created in the listed namespaces, and every value appears exactly once. Charts read them
#  by name (existingSecret / secretKeyRef).
#
#  To set your own values (SMS, mail, SSH keys, registry, admin passwords) put them in the
#  GitHub secret DIGIT_SECRETS using these same paths, e.g.
#    cluster-configs: {secrets: {egov-notification-sms: {username: x, password: y}}}
#  db, kafka-kraft-cluster-id and hmac-secret cannot be changed (it breaks existing data).
# =====================================================================================

cluster-configs:
  secrets:
    # Azure PostgreSQL admin (Terraform creates it) - also used by every service
    db:
      namespace: [egov]
      username: digitadmin
      password: <db_password>
      flyway-username: digitadmin
      flyway-password: <db_password>
    # In-cluster MinIO root login = filestore S3 credentials. One Secret, read by filestore
    # (egov) and by the MinIO chart (backbone: existingSecret minio, keys accesskey/secretkey).
    minio:
      namespace: [egov, backbone]
      accesskey: <minio_user>
      secretkey: <minio_password>
    kc-admin:
      namespace: [egov]
      username: <keycloak_admin_user>
      password: <keycloak_admin_password>
    kc-db:
      namespace: [egov]
      username: keycloak
      password: <keycloak_db_password>
    employee-iam-secret:
      namespace: [egov]
      employee-iam-client-secret: <employee_iam_client_secret>
    citizen-broker-secret:
      namespace: [egov]
      citizen-broker-client-secret: <citizen_broker_client_secret>
    hmac-secret:
      namespace: [egov]
      hmac-secret: <hmac_secret>
    egov-notification-mail:
      namespace: [egov]
      mailsenderusername: not-configured
      mailsenderpassword: not-configured
    egov-notification-sms:
      namespace: [egov]
      username: not-configured
      password: not-configured
    egov-pg-service:
      namespace: [egov]
      stripe-secret-key: not-configured
    # Private image registry login (.dockerconfigjson). Default: none.
    docker-registry-secret:
      namespace: [egov, backbone]
      dockerconfigjson: '{"auths":{}}'
    # Kafka KRaft cluster id
    kafka-kraft-cluster-id:
      namespace: [backbone]
      kraft-cluster-id: <kafka_cluster_id>
    # Elasticsearch user "elastic" (Elasticsearch, Kibana; Jaeger in monitoring)
    elasticsearch-master-credentials:
      namespace: [backbone, monitoring]
      username: elastic
      password: <elasticsearch_password>
    # pgAdmin login (backbone/pgadmin)
    pgadmin:
      namespace: [backbone]
      admin-email: admin@digit.org
      admin-password: <pgadmin_password>
    # Grafana "admin" login (grafana: admin.existingSecret)
    grafana-admin:
      namespace: [monitoring]
      admin-user: admin
      admin-password: <grafana_admin_password>
    # Argo CD "admin" login (Argo CD mode). Read by the workflow, which gives Argo CD only a
    # bcrypt hash of it.
    argocd-admin:
      namespace: [egov]
      password: <argocd_admin_password>
