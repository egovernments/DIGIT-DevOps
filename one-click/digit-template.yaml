# =====================================================================================
#  DIGIT one-click environment (same layout as egov-demo.yaml).
#
#  You do NOT edit this template. Fill in one-click/input.yaml instead. On the first install
#  the workflow copies this file to one-click/<environment>.yaml; later you may tune the
#  release blocks there (replicas, image tags, settings).
#
#  The placeholders <domain> <email> <env> (from input.yaml) and <db_host> <db_name>
#  (the database Terraform created) stay in the file; they are filled in on every deploy.
#
#  Every block below is the Helm values of one release (block name = release name), plus:
#    chart-version   the chart version deployed (required)
#    enabled: false  do not deploy this release
#  NEVER put passwords here - this file is public. Use the GitHub secret DIGIT_SECRETS.
#  Full reference: one-click/README.md (Part 2).
# =====================================================================================

# ============================================================================
#  GLOBAL  -  given to every DIGIT chart
# ============================================================================
global:
  domain: "<domain>"            # from input.yaml
  mode: dev                     # dev = use <release>.image.tag (pinned below); prod = the chart appVersion
  containerRegistry: egovio
  setup: fullsetup

# ============================================================================
#  CLUSTER-CONFIGS
#  Namespaces and the shared ConfigMaps every service reads (secrets: <env>-secrets.yaml)
# ============================================================================

cluster-configs:
  chart-version: 3.1.1
  configmaps:
    egov-config:
      data:
        db-host: <db_host>
        db-name: <db_name>
        db-port: "5432"
        db-ssl-mode: require
        db-url: jdbc:postgresql://<db_host>:5432/<db_name>
        # ~20 services share one small server: keep pools small, wait longer for a connection
        db-pool-max-size: "5"
        db-pool-min-idle: "1"
        db-pool-connection-timeout-ms: "30000"
        egov-services-fqdn-name: https://<domain>/
        flyway-locations: filesystem:/flyway/sql
        kafka-brokers: kafka-kraft-controller-headless.backbone:9092
        keycloak-base-url: http://keycloak.egov.svc.cluster.local:8080/keycloak
        keycloak-db-url: jdbc:postgresql://<db_host>:5432/keycloak
        otel-exporter-otlp-endpoint: http://open-telemetry-opentelemetry-collector.monitoring:4318
        otel-tracing-export-otlp-endpoint: http://open-telemetry-opentelemetry-collector.monitoring:4318/v1/traces
        redis-address: redis.backbone:6379
        redis-host: redis.backbone
        redis-port: "6379"
      namespace:
        - egov
    egov-service-host:
      data:
        account: http://account.egov:8080/
        account-java: http://account.egov:8080/
        apportion: http://apportion.egov:8080/
        apportion-java: http://apportion.egov:8080/
        billing: http://billing.egov:8080/
        billing-java: http://billing.egov:8080/
        boundary: http://boundary.egov:8080/
        boundary-java: http://boundary.egov:8080/
        boundary-management: http://boundary-management.egov:8080/
        boundary-management-java: http://boundary-management.egov:8080/
        employee: http://employee.egov:8080/
        employee-java: http://employee.egov:8080/
        employee-onboarding: http://employee-onboarding.egov:8080/
        employee-onboarding-java: http://employee-onboarding.egov:8080/
        filestore: http://filestore.egov:8080/
        filestore-java: http://filestore.egov:8080/
        idgen: http://idgen.egov:8080/
        idgen-java: http://idgen.egov:8080/
        individual: http://individual.egov:8080/
        individual-java: http://individual.egov:8080/
        localization: http://localization.egov:8080/
        localization-java: http://localization.egov:8080/
        localization-management: http://localization-management.egov:8080/
        localization-management-java: http://localization-management.egov:8080/
        mdms-v2: http://mdms-v2.egov:8080/
        mdms-v2-java: http://mdms-v2.egov:8080/
        notification: http://notification.egov:8080/
        notification-java: http://notification.egov:8080/
        notify: http://notify.egov:8080/
        notify-java: http://notify.egov:8080/
        otp: http://otp.egov:8080/
        otp-java: http://otp.egov:8080/
        pg-service: http://pg-service.egov:8080/
        pg-service-java: http://pg-service.egov:8080/
        registry: http://registry.egov:8080/
        registry-java: http://registry.egov:8080/
        template-config: http://template-config.egov:8080/
        template-config-java: http://template-config.egov:8080/
        url-shortener: http://url-shortener.egov:8080/
        url-shortener-java: http://url-shortener.egov:8080/
        vault: http://vault.vault:8200/
        workflow: http://workflow.egov:8080/
        workflow-java: http://workflow.egov:8080/
      namespace:
        - egov
  namespaces:
    create: true
    values:
      - backbone
      - vault
      - monitoring

# ============================================================================
#  CORE SERVICES (helm.digit.org/digit3/core)
#  Keycloak, Kong, then the DIGIT 3.0 services A-Z. Block = values for that chart.
# ============================================================================

# Identity provider (Keycloak)
keycloak:
  chart-version: 3.1.0
  dbInit:
    adminSecret:
      key: password
    adminUser: digitadmin
  ingress:
    additionalAnnotations: |
      cert-manager.io/cluster-issuer: letsencrypt-prod

# API gateway (Kong) + gateway-sync route reconciler
kong:
  chart-version: 3.1.2
  env:
    pg_ssl: "on"
    pg_ssl_verify: "off"
  gatewaySync:
    domain: <domain>
    enabled: true
    keycloakBaseUrl: http://keycloak.egov.svc.cluster.local:8080/keycloak
    kongAdminUrl: http://kong-admin.egov.svc.cluster.local:8001
    namespaces:
      - egov
  initContainers:
    extraInitContainers: |
      - name: kong-migration
        image: {{ include "kong.image" (dict "Values" .Values "repository" .Values.image.repository "tag" .Values.image.tag) }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args: ["kong migrations bootstrap && kong migrations up && kong migrations finish"]
        env:
        - name: KONG_DATABASE
          value: postgres
        - name: KONG_PG_SSL
          value: "on"
        - name: KONG_PG_SSL_VERIFY
          value: "off"
        - name: KONG_PG_HOST
          valueFrom: {configMapKeyRef: {name: egov-config, key: db-host}}
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_USER
          valueFrom: {secretKeyRef: {name: db, key: username}}
        - name: KONG_PG_PASSWORD
          valueFrom: {secretKeyRef: {name: db, key: password}}
        - name: KONG_PG_DATABASE
          valueFrom: {configMapKeyRef: {name: egov-config, key: db-name}}

