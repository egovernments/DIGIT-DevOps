# =====================================================================================
#  DIGIT one-click install on Azure  -  THE file you change (like infra-as-code input.yaml).
#  Every value in double quotes. Guide: one-click/README.md
#
#  The workflow fills these values into your environment file one-click/<environment>.yaml
#  (made from digit-template.yaml on the first install) every time it deploys, so a change
#  here is one line and one commit.
#  NEVER put passwords here - this file is public. Use the GitHub secret DIGIT_SECRETS.
# =====================================================================================

# ---- FILL IN (mandatory) --------------------------------------------------------------

# A short name for this DIGIT: 3-20 small letters, numbers or "-", starting with a letter.
# It becomes the AKS cluster name, the resource group <environment>-rg and the files
# one-click/<environment>.yaml / <environment>-secrets.yaml. Fixed after the first install.
# Example: "team-a-digit"
environment: "<environment>"

# The web address people open (no https://, no /). You must own it.
# Example: "digit.example.com"
domain: "<domain>"

# Your e-mail, for the free HTTPS certificates (Let's Encrypt).
# Example: "you@example.com"
email: "<email>"

# ---- OPTIONAL (keep as is if not sure) -----------------------------------------------

# Azure region. Fixed after the first install.
location: "centralindia"

# How DIGIT is deployed. Fixed after the first install.
#   "false" = the workflow deploys with helmfile
#   "true"  = the workflow installs Argo CD; Argo CD deploys every service from this
#             repository and keeps it in sync. Screen: https://<domain>/argocd (user admin)
argocd_enabled: "false"

# Terraform variables: terraform_<name> -> variable <name> in
# infra-as-code/terraform/azure/variables.tf
terraform_node_count: "4"
# "true" scales the worker nodes to 0 at night and back up in the morning (Azure Automation).
terraform_scheduling: "false"
# PostgreSQL Flexible Server size. General Purpose: offered in most regions. (The Terraform
# default, Burstable B_Standard_B2ms, is not available in every region/subscription.)
# See what your region offers: az postgres flexible-server list-skus -l <location> -o table
terraform_db_sku_name: "GP_Standard_D2ds_v5"
# terraform_main_vm_size: "Standard_D8s_v3"

# The helmfiles that deploy DIGIT (egovernments/helm-charts, helmfile/digit3-one-click).
# Pin helmfiles_ref to a tag or a FULL 40-character commit SHA for a reproducible
# environment; changing it and committing redeploys with that version.
helmfiles_repo: "egovernments/helm-charts"
helmfiles_ref: "master"
