# Code Build — provisioned by DIGIT-DevOps reusable-setup; do not edit the
# branch / service option lists by hand: both are kept current by the
# "Sync Code Build" workflow (service list from build-config.yml, branch list
# from the repo's live branches).
# This workflow lives only on the default branch; pick the branch to build with
# "Build from Branch" (leave GitHub's "Use workflow from" on the default branch).
# Delegates the build (+ Trivy) to the central engine in DIGIT-DevOps.
name: Code Build
run-name: Code Build · ${{ inputs.service }} (${{ inputs.build_branch }})

on:
  workflow_dispatch:
    inputs:
      build_branch:
        description: "Build from Branch — pick the branch whose code is built"
        required: true
        type: choice
        default: master
        options:
          - master
      service:
        description: "Service image to build (from build-config.yml)"
        required: true
        type: choice
        options:
          - placeholder

jobs:
  build:
    # Grant the engine the token scopes it needs: id-token:write for cosign
    # keyless signing, contents:write so Trivy can publish to gh-pages.
    permissions:
      contents: write
      id-token: write
    # Central build engine, pinned to the moving v1 tag.
    uses: egovernments/DIGIT-DevOps/.github/workflows/reusable-build.yaml@reusable-build-v1
    with:
      service: ${{ inputs.service }}
      build_branch: ${{ inputs.build_branch }}
      enable_trivy: true
    secrets:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
