# Keep the Code Build dropdowns current — both the service list (from
# build-config.yml) and the Build-from-Branch list (from the repo's live
# branches). Runs when the config changes, when a branch is created/deleted,
# on a daily backstop, and on demand. Commits to the default branch via the App.
# Needs repo secrets BUILD_APP_ID + BUILD_APP_PRIVATE_KEY (GitHub App with
# Contents:write + Workflows:write, on the default-branch ruleset bypass list).
name: Sync Code Build

on:
  push:
    # Only the default branch; change if your default branch is not "master".
    branches:
      - master
    paths:
      - "build/build-config.yml"
  create:            # a branch was created
  delete:            # a branch was deleted
  schedule:
    - cron: "17 3 * * *"   # daily backstop (03:17 UTC), in case an event is missed
  workflow_dispatch:
    inputs:
      sync_branch:
        description: "Sync from Branch — also pull this branch's new services into the list (empty = default branch)"
        required: false
        type: string
        default: ""

# One sync at a time; the latest wins.
concurrency:
  group: sync-code-build
  cancel-in-progress: true

jobs:
  sync:
    uses: egovernments/DIGIT-DevOps/.github/workflows/reusable-code-build-sync.yaml@reusable-build-v1
    with:
      sync_branch: ${{ inputs.sync_branch || '' }}
    secrets:
      APP_ID: ${{ secrets.BUILD_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BUILD_APP_PRIVATE_KEY }}
