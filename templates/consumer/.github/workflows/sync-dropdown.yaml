# Keep the Code Build dropdowns current with build-config.yml.
# Runs when the config changes (and on demand); adds/updates module and
# service options without removing existing ones.
# Needs repo secret WORKFLOWS_TOKEN (Contents:write + Workflows:write).
name: Sync Dropdown

on:
  push:
    paths:
      - "build/build-config.yml"
  workflow_dispatch:

jobs:
  sync:
    uses: egovernments/DIGIT-DevOps/.github/workflows/reusable-sync-dropdown.yaml@reusable-build-v1
    secrets:
      WORKFLOWS_TOKEN: ${{ secrets.WORKFLOWS_TOKEN }}
