# Keep the Code Build service dropdown current with build-config.yml.
# Runs when the config changes (and on demand); adds/updates service
# options without removing existing ones, committed straight to the default
# branch via the GitHub App.
# Needs repo secrets BUILD_APP_ID + BUILD_APP_PRIVATE_KEY (GitHub App with
# Contents:write + Workflows:write, on the default-branch ruleset bypass list).
name: Sync Dropdown

on:
  push:
    # Only the default branch; change if your default branch is not "master".
    branches:
      - master
    paths:
      - "build/build-config.yml"
  workflow_dispatch:
    inputs:
      sync_branch:
        description: "Sync from Branch — read services from this branch's build-config (empty = default branch)"
        required: false
        type: string
        default: ""

jobs:
  sync:
    uses: egovernments/DIGIT-DevOps/.github/workflows/reusable-sync-dropdown.yaml@reusable-build-v1
    with:
      sync_branch: ${{ inputs.sync_branch || '' }}
    secrets:
      APP_ID: ${{ secrets.BUILD_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BUILD_APP_PRIVATE_KEY }}
